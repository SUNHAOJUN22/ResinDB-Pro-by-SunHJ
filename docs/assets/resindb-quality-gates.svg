<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640"
 viewBox="0 0 1200 640" role="img"
 aria-labelledby="quality-title quality-title-desc">
<title id="quality-title">Quality and validation gates</title>
<desc id="quality-title-desc">Permanent gates for documentation, production-source hygiene, static analysis, regression, runtime smoke and dependency audit.</desc>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#06111f"/>
    <stop offset=".56" stop-color="#0b1830"/>
    <stop offset="1" stop-color="#111b35"/>
  </linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#22d3ee"/>
    <stop offset="1" stop-color="#2563eb"/>
  </linearGradient>
  <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#34d399"/>
    <stop offset="1" stop-color="#059669"/>
  </linearGradient>
  <filter id="shadow" x="-25%" y="-25%" width="150%" height="170%">
    <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020617" flood-opacity=".46"/>
  </filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="7" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
    <path d="M36 0H0V36" fill="none" stroke="#94a3b8" stroke-opacity=".055"/>
  </pattern>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
    <path d="M0 0L10 5L0 10Z" fill="#38bdf8"/>
  </marker>
  <marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
    <path d="M0 0L10 5L0 10Z" fill="#64748b"/>
  </marker>
</defs>

<rect width="1200" height="640" rx="28" fill="url(#bg)"/>
<rect width="1200" height="640" rx="28" fill="url(#grid)"/>
<circle cx="1040" cy="80" r="190" fill="#2563eb" fill-opacity=".07"/>
<circle cx="110" cy="620" r="210" fill="#10b981" fill-opacity=".05"/>
<text x="72" y="70" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="36" font-weight="820" text-anchor="start">Quality and validation gates</text><text x="72" y="104" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="520" text-anchor="start">A release is accepted only after every deterministic gate is green</text><path d="M72 126H1128" stroke="#334155"/>
<g filter="url(#shadow)">
  <rect x="80" y="174" width="320" height="154" rx="24" fill="#0f213b" stroke="#334155"/>
  <rect x="80" y="174" width="7" height="154" rx="3.5" fill="#38bdf8"/>
  <text x="106" y="216" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="760" text-anchor="start">Documentation</text>
  <text x="106" y="244" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="520" text-anchor="start">links • SVGs • evidence</text>
</g>
<path d="M112 286C168 252,224 316,280 277S350 254,368 290" fill="none" stroke="#38bdf8" stroke-width="3"/>
<g filter="url(#shadow)">
  <rect x="440" y="174" width="320" height="154" rx="24" fill="#0f213b" stroke="#334155"/>
  <rect x="440" y="174" width="7" height="154" rx="3.5" fill="#34d399"/>
  <text x="466" y="216" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="760" text-anchor="start">Source hygiene</text>
  <text x="466" y="244" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="520" text-anchor="start">production code • no injection</text>
</g>
<path d="M472 286C528 252,584 316,640 277S710 254,728 290" fill="none" stroke="#34d399" stroke-width="3"/>
<g filter="url(#shadow)">
  <rect x="800" y="174" width="320" height="154" rx="24" fill="#0f213b" stroke="#334155"/>
  <rect x="800" y="174" width="7" height="154" rx="3.5" fill="#a78bfa"/>
  <text x="826" y="216" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="760" text-anchor="start">Static</text>
  <text x="826" y="244" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="520" text-anchor="start">ESLint • TypeScript</text>
</g>
<path d="M832 286C888 252,944 316,1000 277S1070 254,1088 290" fill="none" stroke="#a78bfa" stroke-width="3"/>
