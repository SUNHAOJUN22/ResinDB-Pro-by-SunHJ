  <rect x="80" y="370" width="7" height="154" rx="3.5" fill="#fbbf24"/>
  <text x="106" y="412" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="760" text-anchor="start">Regression</text>
  <text x="106" y="440" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="520" text-anchor="start">unit • science • workers</text>
</g>
<path d="M112 482C168 448,224 512,280 473S350 450,368 486" fill="none" stroke="#fbbf24" stroke-width="3"/>
<g filter="url(#shadow)">
  <rect x="440" y="370" width="320" height="154" rx="24" fill="#0f213b" stroke="#334155"/>
  <rect x="440" y="370" width="7" height="154" rx="3.5" fill="#fb7185"/>
  <text x="466" y="412" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="760" text-anchor="start">Runtime</text>
  <text x="466" y="440" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="520" text-anchor="start">Vite • HTTP • Chromium</text>
</g>
<path d="M472 482C528 448,584 512,640 473S710 450,728 486" fill="none" stroke="#fb7185" stroke-width="3"/>
<g filter="url(#shadow)">
  <rect x="800" y="370" width="320" height="154" rx="24" fill="#0f213b" stroke="#334155"/>
  <rect x="800" y="370" width="7" height="154" rx="3.5" fill="#22d3ee"/>
  <text x="826" y="412" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="760" text-anchor="start">Security</text>
  <text x="826" y="440" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="520" text-anchor="start">production dependency audit</text>
</g>
<path d="M832 482C888 448,944 512,1000 473S1070 450,1088 486" fill="none" stroke="#22d3ee" stroke-width="3"/>
<g>
  <rect x="100" y="558" width="321.3333333333333" height="34" rx="17" fill="#38bdf8" fill-opacity=".13"
        stroke="#38bdf8" stroke-opacity=".55"/>
  <text x="260.66666666666663" y="581" fill="#e2e8f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="650" text-anchor="middle">Sole main branch</text>
</g>

<g>
  <rect x="439.3333333333333" y="558" width="321.3333333333333" height="34" rx="17" fill="#34d399" fill-opacity=".13"
        stroke="#34d399" stroke-opacity=".55"/>
  <text x="600.0" y="581" fill="#e2e8f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="650" text-anchor="middle">No migration residue</text>
</g>

<g>
  <rect x="778.6666666666666" y="558" width="321.3333333333333" height="34" rx="17" fill="#a78bfa" fill-opacity=".13"
        stroke="#a78bfa" stroke-opacity=".55"/>
  <text x="939.3333333333333" y="581" fill="#e2e8f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="650" text-anchor="middle">Artifacts retained temporarily</text>
</g>

</svg>
