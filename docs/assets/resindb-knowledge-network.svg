  <circle cx="250" cy="454" r="48" fill="#a78bfa" fill-opacity=".18" stroke="#a78bfa" stroke-width="2"/>
  <circle cx="250" cy="454" r="18.240000000000002" fill="#a78bfa" fill-opacity=".9"/>
</g>
<text x="250" y="528" fill="#e2e8f0" fill-opacity="1.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="650" text-anchor="middle">Process route</text>
<path d="M600 330L950 454" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-muted)"/>
<g filter="url(#glow)">
  <circle cx="950" cy="454" r="48" fill="#fb7185" fill-opacity=".18" stroke="#fb7185" stroke-width="2"/>
  <circle cx="950" cy="454" r="18.240000000000002" fill="#fb7185" fill-opacity=".9"/>
</g>
<text x="950" y="528" fill="#e2e8f0" fill-opacity="1.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="650" text-anchor="middle">Reference</text>
<path d="M600 330L600 164" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-muted)"/>
