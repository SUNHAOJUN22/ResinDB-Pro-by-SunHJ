</g>
<text x="600" y="590" fill="#e2e8f0" fill-opacity="1.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="650" text-anchor="middle">Comparable grade</text>
<path d="M280 206Q600 330 600 164" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="7 8"/><path d="M600 164Q600 330 920 206" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="7 8"/><path d="M250 454Q600 330 600 520" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="7 8"/><path d="M600 520Q600 330 950 454" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="7 8"/><path d="M280 206Q600 330 250 454" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="7 8"/><path d="M920 206Q600 330 950 454" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="7 8"/>
</svg>
