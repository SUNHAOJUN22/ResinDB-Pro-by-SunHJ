<path d="M600 330L600 520" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-muted)"/>
<g filter="url(#glow)">
  <circle cx="600" cy="520" r="44" fill="#34d399" fill-opacity=".18" stroke="#34d399" stroke-width="2"/>
