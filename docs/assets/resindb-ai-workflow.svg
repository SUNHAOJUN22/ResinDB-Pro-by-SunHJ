<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="ai-loop-title ai-loop-title-desc">
<title id="ai-loop-title">AI-assisted polymer research workflow</title>
<desc id="ai-loop-title-desc">A five-step workflow from research question to evidence selection, deterministic computation, AI explanation and human review.</desc>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#06111f"/>
    <stop offset="0.55" stop-color="#0b1830"/>
    <stop offset="1" stop-color="#111b35"/>
  </linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#22d3ee"/>
    <stop offset="1" stop-color="#2563eb"/>
  </linearGradient>
  <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#34d399"/>
    <stop offset="1" stop-color="#059669"/>
  </linearGradient>
  <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#c084fc"/>
    <stop offset="1" stop-color="#7c3aed"/>
  </linearGradient>
  <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fbbf24"/>
    <stop offset="1" stop-color="#f97316"/>
  </linearGradient>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="7" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020617" flood-opacity=".45"/>
  </filter>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
    <path d="M36 0H0V36" fill="none" stroke="#94a3b8" stroke-opacity=".055" stroke-width="1"/>
  </pattern>
  <marker id="arrow-cyan" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
    <path d="M0 0L10 5L0 10Z" fill="#38bdf8"/>
  </marker>
  <marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
    <path d="M0 0L10 5L0 10Z" fill="#64748b"/>
  </marker>
</defs>

<rect width="1200" height="640" rx="28" fill="url(#bg)"/>
<rect width="1200" height="640" rx="28" fill="url(#grid)"/>
<circle cx="1040" cy="80" r="190" fill="#2563eb" fill-opacity=".07"/>
<circle cx="110" cy="620" r="210" fill="#10b981" fill-opacity=".05"/>
<text x="72" y="70" fill="#f8fafc" fill-opacity="1.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="36" font-weight="800" text-anchor="start">AI-assisted analysis loop</text><text x="72" y="104" fill="#94a3b8" fill-opacity="1.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="start">AI proposes; deterministic tools calculate; researchers approve</text><path d="M72 126H1128" stroke="#334155" stroke-width="1"/>
<g filter="url(#shadow)">
  <rect x="92" y="218" width="156" height="142" rx="24" fill="#0f213b" stroke="#334155"/>
  <rect x="92" y="218" width="7" height="142" rx="3.5" fill="#38bdf8"/>
  <text x="120" y="260" fill="#f8fafc" fill-opacity="1.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="750" text-anchor="start">Question</text>
  <text x="120" y="288" fill="#94a3b8" fill-opacity="1.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="start">Research intent</text>
</g>
<circle cx="170" cy="398" r="21" fill="#38bdf8" fill-opacity=".16" stroke="#38bdf8"/><text x="170" y="405" fill="#f8fafc" fill-opacity="1.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="800" text-anchor="middle">1</text><path d="M248 289L271 289" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-cyan)"/>
<g filter="url(#shadow)">
  <rect x="285" y="218" width="156" height="142" rx="24" fill="#0f213b" stroke="#334155"/>
  <rect x="285" y="218" width="7" height="142" rx="3.5" fill="#34d399"/>
  <text x="313" y="260" fill="#f8fafc" fill-opacity="1.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="750" text-anchor="start">Evidence</text>
  <text x="313" y="288" fill="#94a3b8" fill-opacity="1.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="start">Selected records</text>
</g>
<circle cx="363" cy="398" r="21" fill="#34d399" fill-opacity=".16" stroke="#34d399"/><text x="363" y="405" fill="#f8fafc" fill-opacity="1.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="800" text-anchor="middle">2</text><path d="M441 289L464 289" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-cyan)"/>
<g filter="url(#shadow)">
  <rect x="478" y="218" width="156" height="142" rx="24" fill="#0f213b" stroke="#334155"/>
  <rect x="478" y="218" width="7" height="142" rx="3.5" fill="#a78bfa"/>
  <text x="506" y="260" fill="#f8fafc" fill-opacity="1.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="750" text-anchor="start">Compute</text>
  <text x="506" y="288" fill="#94a3b8" fill-opacity="1.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="start">Workers + formulas</text>
</g>
<circle cx="556" cy="398" r="21" fill="#a78bfa" fill-opacity=".16" stroke="#a78bfa"/><text x="556" y="405" fill="#f8fafc" fill-opacity="1.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="800" text-anchor="middle">3</text><path d="M634 289L657 289" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-cyan)"/>
<g filter="url(#shadow)">
  <rect x="671" y="218" width="156" height="142" rx="24" fill="#0f213b" stroke="#334155"/>
  <rect x="671" y="218" width="7" height="142" rx="3.5" fill="#fbbf24"/>
  <text x="699" y="260" fill="#f8fafc" fill-opacity="1.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="750" text-anchor="start">Explain</text>
  <text x="699" y="288" fill="#94a3b8" fill-opacity="1.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="start">AI synthesis</text>
</g>
<circle cx="749" cy="398" r="21" fill="#fbbf24" fill-opacity=".16" stroke="#fbbf24"/><text x="749" y="405" fill="#f8fafc" fill-opacity="1.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="800" text-anchor="middle">4</text><path d="M827 289L850 289" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-cyan)"/>
<g filter="url(#shadow)">
  <rect x="864" y="218" width="156" height="142" rx="24" fill="#0f213b" stroke="#334155"/>
  <rect x="864" y="218" width="7" height="142" rx="3.5" fill="#fb7185"/>
  <text x="892" y="260" fill="#f8fafc" fill-opacity="1.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="750" text-anchor="start">Review</text>
  <text x="892" y="288" fill="#94a3b8" fill-opacity="1.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="start">Human decision</text>
</g>
<circle cx="942" cy="398" r="21" fill="#fb7185" fill-opacity=".16" stroke="#fb7185"/><text x="942" y="405" fill="#f8fafc" fill-opacity="1.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="800" text-anchor="middle">5</text>
<path d="M942 440C942 535 257 535 257 425" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="10 9" marker-end="url(#arrow-muted)"/>

<g>
  <rect x="132" y="476" width="184" height="34" rx="17" fill="#38bdf8" fill-opacity=".13" stroke="#38bdf8" stroke-opacity=".55"/>
  <text x="224.0" y="499" fill="#e2e8f0" fill-opacity="1.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="650" text-anchor="middle">No hidden execution</text>
</g>

<g>
  <rect x="354" y="476" width="178" height="34" rx="17" fill="#34d399" fill-opacity=".13" stroke="#34d399" stroke-opacity=".55"/>
  <text x="443.0" y="499" fill="#e2e8f0" fill-opacity="1.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="650" text-anchor="middle">Finite-result checks</text>
</g>

<g>
  <rect x="570" y="476" width="184" height="34" rx="17" fill="#a78bfa" fill-opacity=".13" stroke="#a78bfa" stroke-opacity=".55"/>
  <text x="662.0" y="499" fill="#e2e8f0" fill-opacity="1.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="650" text-anchor="middle">Source-aware output</text>
</g>

<g>
  <rect x="792" y="476" width="168" height="34" rx="17" fill="#fbbf24" fill-opacity=".13" stroke="#fbbf24" stroke-opacity=".55"/>
  <text x="876.0" y="499" fill="#e2e8f0" fill-opacity="1.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="650" text-anchor="middle">Human sign-off</text>
