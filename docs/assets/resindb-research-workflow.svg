  <text x="96" y="220" fill="#f8fafc" fill-opacity="1.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="750" text-anchor="start">Define</text>
  <text x="96" y="248" fill="#94a3b8" fill-opacity="1.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="start">Question + acceptance criteria</text>
</g>
<circle cx="152" cy="290" r="28" fill="#38bdf8" fill-opacity=".18" stroke="#38bdf8"/><text x="152" y="299" fill="#f8fafc" fill-opacity="1.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" text-anchor="middle">1</text><path d="M236 263L282 263" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-cyan)"/>
