  <rect x="292" y="178" width="168" height="170" rx="24" fill="#0f213b" stroke="#334155"/>
  <rect x="292" y="178" width="7" height="170" rx="3.5" fill="#34d399"/>
  <text x="320" y="220" fill="#f8fafc" fill-opacity="1.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="750" text-anchor="start">Curate</text>
  <text x="320" y="248" fill="#94a3b8" fill-opacity="1.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="start">Select and validate records</text>
</g>
<circle cx="376" cy="290" r="28" fill="#34d399" fill-opacity=".18" stroke="#34d399"/><text x="376" y="299" fill="#f8fafc" fill-opacity="1.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" text-anchor="middle">2</text><path d="M460 263L506 263" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-cyan)"/>
<g filter="url(#shadow)">
  <rect x="516" y="178" width="168" height="170" rx="24" fill="#0f213b" stroke="#334155"/>
  <rect x="516" y="178" width="7" height="170" rx="3.5" fill="#a78bfa"/>
  <text x="544" y="220" fill="#f8fafc" fill-opacity="1.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="750" text-anchor="start">Analyze</text>
  <text x="544" y="248" fill="#94a3b8" fill-opacity="1.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="start">Models + uncertainty</text>
</g>
<circle cx="600" cy="290" r="28" fill="#a78bfa" fill-opacity=".18" stroke="#a78bfa"/><text x="600" y="299" fill="#f8fafc" fill-opacity="1.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" text-anchor="middle">3</text><path d="M684 263L730 263" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-cyan)"/>
<g filter="url(#shadow)">
  <rect x="740" y="178" width="168" height="170" rx="24" fill="#0f213b" stroke="#334155"/>
  <rect x="740" y="178" width="7" height="170" rx="3.5" fill="#fbbf24"/>
  <text x="768" y="220" fill="#f8fafc" fill-opacity="1.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="750" text-anchor="start">Compare</text>
  <text x="768" y="248" fill="#94a3b8" fill-opacity="1.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="start">Charts + ranked alternatives</text>
</g>
<circle cx="824" cy="290" r="28" fill="#fbbf24" fill-opacity=".18" stroke="#fbbf24"/><text x="824" y="299" fill="#f8fafc" fill-opacity="1.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" text-anchor="middle">4</text><path d="M908 263L954 263" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-cyan)"/>
<g filter="url(#shadow)">
  <rect x="964" y="178" width="168" height="170" rx="24" fill="#0f213b" stroke="#334155"/>
  <rect x="964" y="178" width="7" height="170" rx="3.5" fill="#fb7185"/>
  <text x="992" y="220" fill="#f8fafc" fill-opacity="1.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="750" text-anchor="start">Report</text>
  <text x="992" y="248" fill="#94a3b8" fill-opacity="1.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="start">Export + review package</text>
</g>
<circle cx="1048" cy="290" r="28" fill="#fb7185" fill-opacity=".18" stroke="#fb7185"/><text x="1048" y="299" fill="#f8fafc" fill-opacity="1.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" text-anchor="middle">5</text>
<g filter="url(#shadow)">
  <rect x="160" y="424" width="880" height="112" rx="24" fill="#0f213b" stroke="#334155"/>
  <rect x="160" y="424" width="7" height="112" rx="3.5" fill="#38bdf8"/>
  <text x="188" y="466" fill="#f8fafc" fill-opacity="1.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="750" text-anchor="start">Evidence package</text>
  <text x="188" y="494" fill="#94a3b8" fill-opacity="1.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="start">filtered dataset • formula settings • plots • QA report • exported records • reviewer notes</text>
</g>

<g>
  <rect x="224" y="488" width="170" height="34" rx="17" fill="#38bdf8" fill-opacity=".13" stroke="#38bdf8" stroke-opacity=".55"/>
  <text x="309.0" y="511" fill="#e2e8f0" fill-opacity="1.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="650" text-anchor="middle">Traceable inputs</text>
