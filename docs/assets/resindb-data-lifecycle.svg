<title id="lifecycle-title">Resin data lifecycle</title>
<desc id="lifecycle-title-desc">The lifecycle keeps source, schema, validation, persistence, analysis and portable export visible as separate stages.</desc>
<metadata>ResinDB UI UX Pro Max design system: Swiss modernism, Bento structure, WCAG-aware semantic colors, vector-only icons, 8-point spacing.</metadata>

