  <rect x="214" y="438" width="7" height="112" rx="3.5" fill="#38bdf8"/>
  <text x="242" y="480" fill="#f8fafc" fill-opacity="1.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="750" text-anchor="start">Versioned source catalogs</text>
  <text x="242" y="508" fill="#94a3b8" fill-opacity="1.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="start">taxonomy • aliases • property groups • manufacturers • references • network • record universes</text>
</g>

