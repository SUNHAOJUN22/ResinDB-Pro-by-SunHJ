</g>
<text x="542" y="356" fill="#e2e8f0" fill-opacity="1.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="650" text-anchor="middle">Normalize</text>
<text x="542" y="372" fill="#94a3b8" fill-opacity="1.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" text-anchor="middle">taxonomy • units</text><path d="M600 278L706 278" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-cyan)"/>
<g filter="url(#glow)">
  <circle cx="770" cy="278" r="52" fill="#fbbf24" fill-opacity=".18" stroke="#fbbf24" stroke-width="2"/>
  <circle cx="770" cy="278" r="19.76" fill="#fbbf24" fill-opacity=".9"/>
</g>
<text x="770" y="356" fill="#e2e8f0" fill-opacity="1.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="650" text-anchor="middle">Persist</text>
<text x="770" y="372" fill="#94a3b8" fill-opacity="1.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" text-anchor="middle">IndexedDB • snapshots</text><path d="M828 278L934 278" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-cyan)"/>
<g filter="url(#glow)">
  <circle cx="998" cy="278" r="52" fill="#fb7185" fill-opacity=".18" stroke="#fb7185" stroke-width="2"/>
  <circle cx="998" cy="278" r="19.76" fill="#fb7185" fill-opacity=".9"/>
</g>
<text x="998" y="356" fill="#e2e8f0" fill-opacity="1.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="650" text-anchor="middle">Export</text>
<text x="998" y="372" fill="#94a3b8" fill-opacity="1.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" text-anchor="middle">CSV • JSON • XML • PDF</text>
<g filter="url(#shadow)">
