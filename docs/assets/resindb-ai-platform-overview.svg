<title id="platform-title">ResinDB Pro</title>
<desc id="platform-title-desc">A local-first research workspace connecting governed data, deterministic computation, visual analytics, optional AI and export evidence.</desc>
<metadata>ResinDB UI UX Pro Max design system: Swiss modernism, Bento structure, WCAG-aware semantic colors, vector-only icons, 8-point spacing.</metadata>

