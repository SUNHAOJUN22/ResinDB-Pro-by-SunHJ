<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640"
 viewBox="0 0 1200 640" role="img"
 aria-labelledby="platform-title platform-title-desc">
<title id="platform-title">ResinDB Pro</title>
<desc id="platform-title-desc">Platform overview of resin data management, analytics, scientific computation, optional AI and evidence export.</desc>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#06111f"/>
    <stop offset=".56" stop-color="#0b1830"/>
    <stop offset="1" stop-color="#111b35"/>
  </linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#22d3ee"/>
    <stop offset="1" stop-color="#2563eb"/>
  </linearGradient>
  <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#34d399"/>
    <stop offset="1" stop-color="#059669"/>
  </linearGradient>
  <filter id="shadow" x="-25%" y="-25%" width="150%" height="170%">
    <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020617" flood-opacity=".46"/>
  </filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="7" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
    <path d="M36 0H0V36" fill="none" stroke="#94a3b8" stroke-opacity=".055"/>
  </pattern>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
    <path d="M0 0L10 5L0 10Z" fill="#38bdf8"/>
  </marker>
  <marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
    <path d="M0 0L10 5L0 10Z" fill="#64748b"/>
  </marker>
</defs>

<rect width="1200" height="640" rx="28" fill="url(#bg)"/>
<rect width="1200" height="640" rx="28" fill="url(#grid)"/>
<circle cx="1040" cy="80" r="190" fill="#2563eb" fill-opacity=".07"/>
<circle cx="110" cy="620" r="210" fill="#10b981" fill-opacity=".05"/>
<text x="72" y="70" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="36" font-weight="820" text-anchor="start">ResinDB Pro</text><text x="72" y="104" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="520" text-anchor="start">Local-first resin intelligence • scientific workers • auditable AI assistance</text><path d="M72 126H1128" stroke="#334155"/>
<g transform="translate(600 334)" filter="url(#glow)">
  <path d="M0-82L71-41V41L0 82L-71 41V-41Z" fill="#0b2b4f" stroke="#38bdf8" stroke-width="3"/>
  <path d="M0-44L38-22V22L0 44L-38 22V-22Z" fill="url(#cyan)" fill-opacity=".28" stroke="#67e8f9"/>
  <circle r="13" fill="#e0f2fe"/>
</g>
<path d="M600 334L230 205" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-muted)" stroke-dasharray="8 8"/><circle cx="230" cy="205" r="52" fill="#38bdf8" fill-opacity=".16" stroke="#38bdf8" stroke-width="2"/><circle cx="230" cy="205" r="18" fill="#38bdf8" fill-opacity=".9"/><text x="230" y="285" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle">Data workspace</text><text x="230" y="306" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="520" text-anchor="middle">CRUD + snapshots</text><path d="M600 334L600 170" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-muted)" stroke-dasharray="8 8"/><circle cx="600" cy="170" r="52" fill="#34d399" fill-opacity=".16" stroke="#34d399" stroke-width="2"/><circle cx="600" cy="170" r="18" fill="#34d399" fill-opacity=".9"/><text x="600" y="250" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle">Visual analytics</text><text x="600" y="271" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="520" text-anchor="middle">dashboard + pivot</text><path d="M600 334L970 205" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-muted)" stroke-dasharray="8 8"/><circle cx="970" cy="205" r="52" fill="#a78bfa" fill-opacity=".16" stroke="#a78bfa" stroke-width="2"/><circle cx="970" cy="205" r="18" fill="#a78bfa" fill-opacity=".9"/><text x="970" y="285" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle">Scientific engine</text><text x="970" y="306" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="520" text-anchor="middle">models + statistics</text><path d="M600 334L230 455" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-muted)" stroke-dasharray="8 8"/><circle cx="230" cy="455" r="52" fill="#fbbf24" fill-opacity=".16" stroke="#fbbf24" stroke-width="2"/><circle cx="230" cy="455" r="18" fill="#fbbf24" fill-opacity=".9"/><text x="230" y="535" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle">AI copilot</text><text x="230" y="556" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="520" text-anchor="middle">optional endpoint</text><path d="M600 334L600 505" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-muted)" stroke-dasharray="8 8"/><circle cx="600" cy="505" r="52" fill="#fb7185" fill-opacity=".16" stroke="#fb7185" stroke-width="2"/><circle cx="600" cy="505" r="18" fill="#fb7185" fill-opacity=".9"/><text x="600" y="585" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle">Evidence export</text><text x="600" y="606" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="520" text-anchor="middle">portable reports</text><path d="M600 334L970 455" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-muted)" stroke-dasharray="8 8"/><circle cx="970" cy="455" r="52" fill="#22d3ee" fill-opacity=".16" stroke="#22d3ee" stroke-width="2"/><circle cx="970" cy="455" r="18" fill="#22d3ee" fill-opacity=".9"/><text x="970" y="535" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle">Quality gates</text><text x="970" y="556" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="520" text-anchor="middle">tests + audit</text>
</svg>
