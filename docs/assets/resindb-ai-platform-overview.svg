<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="hero-title hero-title-desc">
<title id="hero-title">ResinDB Pro platform overview</title>
<desc id="hero-title-desc">An overview of the local-first resin data platform, scientific analysis engine, visual analytics and optional AI copilot.</desc>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#06111f"/>
    <stop offset="0.55" stop-color="#0b1830"/>
    <stop offset="1" stop-color="#111b35"/>
  </linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#22d3ee"/>
    <stop offset="1" stop-color="#2563eb"/>
  </linearGradient>
  <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#34d399"/>
    <stop offset="1" stop-color="#059669"/>
  </linearGradient>
  <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#c084fc"/>
    <stop offset="1" stop-color="#7c3aed"/>
  </linearGradient>
  <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fbbf24"/>
    <stop offset="1" stop-color="#f97316"/>
  </linearGradient>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="7" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020617" flood-opacity=".45"/>
  </filter>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
    <path d="M36 0H0V36" fill="none" stroke="#94a3b8" stroke-opacity=".055" stroke-width="1"/>
  </pattern>
  <marker id="arrow-cyan" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
    <path d="M0 0L10 5L0 10Z" fill="#38bdf8"/>
  </marker>
  <marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
    <path d="M0 0L10 5L0 10Z" fill="#64748b"/>
  </marker>
</defs>

<rect width="1200" height="640" rx="28" fill="url(#bg)"/>
<rect width="1200" height="640" rx="28" fill="url(#grid)"/>
<circle cx="1040" cy="80" r="190" fill="#2563eb" fill-opacity=".07"/>
<circle cx="110" cy="620" r="210" fill="#10b981" fill-opacity=".05"/>
<text x="72" y="70" fill="#f8fafc" fill-opacity="1.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="36" font-weight="800" text-anchor="start">ResinDB Pro</text><text x="72" y="104" fill="#94a3b8" fill-opacity="1.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="start">Local-first resin intelligence • scientific workers • auditable AI assistance</text><path d="M72 126H1128" stroke="#334155" stroke-width="1"/>
<g transform="translate(600 334)" filter="url(#glow)">
  <path d="M0-112L97-56V56L0 112L-97 56V-56Z" fill="#0b2b4f" stroke="#38bdf8" stroke-width="3"/>
  <path d="M0-66L57-33V33L0 66L-57 33V-33Z" fill="url(#cyan)" fill-opacity=".26" stroke="#67e8f9" stroke-width="2"/>
  <circle r="18" fill="#e0f2fe"/>
  <circle cx="-38" cy="-23" r="9" fill="#34d399"/>
