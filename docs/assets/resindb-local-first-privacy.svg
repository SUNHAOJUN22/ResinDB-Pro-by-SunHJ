<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640"
 viewBox="0 0 1200 640" role="img"
 aria-labelledby="privacy-title privacy-title-desc">
<title id="privacy-title">Local-first privacy architecture</title>
<desc id="privacy-title-desc">Privacy boundary between browser-resident data and optional governed AI and remote REST gateways.</desc>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#06111f"/>
    <stop offset=".56" stop-color="#0b1830"/>
    <stop offset="1" stop-color="#111b35"/>
  </linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#22d3ee"/>
    <stop offset="1" stop-color="#2563eb"/>
  </linearGradient>
  <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#34d399"/>
    <stop offset="1" stop-color="#059669"/>
  </linearGradient>
  <filter id="shadow" x="-25%" y="-25%" width="150%" height="170%">
    <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020617" flood-opacity=".46"/>
  </filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="7" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
    <path d="M36 0H0V36" fill="none" stroke="#94a3b8" stroke-opacity=".055"/>
  </pattern>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
    <path d="M0 0L10 5L0 10Z" fill="#38bdf8"/>
  </marker>
  <marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
    <path d="M0 0L10 5L0 10Z" fill="#64748b"/>
  </marker>
</defs>

<rect width="1200" height="640" rx="28" fill="url(#bg)"/>
<rect width="1200" height="640" rx="28" fill="url(#grid)"/>
<circle cx="1040" cy="80" r="190" fill="#2563eb" fill-opacity=".07"/>
<circle cx="110" cy="620" r="210" fill="#10b981" fill-opacity=".05"/>
<text x="72" y="70" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="36" font-weight="820" text-anchor="start">Local-first privacy architecture</text><text x="72" y="104" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="520" text-anchor="start">Browser storage by default; remote services are explicit and bounded</text><path d="M72 126H1128" stroke="#334155"/>
<g filter="url(#shadow)">
  <rect x="80" y="180" width="430" height="330" rx="24" fill="#0f213b" stroke="#334155"/>
  <rect x="80" y="180" width="7" height="330" rx="3.5" fill="#38bdf8"/>
  <text x="106" y="222" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="760" text-anchor="start">Local / deterministic</text>
  <text x="106" y="250" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="520" text-anchor="start">Browser-owned execution boundary</text>
</g>

<g filter="url(#shadow)">
  <rect x="690" y="180" width="430" height="330" rx="24" fill="#0f213b" stroke="#334155"/>
  <rect x="690" y="180" width="7" height="330" rx="3.5" fill="#fbbf24"/>
  <text x="716" y="222" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="760" text-anchor="start">Optional / governed</text>
  <text x="716" y="250" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="520" text-anchor="start">Explicit service boundary</text>
</g>

<g>
  <rect x="120" y="270" width="350" height="34" rx="17" fill="#38bdf8" fill-opacity=".13"
        stroke="#38bdf8" stroke-opacity=".55"/>
  <text x="295.0" y="293" fill="#e2e8f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="650" text-anchor="middle">IndexedDB — records</text>
</g>

<g>
  <rect x="120" y="334" width="350" height="34" rx="17" fill="#34d399" fill-opacity=".13"
        stroke="#34d399" stroke-opacity=".55"/>
  <text x="295.0" y="357" fill="#e2e8f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="650" text-anchor="middle">Preferences — theme + language</text>
</g>

<g>
  <rect x="120" y="398" width="350" height="34" rx="17" fill="#a78bfa" fill-opacity=".13"
        stroke="#a78bfa" stroke-opacity=".55"/>
  <text x="295.0" y="421" fill="#e2e8f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="650" text-anchor="middle">Feedback queue — local export</text>
</g>

<g>
  <rect x="730" y="270" width="350" height="34" rx="17" fill="#fbbf24" fill-opacity=".13"
        stroke="#fbbf24" stroke-opacity=".55"/>
  <text x="905.0" y="293" fill="#e2e8f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="650" text-anchor="middle">AI gateway — optional</text>
</g>

<g>
  <rect x="730" y="334" width="350" height="34" rx="17" fill="#fb7185" fill-opacity=".13"
        stroke="#fb7185" stroke-opacity=".55"/>
  <text x="905.0" y="357" fill="#e2e8f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="650" text-anchor="middle">Remote REST — explicit adapter</text>
</g>

<g>
  <rect x="730" y="398" width="350" height="34" rx="17" fill="#22d3ee" fill-opacity=".13"
        stroke="#22d3ee" stroke-opacity=".55"/>
  <text x="905.0" y="421" fill="#e2e8f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="650" text-anchor="middle">Server controls — auth + rate limits</text>
</g>

<g transform="translate(600 350)">
  <path d="M0-65L58-42V2C58 47 27 77 0 91C-27 77-58 47-58 2V-42Z"
        fill="url(#emerald)" fill-opacity=".17" stroke="#34d399" stroke-width="2"/>
  <path d="M-22 6l16 16 31-40" fill="none" stroke="#a7f3d0" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round"/>
</g>

<g>
  <rect x="100" y="558" width="321.3333333333333" height="34" rx="17" fill="#38bdf8" fill-opacity=".13"
        stroke="#38bdf8" stroke-opacity=".55"/>
  <text x="260.66666666666663" y="581" fill="#e2e8f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="650" text-anchor="middle">VITE_* is public</text>
</g>

<g>
  <rect x="439.3333333333333" y="558" width="321.3333333333333" height="34" rx="17" fill="#34d399" fill-opacity=".13"
        stroke="#34d399" stroke-opacity=".55"/>
  <text x="600.0" y="581" fill="#e2e8f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="650" text-anchor="middle">No privileged client secret</text>
</g>

<g>
  <rect x="778.6666666666666" y="558" width="321.3333333333333" height="34" rx="17" fill="#a78bfa" fill-opacity=".13"
        stroke="#a78bfa" stroke-opacity=".55"/>
  <text x="939.3333333333333" y="581" fill="#e2e8f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="650" text-anchor="middle">Export backups</text>
</g>

</svg>
