<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="privacy-title privacy-title-desc">
<title id="privacy-title">ResinDB Pro local-first privacy architecture</title>
<desc id="privacy-title-desc">A browser workspace stores records locally while optional AI and remote REST services are accessed through explicitly configured gateways.</desc>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#06111f"/>
    <stop offset="0.55" stop-color="#0b1830"/>
    <stop offset="1" stop-color="#111b35"/>
  </linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#22d3ee"/>
    <stop offset="1" stop-color="#2563eb"/>
  </linearGradient>
  <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#34d399"/>
    <stop offset="1" stop-color="#059669"/>
  </linearGradient>
  <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#c084fc"/>
    <stop offset="1" stop-color="#7c3aed"/>
  </linearGradient>
  <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fbbf24"/>
    <stop offset="1" stop-color="#f97316"/>
  </linearGradient>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="7" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020617" flood-opacity=".45"/>
  </filter>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
    <path d="M36 0H0V36" fill="none" stroke="#94a3b8" stroke-opacity=".055" stroke-width="1"/>
  </pattern>
  <marker id="arrow-cyan" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
    <path d="M0 0L10 5L0 10Z" fill="#38bdf8"/>
  </marker>
  <marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
    <path d="M0 0L10 5L0 10Z" fill="#64748b"/>
  </marker>
</defs>

<rect width="1200" height="640" rx="28" fill="url(#bg)"/>
<rect width="1200" height="640" rx="28" fill="url(#grid)"/>
<circle cx="1040" cy="80" r="190" fill="#2563eb" fill-opacity=".07"/>
<circle cx="110" cy="620" r="210" fill="#10b981" fill-opacity=".05"/>
<text x="72" y="70" fill="#f8fafc" fill-opacity="1.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="36" font-weight="800" text-anchor="start">Local-first privacy architecture</text><text x="72" y="104" fill="#94a3b8" fill-opacity="1.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="start">Browser storage by default; remote services are explicit, optional and bounded</text><path d="M72 126H1128" stroke="#334155" stroke-width="1"/>
<g filter="url(#shadow)">
  <rect x="92" y="188" width="300" height="316" rx="24" fill="#0f213b" stroke="#334155"/>
  <rect x="92" y="188" width="7" height="316" rx="3.5" fill="#38bdf8"/>
  <text x="120" y="230" fill="#f8fafc" fill-opacity="1.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="750" text-anchor="start">Browser workspace</text>
  <text x="120" y="258" fill="#94a3b8" fill-opacity="1.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="start">Default execution boundary</text>
</g>

<g>
  <rect x="126" y="286" width="222" height="34" rx="17" fill="#38bdf8" fill-opacity=".13" stroke="#38bdf8" stroke-opacity=".55"/>
  <text x="237.0" y="309" fill="#e2e8f0" fill-opacity="1.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="650" text-anchor="middle">IndexedDB records</text>
</g>

<g>
  <rect x="126" y="342" width="222" height="34" rx="17" fill="#34d399" fill-opacity=".13" stroke="#34d399" stroke-opacity=".55"/>
  <text x="237.0" y="365" fill="#e2e8f0" fill-opacity="1.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="650" text-anchor="middle">Preferences + history</text>
</g>

<g>
  <rect x="126" y="398" width="222" height="34" rx="17" fill="#a78bfa" fill-opacity=".13" stroke="#a78bfa" stroke-opacity=".55"/>
  <text x="237.0" y="421" fill="#e2e8f0" fill-opacity="1.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="650" text-anchor="middle">Feedback queue</text>
</g>

<g filter="url(#shadow)">
  <rect x="808" y="188" width="300" height="316" rx="24" fill="#0f213b" stroke="#334155"/>
  <rect x="808" y="188" width="7" height="316" rx="3.5" fill="#fbbf24"/>
  <text x="836" y="230" fill="#f8fafc" fill-opacity="1.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="750" text-anchor="start">Optional gateways</text>
  <text x="836" y="258" fill="#94a3b8" fill-opacity="1.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="start">Configured by the operator</text>
</g>

<g>
  <rect x="842" y="286" width="232" height="34" rx="17" fill="#fbbf24" fill-opacity=".13" stroke="#fbbf24" stroke-opacity=".55"/>
  <text x="958.0" y="309" fill="#e2e8f0" fill-opacity="1.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="650" text-anchor="middle">OpenAI-compatible API</text>
</g>

<g>
  <rect x="842" y="342" width="232" height="34" rx="17" fill="#fb7185" fill-opacity=".13" stroke="#fb7185" stroke-opacity=".55"/>
  <text x="958.0" y="365" fill="#e2e8f0" fill-opacity="1.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="650" text-anchor="middle">Remote REST adapter</text>
</g>

<g>
  <rect x="842" y="398" width="232" height="34" rx="17" fill="#38bdf8" fill-opacity=".13" stroke="#38bdf8" stroke-opacity=".55"/>
  <text x="958.0" y="421" fill="#e2e8f0" fill-opacity="1.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="650" text-anchor="middle">Server-side controls</text>
</g>

<g transform="translate(600 332)" filter="url(#shadow)">
  <rect x="-112" y="-92" width="224" height="184" rx="30" fill="#0f213b" stroke="#475569"/>
  <path d="M-42-16V-38C-42-91 42-91 42-38V-16" fill="none" stroke="#34d399" stroke-width="9" stroke-linecap="round"/>
  <rect x="-64" y="-22" width="128" height="94" rx="20" fill="url(#emerald)" fill-opacity=".18" stroke="#34d399" stroke-width="2"/>
  <circle cy="18" r="12" fill="#a7f3d0"/>
  <path d="M0 30V48" stroke="#a7f3d0" stroke-width="6" stroke-linecap="round"/>
</g>
<path d="M392 346L477 346" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-muted)" stroke-dasharray="8 8"/><path d="M723 346L808 346" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-muted)" stroke-dasharray="8 8"/><text x="600" y="486" fill="#fbbf24" fill-opacity="1.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650" text-anchor="middle">VITE_* values are public build-time configuration — never store production secrets in the client.</text>
</svg>
