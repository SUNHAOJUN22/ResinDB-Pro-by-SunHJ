<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640"
 viewBox="0 0 1200 640" role="img"
 aria-labelledby="deployment-title deployment-title-desc"
 data-design-system="resindb-uiux-pro-max-v1" shape-rendering="geometricPrecision">
<title id="deployment-title">Security and deployment boundary</title>
<desc id="deployment-title-desc">Operational security is layered across browser UI, server gateway, data services and organizational governance.</desc>
<metadata>ResinDB UI UX Pro Max design system: Swiss modernism, Bento structure, WCAG-aware semantic colors, vector-only icons, 8-point spacing.</metadata>

<defs>
  <filter id="shadow-sm" x="-15%" y="-20%" width="130%" height="150%">
    <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0F172A" flood-opacity=".08"/>
  </filter>
  <pattern id="dot-grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="#CBD5E1" fill-opacity=".38"/>
  </pattern>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
    <path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/>
  </marker>
  <marker id="arrow-muted" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
    <path d="M0 0L9 4.5L0 9Z" fill="#64748B"/>
  </marker>
</defs>

<rect width="1200" height="640" rx="24" fill="#F8FAFC"/>
<rect x="0" y="142" width="1200" height="498" fill="url(#dot-grid)"/>
<rect x="0" y="0" width="1200" height="142" fill="#0F172A"/><text x="64" y="38" fill="#93C5FD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="750" text-anchor="start" letter-spacing="1.6">RESINDB PRO</text><text x="64" y="82" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="760" text-anchor="start">Security and deployment boundary</text><text x="64" y="112" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="450" text-anchor="start">The browser demo is not an authentication or release system</text><text x="1136" y="38" fill="#94A3B8" font-family="JetBrains Mono,SFMono-Regular,Consolas,monospace" font-size="11" font-weight="650" text-anchor="end" letter-spacing="1.0">ARCHITECTURE / DEPLOYMENT BOUNDARY</text><rect x="64" y="132" width="90" height="4" rx="2" fill="#2563EB"/><g filter="url(#shadow-sm)"><rect x="64" y="176" width="1072" height="78" rx="18" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="64" y="176" width="6" height="78" rx="3" fill="#2563EB"/></g><rect x="88" y="198" width="46" height="46" rx="14" fill="#2563EB" fill-opacity=".10" stroke="#2563EB" stroke-opacity=".28"/><g fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M97.0 234.0V208.0M97.0 234.0H126.0"/><path d="M102.0 228.0l7-8 6 4 9-12"/><circle cx="109.0" cy="220.0" r="2" fill="#2563EB" stroke="none"/><circle cx="115.0" cy="224.0" r="2" fill="#2563EB" stroke="none"/></g><text x="148" y="219" fill="#0F172A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="720" text-anchor="start">Browser application</text><text x="148" y="242" fill="#64748B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" text-anchor="start">demo roles • CSP • no privileged secrets</text><rect x="1084" y="194" width="32" height="24" rx="12" fill="#F1F5F9"/><text x="1100" y="211" fill="#64748B" font-family="JetBrains Mono,SFMono-Regular,Consolas,monospace" font-size="11" font-weight="700" text-anchor="middle">01</text><g filter="url(#shadow-sm)"><rect x="98" y="268" width="1004" height="78" rx="18" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="98" y="268" width="6" height="78" rx="3" fill="#0F766E"/></g><rect x="122" y="290" width="46" height="46" rx="14" fill="#0F766E" fill-opacity=".10" stroke="#0F766E" stroke-opacity=".28"/><g fill="none" stroke="#0F766E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M145.0 297.0l14 5v10c0 10-6 16-14 20-8-4-14-10-14-20v-10z"/><path d="M138.0 314.0l5 5 10-11"/></g><text x="182" y="311" fill="#0F172A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="720" text-anchor="start">Server gateway</text><text x="182" y="334" fill="#64748B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" text-anchor="start">authentication • validation • rate limiting</text><rect x="1050" y="286" width="32" height="24" rx="12" fill="#F1F5F9"/><text x="1066" y="303" fill="#64748B" font-family="JetBrains Mono,SFMono-Regular,Consolas,monospace" font-size="11" font-weight="700" text-anchor="middle">02</text><g filter="url(#shadow-sm)"><rect x="132" y="360" width="936" height="78" rx="18" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="132" y="360" width="6" height="78" rx="3" fill="#6D28D9"/></g><rect x="156" y="382" width="46" height="46" rx="14" fill="#6D28D9" fill-opacity=".10" stroke="#6D28D9" stroke-opacity=".28"/><g fill="none" stroke="#6D28D9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="164.0" y="391.0" width="30" height="11" rx="3"/><rect x="164.0" y="408.0" width="30" height="11" rx="3"/><circle cx="170.0" cy="396.5" r="1.5" fill="#6D28D9" stroke="none"/><circle cx="170.0" cy="413.5" r="1.5" fill="#6D28D9" stroke="none"/></g><text x="216" y="403" fill="#0F172A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="720" text-anchor="start">Data services</text><text x="216" y="426" fill="#64748B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" text-anchor="start">database • backup • retention • audit</text><rect x="1016" y="378" width="32" height="24" rx="12" fill="#F1F5F9"/><text x="1032" y="395" fill="#64748B" font-family="JetBrains Mono,SFMono-Regular,Consolas,monospace" font-size="11" font-weight="700" text-anchor="middle">03</text><g filter="url(#shadow-sm)"><rect x="166" y="452" width="868" height="78" rx="18" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="166" y="452" width="6" height="78" rx="3" fill="#B45309"/></g><rect x="190" y="474" width="46" height="46" rx="14" fill="#B45309" fill-opacity=".10" stroke="#B45309" stroke-opacity=".28"/><g fill="none" stroke="#B45309" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="213.0" cy="497.0" r="15"/><path d="M205.0 497.0l6 6 11-13"/></g><text x="250" y="495" fill="#0F172A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="720" text-anchor="start">Operational governance</text><text x="250" y="518" fill="#64748B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" text-anchor="start">HTTPS • monitoring • incident response</text><rect x="982" y="470" width="32" height="24" rx="12" fill="#F1F5F9"/><text x="998" y="487" fill="#64748B" font-family="JetBrains Mono,SFMono-Regular,Consolas,monospace" font-size="11" font-weight="700" text-anchor="middle">04</text><rect x="64" y="580" width="152.1" height="32" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/><circle cx="80" cy="596" r="4" fill="#2563EB"/><text x="92" y="601" fill="#334155" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" text-anchor="start">Demo roles ≠ auth</text><rect x="228.1" y="580" width="166.7" height="32" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/><circle cx="244.1" cy="596" r="4" fill="#0F766E"/><text x="256.1" y="601" fill="#334155" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" text-anchor="start">AI output ≠ release</text><rect x="406.79999999999995" y="580" width="203.2" height="32" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/><circle cx="422.79999999999995" cy="596" r="4" fill="#6D28D9"/><text x="434.79999999999995" y="601" fill="#334155" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" text-anchor="start">Operator owns compliance</text>
