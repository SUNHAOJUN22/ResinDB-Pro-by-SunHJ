<title id="network-title">Resin knowledge network</title>
<desc id="network-title-desc">Relations connect grades to families, property groups, manufacturers, routes, comparable grades and references.</desc>
<metadata>ResinDB UI UX Pro Max design system: Swiss modernism, Bento structure, WCAG-aware semantic colors, vector-only icons, 8-point spacing.</metadata>

