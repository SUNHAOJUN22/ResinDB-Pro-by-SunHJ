<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc" lang="en">
<title id="title">ResinDB Pro — Code and mathematical contracts</title>
<desc id="desc">From traceable resin data, finite numerics and compute-capability probes to verifiable scientific visualization ResinDB Pro is a local-first scientific data and analysis workbench, not a certified LIMS/ERP, commercial force field, industrial grade-release system or automatic scientific approval engine.</desc>
<defs><linearGradient id="background" x2="1" y2="1"><stop stop-color="#070e1d"/><stop offset="1" stop-color="#172338"/></linearGradient><pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#cbd5e1" stroke-opacity=".055"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L9 5L0 9" fill="none" stroke="#5eead4" stroke-width="1.4"/></marker><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC","Noto Sans",Arial,sans-serif}</style></defs>
<rect width="1600" height="900" fill="url(#background)"/><rect width="1600" height="900" fill="url(#grid)"/><circle cx="1444" cy="70" r="178" fill="#5eead4" opacity=".07"/>
<path d="M1350 26L1480 75L1410 162L1539 203M1480 75L1570 20M1410 162L1310 175" fill="none" stroke="#5eead4" stroke-opacity=".22" stroke-width="2"/>
<text x="48" y="82" font-size="49" font-weight="750" fill="#f8fafc" data-box="48,18.299999999999997,1400,78.5"><tspan x="48" dy="0">ResinDB Pro</tspan></text>
<text x="49" y="130" font-size="22" font-weight="400" fill="#5eead4" data-box="49,101.4,1465,71"><tspan x="49" dy="0">From traceable resin data, finite numerics and compute-capability probes to verifiable scientific visualization</tspan></text>
<text x="49" y="214" font-size="15" font-weight="400" fill="#94a3b8" data-box="49,194.5,1470,30.5"><tspan x="49" dy="0">CONCEPTUAL ARCHITECTURE · NOT MEASURED DATA · NOT PROOF OF EXTERNAL EXECUTION</tspan></text>
<path d="M327 357h21" fill="none" stroke="#5eead4" stroke-width="2" marker-end="url(#arrow)"/><path d="M634 357h21" fill="none" stroke="#5eead4" stroke-width="2" marker-end="url(#arrow)"/><path d="M941 357h21" fill="none" stroke="#5eead4" stroke-width="2" marker-end="url(#arrow)"/><path d="M1248 357h21" fill="none" stroke="#5eead4" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="46" y="246" width="278" height="220" rx="20" fill="#0f2038" stroke="#5eead4" stroke-opacity=".5"/><circle cx="77" cy="279" r="15" fill="#5eead4" fill-opacity=".16"/><text x="77" y="284" text-anchor="middle" font-size="13" fill="#5eead4">01</text><text x="66" y="326" font-size="23" font-weight="700" fill="#f8fafc" data-box="66,296.1,237,67.5"><tspan x="66" dy="0">Data contract</tspan></text><text x="66" y="399" font-size="17" font-weight="400" fill="#dbeafe" data-box="66,376.9,237,58.5"><tspan x="66" dy="0">Schema, source, status</tspan><tspan x="66" dy="25">and units</tspan></text></g><g><rect x="353" y="246" width="278" height="220" rx="20" fill="#0f2038" stroke="#5eead4" stroke-opacity=".5"/><circle cx="384" cy="279" r="15" fill="#5eead4" fill-opacity=".16"/><text x="384" y="284" text-anchor="middle" font-size="13" fill="#5eead4">02</text><text x="373" y="326" font-size="23" font-weight="700" fill="#f8fafc" data-box="373,296.1,237,67.5"><tspan x="373" dy="0">Numerical core</tspan></text><text x="373" y="399" font-size="17" font-weight="400" fill="#dbeafe" data-box="373,376.9,237,58.5"><tspan x="373" dy="0">Finiteness, scaling and</tspan><tspan x="373" dy="25">similarity</tspan></text></g><g><rect x="660" y="246" width="278" height="220" rx="20" fill="#0f2038" stroke="#5eead4" stroke-opacity=".5"/><circle cx="691" cy="279" r="15" fill="#5eead4" fill-opacity=".16"/><text x="691" y="284" text-anchor="middle" font-size="13" fill="#5eead4">03</text><text x="680" y="326" font-size="23" font-weight="700" fill="#f8fafc" data-box="680,296.1,237,67.5"><tspan x="680" dy="0">Compute dispatch</tspan></text><text x="680" y="399" font-size="17" font-weight="400" fill="#dbeafe" data-box="680,376.9,237,58.5"><tspan x="680" dy="0">Workers, WASM, GPU and</tspan><tspan x="680" dy="25">fallback</tspan></text></g><g><rect x="967" y="246" width="278" height="220" rx="20" fill="#0f2038" stroke="#5eead4" stroke-opacity=".5"/><circle cx="998" cy="279" r="15" fill="#5eead4" fill-opacity=".16"/><text x="998" y="284" text-anchor="middle" font-size="13" fill="#5eead4">04</text><text x="987" y="326" font-size="23" font-weight="700" fill="#f8fafc" data-box="987,296.1,237,67.5"><tspan x="987" dy="0">Scientific figures</tspan></text><text x="987" y="399" font-size="17" font-weight="400" fill="#dbeafe" data-box="987,376.9,237,58.5"><tspan x="987" dy="0">Labels, finished events</tspan><tspan x="987" dy="25">and nonblank canvas</tspan></text></g><g><rect x="1274" y="246" width="278" height="220" rx="20" fill="#0f2038" stroke="#5eead4" stroke-opacity=".5"/><circle cx="1305" cy="279" r="15" fill="#5eead4" fill-opacity=".16"/><text x="1305" y="284" text-anchor="middle" font-size="13" fill="#5eead4">05</text><text x="1294" y="326" font-size="23" font-weight="700" fill="#f8fafc" data-box="1294,296.1,237,67.5"><tspan x="1294" dy="0">Export and audit</tspan></text><text x="1294" y="399" font-size="17" font-weight="400" fill="#dbeafe" data-box="1294,376.9,237,58.5"><tspan x="1294" dy="0">Language, hashes,</tspan><tspan x="1294" dy="25">receipts and boundaries</tspan></text></g><g><rect x="46" y="510" width="476" height="161" rx="20" fill="#101827" stroke="#64748b" stroke-opacity=".65"/><text x="68" y="544" font-size="17" font-weight="650" fill="#5eead4" data-box="68,521.9,432,30.5"><tspan x="68" dy="0">01  Continuous-coordinate KDE</tspan></text><text x="68" y="588" font-size="19" font-weight="400" fill="#f8fafc" data-box="68,563.3,432,35.5"><tspan x="68" dy="0">f̂(x,y) = Σ K((x−x_i)/h_x,(y−y_i)/h_y)</tspan></text><text x="68" y="617" font-size="19" font-weight="400" fill="#f8fafc" data-box="68,592.3,432,35.5"><tspan x="68" dy="0">/ (n · h_x · h_y)</tspan></text></g><g><rect x="552" y="510" width="476" height="161" rx="20" fill="#101827" stroke="#64748b" stroke-opacity=".65"/><text x="574" y="544" font-size="17" font-weight="650" fill="#5eead4" data-box="574,521.9,432,30.5"><tspan x="574" dy="0">02  Weibull median-rank fit</tspan></text><text x="574" y="588" font-size="19" font-weight="400" fill="#f8fafc" data-box="574,563.3,432,35.5"><tspan x="574" dy="0">F(v) = 1 − exp[−(v/η)^m]</tspan></text><text x="574" y="617" font-size="19" font-weight="400" fill="#f8fafc" data-box="574,592.3,432,35.5"><tspan x="574" dy="0">B₅ = η [−ln(0.95)]^(1/m)</tspan></text></g><g><rect x="1058" y="510" width="476" height="161" rx="20" fill="#101827" stroke="#64748b" stroke-opacity=".65"/><text x="1080" y="544" font-size="17" font-weight="650" fill="#5eead4" data-box="1080,521.9,432,30.5"><tspan x="1080" dy="0">03  Figure delivery gate</tspan></text><text x="1080" y="588" font-size="19" font-weight="400" fill="#f8fafc" data-box="1080,563.3,432,35.5"><tspan x="1080" dy="0">figure = finite ∧ labeled</tspan></text><text x="1080" y="617" font-size="19" font-weight="400" fill="#f8fafc" data-box="1080,592.3,432,35.5"><tspan x="1080" dy="0">∧ finished ∧ nonblank</tspan></text></g>
<rect x="46" y="712" width="1488" height="111" rx="18" fill="#080f1b" stroke="#334155"/>
<text x="73" y="741" font-size="13" font-weight="650" fill="#5eead4" data-box="73,724.1,1440,26.5"><tspan x="73" dy="0">QUALIFICATION AND INTERPRETATION</tspan></text><text x="73" y="767" font-size="18" font-weight="400" fill="#dbeafe" data-box="73,743.6,1440,63"><tspan x="73" dy="0">ResinDB Pro is a local-first scientific data and analysis workbench, not a certified LIMS/ERP, commercial force field, industrial</tspan><tspan x="73" dy="27">grade-release system or automatic scientific approval engine.</tspan></text>
<text x="49" y="871" font-size="14" font-weight="400" fill="#94a3b8" data-box="49,852.8,1470,27"><tspan x="49" dy="0">PINNED SOURCE · FINITE NUMERICS · REPRODUCIBLE EVIDENCE · HUMAN REVIEW</tspan></text>
