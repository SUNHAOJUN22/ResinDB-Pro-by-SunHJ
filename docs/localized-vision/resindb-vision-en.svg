<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">ResinDB Pro — Bilingual Scientific Data and Figure Delivery</title>
  <desc id="desc">Code-grounded architecture for governed resin data, semantic units, formulas, multivariate analytics, CJK-safe figures and traceable exports. Proxy or fitted output is not measured material property or causal evidence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06101f"/><stop offset="0.55" stop-color="#0c1b38"/><stop offset="1" stop-color="#121827"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#60a5fa"/><stop offset="0.55" stop-color="#818cf8"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#93a4c2" stroke-opacity="0.07"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="16"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ec4899"/></marker>
  </defs>
  <style>
    text{font-family:Inter,"Segoe UI","Noto Sans",Arial,sans-serif}.eyebrow{font-size:14px;font-weight:700;letter-spacing:2.2px;fill:#93c5fd}.title{font-size:42px;font-weight:800;fill:#f8fafc}.subtitle{font-size:18px;fill:#b7c6dc}.card{fill:#0c1930;stroke:#6784b5;stroke-opacity:.55;stroke-width:1.5}.index{font-size:13px;font-weight:800;fill:#93c5fd}.module{font-size:18px;font-weight:750;fill:#f8fafc}.detail{font-size:13px;fill:#9fb0c9}.label{font-size:12px;font-weight:800;letter-spacing:1.5px;fill:#a5b4fc}.formula{font-family:"Cambria Math","STIX Two Math",Inter,"Segoe UI",sans-serif;font-size:21px;fill:#e8eef8}.small{font-size:13px;fill:#aebdd2}.boundary{font-size:19px;font-weight:700;fill:#f1f5f9}
  </style>
  <rect width="1600" height="900" rx="34" fill="url(#bg)"/>
  <rect width="1600" height="900" rx="34" fill="url(#grid)"/>
  <circle cx="1420" cy="100" r="230" fill="#6366f1" opacity=".12" filter="url(#glow)"/>
  <circle cx="210" cy="760" r="190" fill="#ec4899" opacity=".07" filter="url(#glow)"/>
  <text x="80" y="58" class="eyebrow">AI CONCEPTUAL ARCHITECTURE · CODE-GROUNDED · NOT EXPERIMENTAL OUTPUT</text>
  <text x="80" y="116" class="title">ResinDB Pro — Bilingual Scientific Data and Figure Delivery</text>
  <text x="80" y="154" class="subtitle">Governed data → semantic units → formula engine → multivariate analytics → CJK-safe figures → traceable export</text>
  <rect x="80" y="186" width="1440" height="76" rx="20" fill="#0b172c" stroke="#3e577e"/>
  <text x="108" y="215" class="label" fill="#f472b6">RESPONSIBILITY BOUNDARY</text>
  <text x="108" y="245" class="boundary">Proxy curves, fitted parameters and embeddings ≠ measured material properties, causal evidence or automatic scientific approval.</text>

  <g transform="translate(80 310)">
    <g><rect class="card" width="220" height="142" rx="22"/><circle cx="30" cy="30" r="16" fill="#60a5fa" opacity=".22"/><text x="30" y="35" text-anchor="middle" class="index">01</text><text x="20" y="78" class="module">Resin data catalog</text><text x="20" y="105" class="detail">Schema · provenance · units</text><rect x="20" y="122" width="180" height="5" rx="2.5" fill="#253957"/><rect x="20" y="122" width="78" height="5" rx="2.5" fill="url(#accent)"/></g>
    <path d="M220 71H244" stroke="#ec4899" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(244 0)"><rect class="card" width="220" height="142" rx="22"/><circle cx="30" cy="30" r="16" fill="#818cf8" opacity=".22"/><text x="30" y="35" text-anchor="middle" class="index">02</text><text x="20" y="78" class="module">Bilingual semantics</text><text x="20" y="105" class="detail">EN / ZH · terminology gate</text><rect x="20" y="122" width="180" height="5" rx="2.5" fill="#253957"/><rect x="20" y="122" width="104" height="5" rx="2.5" fill="url(#accent)"/></g>
    <path d="M464 71H488" stroke="#ec4899" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(488 0)"><rect class="card" width="220" height="142" rx="22"/><circle cx="30" cy="30" r="16" fill="#818cf8" opacity=".22"/><text x="30" y="35" text-anchor="middle" class="index">03</text><text x="20" y="78" class="module">Formula engine</text><text x="20" y="105" class="detail">Finite numerics · contracts</text><rect x="20" y="122" width="180" height="5" rx="2.5" fill="#253957"/><rect x="20" y="122" width="132" height="5" rx="2.5" fill="url(#accent)"/></g>
    <path d="M708 71H732" stroke="#ec4899" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(732 0)"><rect class="card" width="220" height="142" rx="22"/><circle cx="30" cy="30" r="16" fill="#818cf8" opacity=".22"/><text x="30" y="35" text-anchor="middle" class="index">04</text><text x="20" y="78" class="module">Scientific workers</text><text x="20" y="105" class="detail">Isolation · deterministic jobs</text><rect x="20" y="122" width="180" height="5" rx="2.5" fill="#253957"/><rect x="20" y="122" width="92" height="5" rx="2.5" fill="url(#accent)"/></g>
    <path d="M952 71H976" stroke="#ec4899" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(976 0)"><rect class="card" width="220" height="142" rx="22"/><circle cx="30" cy="30" r="16" fill="#818cf8" opacity=".22"/><text x="30" y="35" text-anchor="middle" class="index">05</text><text x="20" y="78" class="module">ECharts figure gate</text><text x="20" y="105" class="detail">CJK · dark/light · no blanks</text><rect x="20" y="122" width="180" height="5" rx="2.5" fill="#253957"/><rect x="20" y="122" width="126" height="5" rx="2.5" fill="url(#accent)"/></g>
    <path d="M1196 71H1220" stroke="#ec4899" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(1220 0)"><rect class="card" width="220" height="142" rx="22"/><circle cx="30" cy="30" r="16" fill="#ec4899" opacity=".22"/><text x="30" y="35" text-anchor="middle" class="index">06</text><text x="20" y="78" class="module">Traceable export</text><text x="20" y="105" class="detail">Receipt · hash · replay</text><rect x="20" y="122" width="180" height="5" rx="2.5" fill="#253957"/><rect x="20" y="122" width="154" height="5" rx="2.5" fill="url(#accent)"/></g>
  </g>

  <g transform="translate(80 506)">
    <g><rect class="card" width="450" height="150" rx="22"/><text x="24" y="34" class="label">OUTLIER CONTRACT</text><text x="24" y="79" class="formula">D²(x) = (x−μ)ᵀ(Σ+αI)⁻¹(x−μ)</text><text x="24" y="119" class="small">Regularized covariance; finite-value and dimensionality gates.</text></g>
    <g transform="translate(495 0)"><rect class="card" width="450" height="150" rx="22"/><text x="24" y="34" class="label">RHEOLOGY PROXY CONTRACT</text><text x="24" y="79" class="formula">η(γ̇)=η∞+(η₀−η∞)[1+(λγ̇)ᵃ]^((n−1)/a)</text><text x="24" y="119" class="small">Proxy/fitted curve only; units and parameter bounds remain explicit.</text></g>
    <g transform="translate(990 0)"><rect class="card" width="450" height="150" rx="22"/><text x="24" y="34" class="label">DENSITY ESTIMATION CONTRACT</text><text x="24" y="79" class="formula">f̂ₕ(x)= (nh)⁻¹ Σᵢ K((x−xᵢ)/h)</text><text x="24" y="119" class="small">Bandwidth, sample count and evidence status accompany every figure.</text></g>
  </g>

  <path d="M80 720H1520" stroke="#354966"/>
  <g transform="translate(80 758)"><circle cx="10" cy="10" r="9" fill="#60a5fa"/><circle cx="36" cy="10" r="9" fill="#ec4899"/><text x="62" y="16" class="small">2026-10 acceptance visual · derived from current repository modules and mathematical contracts</text></g>
  <rect x="1080" y="744" width="440" height="78" rx="20" fill="#0b172c" stroke="#667eea" stroke-opacity=".65"/>
  <text x="1300" y="775" text-anchor="middle" class="label">FAIL CLOSED · TRACEABLE · REPRODUCIBLE</text>
  <text x="1300" y="804" text-anchor="middle" font-size="17" font-weight="750" fill="#f8fafc">main · UTF-8 · deterministic evidence</text>
</svg>
