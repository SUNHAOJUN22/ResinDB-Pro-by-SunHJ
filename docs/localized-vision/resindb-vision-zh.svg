<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">ResinDB Pro——双语科学数据与图形交付平台</title>
  <desc id="desc">基于代码的树脂数据治理、语义与单位、公式引擎、多变量分析、CJK 安全图形和可追踪导出架构。代理结果或拟合输出不等于实测材料性质或因果证据。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06101f"/><stop offset="0.55" stop-color="#0c1b38"/><stop offset="1" stop-color="#121827"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#60a5fa"/><stop offset="0.55" stop-color="#818cf8"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#93a4c2" stroke-opacity="0.07"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="16"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ec4899"/></marker>
  </defs>
  <style>
    text{font-family:"Noto Sans SC","Microsoft YaHei","PingFang SC",Inter,"Segoe UI",sans-serif}.eyebrow{font-size:14px;font-weight:700;letter-spacing:2.2px;fill:#93c5fd}.title{font-size:42px;font-weight:800;fill:#f8fafc}.subtitle{font-size:18px;fill:#b7c6dc}.card{fill:#0c1930;stroke:#6784b5;stroke-opacity:.55;stroke-width:1.5}.index{font-size:13px;font-weight:800;fill:#93c5fd}.module{font-size:18px;font-weight:750;fill:#f8fafc}.detail{font-size:13px;fill:#9fb0c9}.label{font-size:12px;font-weight:800;letter-spacing:1.5px;fill:#a5b4fc}.formula{font-family:"Cambria Math","STIX Two Math","Noto Sans SC","Microsoft YaHei",sans-serif;font-size:21px;fill:#e8eef8}.small{font-size:13px;fill:#aebdd2}.boundary{font-size:19px;font-weight:700;fill:#f1f5f9}
  </style>
  <rect width="1600" height="900" rx="34" fill="url(#bg)"/>
  <rect width="1600" height="900" rx="34" fill="url(#grid)"/>
  <circle cx="1420" cy="100" r="230" fill="#6366f1" opacity=".12" filter="url(#glow)"/>
  <circle cx="210" cy="760" r="190" fill="#ec4899" opacity=".07" filter="url(#glow)"/>
  <text x="80" y="58" class="eyebrow">AI 概念架构图 · 基于当前代码 · 非实验或求解器输出</text>
  <text x="80" y="116" class="title">ResinDB Pro——双语科学数据与图形交付平台</text>
  <text x="80" y="154" class="subtitle">受治理数据 → 语义与单位 → 公式引擎 → 多变量分析 → CJK 安全图形 → 可追踪导出</text>
  <rect x="80" y="186" width="1440" height="76" rx="20" fill="#0b172c" stroke="#3e577e"/>
  <text x="108" y="215" class="label" fill="#f472b6">科学责任边界</text>
  <text x="108" y="245" class="boundary">代理曲线、拟合参数与嵌入结果 ≠ 实测材料性质、因果证据或自动科学批准。</text>

  <g transform="translate(80 310)">
    <g><rect class="card" width="220" height="142" rx="22"/><circle cx="30" cy="30" r="16" fill="#60a5fa" opacity=".22"/><text x="30" y="35" text-anchor="middle" class="index">01</text><text x="20" y="78" class="module">树脂数据目录</text><text x="20" y="105" class="detail">模式 · 来源 · 单位</text><rect x="20" y="122" width="180" height="5" rx="2.5" fill="#253957"/><rect x="20" y="122" width="78" height="5" rx="2.5" fill="url(#accent)"/></g>
    <path d="M220 71H244" stroke="#ec4899" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(244 0)"><rect class="card" width="220" height="142" rx="22"/><circle cx="30" cy="30" r="16" fill="#818cf8" opacity=".22"/><text x="30" y="35" text-anchor="middle" class="index">02</text><text x="20" y="78" class="module">中英语义层</text><text x="20" y="105" class="detail">术语一致性 · 语言模式</text><rect x="20" y="122" width="180" height="5" rx="2.5" fill="#253957"/><rect x="20" y="122" width="104" height="5" rx="2.5" fill="url(#accent)"/></g>
    <path d="M464 71H488" stroke="#ec4899" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(488 0)"><rect class="card" width="220" height="142" rx="22"/><circle cx="30" cy="30" r="16" fill="#818cf8" opacity=".22"/><text x="30" y="35" text-anchor="middle" class="index">03</text><text x="20" y="78" class="module">公式引擎</text><text x="20" y="105" class="detail">有限数值 · 数理合同</text><rect x="20" y="122" width="180" height="5" rx="2.5" fill="#253957"/><rect x="20" y="122" width="132" height="5" rx="2.5" fill="url(#accent)"/></g>
    <path d="M708 71H732" stroke="#ec4899" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(732 0)"><rect class="card" width="220" height="142" rx="22"/><circle cx="30" cy="30" r="16" fill="#818cf8" opacity=".22"/><text x="30" y="35" text-anchor="middle" class="index">04</text><text x="20" y="78" class="module">科学计算进程</text><text x="20" y="105" class="detail">隔离执行 · 确定性任务</text><rect x="20" y="122" width="180" height="5" rx="2.5" fill="#253957"/><rect x="20" y="122" width="92" height="5" rx="2.5" fill="url(#accent)"/></g>
    <path d="M952 71H976" stroke="#ec4899" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(976 0)"><rect class="card" width="220" height="142" rx="22"/><circle cx="30" cy="30" r="16" fill="#818cf8" opacity=".22"/><text x="30" y="35" text-anchor="middle" class="index">05</text><text x="20" y="78" class="module">ECharts 图形门</text><text x="20" y="105" class="detail">CJK · 明暗主题 · 防空图</text><rect x="20" y="122" width="180" height="5" rx="2.5" fill="#253957"/><rect x="20" y="122" width="126" height="5" rx="2.5" fill="url(#accent)"/></g>
    <path d="M1196 71H1220" stroke="#ec4899" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(1220 0)"><rect class="card" width="220" height="142" rx="22"/><circle cx="30" cy="30" r="16" fill="#ec4899" opacity=".22"/><text x="30" y="35" text-anchor="middle" class="index">06</text><text x="20" y="78" class="module">可追踪导出</text><text x="20" y="105" class="detail">回执 · 哈希 · 重放</text><rect x="20" y="122" width="180" height="5" rx="2.5" fill="#253957"/><rect x="20" y="122" width="154" height="5" rx="2.5" fill="url(#accent)"/></g>
  </g>

  <g transform="translate(80 506)">
    <g><rect class="card" width="450" height="150" rx="22"/><text x="24" y="34" class="label">异常检测合同</text><text x="24" y="79" class="formula">D²(x) = (x−μ)ᵀ(Σ+αI)⁻¹(x−μ)</text><text x="24" y="119" class="small">协方差正则化；对有限性、维度和单位执行硬门控。</text></g>
    <g transform="translate(495 0)"><rect class="card" width="450" height="150" rx="22"/><text x="24" y="34" class="label">流变代理合同</text><text x="24" y="79" class="formula">η(γ̇)=η∞+(η₀−η∞)[1+(λγ̇)ᵃ]^((n−1)/a)</text><text x="24" y="119" class="small">仅表示代理或拟合曲线；单位与参数边界始终显式保留。</text></g>
    <g transform="translate(990 0)"><rect class="card" width="450" height="150" rx="22"/><text x="24" y="34" class="label">密度估计合同</text><text x="24" y="79" class="formula">f̂ₕ(x)= (nh)⁻¹ Σᵢ K((x−xᵢ)/h)</text><text x="24" y="119" class="small">每张图同时记录带宽、样本数、来源与证据状态。</text></g>
  </g>

  <path d="M80 720H1520" stroke="#354966"/>
  <g transform="translate(80 758)"><circle cx="10" cy="10" r="9" fill="#60a5fa"/><circle cx="36" cy="10" r="9" fill="#ec4899"/><text x="62" y="16" class="small">2026-10 验收视觉 · 依据当前仓库模块与数理合同绘制</text></g>
  <rect x="1080" y="744" width="440" height="78" rx="20" fill="#0b172c" stroke="#667eea" stroke-opacity=".65"/>
  <text x="1300" y="775" text-anchor="middle" class="label">失败闭合 · 可追踪 · 可复现</text>
  <text x="1300" y="804" text-anchor="middle" font-size="17" font-weight="750" fill="#f8fafc">main · UTF-8 · 确定性证据</text>
</svg>
