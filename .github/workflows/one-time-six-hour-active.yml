name: ResinDB-Pro six-hour active qualification

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  stage-1:
    if: github.event.issue.number == 37 && github.event.comment.body == '/run-six-hour-active-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    outputs:
      active_ns: ${{ steps.soak.outputs.active_ns }}
      cycles: ${{ steps.soak.outputs.cycles }}
      tested_sha: ${{ steps.target.outputs.tested_sha }}
    steps:
      - name: Check out exact pre-harness source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 02d068df34be411e5415bc7a2fb3d1212def8908
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact pre-harness source
        id: target
        shell: bash
        run: |
          set -euo pipefail
          tested_sha=$(git rev-parse HEAD)
          test "$tested_sha" = "02d068df34be411e5415bc7a2fb3d1212def8908"
          echo "tested_sha=$tested_sha" >> "$GITHUB_OUTPUT"
      - name: Record six-hour run start
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body=$(printf '%s\n' \
            'ResinDB-Pro-by-SunHJ six-hour active qualification: RUNNING.' \
            '' \
            "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            'immutable tested source: 02d068df34be411e5415bc7a2fb3d1212def8908' \
            'required active test time: 21,600,000,000,000 ns' \
            'duration basis: MONOTONIC_ACTIVE_TEST_EXECUTION_ONLY' \
            '' \
            'Queueing, dependency installation and artifact upload time are excluded.')
          gh issue comment 37 --repo "$GITHUB_REPOSITORY" --body "$body"
      - name: Install deterministic CJK fonts
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          fc-list :lang=zh | grep -q .
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install exact normalized dependencies
        shell: bash
        run: |
          set -euo pipefail
          cp package.json /tmp/resindb-package.json
          cp package-lock.json /tmp/resindb-package-lock.json
          node scripts/prepare-ci-manifest.mjs
          npm ci --registry=https://registry.npmjs.org
          cp /tmp/resindb-package.json package.json
          cp /tmp/resindb-package-lock.json package-lock.json
      - name: Write deterministic qualification cycle
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/six-hour-cycle.sh" <<'SOAK_CYCLE'
          set -euo pipefail
          npm run validate:docs
          npm run validate:source
          npm run validate:data
          npm run validate:compute
          npm run validate:scientific-ui
          npm run lint
          npm run typecheck
          npm run benchmark:kmeans:smoke
          npm test
          npm run test:unit
          npm run test:science
          npm run test:coverage
          npm run build
          npm run smoke
          npm run test:ui
          SOAK_CYCLE
          chmod +x "$RUNNER_TEMP/six-hour-cycle.sh"
      - name: Accumulate active qualification runtime
        id: soak
        shell: bash
        env:
          ACTIVE_INITIAL_NS: "0"
          ACTIVE_TARGET_NS: "9000000000000"
          STAGE_NUMBER: "1"
          TESTED_SHA: "${{ steps.target.outputs.tested_sha }}"
        run: |
          set -euo pipefail
          mkdir -p six-hour-evidence
          python - <<'PY'
          import json
          import os
          import subprocess
          import time
          from pathlib import Path

          evidence_dir = Path("six-hour-evidence")
          stage = int(os.environ["STAGE_NUMBER"])
          active_ns = int(os.environ["ACTIVE_INITIAL_NS"])
          target_ns = int(os.environ["ACTIVE_TARGET_NS"])
          tested_sha = os.environ["TESTED_SHA"]
          if not tested_sha:
              raise SystemExit("tested source SHA is empty")
          cycle = 0
          ledger = evidence_dir / f"stage-{stage}.ndjson"
          ledger.write_text("", encoding="utf-8")

          while active_ns < target_ns:
              cycle += 1
              started_wall = int(time.time())
              started_active = time.monotonic_ns()
              log = evidence_dir / f"stage-{stage}-current.log"
              with log.open("w", encoding="utf-8") as stream:
                  completed = subprocess.run(
                      ["bash", os.path.join(os.environ["RUNNER_TEMP"], "six-hour-cycle.sh")],
                      stdout=stream,
                      stderr=subprocess.STDOUT,
                      text=True,
                      check=False,
                  )
              ended_active = time.monotonic_ns()
              ended_wall = int(time.time())
              cycle_active_ns = ended_active - started_active
              active_ns += cycle_active_ns
              row = {
                  "stage": stage,
                  "cycle": cycle,
                  "tested_sha": tested_sha,
                  "started_epoch": started_wall,
                  "ended_epoch": ended_wall,
                  "cycle_active_ns": cycle_active_ns,
                  "cumulative_active_ns": active_ns,
                  "target_active_ns": target_ns,
                  "returncode": completed.returncode,
              }
              with ledger.open("a", encoding="utf-8") as stream:
                  stream.write(json.dumps(row, sort_keys=True) + "\n")
              if completed.returncode != 0:
                  print(log.read_text(encoding="utf-8", errors="replace")[-30000:])
                  raise SystemExit(
                      f"stage {stage} cycle {cycle} failed with {completed.returncode}"
                  )
              print(
                  f"stage={stage} cycle={cycle} PASS "
                  f"active={active_ns / 3_600_000_000_000:.6f} h",
                  flush=True,
              )

          summary = {
              "schema": "SUNHJ-SIX-HOUR-ACTIVE-QUALIFICATION-1",
              "stage": stage,
              "pass": True,
              "tested_sha": tested_sha,
              "stage_cycles": cycle,
              "cumulative_active_ns": active_ns,
              "cumulative_active_hours": active_ns / 3_600_000_000_000,
              "required_active_ns": target_ns,
              "duration_basis": "MONOTONIC_ACTIVE_TEST_EXECUTION_ONLY",
          }
          (evidence_dir / f"stage-{stage}-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"active_ns={active_ns}\n")
              stream.write(f"cycles={cycle}\n")
          PY
      - name: Upload stage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ResinDB-Pro-six-hour-stage-1-${{ github.run_id }}
          path: six-hour-evidence/
          if-no-files-found: error
          retention-days: 30

  stage-2:
    needs: stage-1
    if: github.event.issue.number == 37 && github.event.comment.body == '/run-six-hour-active-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    outputs:
      active_ns: ${{ steps.soak.outputs.active_ns }}
      cycles: ${{ steps.soak.outputs.cycles }}
      tested_sha: ${{ needs.stage-1.outputs.tested_sha }}
    steps:
      - name: Check out exact pre-harness source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.stage-1.outputs.tested_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install deterministic CJK fonts
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          fc-list :lang=zh | grep -q .
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install exact normalized dependencies
        shell: bash
        run: |
          set -euo pipefail
          cp package.json /tmp/resindb-package.json
          cp package-lock.json /tmp/resindb-package-lock.json
          node scripts/prepare-ci-manifest.mjs
          npm ci --registry=https://registry.npmjs.org
          cp /tmp/resindb-package.json package.json
          cp /tmp/resindb-package-lock.json package-lock.json
      - name: Write deterministic qualification cycle
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/six-hour-cycle.sh" <<'SOAK_CYCLE'
          set -euo pipefail
          npm run validate:docs
          npm run validate:source
          npm run validate:data
          npm run validate:compute
          npm run validate:scientific-ui
          npm run lint
          npm run typecheck
          npm run benchmark:kmeans:smoke
          npm test
          npm run test:unit
          npm run test:science
          npm run test:coverage
          npm run build
          npm run smoke
          npm run test:ui
          SOAK_CYCLE
          chmod +x "$RUNNER_TEMP/six-hour-cycle.sh"
      - name: Accumulate active qualification runtime
        id: soak
        shell: bash
        env:
          ACTIVE_INITIAL_NS: "${{ needs.stage-1.outputs.active_ns }}"
          ACTIVE_TARGET_NS: "21600000000000"
          STAGE_NUMBER: "2"
          TESTED_SHA: "${{ needs.stage-1.outputs.tested_sha }}"
        run: |
          set -euo pipefail
          mkdir -p six-hour-evidence
          python - <<'PY'
          import json
          import os
          import subprocess
          import time
          from pathlib import Path

          evidence_dir = Path("six-hour-evidence")
          stage = int(os.environ["STAGE_NUMBER"])
          active_ns = int(os.environ["ACTIVE_INITIAL_NS"])
          target_ns = int(os.environ["ACTIVE_TARGET_NS"])
          tested_sha = os.environ["TESTED_SHA"]
          if not tested_sha:
              raise SystemExit("tested source SHA is empty")
          cycle = 0
          ledger = evidence_dir / f"stage-{stage}.ndjson"
          ledger.write_text("", encoding="utf-8")

          while active_ns < target_ns:
              cycle += 1
              started_wall = int(time.time())
              started_active = time.monotonic_ns()
              log = evidence_dir / f"stage-{stage}-current.log"
              with log.open("w", encoding="utf-8") as stream:
                  completed = subprocess.run(
                      ["bash", os.path.join(os.environ["RUNNER_TEMP"], "six-hour-cycle.sh")],
                      stdout=stream,
                      stderr=subprocess.STDOUT,
                      text=True,
                      check=False,
                  )
              ended_active = time.monotonic_ns()
              ended_wall = int(time.time())
              cycle_active_ns = ended_active - started_active
              active_ns += cycle_active_ns
              row = {
                  "stage": stage,
                  "cycle": cycle,
                  "tested_sha": tested_sha,
                  "started_epoch": started_wall,
                  "ended_epoch": ended_wall,
                  "cycle_active_ns": cycle_active_ns,
                  "cumulative_active_ns": active_ns,
                  "target_active_ns": target_ns,
                  "returncode": completed.returncode,
              }
              with ledger.open("a", encoding="utf-8") as stream:
                  stream.write(json.dumps(row, sort_keys=True) + "\n")
              if completed.returncode != 0:
                  print(log.read_text(encoding="utf-8", errors="replace")[-30000:])
                  raise SystemExit(
                      f"stage {stage} cycle {cycle} failed with {completed.returncode}"
                  )
              print(
                  f"stage={stage} cycle={cycle} PASS "
                  f"active={active_ns / 3_600_000_000_000:.6f} h",
                  flush=True,
              )

          summary = {
              "schema": "SUNHJ-SIX-HOUR-ACTIVE-QUALIFICATION-1",
              "stage": stage,
              "pass": True,
              "tested_sha": tested_sha,
              "stage_cycles": cycle,
              "cumulative_active_ns": active_ns,
              "cumulative_active_hours": active_ns / 3_600_000_000_000,
              "required_active_ns": target_ns,
              "duration_basis": "MONOTONIC_ACTIVE_TEST_EXECUTION_ONLY",
          }
          (evidence_dir / f"stage-{stage}-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"active_ns={active_ns}\n")
              stream.write(f"cycles={cycle}\n")
          PY
      - name: Upload stage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ResinDB-Pro-six-hour-stage-2-${{ github.run_id }}
          path: six-hour-evidence/
          if-no-files-found: error
          retention-days: 30

  duration-gate:
    needs: [stage-1, stage-2]
    if: always() && github.event.issue.number == 37 && github.event.comment.body == '/run-six-hour-active-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce six active hours
        shell: bash
        env:
          STAGE1_RESULT: "${{ needs.stage-1.result }}"
          STAGE2_RESULT: "${{ needs.stage-2.result }}"
          ACTIVE_NS: "${{ needs.stage-2.outputs.active_ns }}"
          TESTED_SHA: "${{ needs.stage-2.outputs.tested_sha }}"
        run: |
          set -euo pipefail
          test "$STAGE1_RESULT" = success
          test "$STAGE2_RESULT" = success
          test "${ACTIVE_NS:-0}" -ge 21600000000000
          test -n "$TESTED_SHA"
          python - <<'PY'
          import json
          import os
          active_ns = int(os.environ["ACTIVE_NS"])
          print(json.dumps({
              "schema": "SUNHJ-SIX-HOUR-ACTIVE-QUALIFICATION-1",
              "pass": active_ns >= 21_600_000_000_000,
              "tested_sha": os.environ["TESTED_SHA"],
              "active_ns": active_ns,
              "active_hours": active_ns / 3_600_000_000_000,
              "required_active_ns": 21_600_000_000_000,
              "duration_basis": "MONOTONIC_ACTIVE_TEST_EXECUTION_ONLY",
          }, indent=2, sort_keys=True))
          PY
      - name: Record six-hour machine ledger
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE1_RESULT: "${{ needs.stage-1.result }}"
          STAGE2_RESULT: "${{ needs.stage-2.result }}"
          ACTIVE_NS: "${{ needs.stage-2.outputs.active_ns }}"
          TESTED_SHA: "${{ needs.stage-2.outputs.tested_sha }}"
        run: |
          set -euo pipefail
          verdict=FAIL
          if [[ "$STAGE1_RESULT" == success && "$STAGE2_RESULT" == success ]] \
            && [[ "${ACTIVE_NS:-0}" -ge 21600000000000 ]]; then
            verdict=PASS
          fi
          body=$(printf '%s\n' \
            'ResinDB-Pro-by-SunHJ six-hour active qualification: '"$verdict"'.' \
            '' \
            "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            "stage 1: $STAGE1_RESULT" \
            "stage 2: $STAGE2_RESULT" \
            "measured active test time: ${ACTIVE_NS:-0} ns" \
            'required active test time: 21,600,000,000,000 ns' \
            "immutable tested source: ${TESTED_SHA:-UNRESOLVED}" \
            'duration basis: MONOTONIC_ACTIVE_TEST_EXECUTION_ONLY' \
            '' \
            'Scientific, engineering, HSE, customer and industrial approvals remain NOT_EVALUATED.')
          gh issue comment 37 --repo "$GITHUB_REPOSITORY" --body "$body"
          test "$verdict" = PASS
