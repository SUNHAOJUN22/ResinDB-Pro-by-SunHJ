name: Final post-documentation proof 2026-07-26

on:
  push:
    branches: [main]
    paths:
      - .github/final-proof-docs-20260726.txt

permissions:
  contents: write
  actions: read

concurrency:
  group: resindb-final-proof-docs-20260726
  cancel-in-progress: false

jobs:
  prove:
    name: Validate final code and documentation tree
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Check out exact main commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Execute aggregate final proof
        id: proof
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          evidence="/tmp/resindb-final-proof-docs-20260726"
          logs="$evidence/logs"
          report="reports/final-validation-20260726"
          rm -rf "$evidence"
          mkdir -p "$logs" "$report/logs"
          printf '%s\n' "$GITHUB_SHA" > "$evidence/validated-input-commit.txt"
          {
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "runner=${RUNNER_OS:-unknown}"
          } > "$evidence/runtime.txt"

          overall=0
          run_check() {
            local name="$1"
            shift
            set +e
            timeout 40m "$@" > "$logs/$name.log" 2>&1
            local code=$?
            set -e
            printf '%s\n' "$code" > "$evidence/$name.status"
            cat "$logs/$name.log"
            if [ "$code" -ne 0 ]; then overall=1; fi
          }

          run_check visual-regeneration python3 scripts/generate-readme-visuals.py
          set +e
          git diff --exit-code -- docs/assets > "$logs/visual-diff.log" 2>&1
          visual_diff=$?
          set -e
          printf '%s\n' "$visual_diff" > "$evidence/visual-diff.status"
          if [ "$visual_diff" -ne 0 ]; then overall=1; fi

          git ls-remote --heads origin | awk '{print $2}' | sed 's#refs/heads/##' | sort > "$evidence/remote-branches.txt"
          if [ "$(cat "$evidence/remote-branches.txt")" = "main" ]; then
            printf '0\n' > "$evidence/only-main.status"
          else
            printf '1\n' > "$evidence/only-main.status"
            overall=1
          fi

          install_code=1
          for attempt in 1 2 3; do
            set +e
            timeout 15m npm ci > "$logs/npm-ci.log" 2>&1
            install_code=$?
            set -e
            if [ "$install_code" -eq 0 ]; then break; fi
            tail -n 160 "$logs/npm-ci.log"
            sleep $((attempt * 10))
          done
          printf '%s\n' "$install_code" > "$evidence/npm-ci.status"
          cat "$logs/npm-ci.log"
          if [ "$install_code" -ne 0 ]; then
            overall=1
          else
            run_check validate-ci npm run validate:ci
          fi

          set +e
          git diff --check > "$logs/git-diff-check.log" 2>&1
          diff_code=$?
          set -e
          printf '%s\n' "$diff_code" > "$evidence/git-diff-check.status"
          if [ "$diff_code" -ne 0 ]; then overall=1; fi

          residue=0
          forbidden=(
            .github/.resindb-main-update
            .github/.resindb-v310-patch
            .github/workflows/apply-resindb-main-update.yml
            .github/workflows/apply-v310-patch.yml
            .github/workflows/repository-audit-20260726.yml
            .github/workflows/finalize-repository-20260726.yml
            .github/workflows/finalize-repository-v2-20260726.yml
            .github/workflows/final-proof-20260726.yml
            docs/MIGRATION_v3.1.0.md
            docs/RELEASE_NOTES_v3.1.0.md
            reports/patch-diagnostic.json
            reports/release-baseline-v3.1.0.json
            reports/automated-audit-20260726
          )
          for path in "${forbidden[@]}"; do
            if [ -e "$path" ]; then
              echo "$path" >> "$logs/residue-check.log"
              residue=1
            fi
          done
          printf '%s\n' "$residue" > "$evidence/residue-check.status"
          if [ "$residue" -ne 0 ]; then overall=1; fi

          result=success
          if [ "$overall" -ne 0 ]; then result=failure; fi
          printf '%s\n' "$result" > "$evidence/result.txt"

          python3 - <<'PY'
          from __future__ import annotations
          import datetime as dt
          import json
          from pathlib import Path

          evidence = Path('/tmp/resindb-final-proof-docs-20260726')
          report = Path('reports/final-validation-20260726')
          summary_path = report / 'summary.json'
          summary = json.loads(summary_path.read_text()) if summary_path.exists() else {}
          runtime = dict(line.split('=', 1) for line in (evidence / 'runtime.txt').read_text().splitlines() if '=' in line)
          proof_statuses = {path.stem: int(path.read_text().strip()) for path in sorted(evidence.glob('*.status'))}
          summary.update({
              'schemaVersion': 1,
              'result': (evidence / 'result.txt').read_text().strip(),
              'repository': 'SUNHAOJUN22/ResinDB-Pro-by-SunHJ',
              'version': '3.0.0',
              'validatedInputCommit': (evidence / 'validated-input-commit.txt').read_text().strip(),
              'completedAt': dt.datetime.now(dt.timezone.utc).isoformat(),
              'runtime': runtime,
              'remoteBranches': (evidence / 'remote-branches.txt').read_text().splitlines(),
              'postDocumentationProof': True,
              'postDocumentationStatuses': proof_statuses,
          })
          summary_path.write_text(json.dumps(summary, ensure_ascii=False, indent=2) + '\n')
          Path('reports/ci-validation-latest.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2) + '\n')

          report_md = report / 'REPORT.md'
          text = report_md.read_text() if report_md.exists() else '# ResinDB Pro final validation report\n'
          text += '\n## Post-documentation proof\n\n'
          text += f"- Result: **{summary['result'].upper()}**\n"
          text += f"- Validated input commit: `{summary['validatedInputCommit']}`\n"
          text += '- Aggregate command: `npm run validate:ci`\n'
          text += '- The proof workflow and trigger remove themselves before the evidence commit.\n\n'
          text += '| Gate | Exit code |\n|---|---:|\n'
          for name, code in proof_statuses.items():
              text += f'| `{name}` | `{code}` |\n'
          report_md.write_text(text)
          PY

          rm -rf "$report/post-documentation-logs"
          cp -R "$logs" "$report/post-documentation-logs"
          if [ "$overall" -ne 0 ]; then exit 1; fi

      - name: Upload post-documentation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resindb-post-documentation-proof-${{ github.sha }}
          path: |
            /tmp/resindb-final-proof-docs-20260726/
            reports/final-validation-20260726/
            coverage/
            artifacts/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish self-cleaned evidence
        if: steps.proof.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules dist coverage artifacts
          rm -f .github/workflows/final-proof-docs-20260726.yml .github/final-proof-docs-20260726.txt
          git config user.name "ResinDB Verification Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "ci: verify final documented main tree"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Enforce proof result
        if: always()
        shell: bash
        run: |
          test "${{ steps.proof.outcome }}" = "success"
