name: Diagnose original ResinDB transport head

on:
  push:
    branches: [main]
    paths:
      - .github/diagnose-original-head.trigger

permissions:
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect original head blobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          post() {
            local context="$1" description="$2"
            curl -fsSL -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -d "$(jq -nc --arg state success --arg context "$context" --arg description "${description:0:130}" --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{state:$state,context:$context,description:$description,target_url:$target_url}')" >/dev/null
          }
          blobs=(
            7dd53c13901d139f683324aa5993cbaa4ff667b7
            067abf7677984e3536613bb50aed8ed89e07f79a
          )
          for i in "${!blobs[@]}"; do
            json="/tmp/original-${i}.json"
            raw="/tmp/original-${i}.raw"
            norm="/tmp/original-${i}.norm"
            curl -fsSL -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${blobs[$i]}" -o "$json"
            jq -r '.content' "$json" | tr -d '\n' | base64 -d > "$raw"
            tr -d '\r\n' < "$raw" > "$norm"
            hash="$(sha256sum "$norm" | awk '{print $1}')"
            bytes="$(stat -c%s "$norm")"
            post "resindb/orig${i}-${bytes}-${hash:0:12}" "${blobs[$i]}"
          done
