name: Fix full dependency audit 2026-07-26

on:
  push:
    branches: [main]
    paths:
      - .github/fix-full-dependency-audit-20260726.trigger

permissions:
  contents: write
  actions: read

concurrency:
  group: resindb-fix-full-dependency-audit-20260726
  cancel-in-progress: false

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Remediate advisory and verify final tree
        id: validation
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          out=/tmp/resindb-full-dependency-remediation-20260726
          logs="$out/logs"
          rm -rf "$out"
          mkdir -p "$logs"
          overall=0

          rm -f .github/workflows/fix-full-dependency-audit-20260726.yml
          rm -f .github/fix-full-dependency-audit-20260726.trigger
          rm -f reports/dependency-audit-diagnostic-20260726.txt

          cp package.json "$out/package-before-audit-fix.json"
          set +e
          npm audit fix --package-lock-only --ignore-scripts > "$logs/audit-fix.log" 2>&1
          audit_fix=$?
          set -e
          printf '%s\n' "$audit_fix" > "$out/audit-fix.status"
          cat "$logs/audit-fix.log"
          if ! cmp -s package.json "$out/package-before-audit-fix.json"; then
            echo 'npm audit fix unexpectedly changed package.json' | tee "$logs/package-json-drift.log"
            printf '1\n' > "$out/package-json-drift.status"
            overall=1
          else
            printf '0\n' > "$out/package-json-drift.status"
          fi
          if [ "$audit_fix" -ne 0 ]; then overall=1; fi

          python3 - <<'PY'
          from __future__ import annotations
          import json
          from pathlib import Path

          root = Path('.')
          package_path = root / 'package.json'
          package = json.loads(package_path.read_text(encoding='utf-8'))
          scripts = package.setdefault('scripts', {})
          scripts['audit:all'] = 'npm audit --audit-level=high'
          scripts['audit:prod'] = 'npm audit --omit=dev --audit-level=high'
          validate_ci = scripts['validate:ci']
          validate_ci = validate_ci.replace(' && npm run audit:prod', '')
          if 'npm run audit:all' not in validate_ci:
              validate_ci += ' && npm run audit:all'
          scripts['validate:ci'] = validate_ci
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          ci_path = root / '.github' / 'workflows' / 'ci.yml'
          ci = ci_path.read_text(encoding='utf-8')
          ci = ci.replace('      - name: Production dependency audit\n', '      - name: Full dependency audit\n', 1)
          ci = ci.replace('            if npm run audit:prod; then\n', '            if npm run audit:all; then\n', 1)
          ci_path.write_text(ci, encoding='utf-8')

          generator_path = root / 'scripts' / 'generate-readme-visuals.py'
          generator = generator_path.read_text(encoding='utf-8')
          generator = generator.replace(
              'Permanent gates for documentation, production-source hygiene, static analysis, regression, runtime smoke and dependency audit.',
              'Permanent gates for documentation, production-source hygiene, static analysis, regression, runtime smoke and full dependency audit.',
              1,
          )
          generator = generator.replace(
              '("Security", "production dependency audit"),',
              '("Security", "full dependency audit"),',
              1,
          )
          generator_path.write_text(generator, encoding='utf-8')

          validator_path = root / 'scripts' / 'validate-repository-docs.py'
          validator = validator_path.read_text(encoding='utf-8')
          script_anchor = '        "validate:source": "python3 scripts/validate-source-hygiene.py",\n'
          if '"audit:all": "npm audit --audit-level=high"' not in validator:
              validator = validator.replace(
                  script_anchor,
                  script_anchor + '        "audit:all": "npm audit --audit-level=high",\n',
                  1,
              )
          semantic_anchor = '            for phrase in ("Source hygiene", "production code • no injection"):\n'
          validator = validator.replace(
              semantic_anchor,
              '            for phrase in ("Source hygiene", "production code • no injection", "full dependency audit"):\n',
              1,
          )
          ci_anchor = '    if "npm run validate:source" not in ci:\n        fail("permanent CI must execute npm run validate:source")\n'
          if 'permanent CI must execute npm run audit:all' not in validator:
              validator = validator.replace(
                  ci_anchor,
                  ci_anchor + '    if "npm run audit:all" not in ci:\n        fail("permanent CI must execute npm run audit:all")\n',
                  1,
              )
          forbidden_anchor = '    ".github/workflows/source-hygiene-finalization-20260726.yml",\n'
          addition = forbidden_anchor + '    ".github/workflows/fix-full-dependency-audit-20260726.yml",\n    ".github/fix-full-dependency-audit-20260726.trigger",\n    "reports/dependency-audit-diagnostic-20260726.txt",\n'
          if '".github/workflows/fix-full-dependency-audit-20260726.yml"' not in validator:
              validator = validator.replace(forbidden_anchor, addition, 1)
          validator_path.write_text(validator, encoding='utf-8')

          readme_path = root / 'README.md'
          readme = readme_path.read_text(encoding='utf-8')
          readme = readme.replace(
              '文档、生产源码卫生、静态检查、回归测试、构建、浏览器 UI 和生产依赖审计组成的质量门',
              '文档、生产源码卫生、静态检查、回归测试、构建、浏览器 UI 和全部依赖审计组成的质量门',
              1,
          )
          readme = readme.replace('npm run audit:prod\n', 'npm run audit:all\nnpm run audit:prod\n', 1)
          source_paragraph = '`validate:source` 只扫描 `src/` 下的生产 TypeScript/JavaScript，拒绝 TypeScript/ESLint 抑制、任意代码执行、危险 HTML 注入和未完成标记。用于证明公式引擎拒绝恶意表达式的负向安全样本保留在 `tests/`，不会再被错误当成生产风险。'
          audit_paragraph = '\n\n`audit:all` 是正式 CI 的依赖安全门，覆盖生产与开发工具链；`audit:prod` 保留为仅生产依赖的独立复核命令。任何 high 或 critical advisory 都会阻断验证。'
          if audit_paragraph.strip() not in readme:
              readme = readme.replace(source_paragraph, source_paragraph + audit_paragraph, 1)
          readme_path.write_text(readme, encoding='utf-8')

          validation_path = root / 'docs' / 'VALIDATION.md'
          validation = validation_path.read_text(encoding='utf-8')
          validation = validation.replace(
              'production build, HTTP smoke, Chromium UI smoke and dependency audit.',
              'production build, HTTP smoke, Chromium UI smoke and full dependency audit.',
              1,
          )
          validation = validation.replace(
              '13. `npm run audit:prod` finds no high-severity production dependency vulnerability.',
              '13. `npm run audit:all` finds no high-severity vulnerability in production or development dependencies.\n14. `npm run audit:prod` independently confirms the production dependency graph is clean.',
              1,
          )
          validation = validation.replace('14. `git diff --check`', '15. `git diff --check`', 1)
          validation = validation.replace('15. The remote branch inventory', '16. The remote branch inventory', 1)
          validation = validation.replace(
              'Chromium UI smoke and the production dependency audit as separate attributable stages.',
              'Chromium UI smoke and the full dependency audit as separate attributable stages.',
              1,
          )
          audit_contract = '''\n## Dependency security contract\n\n`npm run audit:all` is the permanent CI gate and covers production plus development tooling. `npm run audit:prod` remains available as a narrower production-only cross-check. The lockfile may be remediated without `--force`; major-version or manifest changes require an explicit reviewed update.\n'''
          if '## Dependency security contract' not in validation:
              validation = validation.replace('\n## Current verified baseline\n', audit_contract + '\n## Current verified baseline\n', 1)
          validation_path.write_text(validation, encoding='utf-8')
          PY

          python3 scripts/generate-readme-visuals.py

          record() {
            local name="$1"
            shift
            set +e
            timeout 35m "$@" > "$logs/$name.log" 2>&1
            local code=$?
            set -e
            printf '%s\n' "$code" > "$out/$name.status"
            cat "$logs/$name.log"
            if [ "$code" -ne 0 ]; then overall=1; fi
          }

          printf '%s\n' "$GITHUB_SHA" > "$out/validated-input-commit.txt"
          {
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "python=$(python3 --version 2>&1)"
            echo "runner=${RUNNER_OS:-unknown}"
          } > "$out/runtime.txt"

          install_code=1
          for attempt in 1 2 3; do
            set +e
            timeout 15m npm ci > "$logs/npm-ci.log" 2>&1
            install_code=$?
            set -e
            if [ "$install_code" -eq 0 ]; then break; fi
            tail -n 160 "$logs/npm-ci.log"
            sleep $((attempt * 10))
          done
          printf '%s\n' "$install_code" > "$out/npm-ci.status"
          cat "$logs/npm-ci.log"
          if [ "$install_code" -ne 0 ]; then
            overall=1
          else
            record validate-source npm run validate:source
            record lint npm run lint
            record typecheck npm run typecheck
            record test npm run test
            record test-unit npm run test:unit
            record test-science npm run test:science
            record test-coverage npm run test:coverage
            record build npm run build
            record smoke npm run smoke
            record test-ui npm run test:ui
            record audit-all npm run audit:all
            record audit-prod npm run audit:prod
            record visuals-check npm run visuals:check
          fi

          git ls-remote --heads origin | awk '{print $2}' | sed 's#refs/heads/##' | sort > "$out/remote-branches.txt"
          if [ "$(cat "$out/remote-branches.txt")" = "main" ]; then
            printf '0\n' > "$out/only-main.status"
          else
            printf '1\n' > "$out/only-main.status"
            overall=1
          fi

          set +e
          git diff --check > "$logs/git-diff-check.log" 2>&1
          diff_code=$?
          set -e
          printf '%s\n' "$diff_code" > "$out/git-diff-check.status"
          if [ "$diff_code" -ne 0 ]; then overall=1; fi

          result=success
          if [ "$overall" -ne 0 ]; then result=failure; fi
          printf '%s\n' "$result" > "$out/result.txt"

          python3 - <<'PY'
          from __future__ import annotations
          import datetime as dt
          import json
          import re
          from pathlib import Path

          root = Path('/tmp/resindb-full-dependency-remediation-20260726')
          logs = root / 'logs'
          fixed = Path('reports/final-visual-upgrade-20260726/summary.json')
          alias = Path('reports/ci-validation-latest.json')
          report = Path('reports/final-visual-upgrade-20260726/REPORT.md')
          runtime = dict(line.split('=', 1) for line in (root / 'runtime.txt').read_text().splitlines() if '=' in line)
          statuses = {p.stem: int(p.read_text().strip()) for p in sorted(root.glob('*.status'))}
          clean = re.sub(r'\x1b\[[0-9;]*m', '', (logs / 'test-coverage.log').read_text(errors='replace'))
          tests_match = re.search(r'Tests\s+(\d+) passed', clean)
          files_match = re.search(r'Test Files\s+(\d+) passed', clean)
          coverage_match = re.search(r'All files\s*\|\s*([\d.]+)\s*\|\s*([\d.]+)\s*\|\s*([\d.]+)\s*\|\s*([\d.]+)', clean)
          if not tests_match or not files_match or not coverage_match:
              raise SystemExit('unable to parse current test and coverage results')
          coverage = {
              'statements': float(coverage_match.group(1)),
              'branches': float(coverage_match.group(2)),
              'functions': float(coverage_match.group(3)),
              'lines': float(coverage_match.group(4)),
          }
          visuals = sorted(p.name for p in Path('docs/assets').glob('resindb-*.svg'))
          validated_commit = (root / 'validated-input-commit.txt').read_text().strip()
          completed = dt.datetime.now(dt.timezone.utc).isoformat()
          result = 'success' if all(code == 0 for code in statuses.values()) else 'failure'
          proof = {
              'result': result,
              'validatedInputCommit': validated_commit,
              'completedAt': completed,
              'runtime': runtime,
              'remoteBranches': (root / 'remote-branches.txt').read_text().splitlines(),
              'statuses': statuses,
              'scope': 'full dependency remediation plus truthful Help Center, hardened Chromium, deterministic visuals and complete application validation',
              'rawEvidenceArtifact': f'resindb-full-dependency-remediation-{validated_commit}',
          }
          summary = {
              'schemaVersion': 1,
              'result': result,
              'repository': 'SUNHAOJUN22/ResinDB-Pro-by-SunHJ',
              'version': '3.0.0',
              'validatedInputCommit': validated_commit,
              'completedAt': completed,
              'runtime': runtime,
              'remoteBranches': proof['remoteBranches'],
              'statuses': statuses,
              'testFilesPassed': int(files_match.group(1)),
              'testsPassed': int(tests_match.group(1)),
              'coveragePercent': coverage,
              'visualCount': len(visuals),
              'generatedVisuals': visuals,
              'rawEvidenceArtifact': proof['rawEvidenceArtifact'],
              'currentTreeVerification': proof,
          }
          payload = json.dumps(summary, ensure_ascii=False, indent=2) + '\n'
          fixed.write_text(payload, encoding='utf-8')
          alias.write_text(payload, encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          replacement = (
              f'当前最新完整验证基线使用 Node.js 22 / npm 10 / Python 3.12 / Linux，记录 **{summary["testFilesPassed"]} 个测试文件、{summary["testsPassed"]} 个测试用例** 全部通过，'
              f'验证 **{summary["visualCount"]} 张确定性功能图**，并通过中文浅色和英文深色 Dashboard Chromium smoke。精确退出码、覆盖率与图像清单见 '
              '[`reports/final-visual-upgrade-20260726/REPORT.md`](reports/final-visual-upgrade-20260726/REPORT.md)、'
              '[`reports/ci-validation-latest.json`](reports/ci-validation-latest.json) 和 [`docs/VALIDATION.md`](docs/VALIDATION.md)。'
          )
          readme = re.sub(r'当前最新完整验证基线使用 Node\.js 22 / npm 10 / Python 3\.12 / Linux，记录 \*\*\d+ 个测试文件、\d+ 个测试用例\*\* 全部通过，验证 \*\*\d+ 张确定性功能图\*\*，并通过中文浅色和英文深色 Dashboard Chromium smoke。精确退出码、覆盖率与图像清单见 .*?。', replacement, readme, count=1)
          readme_path.write_text(readme, encoding='utf-8')

          validation_path = Path('docs/VALIDATION.md')
          validation = validation_path.read_text(encoding='utf-8')
          validation = re.sub(r'The recorded baseline contains \*\*\d+ test files and \d+ passing tests\*\*\.', f'The recorded baseline contains **{summary["testFilesPassed"]} test files and {summary["testsPassed"]} passing tests**.', validation, count=1)
          validation = re.sub(r'\| Statements \| [\d.]+% \|', f'| Statements | {coverage["statements"]:.1f}% |', validation, count=1)
          validation = re.sub(r'\| Branches \| [\d.]+% \|', f'| Branches | {coverage["branches"]:.1f}% |', validation, count=1)
          validation = re.sub(r'\| Functions \| [\d.]+% \|', f'| Functions | {coverage["functions"]:.1f}% |', validation, count=1)
          validation = re.sub(r'\| Lines \| [\d.]+% \|', f'| Lines | {coverage["lines"]:.1f}% |', validation, count=1)
          validation_path.write_text(validation, encoding='utf-8')

          lines = [
              '# ResinDB Pro final visual and validation report', '',
              f'- Result: **{result.upper()}**',
              f'- Validated input commit: `{validated_commit}`',
              f'- Runtime: `{runtime.get("node")}` / `{runtime.get("npm")}` / `{runtime.get("python")}` / `{runtime.get("runner")}`',
              f'- Remote branches: `{", ".join(proof["remoteBranches"])}`',
              f'- Test files passed: **{summary["testFilesPassed"]}**',
              f'- Tests passed: **{summary["testsPassed"]}**',
              f'- Deterministic README visuals: **{summary["visualCount"]}**', '',
              '## Gate status', '', '| Gate | Exit code |', '|---|---:|',
          ]
          lines += [f'| `{name}` | `{code}` |' for name, code in statuses.items()]
          lines += ['', '## Coverage', '', '| Metric | Percent |', '|---|---:|',
                    f'| Statements | {coverage["statements"]:.2f}% |',
                    f'| Branches | {coverage["branches"]:.2f}% |',
                    f'| Functions | {coverage["functions"]:.2f}% |',
                    f'| Lines | {coverage["lines"]:.2f}% |', '',
                    '## Generated visual inventory', '']
          lines += [f'- `{name}`' for name in visuals]
          lines += ['', '## Resolved in this audit', '',
                    '- Remediated the brace-expansion high-severity development-tooling advisory without --force.',
                    '- Upgraded permanent CI from production-only audit to a full production-and-development dependency audit.',
                    '- Corrected Help Center capability claims and added bilingual accessibility regression tests.',
                    '- Updated the deterministic quality-gate SVG and semantic checks.',
                    '- Hardened Chromium startup and page-target readiness for loaded runners.']
          if result != 'success':
              for name, code in statuses.items():
                  if code == 0:
                      continue
                  log = logs / f'{name}.log'
                  if log.exists():
                      lines += ['', f'## Failure excerpt: {name}', '', '```text', *log.read_text(errors='replace').splitlines()[-160:], '```']
          report.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

          record validate-docs npm run validate:docs

          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/resindb-full-dependency-remediation-20260726')
          fixed = Path('reports/final-visual-upgrade-20260726/summary.json')
          alias = Path('reports/ci-validation-latest.json')
          report = Path('reports/final-visual-upgrade-20260726/REPORT.md')
          summary = json.loads(fixed.read_text(encoding='utf-8'))
          statuses = {p.stem: int(p.read_text().strip()) for p in sorted(root.glob('*.status'))}
          summary['statuses'] = statuses
          summary['currentTreeVerification']['statuses'] = statuses
          summary['result'] = 'success' if all(code == 0 for code in statuses.values()) else 'failure'
          summary['currentTreeVerification']['result'] = summary['result']
          payload = json.dumps(summary, ensure_ascii=False, indent=2) + '\n'
          fixed.write_text(payload, encoding='utf-8')
          alias.write_text(payload, encoding='utf-8')

          text = report.read_text(encoding='utf-8')
          marker = '\n## Final documentation proof\n'
          if marker in text:
              text = text.split(marker, 1)[0].rstrip() + '\n'
          text += marker + '\n'
          text += f'- Result: **{summary["result"].upper()}**\n'
          text += f'- `validate-docs`: `{statuses.get("validate-docs")}`\n'
          report.write_text(text, encoding='utf-8')
          (root / 'result.txt').write_text(summary['result'] + '\n')
          PY

          if [ "$(cat "$out/result.txt")" != "success" ]; then exit 1; fi

      - name: Upload raw remediation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resindb-full-dependency-remediation-${{ github.sha }}
          path: |
            /tmp/resindb-full-dependency-remediation-20260726/
            coverage/
            artifacts/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish remediated final tree
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          result="$(cat /tmp/resindb-full-dependency-remediation-20260726/result.txt)"
          rm -rf node_modules dist coverage artifacts
          git config user.name "ResinDB Dependency Remediation Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          if [ "$result" = "success" ]; then
            git commit -m "final: remediate full dependency audit and reverify main"
          else
            git commit -m "ci: publish dependency remediation failure evidence"
          fi
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Enforce result
        if: always()
        run: test "${{ steps.validation.outcome }}" = "success"
