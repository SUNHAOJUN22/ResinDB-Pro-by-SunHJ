name: One-time direct ResinDB security lock

on:
  push:
    branches:
      - agent/final-acceptance-resindb-20260808
    paths:
      - .github/workflows/one-time-direct-security-lock.yml

permissions:
  contents: write

concurrency:
  group: resindb-direct-security-lock
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out exact acceptance branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/final-acceptance-resindb-20260808
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Generate and prove patched exact lock
        shell: bash
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json'); if(p.overrides?.dompurify!=='3.4.13'||p.overrides?.nanoid!=='3.3.17') throw new Error('security overrides missing')"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci
          node -e "const p=require('./package-lock.json'); if(p.packages?.['node_modules/dompurify']?.version!=='3.4.13'||p.packages?.['node_modules/nanoid']?.version!=='3.3.17') throw new Error('patched lock versions missing')"
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high

      - name: Run focused code, language and browser regression
        shell: bash
        run: |
          set -euo pipefail
          npm run validate:docs
          npm run validate:source
          npm run validate:data
          npm run validate:compute
          npm run validate:scientific-ui
          npm run lint
          npm run typecheck
          npm run test:unit
          npm run test:ui

      - name: Restore permanent CI and publish clean branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f .github/security-lock-republish.trigger
          git rm .github/workflows/one-time-direct-security-lock.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json .github/workflows/ci.yml
          git add -u .github/security-lock-republish.trigger
          git diff --cached --check
          git commit -m 'security: publish zero-vulnerability dependency lock'
          git push origin HEAD:agent/final-acceptance-resindb-20260808
