name: One-time governed data and README final validation v2

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write
  statuses: write

concurrency:
  group: one-time-governed-data-readme-final-v2
  cancel-in-progress: false

jobs:
  validate-final-tree:
    if: contains(github.event.head_commit.message, 'run governed data README final validation v2')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Prepare exact final tree
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote --heads origin | tee /tmp/resindb-final-branch-proof.txt
          test "$(wc -l < /tmp/resindb-final-branch-proof.txt | tr -d ' ')" -eq 1
          test "$(grep -c 'refs/heads/main$' /tmp/resindb-final-branch-proof.txt || true)" -eq 1
          git rm .github/workflows/one-time-governed-data-readme-final-v2.yml
          git rm .github/run-governed-data-readme-final-v2.trigger
          tested_tree=$(git write-tree)
          printf 'TESTED_TREE=%s\n' "$tested_tree" >> "$GITHUB_ENV"
          printf '%s\n' "$tested_tree" | tee /tmp/resindb-tested-tree.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/npm-ci.log
          cp package.json /tmp/resindb-package-exact.json
          cp package-lock.json /tmp/resindb-package-lock-exact.json
          restore_manifests() {
            cp /tmp/resindb-package-exact.json package.json
            cp /tmp/resindb-package-lock-exact.json package-lock.json
          }
          trap restore_manifests EXIT
          node scripts/prepare-ci-manifest.mjs | tee /tmp/ci-manifest-normalization.json
          for registry in https://registry.npmjs.org https://registry.npmmirror.com; do
            for attempt in 1 2 3; do
              printf '\nregistry=%s attempt=%s\n' "$registry" "$attempt" | tee -a /tmp/npm-ci.log
              if npm ci --registry="$registry" >> /tmp/npm-ci.log 2>&1; then
                restore_manifests
                trap - EXIT
                cat /tmp/ci-manifest-normalization.json
                cat /tmp/npm-ci.log
                exit 0
              fi
              tail -n 200 /tmp/npm-ci.log
              sleep $((attempt * 10))
            done
          done
          exit 1

      - name: Complete exact-tree validation
        run: npm run validate:ci

      - name: Record dependency audits and freshness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          set +e
          npm audit --omit=dev --audit-level=high --json > artifacts/npm-audit-prod.json
          prod_code=$?
          npm audit --audit-level=high --json > artifacts/npm-audit-all.json
          all_code=$?
          npm outdated --json > artifacts/npm-outdated.json
          outdated_code=$?
          set -e
          if [ ! -s artifacts/npm-outdated.json ]; then printf '{}\n' > artifacts/npm-outdated.json; fi
          printf '%s\n' "$outdated_code" > artifacts/npm-outdated-exit-code.txt
          jq '.metadata.vulnerabilities' artifacts/npm-audit-prod.json
          jq '.metadata.vulnerabilities' artifacts/npm-audit-all.json
          test "$prod_code" -eq 0
          test "$all_code" -eq 0

      - name: Prove exact final repository and bundle source tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          git ls-remote --heads origin | tee artifacts/branch-proof.txt
          test "$(wc -l < artifacts/branch-proof.txt | tr -d ' ')" -eq 1
          test "$(grep -c 'refs/heads/main$' artifacts/branch-proof.txt || true)" -eq 1
          test "$(git write-tree)" = "$TESTED_TREE"
          test "$(find docs/images -maxdepth 1 -type f -name 'ui-*.png' | wc -l | tr -d ' ')" -eq 8
          test "$(find docs/images -maxdepth 1 -type f -name 'resindb-*.svg' | wc -l | tr -d ' ')" -eq 0
          test -s docs/COMPUTE_AND_DISPLAY_AUDIT.md
          test -s docs/compute-module-catalog.json
          test -s docs/DATA_ARCHITECTURE.md
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner --mode='u+rwX,go+rX,go-w' \
            -czf artifacts/exact-source-tree.tar.gz \
            .github data docs native schemas scripts src tests .npmrc .nvmrc eslint.config.js index.html \
            package-lock.json package.json README.md tsconfig.json vite.config.ts
          sha256sum artifacts/exact-source-tree.tar.gz | tee artifacts/exact-source-tree.sha256
          test "$(stat -c%s artifacts/exact-source-tree.tar.gz)" -gt 100000

      - name: Write final validation context
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const tests = JSON.parse(fs.readFileSync('artifacts/test-results.json', 'utf8'));
          const catalog = JSON.parse(fs.readFileSync('docs/compute-module-catalog.json', 'utf8'));
          const context = {
            schemaVersion: 7,
            repository: process.env.GITHUB_REPOSITORY,
            triggerSha: process.env.GITHUB_SHA,
            testedTree: process.env.TESTED_TREE,
            ref: process.env.GITHUB_REF,
            runId: Number(process.env.GITHUB_RUN_ID),
            runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            testFiles: tests.testResults.length,
            testCount: tests.numTotalTests,
            computeModules: catalog.modules.length,
            readmeScreenshots: 8,
            finalBranchCount: 1,
            validationScope: 'governed-data-compute-display-real-readme-v2',
            generatedAt: new Date().toISOString(),
          };
          fs.writeFileSync('artifacts/ci-context.json', `${JSON.stringify(context, null, 2)}\n`);
          fs.writeFileSync('artifacts/ci-gates.json', `${JSON.stringify({
            schemaVersion: 5,
            status: 'PASS',
            testedTree: process.env.TESTED_TREE,
            gates: [
              'docs-real-screenshots','source-hygiene','canonical-governed-data','compute-surface',
              'scientific-ui','lint','typescript','kmeans-benchmark','regression','isolated-unit',
              'isolated-science-workers','whole-source-coverage','build','http-smoke','chromium-ui',
              'production-audit','complete-audit','single-main-branch','deterministic-exact-source-tree',
            ],
          }, null, 2)}\n`);
          NODE

      - name: Generate validation receipt and reports
        shell: bash
        run: |
          set -euo pipefail
          npm run report:receipt
          npm run report:validation
          npm run report:pdf

      - name: Render PDF for visual acceptance
        shell: bash
        run: |
          set -euo pipefail
          pdf='artifacts/ResinDB-Pro-3.2.0-Final-Validation-Report.pdf'
          test -s "$pdf"
          if ! command -v pdfinfo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
          pdfinfo "$pdf"
          pdftoppm -png -r 120 "$pdf" artifacts/pdf-render >/dev/null
          mapfile -t pages < <(find artifacts -maxdepth 1 -name 'pdf-render-*.png' -print | sort -V)
          test "${#pages[@]}" -ge 2
          test "$(stat -c%s "${pages[0]}")" -gt 10000

      - name: Upload final validation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: resindb-data-compute-readme-final-v2-${{ github.sha }}
          path: |
            coverage/
            artifacts/
            README.md
            docs/COMPUTE_AND_DISPLAY_AUDIT.md
            docs/compute-module-catalog.json
            docs/DATA_ARCHITECTURE.md
            FINAL_CODE_AUDIT.md
            FINAL_RELEASE_REPORT.md
          if-no-files-found: error
          retention-days: 30

      - name: Commit the tested final tree
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only)"
          expected=$(printf '%s\n' \
            '.github/run-governed-data-readme-final-v2.trigger' \
            '.github/workflows/one-time-governed-data-readme-final-v2.yml')
          actual=$(git diff --cached --name-only)
          test "$actual" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: finalize governed data README exact-tree validation v2'
          test "$(git rev-parse 'HEAD^{tree}')" = "$TESTED_TREE"
          git push origin HEAD:main
          final_sha=$(git rev-parse HEAD)
          printf 'FINAL_SHA=%s\n' "$final_sha" >> "$GITHUB_ENV"

      - name: Publish final commit validation status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          payload=$(jq -nc \
            --arg state success \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg description 'ResinDB governed-data/README exact-tree validation v2: success' \
            --arg context 'resindb/ci-evidence' \
            '{state:$state,target_url:$target_url,description:$description,context:$context}')
          curl -fsSL -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${FINAL_SHA}" \
            -d "$payload" >/dev/null
