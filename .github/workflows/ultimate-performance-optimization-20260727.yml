name: Ultimate performance optimization 2026-07-27

on:
  push:
    branches: [main]
    paths:
      - .github/ultimate-performance-optimization-20260727.trigger

permissions:
  contents: write
  actions: read

concurrency:
  group: resindb-ultimate-performance-optimization-20260727
  cancel-in-progress: true

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Baseline, optimize and verify
        id: optimization
        continue-on-error: true
        shell: bash
        run: bash scripts/run-ultimate-performance-optimization.sh
      - name: Upload raw performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resindb-performance-optimization-${{ github.sha }}
          path: |
            reports/performance-audit-20260727/
            coverage/
            artifacts/
          if-no-files-found: warn
          retention-days: 30
      - name: Publish verified candidate or compact failure evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          result="$(cat reports/performance-audit-20260727/result.txt 2>/dev/null || echo failure)"
          if [ "$result" != "success" ]; then
            rm -rf /tmp/performance-failure
            mkdir -p /tmp/performance-failure
            cp reports/performance-audit-20260727/FINAL.md /tmp/performance-failure/FAILURE.md 2>/dev/null || true
            cp reports/performance-audit-20260727/summary.json /tmp/performance-failure/summary.json 2>/dev/null || true
            git reset --hard HEAD
            rm -f .github/workflows/ultimate-performance-optimization-20260727.yml
            rm -f .github/ultimate-performance-optimization-20260727.trigger
            rm -f scripts/apply-performance-optimization.py
            rm -f scripts/run-ultimate-performance-optimization.sh
            rm -rf reports/performance-audit-20260727
            mkdir -p reports/performance-audit-20260727
            cp -R /tmp/performance-failure/. reports/performance-audit-20260727/ 2>/dev/null || true
          else
            rm -rf reports/performance-audit-20260727/logs
            rm -f reports/performance-audit-20260727/*.status
            rm -f reports/performance-audit-20260727/input-commit.txt
            rm -f reports/performance-audit-20260727/runtime.txt
            rm -f reports/performance-audit-20260727/result.txt
            rm -f reports/performance-audit-20260727/npm-outdated.exit
          fi
          rm -rf node_modules dist coverage artifacts
          git config user.name "ResinDB Performance Optimization Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          if [ "$result" = "success" ]; then
            git commit -m "perf: optimize indexed computation and publish measured evidence"
          else
            git commit -m "perf: publish optimization failure evidence"
          fi
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Enforce final result
        if: always()
        run: test "${{ steps.optimization.outcome }}" = "success"
