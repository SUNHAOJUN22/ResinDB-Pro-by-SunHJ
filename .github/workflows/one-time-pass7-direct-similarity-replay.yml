name: One-time pass7 direct similarity replay

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-pass7-replay:
    if: github.head_ref == 'agent/direct-similarity-radar-20260803'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Apply and self-delete replay patch
        shell: bash
        run: |
          set -euo pipefail
          python .github/one-time-pass7-direct-similarity-replay.py
          grep -q 'parseFiniteNumericValue' src/components/features/Product/ProductDetailDrawer.tsx
          grep -q 'allProducts={allProducts}' src/components/features/Product/ProductDetailDrawer.tsx
          grep -q '覆盖率约束的直接牌号推荐' README.md
          git rm .github/one-time-pass7-direct-similarity-replay.py
          git rm .github/workflows/one-time-pass7-direct-similarity-replay.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md src/components/features/Product/ProductDetailDrawer.tsx
          git commit -m 'docs: replay direct similarity UI and README contracts'
          git push origin HEAD:${{ github.head_ref }}
