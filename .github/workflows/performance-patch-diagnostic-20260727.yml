name: Performance patch diagnostic 2026-07-27

on:
  push:
    branches: [main]
    paths:
      - .github/performance-patch-diagnostic-20260727.trigger

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Execute historical patch in disposable worktree
        shell: bash
        run: |
          set +e
          git show e624c0553af6df226a36633467425a02643820b6:scripts/apply-performance-optimization.py > scripts/apply-performance-optimization.py
          python3 scripts/apply-performance-optimization.py > /tmp/patch.txt 2>&1
          code=$?
          set -e
          git reset --hard HEAD
          mkdir -p reports/performance-audit-20260727
          {
            echo "validated_commit=$GITHUB_SHA"
            echo "patch_exit=$code"
            echo
            cat /tmp/patch.txt
          } > reports/performance-audit-20260727/patch-diagnostic.txt
      - name: Publish and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/performance-patch-diagnostic-20260727.yml
          rm -f .github/performance-patch-diagnostic-20260727.trigger
          git config user.name "ResinDB Performance Diagnostic Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "perf: publish exact optimization patch diagnostic"
          git pull --rebase origin main
          git push origin HEAD:main
