name: One-time Pass 10 push observer

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-pass10-push-observer.yml

permissions:
  actions: read
  issues: write
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query latest Pass 10 delivery run and report
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          runs=$(curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?event=issue_comment&per_page=100")
          run=$(jq -c '[.workflow_runs[] | select(.name == "One-time Pass 10 strict numeric parsing delivery")] | sort_by(.created_at) | last // {}' <<<"$runs")
          run_id=$(jq -r '.id // "none"' <<<"$run")
          status=$(jq -r '.status // "missing"' <<<"$run")
          conclusion=$(jq -r '.conclusion // "none"' <<<"$run")
          head_sha=$(jq -r '.head_sha // "none"' <<<"$run")
          html_url=$(jq -r '.html_url // "none"' <<<"$run")
          jobs=''
          if [ "$run_id" != none ]; then
            jobs_json=$(curl -fsSL \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100")
            jobs=$(jq -r '[.jobs[] | "- job `\(.name)`: `\(.status)` / `\(.conclusion // "none")` (id `\(.id)`)" ] | join("\n")' <<<"$jobs_json")
          fi
          body=$(cat <<EOF
          PASS10_PUSH_OBSERVER
          run_id: ${run_id}
          status: ${status}
          conclusion: ${conclusion}
          head_sha: ${head_sha}
          url: ${html_url}
          ${jobs}
          EOF
          )
          jq -n --arg body "$body" '{body:$body}' > /tmp/comment.json
          curl -fsSL -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/34/comments" \
            -d @/tmp/comment.json
