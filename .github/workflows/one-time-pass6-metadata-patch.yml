name: One-time pass6 similarity and hull metadata patch

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-pass6-patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/similarity-hull-robustness-20260803'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Apply deterministic metadata and regression updates
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          const performancePath = 'tests/science/numericalPerformance.test.ts';
          let performance = fs.readFileSync(performancePath, 'utf8');
          const oldVersion = "expect(payload.modelVersion).toBe('zscore-cosine-flat-f64-2.1.0');";
          const newVersion = "expect(payload.modelVersion).toBe('zscore-cosine-overlap-f64-3.0.0');";
          if (!performance.includes(oldVersion)) throw new Error('Old similarity model assertion not found.');
          performance = performance.replace(oldVersion, newVersion);
          const oldDiagnostics = [
            "      matrixStorage: 'flat-float64-unit-vectors',",
            "      matrixAllocationPolicy: 'single-in-place-float64',",
            '      matrixBufferCount: 1,',
          ].join('\n');
          const newDiagnostics = [
            '      activeFeatures: 2,',
            '      pairsRejectedForInsufficientOverlap: 0,',
            '      minimumSharedFeatures: 2,',
            "      overlapAdjustment: 'linear-shared-active-ratio',",
            "      varianceDenominatorPolicy: 'observed-count-minus-one',",
            "      numericParsingPolicy: 'strict-finite-full-string',",
            "      matrixStorage: 'flat-float64-unit-vectors',",
            "      observationMaskStorage: 'flat-uint8',",
            "      matrixAllocationPolicy: 'single-in-place-float64-plus-mask',",
            '      matrixBufferCount: 1,',
          ].join('\n');
          if (!performance.includes(oldDiagnostics)) throw new Error('Old similarity diagnostics assertion not found.');
          performance = performance.replace(oldDiagnostics, newDiagnostics);
          fs.writeFileSync(performancePath, performance);

          const catalogPath = 'docs/compute-module-catalog.json';
          const catalog = JSON.parse(fs.readFileSync(catalogPath, 'utf8'));
          const similarity = catalog.modules.find((module) => module.id === 'similarity');
          if (!similarity) throw new Error('Similarity compute catalog entry not found.');
          catalog.updatedAt = '2026-08-03';
          similarity.inputContract = 'At least two unique products and two named features; strict finite numeric parsing, explicit threshold and optional edge bounds.';
          similarity.outputContract = 'Observed-only z-score cosine edges adjusted by shared active-feature coverage, with overlap and allocation diagnostics.';
          similarity.mathematicalContract = 's_adj(x,y)=clamp(cos(z_x,z_y),-1,1) * |F_x∩F_y|/|F_active|, requiring at least two shared active features.';
          similarity.scientificBoundary = 'Feature-space similarity with explicit missingness penalty, not chemical equivalence.';
          fs.writeFileSync(catalogPath, `${JSON.stringify(catalog, null, 2)}\n`);

          const readmePath = 'README.md';
          let readme = fs.readFileSync(readmePath, 'utf8');
          const oldRow = '| Similarity | 单矩阵原位标准化、延迟边对象分配 | Z-score 余弦相似度 |';
          const newRow = '| Similarity | 观测值样本方差、缺失掩码、重叠度惩罚与延迟边对象分配 | Z-score 余弦相似度 × 共享有效特征覆盖率 |';
          const oldBoundary = '- 相似度不等于化学等价；';
          const newBoundary = '- 相似度采用共享有效特征覆盖率惩罚，仍不等于化学等价；';
          if (!readme.includes(oldRow) || !readme.includes(oldBoundary)) {
            throw new Error('README similarity text contract not found.');
          }
          readme = readme.replace(oldRow, newRow).replace(oldBoundary, newBoundary);
          fs.writeFileSync(readmePath, readme);
          NODE

          git rm .github/workflows/one-time-pass6-metadata-patch.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/compute-module-catalog.json tests/science/numericalPerformance.test.ts
          git commit -m 'test: align pass6 similarity contracts'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
