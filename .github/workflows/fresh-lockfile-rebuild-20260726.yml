name: Fresh lockfile rebuild 2026-07-26

on:
  push:
    branches: [main]
    paths:
      - .github/fresh-lockfile-rebuild-20260726.trigger

permissions:
  contents: write

concurrency:
  group: resindb-fresh-lockfile-rebuild-20260726
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rebuild and verify lockfile
        id: rebuild
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          out=/tmp/resindb-fresh-lockfile-rebuild-20260726
          rm -rf "$out"
          mkdir -p "$out"
          cp package.json "$out/package-before.json"
          rm -f package-lock.json
          set +e
          npm install --package-lock-only --ignore-scripts --no-audit > "$out/generate.log" 2>&1
          generate=$?
          if [ "$generate" -eq 0 ]; then
            npm ci > "$out/npm-ci.log" 2>&1
            ci=$?
          else
            ci=1
          fi
          if [ "$ci" -eq 0 ]; then
            npm run audit:all > "$out/audit-all.log" 2>&1
            audit_all=$?
            npm run audit:prod > "$out/audit-prod.log" 2>&1
            audit_prod=$?
          else
            audit_all=1
            audit_prod=1
          fi
          cmp -s package.json "$out/package-before.json"
          manifest=$?
          set -e
          {
            echo "generate=$generate"
            echo "npm_ci=$ci"
            echo "audit_all=$audit_all"
            echo "audit_prod=$audit_prod"
            echo "manifest_unchanged=$manifest"
          } > "$out/status.txt"
          cat "$out/generate.log"
          [ -f "$out/npm-ci.log" ] && cat "$out/npm-ci.log"
          [ -f "$out/audit-all.log" ] && cat "$out/audit-all.log"
          [ -f "$out/audit-prod.log" ] && cat "$out/audit-prod.log"
          test "$generate" -eq 0
          test "$ci" -eq 0
          test "$audit_all" -eq 0
          test "$audit_prod" -eq 0
          test "$manifest" -eq 0

      - name: Publish lockfile or diagnostic and self-clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fresh-lockfile-rebuild-20260726.yml
          rm -f .github/fresh-lockfile-rebuild-20260726.trigger
          rm -f reports/lockfile-rebuild-diagnostic-20260726.txt
          if [ "${{ steps.rebuild.outcome }}" != "success" ]; then
            mkdir -p reports
            {
              echo "# Fresh lockfile rebuild failure"
              echo
              cat /tmp/resindb-fresh-lockfile-rebuild-20260726/status.txt
              for log in /tmp/resindb-fresh-lockfile-rebuild-20260726/*.log; do
                echo
                echo "## $(basename "$log")"
                echo '```text'
                tail -n 200 "$log"
                echo '```'
              done
            } > reports/fresh-lockfile-rebuild-failure-20260726.md
          else
            rm -f reports/fresh-lockfile-rebuild-failure-20260726.md
          fi
          git config user.name "ResinDB Lockfile Rebuild Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if [ "${{ steps.rebuild.outcome }}" = "success" ]; then
            git commit -m "build: rebuild lockfile for compatible ESLint 10 stack"
          else
            git commit -m "ci: publish fresh lockfile rebuild failure"
          fi
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Enforce result
        if: always()
        run: test "${{ steps.rebuild.outcome }}" = "success"
