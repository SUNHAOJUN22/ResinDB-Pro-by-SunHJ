name: One-time bilingual README delivery

on:
  push:
    branches: [main]
    paths:
      - .github/readme-delivery/trigger.txt
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.number == 34 &&
       github.event.comment.body == '/apply-readme-delivery-diagnostic-68dc2807')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Apply reviewed README and diagram payload
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            set -eux
            cat .github/readme-delivery/chunk-*.txt > /tmp/resindb-readme-update.tar.gz.b64
            base64 --decode /tmp/resindb-readme-update.tar.gz.b64 > /tmp/resindb-readme-update.tar.gz
            printf '%s  %s\n' '68dc2807187b048f6bb116be1a733abd2a24757941d34acc9db798a584754d82' '/tmp/resindb-readme-update.tar.gz' | sha256sum --check --strict
            git rm .github/workflows/one-time-readme-delivery.yml
            git rm -r .github/readme-delivery
            tar -xzf /tmp/resindb-readme-update.tar.gz
            node scripts/validate-repository-docs.mjs
            node scripts/validate-source-hygiene.mjs
            node scripts/validate-compute-surface.mjs
            node scripts/validate-data.mjs
          } 2>&1 | tee /tmp/readme-delivery.log

      - name: Commit reviewed deliverables
        if: steps.apply.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git add README.md \
            scripts/validate-repository-docs.mjs \
            tests/unit/toolchainPortability.test.ts \
            docs/README_REWRITE_AND_IMAGE_PROMPTS.md \
            docs/images/ai-platform-architecture.svg \
            docs/images/ai-material-statistics.svg \
            docs/images/ai-polymer-lammps-workflow.svg \
            docs/images/ai-delivery-validation.svg
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: deliver bilingual mathematical README and AI diagrams'
          git push origin HEAD:main

      - name: Record exact failure
        if: steps.apply.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          {
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'sha=%s\n' "$GITHUB_SHA"
            printf '%s\n' '--- tail ---'
            tail -n 200 /tmp/readme-delivery.log || true
          } > .github/readme-delivery/failure.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/readme-delivery/failure.txt
          git commit -m "chore: record README delivery failure [run=${GITHUB_RUN_ID}]"
          git push origin HEAD:main
          exit 1
