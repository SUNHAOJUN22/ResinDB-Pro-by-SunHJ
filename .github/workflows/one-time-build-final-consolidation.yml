name: One-time validated final consolidation

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - .github/consolidation/final-patch/**

permissions:
  contents: write

jobs:
  validate-and-publish-candidate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'automation/resindb-final-consolidation'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out controlled patch transport branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Reconstruct and verify consolidation patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/consolidation/final-patch/part-* | base64 --decode > /tmp/resindb-final.patch.xz
          echo 'c79be26aa57c38c4679baa8a682c1f3d083f3c1510345a73474de01f3c8df0ab  /tmp/resindb-final.patch.xz' | sha256sum --check
          xz --decompress --stdout /tmp/resindb-final.patch.xz > /tmp/resindb-final.patch
          echo 'e560f1966c05acbc9828d9aaaf9475f4dba25d327b691a68f3a1db379cc4fd15  /tmp/resindb-final.patch' | sha256sum --check

      - name: Apply patch to exact pull-request base
        shell: bash
        env:
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --force origin main
          git switch --force-create final-candidate origin/main
          test "$(git rev-parse HEAD)" = "$EXPECTED_BASE_SHA"
          git apply --check /tmp/resindb-final.patch
          git apply /tmp/resindb-final.patch
          git rm --ignore-unmatch \
            .github/workflows/one-time-build-final-consolidation.yml \
            .github/consolidation/run-final-build.trigger
          git add -A
          git diff --cached --check

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Run full repository validation
        run: npm run validate

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Guard repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git ls-files | grep -E '(audit\.json|\.trigger$|second-pass-snapshot|one-time-build-final-consolidation)' || true)"
          test -z "$(git grep -n 'v3\.1\.0-sync' -- . ':!package-lock.json' || true)"
          test -z "$(git grep -nE 'api\.dicebear\.com|transparenttextures\.com|fonts\.googleapis\.com|fonts\.gstatic\.com' -- src index.html || true)"
          test -z "$(git grep -nE '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,})' -- . || true)"

      - name: Commit and publish validated candidate
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git config user.name 'ResinDB Consolidation Bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'refactor: consolidate and harden ResinDB Pro mainline'
          git push --force origin "HEAD:$HEAD_BRANCH"
          {
            echo "base=$BASE_SHA"
            echo "candidate=$(git rev-parse HEAD)"
            echo "patch_sha256=e560f1966c05acbc9828d9aaaf9475f4dba25d327b691a68f3a1db379cc4fd15"
            echo "validation=npm run validate"
            echo "production_audit=npm audit --omit=dev --audit-level=high"
          } > /tmp/consolidation-candidate.txt

      - name: Upload validation record
        uses: actions/upload-artifact@v4
        with:
          name: resindb-final-candidate-validation
          path: /tmp/consolidation-candidate.txt
          retention-days: 7
