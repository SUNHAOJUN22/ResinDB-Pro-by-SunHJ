name: Final consistent lockfile rebuild 2026-07-26

on:
  push:
    branches: [main]
    paths:
      - .github/final-lockfile-rebuild-20260726.trigger

permissions:
  contents: write
  actions: read

concurrency:
  group: resindb-final-consistent-lockfile-20260726
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rebuild lockfile and run complete validation
        id: validation
        continue-on-error: true
        run: bash scripts/finalize-lockfile-rebuild.sh

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resindb-final-lockfile-rebuild-${{ github.sha }}
          path: |
            /tmp/resindb-final-lockfile-rebuild-20260726/
            reports/final-dependency-remediation-20260726/
            coverage/
            artifacts/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish final tree
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          result="$(cat /tmp/resindb-final-lockfile-rebuild-20260726/result.txt 2>/dev/null || echo failure)"
          rm -rf node_modules dist coverage artifacts
          rm -f .github/workflows/final-lockfile-rebuild-20260726.yml
          rm -f .github/final-lockfile-rebuild-20260726.trigger
          rm -f scripts/finalize-lockfile-rebuild.sh
          rm -f reports/lint-stack-install-diagnostic-20260726.txt
          git config user.name "ResinDB Lockfile Verification Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          if [ "$result" = "success" ]; then
            git commit -m "final: align lint stack rebuild lockfile and verify main"
          else
            git commit -m "ci: publish final lockfile rebuild failure"
          fi
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Enforce result
        if: always()
        run: test "${{ steps.validation.outcome }}" = "success"
