name: npm peer compatibility diagnostic 2026-07-26

on:
  push:
    branches: [main]
    paths:
      - .github/npm-ci-peer-diagnostic-20260726.trigger

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Capture npm ci and peer metadata
        shell: bash
        run: |
          set +e
          npm ci > /tmp/npm-ci.log 2>&1
          code=$?
          set -e
          {
            echo "validated_commit=$GITHUB_SHA"
            echo "npm_ci_exit=$code"
            echo
            echo "--- npm ci ---"
            tail -n 240 /tmp/npm-ci.log
            echo
            echo "--- peer dependencies ---"
            for spec in \
              '@typescript-eslint/eslint-plugin@latest' \
              '@typescript-eslint/parser@latest' \
              'typescript-eslint@latest' \
              'eslint-plugin-react-hooks@latest' \
              'eslint-plugin-react-refresh@latest' \
              'eslint-plugin-unused-imports@latest'; do
              echo "### $spec"
              npm view "$spec" version peerDependencies --json || true
            done
          } > reports/npm-ci-peer-diagnostic-20260726.txt
      - name: Publish and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/npm-ci-peer-diagnostic-20260726.yml
          rm -f .github/npm-ci-peer-diagnostic-20260726.trigger
          git config user.name "ResinDB Peer Diagnostic Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "ci: publish npm peer compatibility diagnostic"
          git pull --rebase origin main
          git push origin HEAD:main
