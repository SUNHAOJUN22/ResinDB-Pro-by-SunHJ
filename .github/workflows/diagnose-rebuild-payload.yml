name: Diagnose rebuild payload

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'agent/data-compute-readme-rebuild-20260802'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/data-compute-readme-rebuild-20260802
          fetch-depth: 1
      - name: Print payload part evidence
        shell: bash
        run: |
          set -euo pipefail
          for file in .github/.resindb-rebuild-payload.part*; do
            wc -c "$file"
            sha256sum "$file"
          done
          cat .github/.resindb-rebuild-payload.part* > /tmp/rebuild.b64
          wc -c /tmp/rebuild.b64
          sha256sum /tmp/rebuild.b64
