name: Apply final ResinDB optimization

on:
  push:
    branches: [main]
    paths:
      - .github/apply-final-optimization.trigger

permissions:
  contents: write
  statuses: write

concurrency:
  group: apply-final-resindb-main
  cancel-in-progress: false

jobs:
  validate-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Publish pending status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$(jq -nc --arg state pending --arg context resindb/apply-candidate --arg description 'Complete candidate verification is running' --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{state:$state,context:$context,description:$description,target_url:$target_url}')" >/dev/null

      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore and verify complete signed candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TEXT_SHA256: 25fb284c8915ab4a61ce58a765290ffb9ea61336f8728a002c8b5d89f39e3e39
          GZIP_SHA256: a50a4208cf4be9f5c06c4dadaeba7f2b2e43f57416fb1a53290f11f0dad4e8be
          PATCH_SHA256: 2a33dc4222249f6c7f19ef9571945e7ac18d6f2e2ea0e88489efb088bc4fd694
        run: |
          set -euo pipefail

          post_status() {
            local state="$1" context="$2" description="$3"
            curl -fsSL -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -d "$(jq -nc --arg state "$state" --arg context "$context" --arg description "${description:0:130}" --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{state:$state,context:$context,description:$description,target_url:$target_url}')" >/dev/null
          }

          blob_shas=(
            7dd53c13901d139f683324aa5993cbaa4ff667b7
            067abf7677984e3536613bb50aed8ed89e07f79a
            f334ad66b29321ba95f1f7362a9873222a671501
            7252d8c9e4e3b444c6e3daedbe8d1132adb1c2e2
            9a84e49fcf701ed06e6d82a5c74f72acb3b151cf
            dfa57ae7ba893d8bc986a7c4cbacb6cb0413fa34
          )
          chunk_hashes=(
            21e5e40be35fb00c4cf6a4747e682a221c66fbde68479436d50e640cd5e8d349
            4bb28b8a16af5ca9c0e70c81adea48cac7bf86f998ec8bdacfa02f49a087defb
            eda1d4881d00c13011f6b1477432cd2f45f316a37e39f7b82ca22335474b7c6d
            8d460f0c6f34eaf442c90e1a8f998cda474ed2b6c7391f7fef9ceec7eaed3af2
            953856f3d6b0dbb2d87afb79abd97ee5eda38bbcc60a3f0d2816350f527b530e
            886529979947658498e10eddb0e29be57621c7bfd5548183b83039901e333d70
          )

          for index in "${!blob_shas[@]}"; do
            output="/tmp/resindb-chunk-$(printf '%02d' "$index")"
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${blob_shas[$index]}" \
              | jq -r '.content' | tr -d '\n' | base64 -d > "$output"
            actual="$(sha256sum "$output" | awk '{print $1}')"
            test "$actual" = "${chunk_hashes[$index]}"
          done

          cat /tmp/resindb-chunk-* > /tmp/resindb-final.patch.gz.b64
          actual_text="$(sha256sum /tmp/resindb-final.patch.gz.b64 | awk '{print $1}')"
          if [ "$actual_text" != "$TEXT_SHA256" ]; then
            post_status failure resindb/transport-text "Text digest mismatch: ${actual_text}"
            exit 1
          fi

          base64 -d /tmp/resindb-final.patch.gz.b64 > /tmp/resindb-final.patch.gz
          actual_gzip="$(sha256sum /tmp/resindb-final.patch.gz | awk '{print $1}')"
          if [ "$actual_gzip" != "$GZIP_SHA256" ]; then
            post_status failure resindb/transport-gzip "Gzip digest mismatch: ${actual_gzip}"
            exit 1
          fi
          gzip -t /tmp/resindb-final.patch.gz

          gzip -dc /tmp/resindb-final.patch.gz > /tmp/resindb-final.patch
          actual_patch="$(sha256sum /tmp/resindb-final.patch | awk '{print $1}')"
          if [ "$actual_patch" != "$PATCH_SHA256" ]; then
            post_status failure resindb/transport-patch "Patch digest mismatch: ${actual_patch}"
            exit 1
          fi

          git apply --check --binary /tmp/resindb-final.patch
          git apply --binary /tmp/resindb-final.patch
          post_status success resindb/transport "All transport digests and git apply checks passed"

      - name: Remove one-time transport and historical diagnostics
        shell: bash
        run: |
          set -euo pipefail
          rm -rf reports/_final_source_export
          rm -rf .github/.resindb-v310-patch .github/.resindb-main-update .github/.resindb-v310
          rm -f .github/apply-final-optimization.trigger
          rm -f .github/workflows/apply-final-optimization.yml
          rm -f .github/final-source-export.trigger
          rm -f .github/workflows/final-source-export.yml
          rm -f .github/remediate-lockfile-20260726.trigger
          rm -f .github/workflows/remediate-lockfile-20260726.yml
          rm -f .github/source-export-trigger.txt .github/dependency-export-trigger.txt
          rm -f .github/apply-resindb-main-update.trigger .github/apply-resindb-main-update-retry.trigger
          rm -f .github/workflows/source-export.yml .github/workflows/source-snapshot-export.yml
          rm -f .github/workflows/dependency-snapshot-export.yml
          rm -f .github/workflows/apply-resindb-main-update.yml .github/workflows/apply-resindb-main-update-retry.yml
          rm -f reports/patch-diagnostic.json
          rm -f reports/source-export.json reports/source-export-run.json reports/source-export-started.json
          rm -f reports/dependency-export.json reports/dependency-export-run.json reports/dependency-export-started.json
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        id: npm-ci
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm ci > /tmp/npm-ci.log 2>&1; then
              cat /tmp/npm-ci.log
              exit 0
            fi
            tail -n 180 /tmp/npm-ci.log
            [ "$attempt" -eq 3 ] && exit 1
            sleep $((attempt * 15))
          done

      - name: Run complete pre-commit validation
        run: npm run validate:ci

      - name: Generate and render final validation reports
        run: |
          npm run report:validation
          npm run report:pdf
          pdf="artifacts/ResinDB-Pro-3.2.0-Final-Validation-Report.pdf"
          test -s "$pdf"
          pdfinfo "$pdf"
          pdftoppm -png -f 1 -singlefile -r 120 "$pdf" artifacts/pdf-render-page-1
          test "$(stat -c%s artifacts/pdf-render-page-1.png)" -gt 10000

      - name: Commit validated tree directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ResinDB Finalization Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "feat: finalize ResinDB Pro 3.2.0 scientific data platform"
          git push origin HEAD:main

      - name: Publish successful status
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$(jq -nc --arg state success --arg context resindb/apply-candidate --arg description 'Candidate validated and committed directly to main' --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{state:$state,context:$context,description:$description,target_url:$target_url}')" >/dev/null

      - name: Publish failed status
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$(jq -nc --arg state failure --arg context resindb/apply-candidate --arg description 'Candidate transport or validation failed' --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{state:$state,context:$context,description:$description,target_url:$target_url}')" >/dev/null
