name: Apply final ResinDB optimization

on:
  push:
    branches: [main]
    paths:
      - .github/apply-final-optimization.trigger

permissions:
  contents: write
  statuses: write

concurrency:
  group: apply-final-resindb-main
  cancel-in-progress: false

jobs:
  validate-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Publish pending application status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$(jq -nc --arg state pending --arg context resindb/apply-candidate --arg description 'Fail-closed candidate validation is running' --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{state:$state,context:$context,description:$description,target_url:$target_url}')" >/dev/null

      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore and verify signed patch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH_BLOB_SHA: 6fc613916fd1e90b3242af5c8d9ee6be64bd4474
          PATCH_SHA256: f06205db69ab3cc42cb3f15036d6d8a3866d0a4b8693d55d0f957e5feac038cd
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${PATCH_BLOB_SHA}" \
            | jq -r '.content' | tr -d '\n' | base64 -d > /tmp/resindb-final.patch.gz
          printf '%s  %s\n' "${PATCH_SHA256}" /tmp/resindb-final.patch.gz | sha256sum -c -
          gzip -dc /tmp/resindb-final.patch.gz > /tmp/resindb-final.patch
          git apply --check --binary /tmp/resindb-final.patch
          git apply --binary /tmp/resindb-final.patch

      - name: Remove one-time transport and historical diagnostic residue
        shell: bash
        run: |
          set -euo pipefail
          rm -rf reports/_final_source_export
          rm -f .github/apply-final-optimization.trigger
          rm -f .github/workflows/apply-final-optimization.yml
          rm -f .github/final-source-export.trigger
          rm -f .github/workflows/final-source-export.yml
          rm -f .github/remediate-lockfile-20260726.trigger
          rm -f .github/workflows/remediate-lockfile-20260726.yml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm ci; then exit 0; fi
            [ "$attempt" -eq 3 ] && exit 1
            sleep $((attempt * 15))
          done

      - name: Run complete pre-commit validation
        run: npm run validate:ci

      - name: Commit validated final tree directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ResinDB Finalization Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "feat: finalize ResinDB Pro 3.2.0 scientific data platform"
          git push origin HEAD:main

      - name: Publish successful application status
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$(jq -nc --arg state success --arg context resindb/apply-candidate --arg description 'Candidate validated and committed to main' --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{state:$state,context:$context,description:$description,target_url:$target_url}')" >/dev/null

      - name: Publish failed application status
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$(jq -nc --arg state failure --arg context resindb/apply-candidate --arg description 'Fail-closed candidate validation failed' --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{state:$state,context:$context,description:$description,target_url:$target_url}')" >/dev/null
