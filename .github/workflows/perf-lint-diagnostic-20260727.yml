name: ESLint 10 diagnostic 2026-07-27

on:
  push:
    branches: [main]
    paths:
      - .github/perf-lint-diagnostic-20260727.trigger

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Capture exact lint output
        shell: bash
        run: |
          set +e
          npm ci > /tmp/npm-ci.log 2>&1
          ci_code=$?
          if [ "$ci_code" -eq 0 ]; then
            npm run lint > /tmp/lint.log 2>&1
            lint_code=$?
          else
            lint_code=99
          fi
          set -e
          {
            echo "validated_commit=$GITHUB_SHA"
            echo "npm_ci_exit=$ci_code"
            echo "lint_exit=$lint_code"
            echo
            echo "--- npm ci ---"
            cat /tmp/npm-ci.log
            echo
            echo "--- lint ---"
            cat /tmp/lint.log 2>/dev/null || true
          } > reports/eslint10-diagnostic-20260727.txt
      - name: Publish and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/perf-lint-diagnostic-20260727.yml
          rm -f .github/perf-lint-diagnostic-20260727.trigger
          git config user.name "ResinDB Diagnostic Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "ci: publish ESLint 10 diagnostic"
          git pull --rebase origin main
          git push origin HEAD:main
