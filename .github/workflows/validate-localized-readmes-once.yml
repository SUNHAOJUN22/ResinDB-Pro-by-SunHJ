name: One-time localized README validation

on:
  push:
    branches: [main]
    paths:
      - .github/validate-localized-readmes.trigger

permissions:
  contents: write

concurrency:
  group: resindb-localized-readme-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out exact main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Install CJK fonts
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          fc-list :lang=zh | grep -q .
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Validate localized documents and application contracts
        run: |
          npm run validate:i18n-visuals
          npm run validate:scientific-ui
          npm run lint
          npm run typecheck
          npm run test:unit
          npm run build
      - name: Remove validation transport and publish receipt
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/validate-localized-readmes.trigger
          rm -f .github/workflows/validate-localized-readmes-once.yml
          mkdir -p docs/acceptance
          cat > docs/acceptance/LOCALIZED_README_VALIDATION.md <<'EOF'
          # Localized README validation

          The Chinese and English design editions, localized SVGs, translation resources and scientific-figure contracts passed the repository checks below on the exact publishing tree:

          - `validate:i18n-visuals`
          - `validate:scientific-ui`
          - ESLint
          - TypeScript
          - isolated unit tests
          - production build

          The checks validate software documentation and rendering contracts only. They do not certify resin grades, experiments or force fields.
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'test: validate localized README and scientific visual contracts'
          git push origin HEAD:main
