name: ResinDB Stage-One Transport Staging

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/.resindb-final-patch/**'
      - '.github/.resindb-v320-delta/**'
      - '.github/.resindb-stage1-delta/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm stage-one transport state
        run: echo 'Stage-one Node-only tooling transport is staged without creating a branch.'
