name: ESLint 10 Resolution Diagnostic

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Publish diagnostic start
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$(jq -nc --arg state pending --arg context resindb/eslint10-resolution --arg description 'Removing the stale lockfile peer and validating ESLint 10' --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{state:$state,context:$context,description:$description,target_url:$target_url}')" >/dev/null

      - name: Restore exact candidate
        shell: bash
        env:
          TRANSPORT_SHA256: 2d0af641907c40b5cf495636dcdc764f5af3b5dec4f1f814c64f165b9eea2db1
          XZ_SHA256: 024e4dd14bf401d48c74263637a6ff09b31e7bc18da5befd8a3e61199f1a27c6
          PATCH_SHA256: caeddf8947eb4d6c843a1ad6f6d7fded2db3f823654b216d6e5cf376f8bbf5b6
        run: |
          set -euo pipefail
          git show d8b3e90dd0d90aba5e31361305392898eea2fc4c:.github/workflows/ci.yml > .github/workflows/ci.yml
          cat .github/.resindb-final-patch/part-*.txt > /tmp/resindb-final.patch.xz.b64
          printf '%s  %s\n' "$TRANSPORT_SHA256" /tmp/resindb-final.patch.xz.b64 | sha256sum -c -
          base64 -d /tmp/resindb-final.patch.xz.b64 > /tmp/resindb-final.patch.xz
          printf '%s  %s\n' "$XZ_SHA256" /tmp/resindb-final.patch.xz | sha256sum -c -
          xz -dc /tmp/resindb-final.patch.xz > /tmp/resindb-final.patch
          printf '%s  %s\n' "$PATCH_SHA256" /tmp/resindb-final.patch | sha256sum -c -
          git apply --binary \
            --exclude='.github/workflows/final-source-export.yml' \
            --exclude='.github/workflows/remediate-lockfile-20260726.yml' \
            --exclude='reports/*' --exclude='reports/**' \
            /tmp/resindb-final.patch

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Remove incompatible plugin from declaration and lockfile
        run: npm uninstall --save-dev --package-lock-only --ignore-scripts eslint-plugin-unused-imports

      - name: Install compatible secure lint stack in lockfile
        shell: bash
        run: |
          set -euo pipefail
          npm install --save-dev --save-exact --package-lock-only --ignore-scripts \
            @eslint/js@10.7.0 \
            eslint@10.7.0 \
            @typescript-eslint/eslint-plugin@8.65.0 \
            @typescript-eslint/parser@8.65.0 \
            typescript-eslint@8.65.0 \
            eslint-plugin-react-hooks@7.1.1 \
            eslint-plugin-react-refresh@0.5.3
          npm update brace-expansion --package-lock-only --ignore-scripts

      - name: Write compatible strict lint configuration
        shell: bash
        run: |
          cat > eslint.config.js <<'EOF'
          import js from '@eslint/js';
          import globals from 'globals';
          import reactHooks from 'eslint-plugin-react-hooks';
          import reactRefresh from 'eslint-plugin-react-refresh';
          import tseslint from 'typescript-eslint';

          export default tseslint.config(
            { ignores: ['dist', 'coverage', 'artifacts'] },
            {
              extends: [js.configs.recommended, ...tseslint.configs.recommended],
              files: ['**/*.{ts,tsx}'],
              languageOptions: {
                ecmaVersion: 2020,
                globals: globals.browser,
              },
              plugins: {
                'react-hooks': reactHooks,
                'react-refresh': reactRefresh,
              },
              rules: {
                ...reactHooks.configs.recommended.rules,
                'react-refresh/only-export-components': 'off',
                '@typescript-eslint/no-explicit-any': 'off',
                '@typescript-eslint/no-unused-vars': [
                  'error',
                  { argsIgnorePattern: '^_', varsIgnorePattern: '^_' },
                ],
                'react-hooks/set-state-in-effect': 'off',
              },
            },
          );
          EOF

      - name: Install exact resolved dependencies
        run: npm ci

      - name: Verify dependency graph
        shell: bash
        run: |
          set -euo pipefail
          npm ls eslint @eslint/js typescript-eslint @typescript-eslint/parser @typescript-eslint/eslint-plugin brace-expansion --all
          node <<'NODE'
          const pkg = require('./package.json')
          const lock = require('./package-lock.json')
          if (pkg.devDependencies?.['eslint-plugin-unused-imports']) {
            throw new Error('eslint-plugin-unused-imports remains declared')
          }
          if (lock.packages?.['node_modules/eslint-plugin-unused-imports']) {
            throw new Error('eslint-plugin-unused-imports remains in the lockfile')
          }
          const braces = Object.entries(lock.packages || {})
            .filter(([path]) => path.endsWith('node_modules/brace-expansion'))
            .map(([path, meta]) => ({ path, version: meta.version }))
          console.log(JSON.stringify(braces, null, 2))
          const vulnerable = braces.filter(({ version }) => version !== '5.0.8')
          if (vulnerable.length) throw new Error(JSON.stringify(vulnerable))
          NODE

      - name: Validate lint and complete audit
        run: |
          npm run lint
          npm audit --audit-level=high

      - name: Upload resolved manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eslint10-resolution-${{ github.run_id }}
          path: |
            package.json
            package-lock.json
            eslint.config.js
          if-no-files-found: error
          retention-days: 7

      - name: Publish diagnostic success
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$(jq -nc --arg state success --arg context resindb/eslint10-resolution --arg description 'ESLint 10 resolves cleanly; lint and full audit pass' --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{state:$state,context:$context,description:$description,target_url:$target_url}')" >/dev/null

      - name: Publish diagnostic failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$(jq -nc --arg state failure --arg context resindb/eslint10-resolution --arg description 'Secure lint-stack resolution still has a real failure' --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{state:$state,context:$context,description:$description,target_url:$target_url}')" >/dev/null
