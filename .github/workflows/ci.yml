name: CI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-phase2l:
    if: github.event.head_commit.message == 'ci: apply phase 2l final tree'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - run: node scripts/phase2l-apply-final.mjs
