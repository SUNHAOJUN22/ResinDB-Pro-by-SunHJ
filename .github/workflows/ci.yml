name: ResinDB Stage-One Direct Main Applier

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: resindb-stage-one-main-applier
  cancel-in-progress: false

jobs:
  apply-stage-one:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0

      - name: Publish application start
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$(jq -nc \
              --arg state pending \
              --arg context resindb/stage1-apply \
              --arg description 'Reconstructing and applying the exact Node-only stage-one tree' \
              --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              '{state:$state,context:$context,description:$description,target_url:$target_url}')" >/dev/null

      - name: Reconstruct and verify the exact stage-one tree
        shell: bash
        env:
          BASE_TRANSPORT_SHA256: 2d0af641907c40b5cf495636dcdc764f5af3b5dec4f1f814c64f165b9eea2db1
          BASE_XZ_SHA256: 024e4dd14bf401d48c74263637a6ff09b31e7bc18da5befd8a3e61199f1a27c6
          BASE_PATCH_SHA256: caeddf8947eb4d6c843a1ad6f6d7fded2db3f823654b216d6e5cf376f8bbf5b6
          HARDEN_TRANSPORT_SHA256: a9bae5dab3ab7b670be18b9568adf8f6414a17c6bb0700e53fb83be8882245e0
          HARDEN_XZ_SHA256: 1d174dad5c1c5b74a3bf88e4dd7343412bc7c868f38766a868f7354c9eddabc0
          HARDEN_PATCH_SHA256: 875d1ed291b884a964ca5d448d419ee5624f1e5a667f465e7665037d91f2bdb6
          STAGE1_TRANSPORT_SHA256: 893596177f5502f70c2d14cb59a13b240ae7f20776d74990444b24ad52b66f5f
          STAGE1_XZ_SHA256: 7afa04a61ef72ceef2080c4cb153afb60be39f93acb306d8dd718e97065b9446
          STAGE1_PATCH_SHA256: d33d457bc263c6322e36dd45e212e620b437a04ecc64abb71150878ea98aa6de
          EXPECTED_TREE_SHA: d389544745fc541602a0c342bc4519802da0603b
          EXPECTED_PERMANENT_CI_BLOB: d908548352c24d20535afe866f0e2d351466ccd7
        run: |
          set -euo pipefail
          mkdir -p /tmp/resindb-stage1 artifacts
          cp -a .github/workflows /tmp/resindb-current-workflows

          reconstruct_patch() {
            local directory="$1"
            local expected_count="$2"
            local transport_sha="$3"
            local xz_sha="$4"
            local patch_sha="$5"
            local output_prefix="$6"

            local count
            count="$(find "$directory" -maxdepth 1 -name 'part-*.txt' | wc -l | tr -d ' ')"
            test "$count" -eq "$expected_count"
            cat "$directory"/part-*.txt > "/tmp/resindb-stage1/${output_prefix}.patch.xz.b64"
            printf '%s  %s\n' "$transport_sha" "/tmp/resindb-stage1/${output_prefix}.patch.xz.b64" | sha256sum -c -
            base64 -d "/tmp/resindb-stage1/${output_prefix}.patch.xz.b64" > "/tmp/resindb-stage1/${output_prefix}.patch.xz"
            printf '%s  %s\n' "$xz_sha" "/tmp/resindb-stage1/${output_prefix}.patch.xz" | sha256sum -c -
            xz -t "/tmp/resindb-stage1/${output_prefix}.patch.xz"
            xz -dc "/tmp/resindb-stage1/${output_prefix}.patch.xz" > "/tmp/resindb-stage1/${output_prefix}.patch"
            printf '%s  %s\n' "$patch_sha" "/tmp/resindb-stage1/${output_prefix}.patch" | sha256sum -c -
          }

          reconstruct_patch .github/.resindb-final-patch 51 \
            "$BASE_TRANSPORT_SHA256" "$BASE_XZ_SHA256" "$BASE_PATCH_SHA256" base
          reconstruct_patch .github/.resindb-v320-delta 10 \
            "$HARDEN_TRANSPORT_SHA256" "$HARDEN_XZ_SHA256" "$HARDEN_PATCH_SHA256" harden
          reconstruct_patch .github/.resindb-stage1-delta 10 \
            "$STAGE1_TRANSPORT_SHA256" "$STAGE1_XZ_SHA256" "$STAGE1_PATCH_SHA256" stage1

          rm -rf .github/workflows
          mkdir -p .github/workflows
          git show d8b3e90dd0d90aba5e31361305392898eea2fc4c:.github/workflows/ci.yml > .github/workflows/ci.yml
          test "$(git hash-object .github/workflows/ci.yml)" = 796e74f7b17426aaa03b8d461a100761574960d0

          base_exclusions=(
            --exclude='.github/workflows/final-source-export.yml'
            --exclude='.github/workflows/remediate-lockfile-20260726.yml'
            --exclude='reports/*'
            --exclude='reports/**'
          )
          git apply --check --binary "${base_exclusions[@]}" /tmp/resindb-stage1/base.patch
          git apply --binary "${base_exclusions[@]}" /tmp/resindb-stage1/base.patch
          git apply --check --binary /tmp/resindb-stage1/harden.patch
          git apply --binary /tmp/resindb-stage1/harden.patch
          git apply --check --binary /tmp/resindb-stage1/stage1.patch
          git apply --binary /tmp/resindb-stage1/stage1.patch

          find .github -type f ! -path '.github/workflows/ci.yml' -delete
          find .github -depth -type d -empty -delete || true
          rm -rf reports artifacts coverage dist node_modules
          mkdir -p reports artifacts
          printf '%s\n' \
            '# Validation reports' '' \
            'Exact-tree HTML, PDF, screenshots, coverage and machine-readable receipts are generated into `artifacts/` by CI and uploaded as GitHub Actions artifacts. They are not fabricated or committed as stale evidence.' \
            > reports/README.md
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete

          git add -A
          git diff --cached --check
          desired_tree="$(git write-tree)"
          test "$desired_tree" = "$EXPECTED_TREE_SHA"
          test "$(git hash-object .github/workflows/ci.yml)" = "$EXPECTED_PERMANENT_CI_BLOB"
          test "$(find .github -type f | sort)" = '.github/workflows/ci.yml'
          test "$(find reports -type f | sort)" = 'reports/README.md'
          cp .github/workflows/ci.yml /tmp/resindb-stage1/permanent-ci.yml

          rm -rf .github/workflows
          cp -a /tmp/resindb-current-workflows .github/workflows
          find .github -type f ! -path '.github/workflows/*' -delete
          find .github -depth -type d -empty -delete || true
          git add -A
          git diff --cached --check
          test -z "$(git diff --cached --name-only -- .github/workflows)"

          cat > /tmp/resindb-stage1/reconstruction-receipt.json <<JSON
          {
            "schemaVersion": 1,
            "repository": "${GITHUB_REPOSITORY}",
            "triggerSha": "${GITHUB_SHA}",
            "expectedFinalTreeSha": "${EXPECTED_TREE_SHA}",
            "reconstructedFinalTreeSha": "${desired_tree}",
            "expectedPermanentCiBlob": "${EXPECTED_PERMANENT_CI_BLOB}",
            "branchCreated": false,
            "pullRequestCreated": false
          }
          JSON

      - name: Commit business and tooling changes directly to main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git config user.name 'ResinDB Stage-One Bot'
          git config user.email 'actions@users.noreply.github.com'
          test -n "$(git diff --cached --name-only)"
          git commit -m 'feat: complete stage-one Node-only tooling migration'
          business_sha="$(git rev-parse HEAD)"
          git push origin HEAD:main
          printf '%s\n' "$business_sha" > /tmp/resindb-stage1/business-commit-sha.txt

      - name: Prepare stage-one handoff evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp /tmp/resindb-stage1/permanent-ci.yml artifacts/permanent-ci.yml
          cp /tmp/resindb-stage1/reconstruction-receipt.json artifacts/reconstruction-receipt.json
          cp /tmp/resindb-stage1/business-commit-sha.txt artifacts/business-commit-sha.txt
          sha256sum artifacts/permanent-ci.yml > artifacts/permanent-ci.sha256

      - name: Upload stage-one handoff evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: resindb-stage-one-handoff-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

      - name: Publish application result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=failure
          description='Stage-one reconstruction or direct-main application failed closed'
          if [ "${{ job.status }}" = success ]; then
            state=success
            description='Stage-one Node-only business tree committed directly to main'
          fi
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$(jq -nc \
              --arg state "$state" \
              --arg context resindb/stage1-apply \
              --arg description "$description" \
              --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              '{state:$state,context:$context,description:$description,target_url:$target_url}')" >/dev/null
