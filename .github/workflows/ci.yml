name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate, cover, render and audit
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify repository integrity
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            branches="$(git ls-remote --heads origin | awk '{print $2}' | sed 's#refs/heads/##' | sort)"
            test "$branches" = "main"
          fi

      - name: Install exact dependencies
        id: npm-ci
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm ci > /tmp/npm-ci.log 2>&1; then
              cat /tmp/npm-ci.log
              exit 0
            fi
            tail -n 160 /tmp/npm-ci.log
            [ "$attempt" -eq 3 ] && exit 1
            sleep $((attempt * 15))
          done

      - name: Upload npm diagnostics
        if: failure() && steps.npm-ci.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: npm-ci-diagnostics-${{ github.sha }}
          path: /tmp/npm-ci.log
          retention-days: 3

      - name: Documentation, visuals and repository hygiene
        run: npm run validate:docs

      - name: Production source hygiene
        run: npm run validate:source

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Complete regression suite
        run: npm run test

      - name: Unit tests
        run: npm run test:unit

      - name: Scientific and worker tests
        run: npm run test:science

      - name: Coverage
        run: npm run test:coverage

      - name: Production build
        run: npm run build

      - name: HTTP smoke
        run: npm run smoke

      - name: Chromium UI smoke
        run: npm run test:ui

      - name: Full dependency audit
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm run audit:all; then
              exit 0
            fi
            [ "$attempt" -eq 3 ] && exit 1
            sleep $((attempt * 10))
          done

      - name: Upload coverage and UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-evidence-${{ github.sha }}
          path: |
            coverage/
            artifacts/
          if-no-files-found: warn
          retention-days: 14

  # BEGIN EMBEDDED DEPENDENCY REMEDIATION
  remediate_dependency_audit:
    if: github.event_name == 'push'
    name: Remediate full dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Check out exact main commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply non-forced lockfile remediation
        shell: bash
        run: |
          set -euo pipefail
          cp package.json /tmp/package-before.json
          npm audit fix --package-lock-only --ignore-scripts
          cmp -s package.json /tmp/package-before.json
          npm ci
          npm audit --audit-level=high
          npm audit --omit=dev --audit-level=high
      - name: Publish remediated lockfile and self-clean
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/ci.yml')
          text = path.read_text(encoding='utf-8')
          begin = text.index('\n  # BEGIN EMBEDDED DEPENDENCY REMEDIATION')
          end_marker = '\n  # END EMBEDDED DEPENDENCY REMEDIATION'
          end = text.index(end_marker, begin) + len(end_marker)
          path.write_text(text[:begin].rstrip() + '\n', encoding='utf-8')
          PY
          rm -f .github/workflows/remediate-lockfile-20260726.yml
          rm -f .github/remediate-lockfile-20260726.trigger
          rm -f reports/dependency-audit-diagnostic-20260726.txt
          git config user.name "ResinDB Dependency Remediation Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: remediate full dependency audit"
          git pull --rebase origin main
          git push origin HEAD:main
  # END EMBEDDED DEPENDENCY REMEDIATION
