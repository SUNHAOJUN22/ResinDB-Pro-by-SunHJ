name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate, cover, render and audit
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify repository integrity
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            branches="$(git ls-remote --heads origin | awk '{print $2}' | sed 's#refs/heads/##' | sort)"
            test "$branches" = "main"
          fi

      - name: Install exact dependencies
        id: npm-ci
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm ci > /tmp/npm-ci.log 2>&1; then
              cat /tmp/npm-ci.log
              exit 0
            fi
            tail -n 160 /tmp/npm-ci.log
            [ "$attempt" -eq 3 ] && exit 1
            sleep $((attempt * 15))
          done

      - name: Upload npm diagnostics
        if: failure() && steps.npm-ci.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: npm-ci-diagnostics-${{ github.sha }}
          path: /tmp/npm-ci.log
          retention-days: 3

      - name: Documentation, visuals and repository hygiene
        run: npm run validate:docs

      - name: Production source hygiene
        run: npm run validate:source

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Complete regression suite
        run: npm run test

      - name: Unit tests
        run: npm run test:unit

      - name: Scientific and worker tests
        run: npm run test:science

      - name: Coverage
        run: npm run test:coverage

      - name: Production build
        run: npm run build

      - name: HTTP smoke
        run: npm run smoke

      - name: Chromium UI smoke
        run: npm run test:ui

      - name: Full dependency audit
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm run audit:all; then
              exit 0
            fi
            [ "$attempt" -eq 3 ] && exit 1
            sleep $((attempt * 10))
          done

      - name: Upload coverage and UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-evidence-${{ github.sha }}
          path: |
            coverage/
            artifacts/
          if-no-files-found: warn
          retention-days: 14

  # BEGIN EMBEDDED PERFORMANCE CANDIDATE DIAGNOSTIC
  diagnose_performance_candidate:
    if: github.event_name == 'push' && github.event.head_commit.message == 'perf: run embedded candidate diagnostic'
    name: Diagnose performance candidate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Capture candidate failures
        shell: bash
        run: |
          set +e
          npm ci > /tmp/npm-ci.txt 2>&1
          git show 4cc44cbae0621580d3f2193c836a4e734fdc2599:scripts/apply-performance-source-v2.py > /tmp/apply.py
          sed -i 's/private registerMutationBatchCreate/private async getDB/g' /tmp/apply.py
          python3 /tmp/apply.py > /tmp/apply.txt 2>&1
          apply_code=$?
          if [ "$apply_code" -eq 0 ]; then
            npm run lint > /tmp/lint.txt 2>&1; lint_code=$?
            npm run test:performance > /tmp/performance.txt 2>&1; performance_code=$?
            npm run test > /tmp/test.txt 2>&1; test_code=$?
            npm run build > /tmp/build.txt 2>&1; build_code=$?
          else
            lint_code=99; performance_code=99; test_code=99; build_code=99
          fi
          set -e
          git reset --hard HEAD
          mkdir -p reports/performance-audit-20260727
          {
            echo "validated_commit=$GITHUB_SHA"
            echo "apply_exit=$apply_code"
            echo "lint_exit=$lint_code"
            echo "performance_exit=$performance_code"
            echo "test_exit=$test_code"
            echo "build_exit=$build_code"
            echo
            for name in apply lint performance test build; do
              echo "--- $name ---"
              cat "/tmp/$name.txt" 2>/dev/null || true
              echo
            done
          } > reports/performance-audit-20260727/candidate-diagnostic.txt
      - name: Publish diagnostic and restore permanent CI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/ci.yml')
          text = path.read_text(encoding='utf-8')
          marker = '\n  # BEGIN EMBEDDED PERFORMANCE CANDIDATE DIAGNOSTIC\n'
          if marker not in text:
              raise SystemExit('embedded diagnostic marker missing')
          path.write_text(text.split(marker, 1)[0].rstrip() + '\n', encoding='utf-8')
          PY
          rm -f .github/embedded-performance-candidate-diagnostic.trigger
          rm -f .github/workflows/performance-candidate-diagnostic-20260727.yml
          rm -f .github/performance-candidate-diagnostic-20260727.trigger
          git config user.name "ResinDB Embedded Diagnostic Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "perf: publish embedded candidate diagnostic"
          git pull --rebase origin main
          git push origin HEAD:main
  # END EMBEDDED PERFORMANCE CANDIDATE DIAGNOSTIC
