name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Lint, typecheck, tests, build and HTTP smoke
        run: npm run validate
      - name: Unit tests
        run: npm run test:unit
      - name: Scientific and worker tests
        run: npm run test:science
      - name: Coverage
        run: npm run test:coverage
      - name: Chromium UI and chart audit
        run: npm run test:ui
      - name: Production dependency audit
        run: npm run audit:prod
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-evidence-${{ github.sha }}
          path: |
            coverage/
            artifacts/
          if-no-files-found: warn
          retention-days: 14
