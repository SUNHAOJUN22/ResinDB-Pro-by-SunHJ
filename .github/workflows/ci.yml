name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate, cover, render and audit
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify repository integrity
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            branches="$(git ls-remote --heads origin | awk '{print $2}' | sed 's#refs/heads/##' | sort)"
            test "$branches" = "main"
          fi

      - name: Install exact dependencies
        id: npm-ci
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm ci > /tmp/npm-ci.log 2>&1; then
              cat /tmp/npm-ci.log
              exit 0
            fi
            tail -n 160 /tmp/npm-ci.log
            [ "$attempt" -eq 3 ] && exit 1
            sleep $((attempt * 15))
          done

      - name: Upload npm diagnostics
        if: failure() && steps.npm-ci.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: npm-ci-diagnostics-${{ github.sha }}
          path: /tmp/npm-ci.log
          retention-days: 3

      - name: Documentation, visuals and repository hygiene
        run: npm run validate:docs

      - name: Production source hygiene
        run: npm run validate:source

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Complete regression suite
        run: npm run test

      - name: Unit tests
        run: npm run test:unit

      - name: Scientific and worker tests
        run: npm run test:science

      - name: Coverage
        run: npm run test:coverage

      - name: Production build
        run: npm run build

      - name: HTTP smoke
        run: npm run smoke

      - name: Chromium UI smoke
        run: npm run test:ui

      - name: Full dependency audit
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm run audit:all; then
              exit 0
            fi
            [ "$attempt" -eq 3 ] && exit 1
            sleep $((attempt * 10))
          done

      - name: Upload coverage and UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-evidence-${{ github.sha }}
          path: |
            coverage/
            artifacts/
          if-no-files-found: warn
          retention-days: 14

  # BEGIN EMBEDDED UIUX VISUAL FINALIZER
  uiux_visual_finalizer:
    if: github.event_name == 'push' && github.event.head_commit.message == 'docs: run embedded UI UX visual finalizer'
    name: Finalize UI UX Pro Max README visuals
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      contents: write
      actions: read

    steps:
      - name: Check out exact main tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run visual and application proof
        id: validation
        continue-on-error: true
        shell: bash
        run: bash scripts/uiux-visual-final-proof.sh

      - name: Upload raw visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resindb-uiux-visual-final-proof-${{ github.sha }}
          path: |
            /tmp/resindb-uiux-visual-final-proof/
            coverage/
            artifacts/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish result and restore permanent CI
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          result="$(cat /tmp/resindb-uiux-visual-final-proof/result.txt 2>/dev/null || echo failure)"
          python3 - <<'PY'
          from pathlib import Path

          ci = Path('.github/workflows/ci.yml')
          text = ci.read_text(encoding='utf-8')
          marker = '\n  # BEGIN EMBEDDED UIUX VISUAL FINALIZER\n'
          if marker not in text:
              raise SystemExit('embedded UIUX visual finalizer marker is missing')
          ci.write_text(text.split(marker, 1)[0].rstrip() + '\n', encoding='utf-8')

          validator = Path('scripts/validate-repository-docs.py')
          vtext = validator.read_text(encoding='utf-8')
          anchor = '    "docs/MIGRATION_v3.1.0.md",\n'
          entry = '    ".github/embedded-uiux-visual-finalizer.trigger",\n'
          if entry.strip() not in vtext:
              if anchor not in vtext:
                  raise SystemExit('validator forbidden-path anchor is missing')
              vtext = vtext.replace(anchor, entry + anchor, 1)
          ci_check = '    if "contents: write" in ci or "EMBEDDED DEPENDENCY REMEDIATION" in ci:\n        fail("permanent CI must remain read-only and non-self-modifying")\n'
          replacement = '    if "contents: write" in ci or "EMBEDDED DEPENDENCY REMEDIATION" in ci or "BEGIN EMBEDDED UIUX VISUAL FINALIZER" in ci:\n        fail("permanent CI must remain read-only and non-self-modifying")\n'
          if ci_check in vtext:
              vtext = vtext.replace(ci_check, replacement, 1)
          validator.write_text(vtext, encoding='utf-8')
          PY
          rm -f .github/embedded-uiux-visual-finalizer.trigger
          rm -f .github/workflows/uiux-visual-final-proof-20260727.yml
          rm -f .github/uiux-visual-final-proof-20260727.trigger
          rm -f scripts/refine-uiux-visual-layout.py
          rm -f scripts/uiux-visual-final-proof.sh
          rm -f scripts/write-uiux-visual-evidence.py
          if [ "$result" = "success" ]; then
            rm -rf reports/uiux-visual-final-proof-20260727
          fi
          npm run validate:docs
          git diff --check
          rm -rf node_modules dist coverage artifacts
          git config user.name "ResinDB UIUX Verification Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          if [ "$result" = "success" ]; then
            git commit -m "docs: verify UI UX Pro Max README visual system"
          else
            git commit -m "docs: publish exact UI UX Pro Max visual failure"
          fi
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Enforce finalizer result
        if: always()
        run: test "${{ steps.validation.outcome }}" = "success"
  # END EMBEDDED UIUX VISUAL FINALIZER
