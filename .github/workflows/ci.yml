name: CI Audit Diagnostic

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: diagnose-resindb-v320-audit
  cancel-in-progress: false

jobs:
  diagnose-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore exact candidate
        shell: bash
        env:
          TRANSPORT_SHA256: 2d0af641907c40b5cf495636dcdc764f5af3b5dec4f1f814c64f165b9eea2db1
          XZ_SHA256: 024e4dd14bf401d48c74263637a6ff09b31e7bc18da5befd8a3e61199f1a27c6
          PATCH_SHA256: caeddf8947eb4d6c843a1ad6f6d7fded2db3f823654b216d6e5cf376f8bbf5b6
        run: |
          set -euo pipefail
          git show d8b3e90dd0d90aba5e31361305392898eea2fc4c:.github/workflows/ci.yml > .github/workflows/ci.yml
          test "$(find .github/.resindb-final-patch -maxdepth 1 -name 'part-*.txt' | wc -l | tr -d ' ')" -eq 51
          cat .github/.resindb-final-patch/part-*.txt > /tmp/resindb-final.patch.xz.b64
          printf '%s  %s\n' "$TRANSPORT_SHA256" /tmp/resindb-final.patch.xz.b64 | sha256sum -c -
          base64 -d /tmp/resindb-final.patch.xz.b64 > /tmp/resindb-final.patch.xz
          printf '%s  %s\n' "$XZ_SHA256" /tmp/resindb-final.patch.xz | sha256sum -c -
          xz -dc /tmp/resindb-final.patch.xz > /tmp/resindb-final.patch
          printf '%s  %s\n' "$PATCH_SHA256" /tmp/resindb-final.patch | sha256sum -c -
          git apply --check --binary \
            --exclude='.github/workflows/final-source-export.yml' \
            --exclude='.github/workflows/remediate-lockfile-20260726.yml' \
            --exclude='reports/*' --exclude='reports/**' \
            /tmp/resindb-final.patch
          git apply --binary \
            --exclude='.github/workflows/final-source-export.yml' \
            --exclude='.github/workflows/remediate-lockfile-20260726.yml' \
            --exclude='reports/*' --exclude='reports/**' \
            /tmp/resindb-final.patch

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Publish exact full-audit diagnostics
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          set +e
          npm audit --audit-level=high --json > /tmp/npm-audit-all.json
          audit_code=$?
          set -e
          summary="$(jq -c '.metadata.vulnerabilities' /tmp/npm-audit-all.json)"
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$(jq -nc --arg state "$( [ "$audit_code" -eq 0 ] && echo success || echo failure )" --arg context resindb/audit-summary --arg description "${summary:0:130}" --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{state:$state,context:$context,description:$description,target_url:$target_url}')" >/dev/null
          index=0
          while IFS=$'\t' read -r package severity range direct fix; do
            slug="$(printf '%s' "$package" | tr '@/' '--' | tr -cd 'A-Za-z0-9._-' | cut -c1-35)"
            description="${severity}; range ${range}; direct=${direct}; fix=${fix}"
            curl -fsSL -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -d "$(jq -nc --arg state failure --arg context "resindb/audit-$(printf '%02d' "$index")-${slug}" --arg description "${description:0:130}" --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{state:$state,context:$context,description:$description,target_url:$target_url}')" >/dev/null
            index=$((index + 1))
          done < <(jq -r '.vulnerabilities | to_entries[] | [.key, .value.severity, .value.range, (.value.isDirect|tostring), (.value.fixAvailable|tostring)] | @tsv' /tmp/npm-audit-all.json)
          jq '{metadata, vulnerabilities}' /tmp/npm-audit-all.json
          exit "$audit_code"
