name: CI

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          if ! npm ci > /tmp/npm-ci.log 2>&1; then
            echo 'npm ci failed; showing the final diagnostic lines:'
            tail -n 120 /tmp/npm-ci.log
            exit 1
          fi

      - name: Validate repository
        run: npm run validate
