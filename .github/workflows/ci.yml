name: One-time pass8 main controller through registered CI path

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-time-pass8-main-controller
  cancel-in-progress: false

jobs:
  apply-pass8:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/material-statistics-polymer-physics-20260805'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main controller tree
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Check out candidate branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/material-statistics-polymer-physics-20260805
          fetch-depth: 0
          token: ${{ github.token }}
          path: candidate

      - name: Decode, verify and commit pass8 candidate locally
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          git show 9f3e317abd39dec8f134236ccf07296b2c6cdf5e:.github/workflows/ci.yml > /tmp/resindb-permanent-ci.yml
          cat .github/pass8-payload/part-* | base64 -d > /tmp/resindb-pass8-payload.tar.xz
          printf '%s  %s\n' \
            'a8e69d380c076a3d2bc872dd76ebc6bb61d2f1c6c8540f5b9bd267ecd8e4e47a' \
            '/tmp/resindb-pass8-payload.tar.xz' | sha256sum -c -
          tar -xJf /tmp/resindb-pass8-payload.tar.xz -C .
          cp /tmp/resindb-permanent-ci.yml .github/workflows/ci.yml
          git checkout HEAD -- src/components/charts/DataVisualizerLegacy.tsx
          rm -rf .github/pass8-payload
          rm -f .github/workflows/one-time-pass8-material-physics-payload.yml
          rm -f .github/run-pass8-material-physics-payload.trigger

          python <<'PY'
          from pathlib import Path
          source = Path('src/lib/materialScience.ts')
          text = source.read_text()
          text = text.replace(
              'const STUDENT_T_95_CACHE = new Map<number, number>();\n',
              'const STUDENT_T_95_CACHE = new Map<number, number>();\n'
              'const PERCENTILE_NORMALIZER_CACHE = new WeakMap<readonly number[], (value: number) => number>();\n',
          )
          old = '''  createPercentileNormalizer: (dataArray: number[]): ((value: number) => number) => {
            const sorted = finiteValues(dataArray).sort((left, right) => left - right);
            if (sorted.length < 2) return () => 50;

            return (value: number): number => {
              if (!Number.isFinite(value)) return 50;
              const lower = lowerBound(sorted, value);
              const upper = upperBound(sorted, value);
              let rankIndex: number;
              if (lower < upper) rankIndex = (lower + upper - 1) / 2;
              else rankIndex = Math.min(sorted.length - 1, Math.max(0, lower));
              const displayPercentile = 20 + (80 * rankIndex) / (sorted.length - 1);
              return Math.max(5, Math.min(100, displayPercentile));
            };
          },
          '''
          new = '''  createPercentileNormalizer: (dataArray: number[]): ((value: number) => number) => {
            const cached = PERCENTILE_NORMALIZER_CACHE.get(dataArray);
            if (cached) return cached;

            const sorted = finiteValues(dataArray).sort((left, right) => left - right);
            const normalize = sorted.length < 2
              ? () => 50
              : (value: number): number => {
                if (!Number.isFinite(value)) return 50;
                const lower = lowerBound(sorted, value);
                const upper = upperBound(sorted, value);
                let rankIndex: number;
                if (lower < upper) rankIndex = (lower + upper - 1) / 2;
                else rankIndex = Math.min(sorted.length - 1, Math.max(0, lower));
                const displayPercentile = 20 + (80 * rankIndex) / (sorted.length - 1);
                return Math.max(5, Math.min(100, displayPercentile));
              };
            PERCENTILE_NORMALIZER_CACHE.set(dataArray, normalize);
            return normalize;
          },
          '''
          if old not in text:
              raise SystemExit('percentile normalizer source block not found')
          source.write_text(text.replace(old, new))

          audit = Path('docs/CODE_MATH_PERFORMANCE_AUDIT_2026-08-05_PASS8_MATERIAL_PHYSICS.md')
          text = audit.read_text()
          text = text.replace(
              '2. `src/components/charts/DataVisualizerLegacy.tsx`：雷达图中位秩归一化调用链；\n'
              '3. `src/utils/polymerPhysics.ts`',
              '2. `src/utils/polymerPhysics.ts`',
          )
          text = text.replace('4. 新增 23 项专项数值与物理边界测试。', '3. 新增 23 项专项数值与物理边界测试。')
          text = text.replace(
              '新路径每个维度只排序一次，再使用二分查找计算并列平均秩。',
              '新路径按参考数组对象缓存每个维度的排序结果，再使用二分查找计算并列平均秩；现有显示调用无需改写即可复用缓存。',
          )
          audit.write_text(text)
          PY

          test -s src/lib/materialScience.ts
          test -s src/utils/polymerPhysics.ts
          test -s tests/unit/materialScienceRobustness.test.ts
          test -s tests/unit/polymerPhysics.test.ts
          test -s docs/CODE_MATH_PERFORMANCE_AUDIT_2026-08-05_PASS8_MATERIAL_PHYSICS.md
          grep -q 'PERCENTILE_NORMALIZER_CACHE' src/lib/materialScience.ts
          grep -q 'regularizedIncompleteBeta' src/lib/materialScience.ts
          grep -q 'relative-number-intensity' src/lib/materialScience.ts
          grep -q 'coolingEndK' src/utils/polymerPhysics.ts
          grep -q 'fix deform' src/utils/polymerPhysics.ts
          grep -q 'Material Statistics and Polymer Physics' README.md

          git add -A
          git diff --check
          git diff --cached --name-only | sort > /tmp/pass8-files.txt
          cat > /tmp/pass8-expected.txt <<'EOF'
          README.md
          docs/CODE_MATH_PERFORMANCE_AUDIT_2026-08-05_PASS8_MATERIAL_PHYSICS.md
          src/lib/materialScience.ts
          src/utils/polymerPhysics.ts
          tests/unit/materialScienceRobustness.test.ts
          tests/unit/polymerPhysics.test.ts
          EOF
          sort -o /tmp/pass8-expected.txt /tmp/pass8-expected.txt
          diff -u /tmp/pass8-expected.txt /tmp/pass8-files.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: harden material statistics and polymer physics'

      - name: Restore permanent main CI before candidate synchronization
        shell: bash
        run: |
          set -euo pipefail
          git show 9f3e317abd39dec8f134236ccf07296b2c6cdf5e:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f .github/workflows/one-time-pass8-branch-apply.yml
          rm -f .github/run-pass8-branch-apply.trigger
          rm -f .github/run-pass8-main-controller.trigger
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove pass8 main controller'
          git push origin HEAD:main

      - name: Push clean pass8 candidate
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          git push origin HEAD:agent/material-statistics-polymer-physics-20260805
