name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate, cover, render and audit
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        id: npm-ci
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm ci > /tmp/npm-ci.log 2>&1; then
              exit 0
            fi
            tail -n 160 /tmp/npm-ci.log
            [ "$attempt" -eq 3 ] && exit 1
            sleep $((attempt * 15))
          done

      - name: Upload npm diagnostics
        if: failure() && steps.npm-ci.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: npm-ci-diagnostics-${{ github.sha }}
          path: /tmp/npm-ci.log
          retention-days: 3

      - name: Lint, typecheck, full tests, build and HTTP smoke
        run: npm run validate

      - name: Unit tests
        run: npm run test:unit

      - name: Scientific and worker tests
        run: npm run test:science

      - name: Coverage
        run: npm run test:coverage

      - name: Chromium UI smoke
        run: npm run test:ui

      - name: Production dependency audit
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm run audit:prod; then
              exit 0
            fi
            [ "$attempt" -eq 3 ] && exit 1
            sleep $((attempt * 10))
          done

      - name: Upload coverage and UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-evidence-${{ github.sha }}
          path: |
            coverage/
            artifacts/
          if-no-files-found: warn
          retention-days: 14
