name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  actions: read
  contents: write
  issues: write

concurrency:
  group: resindb-final-overlay-publisher
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out acceptance branch with write access
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/final-acceptance-resindb-20260808
          fetch-depth: 0
          persist-credentials: true

      - name: Download trusted acceptance overlay
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '9016379422'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/resindb-final-artifact
          mkdir -p /tmp/resindb-final-artifact
          curl -fsSL -L \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o /tmp/resindb-final-artifact.zip
          unzip -q /tmp/resindb-final-artifact.zip -d /tmp/resindb-final-artifact
          test -s /tmp/resindb-final-artifact/final-overlay/package-lock.json
          test -s /tmp/resindb-final-artifact/ui-smoke-manifest.json
          test -s /tmp/resindb-final-artifact/test-results.json
          test -s /tmp/resindb-final-artifact/coverage-summary.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Apply audited overlay and validate permanent delivery
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/ci.yml
          node .github/materialize-resindb-final.mjs
          node .github/apply-resindb-final-overlay.mjs /tmp/resindb-final-artifact
          npm ci
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high
          node scripts/validate-repository-docs.mjs
          node scripts/validate-i18n-visuals.mjs
          node scripts/validate-scientific-ui.mjs
          node -e "const lock=require('./package-lock.json'); if(lock.packages?.['node_modules/dompurify']?.version!=='3.4.13'||lock.packages?.['node_modules/nanoid']?.version!=='3.3.17') throw new Error('audited dependency versions missing')"
          ! grep -q 'contents: write' .github/workflows/ci.yml
          grep -q 'Install CJK fonts for deterministic visual evidence' .github/workflows/ci.yml
          grep -q '326/326' README.md
          grep -q 'Noto Sans CJK SC' docs/README_RUNTIME_VISUAL_EVIDENCE.json
          cp .github/workflows/ci.yml /tmp/resindb-permanent-ci.yml

      - name: Commit exact non-workflow delivery payload
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git checkout HEAD -- .github/workflows
          test -z "$(git status --short -- .github/workflows)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No non-workflow payload changes were produced.' >&2
            exit 1
          fi
          git commit -m 'fix: finalize audited bilingual scientific delivery payload'
          git push origin HEAD:agent/final-acceptance-resindb-20260808
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Record payload publication result
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          body="RESINDB_FINAL_PAYLOAD_PUBLISHED: ${SOURCE_SHA} — run 31238772446; 326/326 tests; zero dependency findings; CJK font and non-blank scientific Canvas evidence committed. Permanent CI was validated and will be restored through the GitHub connector."
          jq -n --arg body "$body" '{body:$body}' > /tmp/comment.json
          curl -fsSL -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/35/comments" \
            -d @/tmp/comment.json
