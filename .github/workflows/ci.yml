name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Exact-tree validation, browser evidence and reports
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Remove accidental transient branch
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin should-not-create >/dev/null 2>&1; then
            git push origin --delete should-not-create
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact dependencies
        id: npm-ci
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/npm-ci.log
          cp package.json /tmp/resindb-package-exact.json
          cp package-lock.json /tmp/resindb-package-lock-exact.json
          restore_manifests() {
            cp /tmp/resindb-package-exact.json package.json
            cp /tmp/resindb-package-lock-exact.json package-lock.json
          }
          trap restore_manifests EXIT
          node scripts/prepare-ci-manifest.mjs | tee /tmp/ci-manifest-normalization.json
          registries=(
            "https://registry.npmjs.org"
            "https://registry.npmmirror.com"
          )
          for registry in "${registries[@]}"; do
            for attempt in 1 2 3; do
              printf '\nregistry=%s attempt=%s\n' "$registry" "$attempt" | tee -a /tmp/npm-ci.log
              if npm ci --registry="$registry" >> /tmp/npm-ci.log 2>&1; then
                restore_manifests
                trap - EXIT
                cat /tmp/ci-manifest-normalization.json
                cat /tmp/npm-ci.log
                exit 0
              fi
              tail -n 200 /tmp/npm-ci.log
              sleep $((attempt * 10))
            done
          done
          exit 1

      - name: Upload npm diagnostics
        if: failure() && steps.npm-ci.outcome == 'failur'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npm-ci-diagnostics-${{ github.sha }}
          path: |
            /tmp/npm-ci.log
            /tmp/ci-manifest-normalization.json
          retention-days: 5

      - name: Documentation and deterministic scientific visuals
        run: npm run validate:docs

      - name: Production source hygiene
        run: npm run validate:source

      - name: Governed external data
        run: npm run validate:data

      - name: Scientific UI and figure semantics
        run: npm run validate:scientific-ui

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Deterministic K-Means backend benchmark smoke
        run: npm run benchmark:kmeans:smoke

      - name: Complete regression tests
        run: npm test

      - name: Isolated unit tests
        run: npm run test:unit

      - name: Isolated scientific and worker tests
        run: npm run test:science

      - name: Whole-production-source coverage
        run: npm run test:coverage

      - name: Production build and external-data proof
        run: npm run build

      - name: HTTP production smoke
        run: npm run smoke

      - name: Chromium interactive UI smoke
        run: npm run test:ui

      - name: Production dependency audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          set +e
          npm audit --omit=dev --audit-level=high --json > artifacts/npm-audit-prod.json
          code=$?
          set -e
          jq '.metadata.vulnerabilities' artifacts/npm-audit-prod.json
          exit "$code"

      - name: Complete dependency audit
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npm audit --audit-level=high --json > artifacts/npm-audit-all.json
          code=$?
          set -e
          jq '.metadata.vulnerabilities' artifacts/npm-audit-all.json
          exit "$code"

      - name: Record dependency freshness
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          npm outdated --json > artifacts/npm-outdated.json
          code=$?
          set -e
          if [ ! -s artifacts/npm-outdated.json ]; then printf '{}\n' > artifacts/npm-outdated.json; fi
          printf '%s\n' "$code" > artifacts/npm-outdated-exit-code.txt
          jq . artifacts/npm-outdated.json

      - name: Prove main is the sole remote branch
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote --heads origin | tee artifacts/branch-proof.txt
          test "$(wc -l < artifacts/branch-proof.txt | tr -d ' ')" -eq 1
          test "$(grep -c 'refs/heads/main$' artifacts/branch-proof.txt || true)" -eq 1

      - name: Bundle deterministic exact source tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            --mode='u+rwX,go+rX,go-w' \
            -czf artifacts/exact-source-tree.tar.gz \
            .github \
            native \
            schemas \
            scripts \
            src \
            tests \
            .npmrc \
            .nvmrc \
            eslint.config.js \
             index.html \
            package-lock.json \
            package.json \
            tsconfig.json \
            vite.config.ts
          sha256sum artifacts/exact-source-tree.tar.gz | tee artifacts/exact-source-tree.sha256
          test "$(stat -c%s artifacts/exact-source-tree.tar.gz)" -gt 100000

      - name: Write exact-tree context and passed core gates
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const tests = JSON.parse(fs.readFileSync('artifacts/test-results.json', 'utf8'))
          const context = {
            schemaVersion: 3,
            repository: process.env.GITHUB_REPOSITORY,
            sha: process.env.GITHUB_SHA,
            ref: process.env.GITHUB_REF,
            runId: Number(process.env.GITHUB_RUN_ID),
            runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            testFiles: tests.testResults.length,
            testCount: tests.numTotalTests,
            generatedAt: new Date().toISOString(),
          }
          fs.writeFileSync('artifacts/ci-context.json', `${JSON.stringify(context, null, 2)}\n`)
          fs.writeFileSync('artifacts/ci-gates.json', `${JSON.stringify({
            schemaVersion: 1,
            status: 'PASS',
            gates: [
              'docs', 'source-hygiene', 'governed-data', 'scientific-ui', 'lint', 'typescript',
              'regression', 'isolated-unit', 'isolated-science-workers',
              'whole-source-coverage', 'build', 'http-smoke', 'chromium-ui',
              'production-audit', 'complete-audit', 'single-main-branch',
              'deterministic-exact-source-tree',
            ],
          }, null, 2)}\n`)
          NODE

      - name: Generate exact-tree validation receipt
        run: npm run report:receipt

      - name: Generate HTML and Markdown validation reports
        run: npm run report:validation

      - name: Generate PDF image report
        run: npm run report:pdf

      - name: Render PDF for visual acceptance
        shell: bash
        run: |
          set -euo pipefail
          pdf="artifacts/ResinDB-Pro-3.2.0-Final-Validation-Report.pdf"
          test -s "$pdf"
          if ! command -v pdfinfo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
          pdfinfo "$pdf"
          pdftoppm -png -r 120 "$pdf" artifacts/pdf-render >/dev/null
          mapfile -t rendered_pages < <(find artifacts -maxdepth 1 -name 'pdf-render-*.png' -print | sort -V)
          test "${#rendered_pages[@]}" -ge 2
          test "$(stat -c%s "${rendered_pages[0]}")" -gt 10000

      - name: Upload complete validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: resindb-pro-3.2.0-evidence-${{ github.sha }}
          path: |
            coverage/
            artifacts/
            FINAL_CODE_AUDIT.md
            FINAL_RELEASE_REPORT.md
          if-no-files-found: warn
          retention-days: 30

  publish-status:
    name: Publish queryable CI evidence status
    if: always() && github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Publish commit status
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.validate.result }}
        shell: bash
        run: |
          set -euo pipefail
          state=failure
          [ "$RESULT" = success ] && state=success
          [ "$RESULT" = cancelled ] && state=error
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$(jq -nc --arg state "$state" --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --arg description "ResinDB exact-tree validation: ${RESULT}" --arg context resindb/ci-evidence '{state:$state,target_url:$target_url,description:$description,context:$context}')" >/dev/null
