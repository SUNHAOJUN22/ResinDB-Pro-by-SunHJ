name: ResinDB Stage-One Direct Main Applier

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: resindb-stage-one-direct-main
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0

      - name: Publish start status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$(jq -nc --arg state pending --arg context resindb/stage1-apply --arg description 'Applying exact Node-only phase-one tree directly to main' --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{state:$state,context:$context,description:$description,target_url:$target_url}')" >/dev/null

      - name: Reconstruct, validate and stage exact business tree
        shell: bash
        env:
          BASE_TRANSPORT_SHA256: 2d0af641907c40b5cf495636dcdc764f5af3b5dec4f1f814c64f165b9eea2db1
          BASE_XZ_SHA256: 024e4dd14bf401d48c74263637a6ff09b31e7bc18da5befd8a3e61199f1a27c6
          BASE_PATCH_SHA256: caeddf8947eb4d6c843a1ad6f6d7fded2db3f823654b216d6e5cf376f8bbf5b6
          HARDEN_TRANSPORT_SHA256: a9bae5dab3ab7b670be18b9568adf8f6414a17c6bb0700e53fb83be8882245e0
          HARDEN_XZ_SHA256: 1d174dad5c1c5b74a3bf88e4dd7343412bc7c868f38766a868f7354c9eddabc0
          HARDEN_PATCH_SHA256: 875d1ed291b884a964ca5d448d419ee5624f1e5a667f465e7665037d91f2bdb6
          STAGE1_TRANSPORT_SHA256: 893596177f5502f70c2d14cb59a13b240ae7f20776d74990444b24ad52b66f5f
          STAGE1_XZ_SHA256: 7afa04a61ef72ceef2080c4cb153afb60be39f93acb306d8dd718e97065b9446
          STAGE1_PATCH_SHA256: d33d457bc263c6322e36dd45e212e620b437a04ecc64abb71150878ea98aa6de
          EXPECTED_TREE_SHA: d389544745fc541602a0c342bc4519802da0603b
          EXPECTED_PERMANENT_CI_BLOB: d908548352c24d20535afe866f0e2d351466ccd7
        run: |
          set -euxo pipefail
          mkdir -p /tmp/resindb-stage1 artifacts
          cp -a .github/workflows /tmp/resindb-running-workflows

          reconstruct_regular() {
            local directory="$1" count="$2" transport="$3" xz="$4" patch="$5" prefix="$6"
            test "$(find "$directory" -maxdepth 1 -name 'part-*.txt' | wc -l | tr -d ' ')" -eq "$count"
            cat "$directory"/part-*.txt > "/tmp/resindb-stage1/${prefix}.b64"
            printf '%s  %s\n' "$transport" "/tmp/resindb-stage1/${prefix}.b64" | sha256sum -c -
            base64 -d "/tmp/resindb-stage1/${prefix}.b64" > "/tmp/resindb-stage1/${prefix}.xz"
            printf '%s  %s\n' "$xz" "/tmp/resindb-stage1/${prefix}.xz" | sha256sum -c -
            xz -t "/tmp/resindb-stage1/${prefix}.xz"
            xz -dc "/tmp/resindb-stage1/${prefix}.xz" > "/tmp/resindb-stage1/${prefix}.patch"
            printf '%s  %s\n' "$patch" "/tmp/resindb-stage1/${prefix}.patch" | sha256sum -c -
          }

          reconstruct_regular .github/.resindb-final-patch 51 "$BASE_TRANSPORT_SHA256" "$BASE_XZ_SHA256" "$BASE_PATCH_SHA256" base
          reconstruct_regular .github/.resindb-v320-delta 10 "$HARDEN_TRANSPORT_SHA256" "$HARDEN_XZ_SHA256" "$HARDEN_PATCH_SHA256" harden

          cat \
            .github/.resindb-stage1-delta/part-000.txt \
            .github/.resindb-stage1-delta/part-001.txt \
            .github/.resindb-stage1-delta/part-002.txt \
            .github/.resindb-stage1-delta/part-003a.txt \
            .github/.resindb-stage1-delta/part-003b.txt \
            .github/.resindb-stage1-delta/part-004.txt \
            .github/.resindb-stage1-delta/part-005.txt \
            .github/.resindb-stage1-delta/part-006.txt \
            .github/.resindb-stage1-delta/part-007.txt \
            .github/.resindb-stage1-delta/part-008.txt \
            .github/.resindb-stage1-delta/part-009.txt \
            > /tmp/resindb-stage1/stage1.b64
          printf '%s  %s\n' "$STAGE1_TRANSPORT_SHA256" /tmp/resindb-stage1/stage1.b64 | sha256sum -c -
          base64 -d /tmp/resindb-stage1/stage1.b64 > /tmp/resindb-stage1/stage1.xz
          printf '%s  %s\n' "$STAGE1_XZ_SHA256" /tmp/resindb-stage1/stage1.xz | sha256sum -c -
          xz -t /tmp/resindb-stage1/stage1.xz
          xz -dc /tmp/resindb-stage1/stage1.xz > /tmp/resindb-stage1/stage1.patch
          printf '%s  %s\n' "$STAGE1_PATCH_SHA256" /tmp/resindb-stage1/stage1.patch | sha256sum -c -

          rm -rf .github/workflows
          mkdir -p .github/workflows
          git show d8b3e90dd0d90aba5e31361305392898eea2fc4c:.github/workflows/ci.yml > .github/workflows/ci.yml
          test "$(git hash-object .github/workflows/ci.yml)" = 796e74f7b17426aaa03b8d461a100761574960d0

          exclusions=(--exclude='.github/workflows/final-source-export.yml' --exclude='.github/workflows/remediate-lockfile-20260726.yml' --exclude='reports/*' --exclude='reports/**')
          git apply --check --binary "${exclusions[@]}" /tmp/resindb-stage1/base.patch
          git apply --binary "${exclusions[@]}" /tmp/resindb-stage1/base.patch
          git apply --check --binary /tmp/resindb-stage1/harden.patch
          git apply --binary /tmp/resindb-stage1/harden.patch
          git apply --check --binary /tmp/resindb-stage1/stage1.patch
          git apply --binary /tmp/resindb-stage1/stage1.patch

          find .github -type f ! -path '.github/workflows/ci.yml' -delete
          find .github -depth -type d -empty -delete || true
          rm -rf reports artifacts coverage dist node_modules
          mkdir -p reports artifacts
          printf '%s\n' '# Validation reports' '' 'Exact-tree HTML, PDF, screenshots, coverage and machine-readable receipts are generated into `artifacts/` by CI and uploaded as GitHub Actions artifacts. They are not fabricated or committed as stale evidence.' > reports/README.md
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete

          git add -A
          git diff --cached --check
          desired_tree="$(git write-tree)"
          test "$desired_tree" = "$EXPECTED_TREE_SHA"
          test "$(git hash-object .github/workflows/ci.yml)" = "$EXPECTED_PERMANENT_CI_BLOB"
          cp .github/workflows/ci.yml /tmp/resindb-stage1/permanent-ci.yml

          rm -rf .github/workflows
          cp -a /tmp/resindb-running-workflows .github/workflows
          find .github -type f ! -path '.github/workflows/*' -delete
          find .github -depth -type d -empty -delete || true
          git add -A
          git diff --cached --check
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          printf '%s\n' "$desired_tree" > /tmp/resindb-stage1/desired-tree.txt

      - name: Commit stage-one business tree directly to main
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git config user.name 'ResinDB Stage-One Bot'
          git config user.email 'actions@users.noreply.github.com'
          test -n "$(git diff --cached --name-only)"
          git commit -m 'feat: complete stage-one Node-only tooling migration'
          git push origin HEAD:main
          git rev-parse HEAD > /tmp/resindb-stage1/business-commit.txt

      - name: Upload permanent CI handoff
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: resindb-stage-one-handoff-${{ github.run_id }}
          path: |
            /tmp/resindb-stage1/permanent-ci.yml
            /tmp/resindb-stage1/desired-tree.txt
            /tmp/resindb-stage1/business-commit.txt
          if-no-files-found: error
          retention-days: 7

      - name: Publish result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=failure
          description='Phase-one direct-main application failed closed'
          if [ "${{ job.status }}" = success ]; then state=success; description='Phase-one Node-only business tree committed to main'; fi
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$(jq -nc --arg state "$state" --arg context resindb/stage1-apply --arg description "$description" --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{state:$state,context:$context,description:$description,target_url:$target_url}')" >/dev/null
