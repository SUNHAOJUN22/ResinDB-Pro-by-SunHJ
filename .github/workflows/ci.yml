name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Exact-tree validation, browser evidence and reports
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact dependencies
        id: npm-ci
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm ci > /tmp/npm-ci.log 2>&1; then
              cat /tmp/npm-ci.log
              exit 0
            fi
            tail -n 200 /tmp/npm-ci.log
            [ "$attempt" -eq 3 ] && exit 1
            sleep $((attempt * 15))
          done

      - name: Upload npm diagnostics
        if: failure() && steps.npm-ci.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npm-ci-diagnostics-${{ github.sha }}
          path: /tmp/npm-ci.log
          retention-days: 5

      - name: Documentation and deterministic scientific visuals
        run: npm run validate:docs

      - name: Production source hygiene
        run: npm run validate:source

      - name: Governed external data
        run: npm run validate:data

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Complete regression tests
        run: npm test

      - name: Isolated unit tests
        run: npm run test:unit

      - name: Isolated scientific and worker tests
        run: npm run test:science

      - name: Whole-production-source coverage
        run: npm run test:coverage

      - name: Production build and external-data proof
        run: npm run build

      - name: HTTP production smoke
        run: npm run smoke

      - name: Chromium interactive UI smoke
        run: npm run test:ui

      - name: Production dependency audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          set +e
          npm audit --omit=dev --audit-level=high --json > artifacts/npm-audit-prod.json
          code=$?
          set -e
          jq '.metadata.vulnerabilities' artifacts/npm-audit-prod.json
          exit "$code"

      - name: Complete dependency audit
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npm audit --audit-level=high --json > artifacts/npm-audit-all.json
          code=$?
          set -e
          jq '.metadata.vulnerabilities' artifacts/npm-audit-all.json
          exit "$code"

      - name: Record dependency freshness
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          npm outdated --json > artifacts/npm-outdated.json
          code=$?
          set -e
          if [ ! -s artifacts/npm-outdated.json ]; then printf '{}\n' > artifacts/npm-outdated.json; fi
          printf '%s\n' "$code" > artifacts/npm-outdated-exit-code.txt
          jq . artifacts/npm-outdated.json

      - name: Prove main is the sole remote branch
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote --heads origin | tee artifacts/branch-proof.txt
          test "$(wc -l < artifacts/branch-proof.txt | tr -d ' ')" -eq 1
          test "$(grep -c 'refs/heads/main$' artifacts/branch-proof.txt || true)" -eq 1

      - name: Write exact-tree context and passed core gates
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const tests = JSON.parse(fs.readFileSync('artifacts/test-results.json', 'utf8'))
          const context = {
            schemaVersion: 3,
            repository: process.env.GITHUB_REPOSITORY,
            sha: process.env.GITHUB_SHA,
            ref: process.env.GITHUB_REF,
            runId: Number(process.env.GITHUB_RUN_ID),
            runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            testFiles: tests.testResults.length,
            testCount: tests.numTotalTests,
            generatedAt: new Date().toISOString(),
          }
          fs.writeFileSync('artifacts/ci-context.json', `${JSON.stringify(context, null, 2)}\n`)
          fs.writeFileSync('artifacts/ci-gates.json', `${JSON.stringify({
            schemaVersion: 1,
            status: 'PASS',
            gates: [
              'docs', 'source-hygiene', 'governed-data', 'lint', 'typescript',
              'regression', 'isolated-unit', 'isolated-science-workers',
              'whole-source-coverage', 'build', 'http-smoke', 'chromium-ui',
              'production-audit', 'complete-audit', 'single-main-branch',
            ],
          }, null, 2)}\n`)
          NODE

      - name: Generate exact-tree validation receipt
        run: npm run report:receipt

      - name: Generate HTML and Markdown validation reports
        run: npm run report:validation

      - name: Generate PDF image report
        run: npm run report:pdf

      - name: Render PDF for visual acceptance
        shell: bash
        run: |
          set -euo pipefail
          pdf="artifacts/ResinDB-Pro-3.2.0-Final-Validation-Report.pdf"
          test -s "$pdf"
          if ! command -v pdfinfo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
          pdfinfo "$pdf"
          pdftoppm -png -r 120 "$pdf" artifacts/pdf-render >/dev/null
          test "$(find artifacts -maxdepth 1 -name 'pdf-render-*.png' | wc -l | tr -d ' ')" -ge 2
          test "$(stat -c%s artifacts/pdf-render-1.png)" -gt 10000

      - name: Upload complete validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: resindb-pro-3.2.0-evidence-${{ github.sha }}
          path: |
            coverage/
            artifacts/
            FINAL_CODE_AUDIT.md
            FINAL_RELEASE_REPORT.md
          if-no-files-found: warn
          retention-days: 30

  publish-status:
    name: Publish queryable CI evidence status
    if: always() && github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Publish commit status
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.validate.result }}
        shell: bash
        run: |
          set -euo pipefail
          state=failure
          [ "$RESULT" = success ] && state=success
          [ "$RESULT" = cancelled ] && state=error
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$(jq -nc --arg state "$state" --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --arg description "ResinDB exact-tree validation: ${RESULT}" --arg context resindb/ci-evidence '{state:$state,target_url:$target_url,description:$description,context:$context}')" >/dev/null
