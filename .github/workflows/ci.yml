name: ESLint 10 Install Log Diagnostic

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Publish diagnostic start
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$(jq -nc --arg state pending --arg context resindb/eslint10-install-log --arg description 'Capturing exact npm install output after lockfile cleanup' --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{state:$state,context:$context,description:$description,target_url:$target_url}')" >/dev/null

      - name: Restore exact candidate
        shell: bash
        env:
          TRANSPORT_SHA256: 2d0af641907c40b5cf495636dcdc764f5af3b5dec4f1f814c64f165b9eea2db1
          XZ_SHA256: 024e4dd14bf401d48c74263637a6ff09b31e7bc18da5befd8a3e61199f1a27c6
          PATCH_SHA256: caeddf8947eb4d6c843a1ad6f6d7fded2db3f823654b216d6e5cf376f8bbf5b6
        run: |
          set -euo pipefail
          git show d8b3e90dd0d90aba5e31361305392898eea2fc4c:.github/workflows/ci.yml > .github/workflows/ci.yml
          cat .github/.resindb-final-patch/part-*.txt > /tmp/resindb-final.patch.xz.b64
          printf '%s  %s\n' "$TRANSPORT_SHA256" /tmp/resindb-final.patch.xz.b64 | sha256sum -c -
          base64 -d /tmp/resindb-final.patch.xz.b64 > /tmp/resindb-final.patch.xz
          printf '%s  %s\n' "$XZ_SHA256" /tmp/resindb-final.patch.xz | sha256sum -c -
          xz -dc /tmp/resindb-final.patch.xz > /tmp/resindb-final.patch
          printf '%s  %s\n' "$PATCH_SHA256" /tmp/resindb-final.patch | sha256sum -c -
          git apply --binary \
            --exclude='.github/workflows/final-source-export.yml' \
            --exclude='.github/workflows/remediate-lockfile-20260726.yml' \
            --exclude='reports/*' --exclude='reports/**' \
            /tmp/resindb-final.patch

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Remove incompatible plugin from declaration and lockfile
        run: npm uninstall --save-dev --package-lock-only --ignore-scripts eslint-plugin-unused-imports

      - name: Capture secure lint-stack install output
        id: install
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp package.json artifacts/package-after-uninstall.json
          cp package-lock.json artifacts/package-lock-after-uninstall.json
          set +e
          npm install --save-dev --save-exact --package-lock-only --ignore-scripts \
            @eslint/js@10.7.0 \
            eslint@10.7.0 \
            @typescript-eslint/eslint-plugin@8.65.0 \
            @typescript-eslint/parser@8.65.0 \
            typescript-eslint@8.65.0 \
            eslint-plugin-react-hooks@7.1.1 \
            eslint-plugin-react-refresh@0.5.3 \
            > artifacts/npm-eslint10-install.log 2>&1
          code=$?
          set -e
          printf '%s\n' "$code" > artifacts/exit-code.txt
          cp package.json artifacts/package-after-install.json
          cp package-lock.json artifacts/package-lock-after-install.json
          tail -n 260 artifacts/npm-eslint10-install.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      - name: Upload exact install evidence
        uses: actions/upload-artifact@v4
        with:
          name: eslint10-install-log-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

      - name: Publish diagnostic result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=success
          description='Secure lint-stack package resolution succeeded'
          if [ "${{ steps.install.outputs.exit_code }}" != '0' ]; then
            state=failure
            description='Exact npm install failure captured in the linked artifact'
          fi
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$(jq -nc --arg state "$state" --arg context resindb/eslint10-install-log --arg description "$description" --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{state:$state,context:$context,description:$description,target_url:$target_url}')" >/dev/null

      - name: Fail closed after evidence capture
        if: steps.install.outputs.exit_code != '0'
        run: exit 1
