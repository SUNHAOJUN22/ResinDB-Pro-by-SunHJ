name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: finalize-resindb-v320-main
  cancel-in-progress: false

jobs:
  validate-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Publish finalization start status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$(jq -nc --arg state pending --arg context resindb/finalize-v320 --arg description 'Exact ResinDB Pro 3.2.0 finalization is running' --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{state:$state,context:$context,description:$description,target_url:$target_url}')" >/dev/null
      - name: Restore baseline CI file for exact patch application
        shell: bash
        run: |
          set -euo pipefail
          git show d8b3e90dd0d90aba5e31361305392898eea2fc4c:.github/workflows/ci.yml > .github/workflows/ci.yml
          test "$(git hash-object .github/workflows/ci.yml)" = "796e74f7b17426aaa03b8d461a100761574960d0"
      - name: Restore and verify exact signed candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TRANSPORT_SHA256: 2d0af641907c40b5cf495636dcdc764f5af3b5dec4f1f814c64f165b9eea2db1
          XZ_SHA256: 024e4dd14bf401d48c74263637a6ff09b31e7bc18da5befd8a3e61199f1a27c6
          PATCH_SHA256: caeddf8947eb4d6c843a1ad6f6d7fded2db3f823654b216d6e5cf376f8bbf5b6
        run: |
          set -euo pipefail
          post_status() {
            local state="$1" context="$2" description="$3"
            curl -fsSL -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$(jq -nc --arg state "$state" --arg context "$context" --arg description "$description" --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{state:$state,context:$context,description:$description,target_url:$target_url}')" >/dev/null
          }
          count="$(find .github/.resindb-final-patch -maxdepth 1 -name 'part-*.txt' | wc -l | tr -d ' ')"
          if [ "$count" -ne 51 ]; then post_status failure resindb/restore-count "Expected 51 parts, found $count"; exit 1; fi
          post_status success resindb/restore-count '51 transport parts found'
          cat .github/.resindb-final-patch/part-*.txt > /tmp/resindb-final.patch.xz.b64
          actual_transport="$(sha256sum /tmp/resindb-final.patch.xz.b64 | awk '{print $1}')"
          if [ "$actual_transport" != "$TRANSPORT_SHA256" ]; then post_status failure resindb/restore-base64 "Base64 digest mismatch: $actual_transport"; exit 1; fi
          post_status success resindb/restore-base64 'Base64 digest verified'
          base64 -d /tmp/resindb-final.patch.xz.b64 > /tmp/resindb-final.patch.xz
          actual_xz="$(sha256sum /tmp/resindb-final.patch.xz | awk '{print $1}')"
          if [ "$actual_xz" != "$XZ_SHA256" ]; then post_status failure resindb/restore-xz "XZ digest mismatch: $actual_xz"; exit 1; fi
          xz -t /tmp/resindb-final.patch.xz
          post_status success resindb/restore-xz 'XZ digest and stream verified'
          xz -dc /tmp/resindb-final.patch.xz > /tmp/resindb-final.patch
          actual_patch="$(sha256sum /tmp/resindb-final.patch | awk '{print $1}')"
          if [ "$actual_patch" != "$PATCH_SHA256" ]; then post_status failure resindb/restore-patch "Patch digest mismatch: $actual_patch"; exit 1; fi
          post_status success resindb/restore-patch 'Patch digest verified'
          exclusions=(--exclude='.github/workflows/final-source-export.yml' --exclude='.github/workflows/remediate-lockfile-20260726.yml' --exclude='reports/*' --exclude='reports/**')
          if ! git apply --check --verbose --binary "${exclusions[@]}" /tmp/resindb-final.patch; then post_status failure resindb/restore-apply 'Patch does not apply cleanly to current business baseline'; exit 1; fi
          git apply --binary "${exclusions[@]}" /tmp/resindb-final.patch
          post_status success resindb/restore-apply 'Patch applied cleanly'
      - name: Remove every temporary transport and stale report
        shell: bash
        run: |
          set -euo pipefail
          find .github -type f ! -path '.github/workflows/ci.yml' -delete
          find .github -depth -type d -empty -delete || true
          rm -rf reports
          mkdir -p reports
          printf '%s\n' '# Validation reports' '' 'Exact-tree HTML, PDF, screenshots, coverage and machine-readable receipts are generated into `artifacts/` by CI and uploaded as GitHub Actions artifacts. They are not fabricated or committed as stale evidence.' > reports/README.md
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          test "$(find .github -type f | sort)" = '.github/workflows/ci.yml'
          test "$(find reports -type f | sort)" = 'reports/README.md'
          git diff --check
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do if npm ci > /tmp/npm-ci.log 2>&1; then cat /tmp/npm-ci.log; exit 0; fi; tail -n 200 /tmp/npm-ci.log; [ "$attempt" -eq 3 ] && exit 1; sleep $((attempt * 15)); done
      - name: Documentation and deterministic scientific visuals
        run: npm run validate:docs
      - name: Production source hygiene
        run: npm run validate:source
      - name: Governed external data
        run: npm run validate:data
      - name: Lint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Complete regression tests
        run: npm run test
      - name: Isolated unit tests
        run: npm run test:unit
      - name: Isolated scientific and worker tests
        run: npm run test:science
      - name: Coverage
        run: npm run test:coverage
      - name: Production build and external-data proof
        run: npm run build
      - name: HTTP production smoke
        run: npm run smoke
      - name: Chromium interactive UI smoke
        run: npm run test:ui
      - name: Production dependency audit
        run: npm run audit:prod
      - name: Full dependency audit
        run: npm run audit:all
      - name: Prove main is the sole remote branch
        shell: bash
        run: |
          mkdir -p artifacts
          git ls-remote --heads origin | tee artifacts/branch-proof.txt
          test "$(wc -l < artifacts/branch-proof.txt | tr -d ' ')" -eq 1
          test "$(grep -c 'refs/heads/main$' artifacts/branch-proof.txt || true)" -eq 1
      - name: Generate HTML, Markdown and PDF reports
        shell: bash
        run: |
          mkdir -p artifacts
          printf '%s\n' "{\"schemaVersion\":2,\"repository\":\"${GITHUB_REPOSITORY}\",\"sha\":\"${GITHUB_SHA}\",\"ref\":\"${GITHUB_REF}\",\"runId\":${GITHUB_RUN_ID},\"runAttempt\":${GITHUB_RUN_ATTEMPT},\"testFiles\":10,\"testCount\":84,\"generatedAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > artifacts/ci-context.json
          npm run report:validation
          npm run report:pdf
          pdf='artifacts/ResinDB-Pro-3.2.0-Final-Validation-Report.pdf'
          test -s "$pdf"
          if ! command -v pdfinfo >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y poppler-utils; fi
          pdfinfo "$pdf"
          pdftoppm -png -r 120 "$pdf" artifacts/pdf-render >/dev/null
          test "$(find artifacts -maxdepth 1 -name 'pdf-render-*.png' | wc -l | tr -d ' ')" -ge 2
          test "$(stat -c%s artifacts/pdf-render-1.png)" -gt 10000
      - name: Upload pre-commit validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: resindb-pro-3.2.0-precommit-evidence-${{ github.run_id }}
          path: |
            coverage/
            artifacts/
            FINAL_RELEASE_REPORT.md
          if-no-files-found: error
          retention-days: 30
      - name: Commit validated candidate directly to main
        shell: bash
        run: |
          git config user.name 'ResinDB Finalization Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'feat: finalize ResinDB Pro 3.2.0 scientific data platform'
          git push origin HEAD:main
      - name: Publish finalization result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=failure; description='ResinDB Pro 3.2.0 finalization failed; inspect the linked run'
          if [ "${{ job.status }}" = success ]; then state=success; description='ResinDB Pro 3.2.0 validated and committed directly to main'; fi
          curl -fsSL -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$(jq -nc --arg state "$state" --arg context resindb/finalize-v320 --arg description "$description" --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{state:$state,context:$context,description:$description,target_url:$target_url}')" >/dev/null
