name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: resindb-exact-final-acceptance
  cancel-in-progress: true

jobs:
  finalize:
    if: >-
      github.event.pull_request.number == 35 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/final-acceptance-resindb-20260808'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Check out exact acceptance branch with write access
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/final-acceptance-resindb-20260808
          fetch-depth: 0
          persist-credentials: true

      - name: Install CJK fonts for deterministic visual evidence
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          fc-match 'Noto Sans CJK SC'
          fc-list :lang=zh | grep -q .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Generate exact zero-vulnerability dependency lock
        shell: bash
        run: |
          set -euo pipefail
          generated=0
          for registry in https://registry.npmjs.org https://registry.npmmirror.com; do
            for attempt in 1 2 3; do
              echo "lock registry=${registry} attempt=${attempt}"
              if npm install --package-lock-only --ignore-scripts --no-audit --no-fund --registry="$registry"; then
                generated=1
                break 2
              fi
              sleep $((attempt * 10))
            done
          done
          test "$generated" -eq 1
          node <<'NODE'
          const lock = require('./package-lock.json');
          const dompurify = lock.packages?.['node_modules/dompurify']?.version;
          const nanoid = lock.packages?.['node_modules/nanoid']?.version;
          if (dompurify !== '3.4.13' || nanoid !== '3.3.17') {
            throw new Error(`patched lock mismatch: dompurify=${dompurify}, nanoid=${nanoid}`);
          }
          NODE
          cp package-lock.json /tmp/audited-package-lock.json

      - name: Restore permanent CI and bilingual visual documentation contract
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f .github/security-lock-republish.trigger
          rm -f .github/workflows/one-time-direct-security-lock.yml
          node <<'NODE'
          const fs = require('node:fs');

          const workflowPath = '.github/workflows/ci.yml';
          let workflow = fs.readFileSync(workflowPath, 'utf8');
          const start = workflow.indexOf('  security-lock:\n');
          const end = workflow.indexOf('  validate:\n');
          if (start >= 0) {
            if (end <= start) throw new Error('unable to isolate temporary security-lock job');
            workflow = workflow.slice(0, start) + workflow.slice(end);
          }
          if (!workflow.includes('Install CJK fonts for deterministic visual evidence')) {
            const setupAnchor = `      - name: Set up Node.js
        uses: actions/setup-node@v4
`;
            if (!workflow.includes(setupAnchor)) throw new Error('permanent CI Node setup anchor missing');
            const fontStep = `      - name: Install CJK fonts for deterministic visual evidence
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          fc-match 'Noto Sans CJK SC'
          fc-list :lang=zh | grep -q .

`;
            workflow = workflow.replace(setupAnchor, fontStep + setupAnchor);
          }
          fs.writeFileSync(workflowPath, workflow, 'utf8');

          const readmePath = 'README.md';
          let readme = fs.readFileSync(readmePath, 'utf8');
          if (!readme.includes('Linux CJK font and screenshot acceptance')) {
            readme += `

## Linux 中文字体与截图验收 / Linux CJK font and screenshot acceptance

中文界面与科研图表只有在实际字体和真实绘制同时成立时才允许进入 README。永久 CI 安装并验证 Noto CJK，Chromium 随后检查字体可用性、ECharts \`finished\` 生命周期、非零数据点、Canvas 尺寸与非空彩色像素；仅存在 \`canvas\` 或 SVG 图标不再视为图表通过。

*Chinese UI and scientific figures are accepted only when a real CJK font and a completed non-blank plot are both observable. Permanent CI installs and verifies Noto CJK, then requires Chromium font evidence, the ECharts \`finished\` lifecycle, non-zero data points, a sized Canvas, and non-background chromatic pixels.*

Minimal Ubuntu/Debian runtime prerequisite:

\`\`\`bash
sudo apt-get update
sudo apt-get install -y --no-install-recommends fonts-noto-cjk
fc-cache -f
\`\`\`

Windows uses the governed fallback chain headed by Microsoft YaHei; Linux uses Noto Sans CJK SC/Noto Sans SC. README screenshots are regenerated from the same production build after these checks.
`;
          }
          fs.writeFileSync(readmePath, readme, 'utf8');
          NODE

      - name: Install exact lock and prove zero dependency findings
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          cmp package-lock.json /tmp/audited-package-lock.json
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high

      - name: Execute complete code, mathematical and browser acceptance
        shell: bash
        run: |
          set -euo pipefail
          npm run validate:ci
          cmp package-lock.json /tmp/audited-package-lock.json
          git diff --exit-code -- package.json

      - name: Replace README images with runtime-proven evidence
        shell: bash
        run: |
          set -euo pipefail
          for image in \
            ui-dashboard-zh-light.png \
            ui-dashboard-en-dark.png \
            ui-product-detail.png \
            ui-scientific-analytics.png \
            ui-phase2l-rheology-proxy.png \
            ui-phase2l-dependency-heatmap.png \
            ui-kmeans-profile-audit.png \
            ui-kmeans-device-calibration.png
          do
            test -s "artifacts/${image}"
            cp "artifacts/${image}" "docs/images/${image}"
          done
          node <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('artifacts/ui-smoke-manifest.json', 'utf8'));
          if (manifest.schemaVersion !== 2 || !manifest.cjkFont?.available) {
            throw new Error(`CJK runtime evidence is incomplete: ${JSON.stringify(manifest.cjkFont)}`);
          }
          if (!manifest.scientificCanvas?.ready || manifest.scientificCanvas.points <= 0) {
            throw new Error(`scientific Canvas evidence is incomplete: ${JSON.stringify(manifest.scientificCanvas)}`);
          }
          fs.writeFileSync(
            'docs/README_RUNTIME_VISUAL_EVIDENCE.json',
            `${JSON.stringify({
              schemaVersion: 'resindb-readme-runtime-visual-evidence-1.0.0',
              cjkFont: manifest.cjkFont,
              scientificCanvas: manifest.scientificCanvas,
              screenshots: manifest.screenshots,
              generatedAt: manifest.generatedAt,
            }, null, 2)}\n`,
            'utf8',
          );
          NODE
          npm run validate:docs
          npm run validate:i18n-visuals

      - name: Publish exact clean acceptance tree
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: finalize readable bilingual scientific visual delivery'
          git push origin HEAD:agent/final-acceptance-resindb-20260808
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Post exact acceptance result
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.publish.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          body="RESINDB_FINAL_ACCEPTANCE: PASS — exact source ${SOURCE_SHA}; zero production/full dependency findings; complete validate:ci; readable CJK font evidence; completed non-blank scientific Canvas; README screenshots regenerated from the production build; permanent read-only CI restored."
          jq -n --arg body "$body" '{body:$body}' > /tmp/comment.json
          curl -fsSL -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/35/comments" \
            -d @/tmp/comment.json
