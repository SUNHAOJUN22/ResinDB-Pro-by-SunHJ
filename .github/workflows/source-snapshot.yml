name: One-time source snapshot

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Create clean source archive
        shell: bash
        run: |
          tar --exclude=.git --exclude=node_modules --exclude=dist --exclude=coverage -czf /tmp/resindb-source.tar.gz .
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: resindb-source-snapshot
          path: /tmp/resindb-source.tar.gz
          retention-days: 2
