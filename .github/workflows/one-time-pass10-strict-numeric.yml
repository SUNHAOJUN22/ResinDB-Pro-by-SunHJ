name: One-time Pass 10 final delivery

on:
  issue_comment:
    types: [created]
  push:
    branches: [main]
    paths:
      - .github/pass10-delivery/execute-v5.trigger

permissions:
  contents: write

concurrency:
  group: pass10-final-delivery
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 34 &&
       github.event.comment.body == '/apply-pass10-final-e74fbe5f') ||
      github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out exact main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Verify transport and apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > /tmp/pass10-baseline-sha

          verify_blob() {
            local path="$1"
            local expected="$2"
            local actual
            actual=$(git hash-object "$path")
            test "$actual" = "$expected" || {
              echo "blob mismatch: ${path}: ${actual} != ${expected}" >&2
              exit 1
            }
          }

          verify_blob .github/pass10-final-delivery/chunk-00.txt f43ccaa007a9e8264349691115d3403fa94ff64c
          verify_blob .github/pass10-final-delivery/chunk-01.txt 8cbc6d85783d9aa877b9ec90bdfc187b6ab3b53e
          verify_blob .github/pass10-final-delivery/chunk-02.txt 9b8fe1519c74f4ac46825adeb2e8f9afe102b406
          verify_blob .github/pass10-final-delivery/chunk-03.txt 28dfbf328f5609e2dad0dfb34a469928ad070cf7
          verify_blob .github/pass10-final-delivery/chunk-04.txt 0f28c31308d69e543eefdbdd962f8415ecac58c6
          verify_blob .github/pass10-final-delivery/chunk-05.txt f62c5805c84ea4971ca7acb1d9b1ac575f5291d8
          verify_blob .github/pass10-final-delivery/chunk-06.txt ae14e7602f2b88bdd4b9d5e7d81b09611dca35f3

          cat .github/pass10-final-delivery/chunk-*.txt > /tmp/pass10-final.patch.gz.b64
          base64 --decode /tmp/pass10-final.patch.gz.b64 > /tmp/pass10-final.patch.gz
          echo 'e74fbe5f4d3300ede9a8a1b6468a04e0d699965d165a173ea2d10c5f9263f73d  /tmp/pass10-final.patch.gz' | sha256sum --check --strict
          gzip -dc /tmp/pass10-final.patch.gz > /tmp/pass10-final.patch
          git apply --check /tmp/pass10-final.patch
          git apply /tmp/pass10-final.patch

          rm -rf .github/pass10-delivery .github/pass10-final-delivery
          find .github/workflows -maxdepth 1 -type f -name 'one-time-pass10-*' -delete

          node scripts/validate-repository-docs.mjs
          node scripts/validate-source-hygiene.mjs
          node scripts/validate-data.mjs
          node scripts/validate-compute-surface.mjs
          node scripts/validate-scientific-ui.mjs

          node --experimental-strip-types --input-type=module <<'NODE'
          import {
            parseFiniteNumericComparison,
            parseFiniteNumericRange,
            parseFiniteNumericValue,
          } from './src/lib/numericParsing.ts'

          const checks = [
            [parseFiniteNumericValue('12abc'), null],
            [parseFiniteNumericValue('12 MPa'), null],
            [parseFiniteNumericValue('-1.25e2'), -125],
            [parseFiniteNumericValue('0x10'), null],
          ]
          for (const [actual, expected] of checks) {
            if (!Object.is(actual, expected)) throw new Error('strict numeric contract failed')
          }
          const scientific = parseFiniteNumericRange('1e-3-2e-3')
          if (!scientific || scientific.minimum !== 0.001 || scientific.maximum !== 0.002) throw new Error('scientific range contract failed')
          const negative = parseFiniteNumericRange('-2--1')
          if (!negative || negative.minimum !== -2 || negative.maximum !== -1) throw new Error('negative range contract failed')
          const comparison = parseFiniteNumericComparison('>=1.2e3')
          if (!comparison || comparison.operator !== '>=' || comparison.value !== 1200) throw new Error('comparison contract failed')
          NODE

          if grep -R -n -E '\b(Number\.)?parseFloat[[:space:]]*\(' src; then
            echo 'loose parseFloat remains in production source' >&2
            exit 1
          fi

      - name: Install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          cp package.json /tmp/pass10-package.json
          cp package-lock.json /tmp/pass10-package-lock.json
          restore_manifests() {
            cp /tmp/pass10-package.json package.json
            cp /tmp/pass10-package-lock.json package-lock.json
          }
          trap restore_manifests EXIT
          node scripts/prepare-ci-manifest.mjs
          for registry in https://registry.npmjs.org https://registry.npmmirror.com; do
            for attempt in 1 2 3; do
              if npm ci --registry="$registry"; then
                restore_manifests
                trap - EXIT
                exit 0
              fi
              sleep $((attempt * 10))
            done
          done
          exit 1

      - name: Validate code tests and build
        shell: bash
        run: |
          set -euo pipefail
          npm run validate:docs
          npm run validate:source
          npm run validate:data
          npm run validate:compute
          npm run validate:scientific-ui
          npm run lint
          npm run typecheck
          npx vitest run tests/unit/numericParsing.test.ts tests/unit/filterUtilsStrictNumeric.test.ts tests/unit/toolchainPortability.test.ts tests/science/formulaEngine.test.ts
          npm test
          npm run build

      - name: Commit formal production tree
        shell: bash
        run: |
          set -euo pipefail
          baseline=$(cat /tmp/pass10-baseline-sha)
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$baseline" || {
            echo 'main moved during validation; refusing to overwrite concurrent work' >&2
            exit 1
          }
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: enforce strict numeric parsing and delivery hygiene'
          git push origin HEAD:main
