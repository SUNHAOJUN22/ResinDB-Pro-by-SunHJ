name: Dependency lock repair candidate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-lock-repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out pull request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Generate and verify non-breaking npm audit lock repair
        shell: bash
        run: |
          set -euo pipefail
          cp package.json /tmp/package-before.json
          npm audit fix --package-lock-only --audit-level=high
          cmp -s package.json /tmp/package-before.json
          npm audit --audit-level=high --json > /tmp/audit-after.json
          test "$(jq '.metadata.vulnerabilities.total' /tmp/audit-after.json)" -eq 0
          git rm .github/workflows/audit-lock-candidate.yml
          git add package-lock.json
          git diff --check --cached
          git diff --cached --name-only | sort > /tmp/staged.txt
          printf '%s\n' '.github/workflows/audit-lock-candidate.yml' 'package-lock.json' | sort > /tmp/expected.txt
          cmp -s /tmp/staged.txt /tmp/expected.txt
      - name: Commit audited lock and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh audited development lockfile'
          git push origin HEAD:agent/material-statistics-polymer-physics-20260805
