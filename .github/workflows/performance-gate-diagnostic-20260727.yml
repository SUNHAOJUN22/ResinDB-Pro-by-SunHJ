name: Performance gate diagnostic 2026-07-27

on:
  push:
    branches: [main]
    paths:
      - .github/performance-gate-diagnostic-20260727.trigger

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Capture exact stage output
        shell: bash
        run: |
          set +e
          npm ci > /tmp/npm-ci.txt 2>&1; ci=$?
          if [ "$ci" -eq 0 ]; then npm run lint > /tmp/lint.txt 2>&1; lint=$?; else lint=99; fi
          if [ "$lint" -eq 0 ]; then npm run typecheck > /tmp/typecheck.txt 2>&1; typecheck=$?; else typecheck=99; fi
          set -e
          mkdir -p reports/performance-audit-20260727
          {
            echo "validated_commit=$GITHUB_SHA"
            echo "npm_ci_exit=$ci"
            echo "lint_exit=$lint"
            echo "typecheck_exit=$typecheck"
            echo
            echo '--- npm ci ---'; cat /tmp/npm-ci.txt
            echo; echo '--- lint ---'; cat /tmp/lint.txt 2>/dev/null || true
            echo; echo '--- typecheck ---'; cat /tmp/typecheck.txt 2>/dev/null || true
          } > reports/performance-audit-20260727/gate-diagnostic.txt
      - name: Publish and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/performance-gate-diagnostic-20260727.yml
          rm -f .github/performance-gate-diagnostic-20260727.trigger
          git config user.name "ResinDB Performance Diagnostic Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "perf: publish exact baseline gate diagnostic"
          git pull --rebase origin main
          git push origin HEAD:main
