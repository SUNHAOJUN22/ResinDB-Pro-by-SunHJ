name: UI UX Pro Max README visual redesign 2026-07-27

on:
  push:
    branches: [main]
    paths:
      - .github/uiux-readme-visual-redesign-20260727.trigger

permissions:
  contents: write

concurrency:
  group: resindb-uiux-readme-visual-redesign-20260727
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply design system and regenerate diagrams
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/generate-readme-visuals.py scripts/apply-uiux-readme-visual-system.py scripts/validate-repository-docs.py
          python3 scripts/apply-uiux-readme-visual-system.py
          rm -f .github/workflows/uiux-design-system-research-20260727.yml
          rm -f .github/uiux-design-system-research-20260727.trigger
          rm -f .github/workflows/uiux-readme-visual-redesign-20260727.yml
          rm -f .github/uiux-readme-visual-redesign-20260727.trigger
          rm -f scripts/apply-uiux-readme-visual-system.py
          python3 scripts/generate-readme-visuals.py
          python3 scripts/generate-readme-visuals.py --check
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          assets = sorted(Path('docs/assets').glob('resindb-*.svg'))
          if len(assets) != 14:
              raise SystemExit(f'expected 14 diagrams, found {len(assets)}')
          ns = '{http://www.w3.org/2000/svg}'
          for path in assets:
              root = ET.parse(path).getroot()
              if root.attrib.get('role') != 'img':
                  raise SystemExit(f'{path}: role=img missing')
              if root.attrib.get('data-design-system') != 'resindb-uiux-pro-max-v1':
                  raise SystemExit(f'{path}: UI UX Pro Max marker missing')
              if not root.attrib.get('aria-labelledby'):
                  raise SystemExit(f'{path}: aria-labelledby missing')
              if not root.findall(f'{ns}title') or not root.findall(f'{ns}desc') or not root.findall(f'{ns}metadata'):
                  raise SystemExit(f'{path}: accessible metadata incomplete')
          readme = Path('README.md').read_text(encoding='utf-8')
          for path in assets:
              relative = f'docs/assets/{path.name}'
              if readme.count(relative) != 1:
                  raise SystemExit(f'{relative}: README reference count is not one')
          if 'docs/README_VISUAL_DESIGN_SYSTEM.md' not in readme:
              raise SystemExit('README visual design-system link missing')
          print('validated 14 UI UX Pro Max deterministic README diagrams')
          PY
          git diff --check
      - name: Publish regenerated visual system
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ResinDB UIUX Visual Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: regenerate README visuals with UI UX Pro Max system"
          git pull --rebase origin main
          git push origin HEAD:main
