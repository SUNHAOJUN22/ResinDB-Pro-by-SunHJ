name: One-time similarity repair workflow correction

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-similarity-workflow-once.yml

permissions:
  contents: write

jobs:
  correct:
    if: github.actor == 'SUNHAOJUN22'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact correction base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - name: Correct test tolerance and ancestry guard
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/repair-similarity-tiebreak-once.yml')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '          fetch-depth: 3\n': '          fetch-depth: 0\n',
              '          test "$(git rev-parse HEAD^^)" = "51dfb8f98fb5944121c9ab58a6a31441e88d51fd"\n': (
                  '          git merge-base --is-ancestor '
                  '51dfb8f98fb5944121c9ab58a6a31441e88d51fd HEAD\n'
              ),
              '          test "$(git diff --name-only HEAD^^..HEAD | LC_ALL=C sort)" = ".github/workflows/repair-similarity-tiebreak-once.yml"\n': (
                  '          test "$(git diff --name-only '
                  '51dfb8f98fb5944121c9ab58a6a31441e88d51fd..HEAD | LC_ALL=C sort)" '
                  '= ".github/workflows/repair-similarity-tiebreak-once.yml"\n'
              ),
              "              expect(firstEdges[0]).toMatchObject({ source: 'a', target: 'b', value: 1 });\n": (
                  "              expect(firstEdges[0]).toMatchObject({ source: 'a', target: 'b' });\n"
                  "              expect(firstEdges[0].value as number).toBeCloseTo(1, 12);\n"
              ),
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'unexpected repair workflow anchor count: {old!r} -> {text.count(old)}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8', newline='\n')
      - name: Remove correction workflow and publish
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/repair-similarity-workflow-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/repair-similarity-tiebreak-once.yml
          git commit -m "fix(workflow): use numeric tolerance in similarity regression"
          git push origin HEAD:main
