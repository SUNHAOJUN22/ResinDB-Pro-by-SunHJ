name: One-time ResinDB final acceptance controller

on:
  push:
    branches: [main]
    paths:
      - .github/resindb-finalizer.trigger

permissions:
  contents: write

concurrency:
  group: resindb-final-acceptance-controller
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out acceptance branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/final-acceptance-resindb-20260808
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Materialize permanent bilingual visual contracts
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          let readme = fs.readFileSync('README.md', 'utf8');
          const anchor = '### 2.4 真实界面证据 / Real UI evidence';
          const section = `### 2.4 双语科学图表完整性 / Bilingual scientific visual integrity

语言、字体、数值与绘图生命周期属于同一个显示合同。中文和英文模式使用受控 locale alias，界面文本执行 Unicode NFC 归一化；替换字符、常见 mojibake 和不可见控制字符不得进入交付结果。\`ScientificEChart\` 对零尺寸容器、字体加载、\`ResizeObserver\` 缺失和动态主题/语言切换提供显式恢复路径。

*Language, typography, numerics, and the chart lifecycle form one display contract. Governed locale aliases, Unicode normalization, CJK-safe font fallbacks, resilient resize behavior, and exact-tree evidence prevent broken glyphs or invisible mathematical figures from becoming silent failures.*

![Bilingual scientific visual integrity](docs/images/ai-i18n-scientific-visual-integrity.svg)

验收命令 / Acceptance command:

\`\`\`bash
npm run validate:i18n-visuals
\`\`\`

该门禁检查翻译键一致性、关键中英文语义、UTF-8、乱码特征、README 图链接、SVG 的 \`viewBox\`、\`title\`、\`desc\`、CJK 字体回退和主动脚本禁用。

`;
          if (!readme.includes('ai-i18n-scientific-visual-integrity.svg')) {
            if (!readme.includes(anchor)) throw new Error('README visual anchor missing');
            readme = readme.replace(anchor, `${section}### 2.5 真实界面证据 / Real UI evidence`);
          }
          fs.writeFileSync('README.md', readme, 'utf8');

          let docs = fs.readFileSync('scripts/validate-repository-docs.mjs', 'utf8');
          if (!docs.includes("'ai-i18n-scientific-visual-integrity.svg'")) {
            docs = docs.replace(
              "  'ai-delivery-validation.svg',\n].sort();",
              "  'ai-delivery-validation.svg',\n  'ai-i18n-scientific-visual-integrity.svg',\n].sort();",
            );
          }
          if (!docs.includes("'validate:i18n-visuals':")) {
            docs = docs.replace(
              "  'validate:docs': 'node scripts/validate-repository-docs.mjs',",
              "  'validate:docs': 'node scripts/validate-repository-docs.mjs',\n  'validate:i18n-visuals': 'node scripts/validate-i18n-visuals.mjs',",
            );
          }
          fs.writeFileSync('scripts/validate-repository-docs.mjs', docs, 'utf8');

          const workflowPath = '.github/workflows/ci.yml';
          let workflow = fs.readFileSync(workflowPath, 'utf8');
          const finalizeStart = workflow.indexOf('  finalize:\n');
          const validateStart = workflow.indexOf('  validate:\n');
          if (finalizeStart >= 0) {
            if (validateStart <= finalizeStart) throw new Error('permanent validate job boundary missing');
            workflow = workflow.slice(0, finalizeStart) + workflow.slice(validateStart);
          }
          workflow = workflow.replace('permissions:\n  contents: write', 'permissions:\n  contents: read');
          if (!workflow.includes('Bilingual text and visual integrity')) {
            workflow = workflow.replace(
              '      - name: Documentation and deterministic scientific visuals\n        run: npm run validate:docs\n',
              '      - name: Documentation and deterministic scientific visuals\n        run: npm run validate:docs\n      - name: Bilingual text and visual integrity\n        run: npm run validate:i18n-visuals\n',
            );
          }
          if (!workflow.includes("            'i18n-visuals',")) {
            workflow = workflow.replace(
              "            'docs',\n            'source-hygiene',",
              "            'docs',\n            'i18n-visuals',\n            'source-hygiene',",
            );
          }
          fs.writeFileSync(workflowPath, workflow, 'utf8');
          NODE
          rm -f .github/workflows/finalize-resindb-acceptance-once.yml
      - name: Install exact dependencies and run focused qualification
        run: |
          npm ci
          npm run validate:docs
          npm run validate:i18n-visuals
          npm run validate:scientific-ui
          npm run lint
          npm run typecheck
          npm run test:unit
      - name: Publish finalized acceptance branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: finalize Unicode-safe bilingual scientific visuals'
          git push origin HEAD:agent/final-acceptance-resindb-20260808
      - name: Remove one-time controller from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git switch --force-create main origin/main
          git rm .github/workflows/one-time-resindb-finalizer.yml .github/resindb-finalizer.trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove one-time ResinDB finalizer'
          git push origin HEAD:main
