name: One-shot ResinDB closure qualification

on:
  push:
    branches: [closure/20260828-code-readme]

permissions:
  contents: write

concurrency:
  group: resindb-closure-20260828
  cancel-in-progress: false

jobs:
  apply-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: closure/20260828-code-readme
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Apply reviewed non-workflow patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode > /tmp/closure.patch.gz <<'PATCH'
          
          PATCH
          printf '%s  %s\n' 3385b5f568c663b24cb492103ebd5829bc99e95005d003a0c0ae04b532231d18 /tmp/closure.patch.gz | sha256sum --check
          gzip -dc /tmp/closure.patch.gz > /tmp/closure.patch
          git apply --index --binary /tmp/closure.patch
      - name: Qualify changed source and README
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run validate:docs
          npm run validate:source
          npm run lint
          npm run typecheck
          npm test
          git diff --check
      - name: Commit qualified source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(closure): remove duplicate qualification paths and clarify boundaries'
          git push origin HEAD:closure/20260828-code-readme
