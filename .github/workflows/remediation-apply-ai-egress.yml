name: One-shot governed AI egress convergence

on:
  push:
    branches:
      - remediation/nanoid-3.3.18
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resindb-ai-egress-convergence
  cancel-in-progress: false

jobs:
  apply-and-qualify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CI: "true"
    steps:
      - name: Check out exact Draft PR branch
        uses: actions/checkout@v4
        with:
          ref: remediation/nanoid-3.3.18
          fetch-depth: 0

      - name: Set up governed Node runtime
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Reconstruct and apply branch-only security patch
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          chunks=(.github/remediation/resindb-ai-egress.patch.b64.*)
          test "${#chunks[@]}" -gt 0
          cat "${chunks[@]}" | tr -d '\r\n' > /tmp/resindb-ai-egress.patch.gz.b64
          base64 --decode /tmp/resindb-ai-egress.patch.gz.b64 | gzip --decompress > /tmp/resindb-ai-egress.patch
          test -s /tmp/resindb-ai-egress.patch
          git apply --check /tmp/resindb-ai-egress.patch
          git apply /tmp/resindb-ai-egress.patch
          rm -rf .github/remediation
          rm .github/workflows/remediation-apply-ai-egress.yml
          git add -A

      - name: Install exact dependencies
        run: npm ci

      - name: Run available deterministic source gates
        shell: bash
        run: |
          set -euo pipefail
          has_script() {
            node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts['$1'] ? 0 : 1)"
          }
          for script in lint typecheck test build; do
            if has_script "$script"; then
              npm run "$script"
            fi
          done
          git diff --check

      - name: Verify governed runtime invariants
        shell: bash
        run: |
          set -euo pipefail
          rg -n --fixed-strings '/api/ai/proxy' src tests scripts
          if rg -n --glob '*.{ts,tsx,js,mjs,cjs}' '(localStorage|sessionStorage).*(api.?key|token|secret)|(api.?key|token|secret).*(localStorage|sessionStorage)' src; then
            echo 'browser secret persistence remains' >&2
            exit 1
          fi
          if rg -n --glob '*.{ts,tsx,js,mjs,cjs}' 'https?://[^"'"' ]+.*(openai|anthropic|gemini|deepseek)|(openai|anthropic|gemini|deepseek).*https?://' src; then
            echo 'direct external model endpoint remains in browser source' >&2
            exit 1
          fi

      - name: Commit reviewable source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ai): enforce same-origin governed egress"
          git push origin HEAD:remediation/nanoid-3.3.18
