name: Apply skill-native V15
on:
  push:
    branches: [main]
    paths:
      - scripts/apply_skill_native_v15.py
      - .github/workflows/apply-skill-native-v15.yml
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: resindb-skill-native-v15
  cancel-in-progress: false
jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - run: python scripts/apply_skill_native_v15.py
      - run: npm ci
      - run: node scripts/validate-skill-v15.mjs .
      - run: npx vitest run src/lib/__tests__/scientificContractsV15.test.ts --pool=forks --maxWorkers=1
      - run: npm run typecheck
      - shell: bash
        run: rm -f scripts/apply_skill_native_v15.py .github/workflows/apply-skill-native-v15.yml
      - name: Commit verified result to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'feat: finalize ResinDB skill-native V15'
          git push origin HEAD:main
