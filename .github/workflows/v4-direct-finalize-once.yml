name: V4 strict direct finalizer once

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: v4-strict-direct-finalize-once
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install deterministic CJK fonts
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk fonts-noto-core
          fc-cache -f
          fc-list :lang=zh | grep -q .
      - name: Install exact dependencies without manifest drift
        shell: bash
        run: |
          set -euo pipefail
          cp package.json /tmp/resindb-package-exact.json
          cp package-lock.json /tmp/resindb-package-lock-exact.json
          restore_manifests() {
            cp /tmp/resindb-package-exact.json package.json
            cp /tmp/resindb-package-lock-exact.json package-lock.json
          }
          trap restore_manifests EXIT
          node scripts/prepare-ci-manifest.mjs
          npm ci
          restore_manifests
          trap - EXIT
      - name: Reuse reviewed strict builder
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          controller = Path('.github/workflows/v4-strict-hardening-once.yml')
          text = controller.read_text(encoding='utf-8')
          old_block = """          refresh_text = replace_once(
              refresh_text,
              old_publish,
              new_publish,
              'exact-parent README publication',
          )
"""
          new_block = """          if old_publish in refresh_text:
              refresh_text = refresh_text.replace(old_publish, new_publish, 1)
          elif new_publish not in refresh_text:
              raise SystemExit('exact-parent README publication contract is missing')
"""
          if old_block in text:
              text = text.replace(old_block, new_block, 1)
          elif new_block not in text:
              raise SystemExit('exact-parent builder patch anchor missing')
          controller.write_text(text, encoding='utf-8', newline='\n')

          text = controller.read_text(encoding='utf-8')
          anchor = '      - name: Build normalized controller-free strict candidate\n'
          step_start = text.index(anchor)
          run_marker = '        run: |\n'
          script_start = text.index(run_marker, step_start) + len(run_marker)
          script_end = text.index('\n      - name:', script_start)
          physical = text[script_start:script_end].splitlines()
          logical = [line[10:] if line.startswith('          ') else line for line in physical]
          Path('/tmp/resindb-v4-build.sh').write_text(
              '\n'.join(logical) + '\n', encoding='utf-8', newline='\n'
          )

          refresh = Path('.github/workflows/current-main-readme-refresh.yml')
          if not refresh.exists():
              slash = chr(0x5C)
              tokens = [
                  slash + slash + 'uFFFD',
                  chr(0x00C3),
                  chr(0x00C2),
                  chr(0x00E2) + chr(0x20AC),
                  chr(0x951F) + chr(0x65A4) + chr(0x62F7),
              ]
              legacy = (
                  '          const legacy = "const BAD = [\''
                  + "', '".join(tokens)
                  + '\'];";\n'
              )
              publication = (
                  '          git fetch origin main\n'
                  '          git rebase origin/main\n'
                  '          git push origin HEAD:main\n'
              )
              refresh.write_text(
                  legacy + publication, encoding='utf-8', newline='\n'
              )
          PY
          bash /tmp/resindb-v4-build.sh
      - name: Remove all migration and trigger scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/v4-resindb-export-trigger \
            .github/v4-direct-finalize-trigger \
            .github/workflows/v4-candidate-export-once.yml \
            .github/workflows/current-main-readme-refresh.yml \
            .github/workflows/v4-strict-hardening-once.yml \
            .github/workflows/v4-fail-closed-hardening-once.yml
          git rm -f .github/workflows/v4-direct-finalize-once.yml
          git add -A
          git commit --amend --no-edit
          git diff --check
      - name: Run complete permanent product qualification
        shell: bash
        run: |
          set -euo pipefail
          node scripts/refresh-current-main-readme.mjs --check
          npm run validate:ci
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('reports/UNICODE_INTEGRITY_REPORT.json', 'utf8'));
          if (report.verdict !== 'PASS') throw new Error(JSON.stringify(report));
          const workflow = fs.readFileSync('.github/workflows/ci.yml', 'utf8');
          for (const token of ['continue-on-error:', '|| true', 'actions/setup-node@v4', 'set +e']) {
            if (workflow.includes(token)) throw new Error(`forbidden permanent-CI construct remains: ${token}`);
          }
          NODE
          git diff --exit-code
          git diff --check
      - name: Prove sole branch and exact-parent publish
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote --heads origin > /tmp/branches.txt
          python - <<'PY'
          from pathlib import Path
          refs = [line.split()[1] for line in Path('/tmp/branches.txt').read_text().splitlines() if line.strip()]
          if refs != ['refs/heads/main']:
              raise SystemExit(f'unexpected remote branches: {refs}')
          PY
          remote_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote_sha" = "$GITHUB_SHA"
          git push origin HEAD:main
