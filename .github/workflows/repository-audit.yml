name: One-time repository audit

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Inventory repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          git ls-files > audit/tracked-files.txt
          find . -path './.git' -prune -o -type f -printf '%s\t%p\n' | sort -nr > audit/files-by-size.tsv
          find . -path './.git' -prune -o -type d -print | sort > audit/directories.txt
          du -sh . > audit/repository-size.txt
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, os, re
          from collections import defaultdict, deque
          from pathlib import Path

          root = Path('.').resolve()
          audit = root / 'audit'
          tracked = [Path(x) for x in (audit / 'tracked-files.txt').read_text().splitlines() if x]
          image_exts = {'.png', '.jpg', '.jpeg', '.gif', '.webp', '.bmp', '.svg', '.ico'}
          text_exts = {'.ts','.tsx','.js','.jsx','.cjs','.mjs','.json','.md','.html','.css','.scss','.yml','.yaml','.txt','.sh','.rules','.example'}
          text = {}
          for rel in tracked:
              path = root / rel
              if not path.is_file() or path.stat().st_size > 3_000_000:
                  continue
              if path.suffix.lower() in text_exts or path.name in {'.gitignore','.env.example'}:
                  try: text[rel] = path.read_text(encoding='utf-8')
                  except UnicodeDecodeError: pass

          images = []
          for rel in tracked:
              if rel.suffix.lower() not in image_exts: continue
              refs = [p.as_posix() for p, body in text.items() if p != rel and (rel.as_posix() in body or rel.name in body)]
              images.append({'path': rel.as_posix(), 'bytes': (root/rel).stat().st_size, 'references': sorted(refs)})
          (audit/'image-reference-report.json').write_text(json.dumps(images, ensure_ascii=False, indent=2), encoding='utf-8')
          (audit/'unreferenced-images.txt').write_text(''.join(f"{x['bytes']}\t{x['path']}\n" for x in images if not x['references']), encoding='utf-8')

          hashes = defaultdict(list)
          for rel in tracked:
              path = root / rel
              if path.is_file(): hashes[hashlib.sha256(path.read_bytes()).hexdigest()].append(rel.as_posix())
          duplicates = sorted((v for v in hashes.values() if len(v) > 1), key=lambda v: (-len(v), v))
          (audit/'duplicate-files.json').write_text(json.dumps(duplicates, ensure_ascii=False, indent=2), encoding='utf-8')

          suspicious = []
          for rel in tracked:
              lower = rel.as_posix().lower(); reasons = []
              if rel.suffix.lower() in {'.tgz','.zip','.tar','.gz','.7z','.rar'}: reasons.append('archive committed to source')
              if 'prompt_history' in lower or 'migrated_prompt' in lower: reasons.append('prompt or migration history')
              if rel.suffix.lower() == '.md' and lower.startswith('src/'): reasons.append('documentation misplaced under src')
              if any(part.lower() in {'screenshot','screenshots'} for part in rel.parts): reasons.append('screenshot directory')
              if reasons: suspicious.append({'path': rel.as_posix(), 'bytes': (root/rel).stat().st_size, 'reasons': reasons})
          (audit/'suspicious-files.json').write_text(json.dumps(suspicious, ensure_ascii=False, indent=2), encoding='utf-8')

          source = {p for p in tracked if p.parts and p.parts[0] == 'src' and p.suffix in {'.ts','.tsx'}}
          import_re = re.compile(r"(?:from\s+|import\s*\(|import\s+|export\s+[^;]*?from\s+)[\"']([^\"']+)[\"']")
          worker_re = re.compile(r"new\s+URL\(\s*[\"']([^\"']+)[\"']\s*,\s*import\.meta\.url")
          def resolve(spec, current):
              if spec.startswith('@/'): base = Path('src')/spec[2:]
              elif spec.startswith('.'): base = current.parent/spec
              else: return None
              candidates = [base] if base.suffix else [Path(str(base)+e) for e in ('.ts','.tsx','.js','.jsx')] + [base/n for n in ('index.ts','index.tsx','index.js','index.jsx')]
              for c in candidates:
                  c = Path(os.path.normpath(c.as_posix()))
                  if c in source: return c
              return None
          graph = defaultdict(set)
          for rel in source:
              body = text.get(rel, '')
              for spec in import_re.findall(body) + worker_re.findall(body):
                  target = resolve(spec, rel)
                  if target: graph[rel].add(target)
          reachable = set(); queue = deque([Path('src/index.tsx')])
          while queue:
              cur = queue.popleft()
              if cur in reachable or cur not in source: continue
              reachable.add(cur); queue.extend(graph[cur])
          orphans = sorted(p.as_posix() for p in source if p not in reachable and not p.name.endswith('.d.ts') and '__tests__' not in p.parts)
          (audit/'source-reachability.json').write_text(json.dumps({'source_file_count':len(source),'reachable_count':len(reachable),'likely_orphans':orphans}, ensure_ascii=False, indent=2), encoding='utf-8')

          summary = {
              'tracked_file_count': len(tracked),
              'root_files': sorted(p.as_posix() for p in tracked if len(p.parts)==1),
              'markdown_files': sorted(p.as_posix() for p in tracked if p.suffix.lower()=='.md'),
              'image_count': len(images),
              'unreferenced_image_count': sum(not x['references'] for x in images),
              'duplicate_group_count': len(duplicates),
              'suspicious_file_count': len(suspicious),
              'source_file_count': len(source),
              'likely_orphan_source_count': len(orphans),
          }
          (audit/'summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Capture code-smell indicators
        shell: bash
        run: |
          set +e
          git grep -nE 'TODO|FIXME|HACK|XXX' -- ':!package-lock.json' > audit/todos.txt
          git grep -nE 'console\.(log|warn|error|debug)' -- 'src/**' > audit/console-usage.txt
          git grep -nE '\bany\b' -- 'src/**/*.ts' 'src/**/*.tsx' > audit/explicit-any.txt
          git grep -nE 'Math\.random\(|Date\.now\(' -- 'src/**' > audit/nondeterminism.txt
          git grep -nE 'localStorage|sessionStorage' -- 'src/**' > audit/browser-storage.txt
          exit 0

      - name: Install and run quality gates
        shell: bash
        run: |
          set +e
          : > audit/quality-status.tsv
          run_check() { name="$1"; shift; "$@" > "audit/${name}.log" 2>&1; printf '%s\t%s\n' "$name" "$?" >> audit/quality-status.tsv; }
          run_check npm-ci npm ci
          if grep -q $'npm-ci\t0' audit/quality-status.tsv; then
            run_check lint npm run lint
            run_check typecheck npm run typecheck
            run_check test npm run test
            run_check build npm run build
            run_check smoke npm run smoke
            npm audit --omit=dev --json > audit/npm-audit.json 2> audit/npm-audit.stderr
            echo $? > audit/npm-audit.exit
          fi
          exit 0

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: repository-audit-report
          path: audit
          retention-days: 3
