name: Apply verified ResinDB v3.1.0 patch

on:
  push:
    branches: [main]
    paths:
      - .github/apply-v310-patch.trigger

permissions:
  contents: write

concurrency:
  group: apply-resindb-v310
  cancel-in-progress: false

jobs:
  apply:
    name: Verify and apply v3.1.0 to main
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify payload and apply
        shell: bash
        env:
          PAYLOAD_SHA256: ec61784122da0d984532c3b71e7d57a67d167cc17a8e4d70860797af4d771cd6
        run: |
          set -euo pipefail
          cat .github/.resindb-v310-patch/part* | base64 -d > /tmp/resindb-v310.patch.gz
          printf '%s  %s\n' "${PAYLOAD_SHA256}" /tmp/resindb-v310.patch.gz | sha256sum -c -
          gzip -dc /tmp/resindb-v310.patch.gz > /tmp/resindb-v310.patch

          exclusions=(
            --exclude=.github/source-export-trigger.txt
            --exclude=.github/workflows/source-export.yml
            --exclude=reports/release-baseline-v3.1.0.json
          )
          git apply --check --binary "${exclusions[@]}" /tmp/resindb-v310.patch
          git apply --binary "${exclusions[@]}" /tmp/resindb-v310.patch

          cat > reports/release-baseline-v3.1.0.json <<'JSON'
          {
            "schemaVersion": "1.1.0",
            "release": "3.1.0",
            "generatedAt": "2026-07-25T05:41:44.179720+00:00",
            "scope": "validated local release candidate; final acceptance requires matching GitHub Actions success",
            "branchPolicy": {
              "requiredBranches": ["main"],
              "maximumBranchCount": 1
            },
            "dataArchitecture": {
              "runtimeAssets": 10,
              "resinDocuments": 9,
              "totalExternalBytes": 53618,
              "categories": 97,
              "products": 11,
              "networkNodes": 26,
              "frontendSentinelMatches": 0
            },
            "tests": {
              "total": 79,
              "unit": 14,
              "scientific": 65,
              "failed": 0
            },
            "coveragePercent": {
              "lines": 71.54,
              "statements": 70.07,
              "branches": 44.72,
              "functions": 70.82
            },
            "build": {
              "status": "passed",
              "distFiles": 99,
              "distBytes": 4146313,
              "entryBytes": 359294,
              "entryGzipBytes": 115018,
              "entryBudgetGzipBytes": 350000,
              "echartsBytes": 772309,
              "echartsGzipBytes": 259665,
              "echartsBudgetBytes": 800000,
              "modulePreloads": 0
            },
            "uiEvidence": {
              "status": "passed",
              "screenshots": [
                "ui-dashboard-zh-light.png",
                "ui-empty-state.png",
                "ui-product-detail.png",
                "ui-scientific-analytics.png",
                "ui-dependency-map.png",
                "ui-dashboard-en-dark.png",
                "ui-mobile-dashboard.png"
              ],
              "recordCount": 13,
              "preferences": {
                "language": "en",
                "theme": "dark",
                "colorTheme": "emerald",
                "htmlLanguage": "en",
                "dark": true
              }
            },
            "acceptance": "Final acceptance requires the matching GitHub Actions CI workflow and resindb/ci-evidence status to succeed."
          }
          JSON

          if [ -f .resindb-delete-manifest.txt ]; then
            while IFS= read -r path; do
              [ -z "${path}" ] && continue
              rm -rf -- "${path}"
            done < .resindb-delete-manifest.txt
          fi

          rm -rf .github/.resindb-v310-patch .github/.resindb-main-update .github/.resindb-v310
          rm -f .github/apply-v310-patch.trigger .github/workflows/apply-v310-patch.yml
          rm -f .resindb-delete-manifest.txt
          rm -f .github/source-export-trigger.txt .github/dependency-export-trigger.txt
          rm -f .github/apply-resindb-main-update.trigger .github/apply-resindb-main-update-retry.trigger
          rm -f .github/workflows/source-snapshot-export.yml .github/workflows/dependency-snapshot-export.yml
          rm -f .github/workflows/apply-resindb-main-update.yml .github/workflows/apply-resindb-main-update-retry.yml
          rm -f reports/source-export.json reports/source-export-run.json reports/source-export-started.json
          rm -f reports/dependency-export.json reports/dependency-export-run.json reports/dependency-export-started.json

          python - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path

          receipt = {
              "schemaVersion": 1,
              "release": "3.1.0",
              "branch": "main",
              "triggerCommit": os.environ["GITHUB_SHA"],
              "payloadSha256": os.environ["PAYLOAD_SHA256"],
              "appliedAt": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "validation": "Local full validation passed; GitHub Actions CI is required for final acceptance.",
          }
          Path("reports/main-update-receipt.json").write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          git config user.name "ResinDB Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: release ResinDB Pro v3.1.0 with external data and performance gates"
          git push origin HEAD:main
