name: Current main qualification once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/current-main-qualification-once.yml

permissions:
  contents: write
  issues: write

concurrency:
  group: resindb-current-main-qualification-once
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install deterministic CJK fonts
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk fonts-noto-core
          fc-cache -f
          fc-list :lang=zh | grep -q .
      - name: Remove qualifier and obsolete migration debris from candidate tree
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/current-main-qualification-once.yml
          git rm -r --ignore-unmatch .github/pass10-delivery .github/pass10-final-delivery
          git rm --ignore-unmatch \
            scripts/.phase2l-payload-* \
            scripts/phase2l-apply-final.mjs \
            scripts/ui-phase2l-scientific-smoke-v2.mjs
          git diff --cached --check
      - name: Install exact dependencies without manifest drift
        shell: bash
        run: |
          set -euo pipefail
          cp package.json /tmp/resindb-package-exact.json
          cp package-lock.json /tmp/resindb-package-lock-exact.json
          restore_manifests() {
            cp /tmp/resindb-package-exact.json package.json
            cp /tmp/resindb-package-lock-exact.json package-lock.json
          }
          trap restore_manifests EXIT
          node scripts/prepare-ci-manifest.mjs
          installed=0
          for registry in https://registry.npmjs.org https://registry.npmmirror.com; do
            for attempt in 1 2 3; do
              if npm ci --registry="$registry"; then
                installed=1
                break 2
              fi
              sleep $((attempt * 10))
            done
          done
          test "$installed" -eq 1
          restore_manifests
          trap - EXIT
      - name: Normalize text and build strict Unicode evidence
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-repository-unicode.mjs --normalize
          node scripts/validate-repository-unicode.mjs --check
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('reports/UNICODE_INTEGRITY_REPORT.json', 'utf8'));
          if (report.verdict !== 'PASS' || report.scannedTextFiles <= 0 || report.failures.length !== 0) {
            throw new Error(JSON.stringify(report));
          }
          const ci = fs.readFileSync('.github/workflows/ci.yml', 'utf8');
          for (const token of ['continue-on-error:', 'actions/setup-node@v4', 'set +e', '|| true']) {
            if (ci.includes(token)) throw new Error(`forbidden permanent CI construct: ${token}`);
          }
          NODE
          git add -A
          git diff --cached --check
          git status --porcelain=v1 > /tmp/resindb-candidate-before.txt
      - name: README and bilingual visual contracts
        run: |
          node scripts/refresh-current-main-readme.mjs --check
          npm run validate:docs
      - name: Repository Unicode audit
        run: npm run validate:unicode
      - name: Source hygiene
        run: npm run validate:source
      - name: Scientific UI semantics
        run: npm run validate:scientific-ui
      - name: Compute surface
        run: npm run validate:compute
      - name: Governed data
        run: npm run validate:data
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Complete regression tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/resindb-regression.log
      - name: Report regression diagnostic
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tail -n 120 /tmp/resindb-regression.log > /tmp/resindb-regression-tail.log
          body=$(printf 'REGRESSION_DIAGNOSTIC run=%s\n```text\n%s\n```' "$GITHUB_RUN_ID" "$(cat /tmp/resindb-regression-tail.log)")
          gh issue comment 38 --body "$body"
      - name: Production build
        run: npm run build
      - name: HTTP smoke
        run: npm run smoke
      - name: K-Means backend benchmark smoke
        run: npm run benchmark:kmeans:smoke
      - name: Isolated unit tests
        run: npm run test:unit
      - name: Isolated science and worker tests
        run: npm run test:science
      - name: Whole-production-source coverage
        run: npm run test:coverage
      - name: Chromium bilingual nonblank UI suite
        run: npm run test:ui
      - name: Production dependency audit
        run: npm run audit:prod
      - name: Complete dependency audit
        run: npm run audit:all
      - name: Recheck Unicode and candidate immutability
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-repository-unicode.mjs --check
          git diff --check
          git add -A
          git status --porcelain=v1 > /tmp/resindb-candidate-after.txt
          diff -u /tmp/resindb-candidate-before.txt /tmp/resindb-candidate-after.txt
      - name: Prove sole remote main branch and clean workflow inventory
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote --heads origin > /tmp/resindb-branches.txt
          python - <<'PY'
          from pathlib import Path
          refs = [line.split()[1] for line in Path('/tmp/resindb-branches.txt').read_text().splitlines() if line.strip()]
          if refs != ['refs/heads/main']:
              raise SystemExit(f'unexpected remote branches: {refs}')
          PY
          test -f .github/workflows/ci.yml
          test "$(find .github/workflows -maxdepth 1 -type f -name '*.yml' -print | wc -l | tr -d ' ')" -eq 1
      - name: Publish exact qualified clean tree
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          parent="$GITHUB_SHA"
          remote_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote_sha" = "$parent"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(repo): normalize text and retire migration scaffolding'
          qualified="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$parent"
          git push origin HEAD:main
          echo "qualified=$qualified" >> "$GITHUB_OUTPUT"
      - name: Record machine result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ job.status }}
          QUALIFIED: ${{ steps.publish.outputs.qualified }}
        shell: bash
        run: |
          gh issue comment 38 --body "CURRENT_MAIN_EXACT_QUALIFICATION outcome=${OUTCOME} tested_parent=${GITHUB_SHA} qualified=${QUALIFIED:-UNPUBLISHED} run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} unicode=normalized-mechanical+semantic-fail-closed migration_debris=removed docs=strict scientific_ui=strict compute=strict data=strict tests=full coverage=blocking chromium=nonblank audit=blocking workflow_inventory=ci-only branch=main-only"
