name: One-time ResinDB security observer

on:
  workflow_run:
    workflows: ["One-time ResinDB security lock finalizer"]
    types: [completed]

permissions:
  actions: read
  contents: write
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Post exact finalizer result
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          STATUS: ${{ github.event.workflow_run.status }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          jobs_json=$(curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100")
          jobs=$(jq -r '[.jobs[] | "- job `\(.name)`: `\(.status)` / `\(.conclusion // "none")` (id `\(.id)`)" ] | join("\n")' <<<"$jobs_json")
          body=$(cat <<EOF
          RESINDB_SECURITY_LOCK_RUN
          run_id: ${RUN_ID}
          status: ${STATUS}
          conclusion: ${CONCLUSION}
          head_sha: ${HEAD_SHA}
          ${jobs}
          EOF
          )
          jq -n --arg body "$body" '{body:$body}' > /tmp/comment.json
          curl -fsSL -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/35/comments" \
            -d @/tmp/comment.json
      - name: Remove observer from main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: true
      - name: Delete observer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-time-resindb-security-observer.yml
          git commit -m 'chore: remove one-time ResinDB security observer'
          git push origin HEAD:main
