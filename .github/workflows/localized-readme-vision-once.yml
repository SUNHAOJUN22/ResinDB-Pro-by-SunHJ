name: One-time localized README vision finalizer

on:
  push:
    branches: [main]
    paths:
      - .github/localized-readme-vision.py

permissions:
  contents: write

concurrency:
  group: localized-readme-vision-resindb
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Generate localized READMEs, diagrams and persistent visual audits
        run: |
          python .github/localized-readme-vision.py
          npm ci
          npm run validate:i18n-visuals
          npm run validate:scientific-ui
          npm run typecheck
          git diff --check
      - name: Remove one-time transport and publish
        run: |
          rm -f .github/localized-readme-vision.py
          rm -f .github/workflows/localized-readme-vision-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs: add localized Chinese and English project vision'
          git push origin HEAD:main
