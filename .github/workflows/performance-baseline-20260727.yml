name: Performance baseline 2026-07-27

on:
  push:
    branches: [main]
    paths:
      - .github/performance-baseline-20260727.trigger

permissions:
  contents: write

concurrency:
  group: resindb-performance-baseline-20260727
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Collect baseline
        id: baseline
        continue-on-error: true
        shell: bash
        run: |
          set +e
          bash scripts/phase0-performance-baseline.sh > /tmp/performance-baseline.log 2>&1
          code=$?
          set -e
          mkdir -p reports/performance-audit-20260727
          cp /tmp/performance-baseline.log reports/performance-audit-20260727/workflow.log
          printf '%s\n' "$code" > reports/performance-audit-20260727/workflow.exit
          cat /tmp/performance-baseline.log
          exit "$code"
      - name: Publish evidence and self-clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/performance-baseline-20260727.yml
          rm -f .github/performance-baseline-20260727.trigger
          rm -f scripts/phase0-performance-baseline.sh
          git config user.name "ResinDB Performance Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          if [ "${{ steps.baseline.outcome }}" = "success" ]; then
            git commit -m "perf: restore lint baseline and capture performance evidence"
          else
            git commit -m "perf: publish phase-zero baseline failure evidence"
          fi
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Enforce baseline result
        if: always()
        run: test "${{ steps.baseline.outcome }}" = "success"
