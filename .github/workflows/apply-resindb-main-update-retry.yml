name: Apply ResinDB main update retry

on:
  push:
    branches: [main]
    paths:
      - .github/apply-resindb-main-update-retry.trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resindb-apply-main-update
  cancel-in-progress: false

jobs:
  apply:
    name: Verify and apply update to main
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify and apply payload
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(.github/.resindb-main-update/part*)
          if [ "${#parts[@]}" -ne 10 ]; then
            echo "Expected 10 payload parts, found ${#parts[@]}" >&2
            printf '%s\n' "${parts[@]}" >&2
            exit 1
          fi
          cat "${parts[@]}" > /tmp/resindb-main-update.b64
          base64 --decode /tmp/resindb-main-update.b64 > /tmp/resindb-main-update.tgz
          echo "0b105560d52579362d32f04e5e42139728926482e32a29edaf060b718c3daead  /tmp/resindb-main-update.tgz" | sha256sum --check --strict
          tar -xzf /tmp/resindb-main-update.tgz -C .

          test -f .resindb-delete-manifest.txt
          while IFS= read -r path; do
            [ -n "$path" ] && rm -rf -- "$path"
          done < .resindb-delete-manifest.txt

          rm -f .resindb-delete-manifest.txt
          rm -rf .github/.resindb-main-update
          rm -f .github/apply-resindb-main-update.trigger
          rm -f .github/apply-resindb-main-update-retry.trigger
          rm -f .github/workflows/apply-resindb-main-update.yml
          rm -f .github/workflows/apply-resindb-main-update-retry.yml

          git config user.name "ResinDB Main Integrator"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m "feat: externalize resin data and harden ResinDB validation"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            [ "$attempt" -eq 3 ] && exit 1
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 5))
          done
