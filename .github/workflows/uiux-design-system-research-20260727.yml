name: UI UX Pro Max design-system research 2026-07-27

on:
  push:
    branches: [main]
    paths:
      - .github/uiux-design-system-research-20260727.trigger

permissions:
  contents: write

concurrency:
  group: resindb-uiux-design-system-research-20260727
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run upstream UI UX Pro Max searches
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ui-ux-pro-max-skill
          git clone --depth 1 https://github.com/nextlevelbuilder/ui-ux-pro-max-skill.git /tmp/ui-ux-pro-max-skill
          skill=/tmp/ui-ux-pro-max-skill/.claude/skills/ui-ux-pro-max
          out=reports/uiux-design-system-20260727
          mkdir -p "$out"
          python3 "$skill/scripts/search.py" \
            "materials informatics scientific analytics dashboard enterprise research tool accessible dense data visualization" \
            --design-system --variance 5 --motion 2 --density 8 -p "ResinDB Pro" -f markdown \
            > "$out/DESIGN_SYSTEM.md"
          python3 "$skill/scripts/search.py" "scientific analytics dashboard dense enterprise" --domain style -n 12 > "$out/style.txt"
          python3 "$skill/scripts/search.py" "scientific materials dashboard accessible" --domain color -n 12 > "$out/color.txt"
          python3 "$skill/scripts/search.py" "technical scientific dashboard readable" --domain typography -n 12 > "$out/typography.txt"
          python3 "$skill/scripts/search.py" "scientific comparison dashboard uncertainty relationship network" --domain chart -n 15 > "$out/chart.txt"
          python3 "$skill/scripts/search.py" "dashboard accessibility contrast reduced motion responsive data visualization" --domain ux -n 20 > "$out/ux.txt"
          python3 "$skill/scripts/search.py" "dashboard outline scientific navigation status" --domain icons -n 20 > "$out/icons.txt"
          python3 "$skill/scripts/search.py" "rerender memo lazy bundle chart dashboard" --stack react > "$out/react-stack.txt"
          printf 'upstream_commit=%s\n' "$(git -C /tmp/ui-ux-pro-max-skill rev-parse HEAD)" > "$out/source.txt"
          printf 'target_commit=%s\n' "$GITHUB_SHA" >> "$out/source.txt"
      - name: Publish research and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/uiux-design-system-research-20260727.yml
          rm -f .github/uiux-design-system-research-20260727.trigger
          git config user.name "ResinDB UIUX Research Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: capture ResinDB UI UX Pro Max design system"
          git pull --rebase origin main
          git push origin HEAD:main
