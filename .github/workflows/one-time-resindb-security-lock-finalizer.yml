name: One-time ResinDB security lock finalizer

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: resindb-security-lock-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.event.pull_request.number == 35 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/final-acceptance-resindb-20260808' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out acceptance branch with write access
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/final-acceptance-resindb-20260808
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify governed security overrides
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const packagePath = 'package.json';
          const value = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          value.overrides = {
            ...(value.overrides ?? {}),
            dompurify: '3.4.13',
            nanoid: '3.3.17',
          };
          fs.writeFileSync(packagePath, `${JSON.stringify(value, null, 2)}\n`, 'utf8');
          NODE
          node -e "const p=require('./package.json'); if(p.overrides.dompurify!=='3.4.13'||p.overrides.nanoid!=='3.3.17') process.exit(1)"

      - name: Regenerate exact npm lock without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci
          npm ls dompurify nanoid --all

      - name: Prove production and complete dependency audits
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          npm audit --omit=dev --audit-level=high --json > artifacts/npm-audit-prod-final.json
          npm audit --audit-level=high --json > artifacts/npm-audit-all-final.json
          jq '.metadata.vulnerabilities' artifacts/npm-audit-prod-final.json
          jq '.metadata.vulnerabilities' artifacts/npm-audit-all-final.json
          test "$(jq '.metadata.vulnerabilities.total' artifacts/npm-audit-prod-final.json)" -eq 0
          test "$(jq '.metadata.vulnerabilities.total' artifacts/npm-audit-all-final.json)" -eq 0

      - name: Run focused code, language and browser regression
        shell: bash
        run: |
          set -euo pipefail
          npm run validate:docs
          npm run lint
          npm run typecheck
          npm run test:unit
          npm run test:ui

      - name: Publish exact security lock update
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git diff --cached --check
          git commit -m 'security: pin patched transitive browser tooling'
          git push origin HEAD:agent/final-acceptance-resindb-20260808
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Remove one-time controllers from main and post evidence
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.publish.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git switch --force-create main origin/main
          git rm -f --ignore-unmatch \
            .github/workflows/one-time-resindb-security-lock-finalizer.yml \
            .github/workflows/one-time-pass10-observer.yml \
            .github/workflows/one-time-resindb-observer.yml \
            .github/workflows/one-time-resindb-workflow-run-observer.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'chore: remove one-time ResinDB acceptance controllers'
            git push origin HEAD:main
          fi
          body="RESINDB_SECURITY_LOCK_FINALIZER: PASS — exact branch source ${SOURCE_SHA}; dompurify=3.4.13 and nanoid=3.3.17; production and complete npm audits report zero vulnerabilities; documentation, lint, TypeScript, unit and Chromium suites passed."
          jq -n --arg body "$body" '{body:$body}' > /tmp/comment.json
          curl -fsSL -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/35/comments" \
            -d @/tmp/comment.json
