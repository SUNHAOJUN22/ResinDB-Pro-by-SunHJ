name: Source v2 apply diagnostic 2026-07-27

on:
  push:
    branches: [main]
    paths:
      - .github/source-v2-apply-diagnostic-20260727.trigger

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply in disposable worktree
        shell: bash
        run: |
          set +e
          git show 4cc44cbae0621580d3f2193c836a4e734fdc2599:scripts/apply-performance-source-v2.py > scripts/apply-performance-source-v2.py
          python3 scripts/apply-performance-source-v2.py > /tmp/apply-v2.txt 2>&1
          code=$?
          set -e
          git reset --hard HEAD
          mkdir -p reports/performance-audit-20260727
          {
            echo "validated_commit=$GITHUB_SHA"
            echo "apply_exit=$code"
            echo
            cat /tmp/apply-v2.txt
          } > reports/performance-audit-20260727/source-v2-apply-diagnostic.txt
      - name: Publish and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/source-v2-apply-diagnostic-20260727.yml
          rm -f .github/source-v2-apply-diagnostic-20260727.trigger
          git config user.name "ResinDB Source Diagnostic Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "perf: publish source v2 apply diagnostic"
          git pull --rebase origin main
          git push origin HEAD:main
