name: One-time cleanup validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate-cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out proposed cleanup
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove audited non-product files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .agents .antigravity migrated_prompt_history docs
          rm -f AGENTS.md check_lang.cjs firebase-applet-config.json firebase-blueprint.json firebase.json firestore.rules metadata.json
          rm -f resindb-pro-by-sunhj-3.0.0.tgz .audit-trigger
          find scripts -maxdepth 1 -type f ! -name 'smoke-test.mjs' -delete
          rm -f src/components/auth/AuthScreen.tsx
          rm -f src/components/features/Ai/DashboardAiCard.tsx
          rm -f src/components/ui/Skeleton.tsx
          rm -f src/hooks/datagrid/useActiveFilters.ts src/hooks/datagrid/useDataGrid.ts src/lib/math.ts
          rm -f .github/workflows/repository-audit.yml .github/workflows/source-snapshot.yml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Production HTTP smoke test
        run: npm run smoke

      - name: Capture production dependency audit
        if: always()
        shell: bash
        run: npm audit --omit=dev --json > npm-audit.json || true

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cleanup-validation-output
          path: npm-audit.json
          retention-days: 3

      - name: Commit validated cleanup to temporary branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: remove generated artifacts and misleading legacy surfaces'
          git push origin HEAD:audit-trigger
