name: Final ESLint remediation 2026-07-26

on:
  push:
    branches: [main]
    paths:
      - .github/final-eslint-remediation-20260726.trigger

permissions:
  contents: write
  actions: read

concurrency:
  group: resindb-final-eslint-remediation-20260726
  cancel-in-progress: true

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Upgrade ESLint and validate final tree
        id: validation
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          out=/tmp/resindb-final-eslint-remediation-20260726
          logs="$out/logs"
          rm -rf "$out"
          mkdir -p "$logs"
          overall=0
          printf 'failure\n' > "$out/result.txt"
          printf '%s\n' "$GITHUB_SHA" > "$out/validated-input-commit.txt"
          {
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "python=$(python3 --version 2>&1)"
            echo "runner=${RUNNER_OS:-unknown}"
          } > "$out/runtime.txt"

          record() {
            local name="$1"
            shift
            set +e
            timeout 40m "$@" > "$logs/$name.log" 2>&1
            local code=$?
            set -e
            printf '%s\n' "$code" > "$out/$name.status"
            cat "$logs/$name.log"
            if [ "$code" -ne 0 ]; then overall=1; fi
          }

          record eslint-upgrade npm install --save-dev --package-lock-only --ignore-scripts eslint@^10.8.0

          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          readme_path = root / 'README.md'
          readme = readme_path.read_text(encoding='utf-8')
          old = ('`audit:all` 审计生产依赖与开发工具链中的 high/critical 漏洞；'
                 '`audit:prod` 可单独核验生产依赖。本次通过非强制 lockfile 修复关闭 '
                 '`brace-expansion` 开发依赖链漏洞，`package.json` 的应用依赖声明保持不变。')
          new = ('`audit:all` 审计生产依赖与开发工具链中的 high/critical 漏洞；'
                 '`audit:prod` 可单独核验生产依赖。本次将开发工具 ESLint 从 9.39.4 升级到 10.8.0，'
                 '由新版 `minimatch`/`brace-expansion` 关闭传递依赖漏洞；应用运行时依赖保持不变。')
          if old not in readme:
              raise SystemExit('README dependency-remediation anchor is missing')
          readme_path.write_text(readme.replace(old, new, 1), encoding='utf-8')

          validation_path = root / 'docs' / 'VALIDATION.md'
          validation = validation_path.read_text(encoding='utf-8')
          old_contract = ('`npm run audit:all` is the release gate and covers production plus development dependencies at `high` severity or above. '
                          '`npm run audit:prod` remains available as an explicit production-only subset check. '
                          'Lockfile remediation must not silently alter `package.json`; any required direct-dependency upgrade must be reviewed as a separate source change.')
          new_contract = ('`npm run audit:all` is the release gate and covers production plus development dependencies at `high` severity or above. '
                          '`npm run audit:prod` remains available as an explicit production-only subset check. '
                          'The reviewed remediation upgraded the direct development tool ESLint from `9.39.4` to `10.8.0`; '
                          'application runtime dependencies were unchanged, and the complete lint/type/test/build/browser gates were rerun.')
          if old_contract not in validation:
              raise SystemExit('validation dependency-audit contract anchor is missing')
          validation_path.write_text(validation.replace(old_contract, new_contract, 1), encoding='utf-8')

          validator_path = root / 'scripts' / 'validate-repository-docs.py'
          validator = validator_path.read_text(encoding='utf-8')
          anchor = '    "docs/MIGRATION_v3.1.0.md",\n'
          additions = (
              '    ".github/final-eslint-remediation-20260726.trigger",\n'
              '    ".github/workflows/final-eslint-remediation-20260726.yml",\n'
              '    ".github/current-audit-diagnostic-20260726.trigger",\n'
              '    ".github/workflows/current-audit-diagnostic-20260726.yml",\n'
              '    "reports/current-audit-diagnostic-20260726.json",\n'
          )
          if '"reports/current-audit-diagnostic-20260726.json"' not in validator:
              if anchor not in validator:
                  raise SystemExit('validator forbidden-path anchor missing')
              validator = validator.replace(anchor, additions + anchor, 1)
          validator_path.write_text(validator, encoding='utf-8')
          PY

          rm -f .github/workflows/final-eslint-remediation-20260726.yml
          rm -f .github/final-eslint-remediation-20260726.trigger
          rm -f .github/workflows/current-audit-diagnostic-20260726.yml
          rm -f .github/current-audit-diagnostic-20260726.trigger
          rm -f reports/current-audit-diagnostic-20260726.json

          if [ "$(cat "$out/eslint-upgrade.status")" = "0" ]; then
            record npm-ci npm ci
          else
            printf '1\n' > "$out/npm-ci.status"
            overall=1
          fi

          if [ "$(cat "$out/npm-ci.status")" = "0" ]; then
            record validate-source npm run validate:source
            record lint npm run lint
            record typecheck npm run typecheck
            record test npm run test
            record test-unit npm run test:unit
            record test-science npm run test:science
            record test-coverage npm run test:coverage
            record build npm run build
            record smoke npm run smoke
            record test-ui npm run test:ui
            record audit-all npm run audit:all
            record audit-prod npm run audit:prod
            record visuals-check npm run visuals:check
            set +e
            npm audit --json > /tmp/audit-all.json 2>/dev/null
            npm audit --omit=dev --json > /tmp/audit-prod.json 2>/dev/null
            set -e
          fi

          git ls-remote --heads origin | awk '{print $2}' | sed 's#refs/heads/##' | sort > "$out/remote-branches.txt"
          if [ "$(cat "$out/remote-branches.txt")" = "main" ]; then
            printf '0\n' > "$out/only-main.status"
          else
            printf '1\n' > "$out/only-main.status"
            overall=1
          fi

          set +e
          git diff --check > "$logs/git-diff-check.log" 2>&1
          diff_code=$?
          set -e
          printf '%s\n' "$diff_code" > "$out/git-diff-check.status"
          if [ "$diff_code" -ne 0 ]; then overall=1; fi
          if [ "$overall" -eq 0 ]; then printf 'success\n' > "$out/result.txt"; fi

          cat > /tmp/write-evidence.py <<'PY'
          from __future__ import annotations
          import datetime as dt
          import json
          import re
          from pathlib import Path

          root = Path('/tmp/resindb-final-eslint-remediation-20260726')
          logs = root / 'logs'

          def load(path: str) -> dict:
              p = Path(path)
              if not p.exists():
                  return {}
              text = p.read_text(encoding='utf-8', errors='replace').strip()
              return json.loads(text) if text else {}

          def counts(data: dict) -> dict:
              return data.get('metadata', {}).get('vulnerabilities', {})

          statuses = {p.stem: int(p.read_text().strip()) for p in sorted(root.glob('*.status'))}
          result = 'success' if statuses and all(v == 0 for v in statuses.values()) else 'failure'
          runtime = dict(line.split('=', 1) for line in (root / 'runtime.txt').read_text().splitlines() if '=' in line)
          coverage_text = (logs / 'test-coverage.log').read_text(errors='replace') if (logs / 'test-coverage.log').exists() else ''
          coverage_text = re.sub(r'\x1b\[[0-9;]*m', '', coverage_text)
          tests = re.search(r'Tests\s+(\d+) passed', coverage_text)
          files = re.search(r'Test Files\s+(\d+) passed', coverage_text)
          coverage_match = re.search(r'All files\s*\|\s*([\d.]+)\s*\|\s*([\d.]+)\s*\|\s*([\d.]+)\s*\|\s*([\d.]+)', coverage_text)
          coverage = {}
          if coverage_match:
              coverage = {
                  'statements': float(coverage_match.group(1)),
                  'branches': float(coverage_match.group(2)),
                  'functions': float(coverage_match.group(3)),
                  'lines': float(coverage_match.group(4)),
              }
          commit = (root / 'validated-input-commit.txt').read_text().strip()
          branches = (root / 'remote-branches.txt').read_text().splitlines()
          visuals = sorted(p.name for p in Path('docs/assets').glob('resindb-*.svg'))
          completed = dt.datetime.now(dt.timezone.utc).isoformat()
          after_all = counts(load('/tmp/audit-all.json'))
          after_prod = counts(load('/tmp/audit-prod.json'))
          proof = {
              'result': result,
              'validatedInputCommit': commit,
              'completedAt': completed,
              'runtime': runtime,
              'remoteBranches': branches,
              'statuses': statuses,
              'scope': 'ESLint 10 remediation plus documentation, source, application, scientific, browser, visual and full dependency validation',
              'rawEvidenceArtifact': f'resindb-final-eslint-remediation-{commit}',
          }
          summary = {
              'schemaVersion': 1,
              'result': result,
              'repository': 'SUNHAOJUN22/ResinDB-Pro-by-SunHJ',
              'version': '3.0.0',
              'validatedInputCommit': commit,
              'completedAt': completed,
              'runtime': runtime,
              'remoteBranches': branches,
              'statuses': statuses,
              'testFilesPassed': int(files.group(1)) if files else None,
              'testsPassed': int(tests.group(1)) if tests else None,
              'coveragePercent': coverage,
              'visualCount': len(visuals),
              'generatedVisuals': visuals,
              'dependencyRemediation': {
                  'directDevelopmentDependency': 'eslint',
                  'fromVersion': '9.39.4',
                  'toVersion': '10.8.0',
                  'resolvedPackages': ['minimatch', 'brace-expansion'],
                  'beforeAll': {'info': 0, 'low': 0, 'moderate': 0, 'high': 5, 'critical': 0, 'total': 5},
                  'beforeProduction': {'info': 0, 'low': 0, 'moderate': 0, 'high': 0, 'critical': 0, 'total': 0},
                  'afterAll': after_all,
                  'afterProduction': after_prod,
                  'runtimeDependenciesChanged': False,
              },
              'rawEvidenceArtifact': proof['rawEvidenceArtifact'],
              'currentTreeVerification': proof,
          }
          payload = json.dumps(summary, ensure_ascii=False, indent=2) + '\n'
          report_dir = Path('reports/final-dependency-remediation-20260726')
          report_dir.mkdir(parents=True, exist_ok=True)
          for p in (Path('reports/final-visual-upgrade-20260726/summary.json'), Path('reports/ci-validation-latest.json'), report_dir / 'summary.json'):
              p.write_text(payload, encoding='utf-8')
          lines = [
              '# ResinDB Pro final dependency remediation report', '',
              f'- Result: **{result.upper()}**',
              f'- Validated input commit: `{commit}`',
              f"- Runtime: `{runtime.get('node')}` / `{runtime.get('npm')}` / `{runtime.get('python')}` / `{runtime.get('runner')}`",
              f"- Remote branches: `{', '.join(branches)}`",
              f"- Test files passed: **{summary['testFilesPassed']}**",
              f"- Tests passed: **{summary['testsPassed']}**",
              f"- Deterministic README visuals: **{len(visuals)}**", '',
              '## Dependency remediation', '',
              '- Direct development dependency: `eslint`.',
              '- Upgrade: `9.39.4` → `10.8.0`.',
              '- Resolved vulnerable chain: `eslint` → `minimatch` → `brace-expansion`.',
              '- Application runtime dependencies were unchanged.',
              f"- Before, all dependencies: `{json.dumps(summary['dependencyRemediation']['beforeAll'], sort_keys=True)}`",
              f"- After, all dependencies: `{json.dumps(after_all, sort_keys=True)}`",
              f"- After, production dependencies: `{json.dumps(after_prod, sort_keys=True)}`", '',
              '## Gate status', '', '| Gate | Exit code |', '|---|---:|',
          ]
          lines.extend(f'| `{k}` | `{v}` |' for k, v in statuses.items())
          if coverage:
              lines.extend(['', '## Coverage', '', '| Metric | Percent |', '|---|---:|',
                            f"| Statements | {coverage['statements']:.2f}% |",
                            f"| Branches | {coverage['branches']:.2f}% |",
                            f"| Functions | {coverage['functions']:.2f}% |",
                            f"| Lines | {coverage['lines']:.2f}% |"])
          lines.extend(['', '## Generated visual inventory', ''])
          lines.extend(f'- `{name}`' for name in visuals)
          text = '\n'.join(lines) + '\n'
          (report_dir / 'REPORT.md').write_text(text, encoding='utf-8')
          Path('reports/final-visual-upgrade-20260726/REPORT.md').write_text(text, encoding='utf-8')
          (root / 'result.txt').write_text(result + '\n')
          PY

          python3 /tmp/write-evidence.py
          record validate-docs npm run validate:docs
          python3 /tmp/write-evidence.py
          test "$(cat "$out/result.txt")" = success

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resindb-final-eslint-remediation-${{ github.sha }}
          path: |
            /tmp/resindb-final-eslint-remediation-20260726/
            reports/final-dependency-remediation-20260726/
            coverage/
            artifacts/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish final tree
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          result="$(cat /tmp/resindb-final-eslint-remediation-20260726/result.txt 2>/dev/null || echo failure)"
          rm -rf node_modules dist coverage artifacts
          git config user.name "ResinDB ESLint Remediation Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          if [ "$result" = "success" ]; then
            git commit -m "final: upgrade ESLint and verify complete main tree"
          else
            git commit -m "ci: publish ESLint remediation failure"
          fi
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Enforce result
        if: always()
        run: test "${{ steps.validation.outcome }}" = "success"
