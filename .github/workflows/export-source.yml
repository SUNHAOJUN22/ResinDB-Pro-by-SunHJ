name: Export complete repository bundle

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch every branch and tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --prune origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          mkdir -p /tmp/resindb-audit
          git for-each-ref --sort=refname --format='%(refname) %(objectname) %(committerdate:iso8601-strict) %(subject)' refs/heads refs/remotes/origin refs/tags > /tmp/resindb-audit/refs.txt
          git log --all --graph --decorate --oneline --date-order > /tmp/resindb-audit/history.txt
          git bundle create /tmp/resindb-audit/ResinDB-Pro-by-SunHJ.bundle --all
          sha256sum /tmp/resindb-audit/ResinDB-Pro-by-SunHJ.bundle > /tmp/resindb-audit/SHA256SUMS

      - name: Upload complete auditable bundle
        uses: actions/upload-artifact@v4
        with:
          name: resindb-complete-repository-bundle
          path: /tmp/resindb-audit
          if-no-files-found: error
          retention-days: 2
