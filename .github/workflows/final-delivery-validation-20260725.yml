name: Final delivery validation 2026-07-25

on:
  push:
    branches: [main]
    paths:
      - .github/final-delivery-validation-20260725.trigger

permissions:
  contents: write
  actions: read

concurrency:
  group: resindb-final-delivery-validation-20260725
  cancel-in-progress: false

jobs:
  validate:
    name: Validate final main delivery
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Check out exact main commit
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Run complete validation suite
        id: validation
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p /tmp/resindb-final-validation reports
          overall=0

          record_check() {
            local name="$1"
            shift
            echo "==> ${name}"
            set +e
            "$@" >"/tmp/resindb-final-validation/${name}.log" 2>&1
            local code=$?
            set -e
            cat "/tmp/resindb-final-validation/${name}.log"
            printf '%s' "$code" >"/tmp/resindb-final-validation/${name}.status"
            if [ "$code" -ne 0 ]; then overall=1; fi
          }

          set -e
          heads="$(git ls-remote --heads origin | awk '{print $2}' | sed 's#refs/heads/##' | sort)"
          printf '%s\n' "$heads" > /tmp/resindb-final-validation/remote-branches.txt
          if [ "$heads" != "main" ]; then
            printf '1' > /tmp/resindb-final-validation/only-main.status
            overall=1
          else
            printf '0' > /tmp/resindb-final-validation/only-main.status
          fi

          install_code=1
          for attempt in 1 2 3; do
            set +e
            npm ci > /tmp/resindb-final-validation/npm-ci.log 2>&1
            install_code=$?
            set -e
            if [ "$install_code" -eq 0 ]; then break; fi
            tail -n 160 /tmp/resindb-final-validation/npm-ci.log
            sleep $((attempt * 15))
          done
          cat /tmp/resindb-final-validation/npm-ci.log
          printf '%s' "$install_code" > /tmp/resindb-final-validation/npm-ci.status
          if [ "$install_code" -ne 0 ]; then
            overall=1
          else
            if npm run | grep -q 'validate:data'; then
              record_check validate-data npm run validate:data
            fi
            record_check lint npm run lint
            record_check typecheck npm run typecheck
            record_check test npm run test
            record_check test-unit npm run test:unit
            record_check test-science npm run test:science
            record_check test-coverage npm run test:coverage
            record_check build npm run build
            record_check smoke npm run smoke
            record_check test-ui npm run test:ui

            audit_code=1
            for attempt in 1 2 3; do
              set +e
              npm run audit:prod > /tmp/resindb-final-validation/audit-prod.log 2>&1
              audit_code=$?
              set -e
              if [ "$audit_code" -eq 0 ]; then break; fi
              cat /tmp/resindb-final-validation/audit-prod.log
              sleep $((attempt * 10))
            done
            cat /tmp/resindb-final-validation/audit-prod.log
            printf '%s' "$audit_code" > /tmp/resindb-final-validation/audit-prod.status
            if [ "$audit_code" -ne 0 ]; then overall=1; fi
          fi

          result=success
          if [ "$overall" -ne 0 ]; then result=failure; fi
          printf '%s' "$result" > /tmp/resindb-final-validation/result.txt

          python3 - "$result" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" <<'PY'
          import json, pathlib, sys, datetime
          result, sha, run_id, attempt = sys.argv[1:]
          root = pathlib.Path('/tmp/resindb-final-validation')
          statuses = {}
          for path in sorted(root.glob('*.status')):
              statuses[path.stem] = int(path.read_text().strip())
          receipt = {
              'schemaVersion': 1,
              'result': result,
              'repository': 'SUNHAOJUN22/ResinDB-Pro-by-SunHJ',
              'validatedCommit': sha,
              'workflowRunId': int(run_id),
              'workflowRunAttempt': int(attempt),
              'completedAt': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'runner': 'ubuntu-latest / Node.js 22',
              'branchInventory': (root/'remote-branches.txt').read_text().splitlines(),
              'statuses': statuses,
              'evidenceArtifact': f'resindb-final-delivery-{sha}',
          }
          pathlib.Path('reports/final-ci-receipt.json').write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          marker = pathlib.Path(f'reports/final-ci-{result}.json')
          marker.write_text(json.dumps(receipt, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          stale = pathlib.Path(f'reports/final-ci-{"failure" if result == "success" else "success"}.json')
          if stale.exists(): stale.unlink()
          PY

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resindb-final-delivery-${{ github.sha }}
          path: |
            /tmp/resindb-final-validation/
            coverage/
            artifacts/
            reports/final-ci-receipt.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publish receipt and remove one-time gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules dist coverage artifacts
          git config user.name "ResinDB Validation Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/final-delivery-validation-20260725.yml .github/final-delivery-validation-20260725.trigger
          git add reports/final-ci-receipt.json reports/final-ci-success.json reports/final-ci-failure.json 2>/dev/null || true
          git diff --cached --check
          git commit -m "ci: publish final delivery validation receipt [skip ci]"
          git push origin HEAD:main

      - name: Enforce validation result
        if: always()
        shell: bash
        run: |
          test "$(cat /tmp/resindb-final-validation/result.txt)" = "success"
