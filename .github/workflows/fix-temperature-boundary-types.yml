name: Fix temperature boundary types

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: fix-temperature-boundary-types
  cancel-in-progress: false

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'agent/data-compute-readme-rebuild-20260802'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/data-compute-readme-rebuild-20260802
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Normalize temperature values at UI and storage boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          replacements = {
              Path('src/components/modals/AddProductModal.tsx'): [
                  ('temperature: val.temperature || "",',
                   'temperature: val.temperature === undefined ? "" : String(val.temperature),'),
              ],
              Path('src/components/modals/EditProductModal.tsx'): [
                  ('temperature: val.temperature || "",',
                   'temperature: val.temperature === undefined ? "" : String(val.temperature),'),
              ],
              Path('src/lib/adapters/UniversalStorageBridge.ts'): [
                  ('temp: mfr?.temperature || mfr?.temp || defaultMfrTemperature,',
                   'temp: String(mfr?.temperature ?? mfr?.temp ?? defaultMfrTemperature),'),
              ],
          }

          for path, rules in replacements.items():
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in rules:
                  if old not in text:
                      raise SystemExit(f'missing expected source expression in {path}: {old}')
                  text = text.replace(old, new)
              if text == original:
                  raise SystemExit(f'no change applied to {path}')
              path.write_text(text, encoding='utf-8')
          PY

          test "$(grep -c 'temperature: val.temperature === undefined ? "" : String(val.temperature),' src/components/modals/AddProductModal.tsx)" -eq 1
          test "$(grep -c 'temperature: val.temperature === undefined ? "" : String(val.temperature),' src/components/modals/EditProductModal.tsx)" -eq 2
          grep -F 'temp: String(mfr?.temperature ?? mfr?.temp ?? defaultMfrTemperature),' src/lib/adapters/UniversalStorageBridge.ts
          git diff --check

      - name: Commit source-only fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/fix-temperature-boundary.trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/components/modals/AddProductModal.tsx \
            src/components/modals/EditProductModal.tsx \
            src/lib/adapters/UniversalStorageBridge.ts \
            .github/fix-temperature-boundary.trigger
          git commit -m 'fix: normalize property temperatures at boundaries'
          git push origin HEAD:agent/data-compute-readme-rebuild-20260802
