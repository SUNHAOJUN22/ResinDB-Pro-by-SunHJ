name: Qualify final receipt candidate
on:
  push:
    branches: [main]
    paths: [.github/workflows/archive-completed-closure-branches.yml]
permissions:
  contents: write
jobs:
  qualify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install CJK fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Apply checksum-bound candidate patch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, gzip, hashlib, json, os, pathlib, subprocess, urllib.request
          fragments = (
              'ef94e7f6d205ebc9bf0a8a76c7e4f8a08f89177a',
              '4f98c33359e6012474017b152e3f8fe90afca4eb',
              '11798bb0ea12ce438459a5cfae8d180403f76d60',
          )
          chunks = []
          for sha in fragments:
              request = urllib.request.Request(
                  os.environ['GITHUB_API_URL'] + '/repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/blobs/' + sha,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
              data = base64.b64decode(payload['content'])
              actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              if actual != sha:
                  raise SystemExit('candidate fragment identity mismatch')
              chunks.append(data)
          patch = gzip.decompress(base64.b64decode(b''.join(chunks), validate=True))
          if hashlib.sha256(patch).hexdigest() != 'bfa91e3e6dbfcc7f3672d3be7a747f9e955f3d68cb4e031bd378c3200be516cf':
              raise SystemExit('candidate checksum mismatch')
          pathlib.Path('/tmp/receipt-candidate.patch').write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '/tmp/receipt-candidate.patch'], check=True)
          subprocess.run(['git', 'apply', '/tmp/receipt-candidate.patch'], check=True)
          subprocess.run(['git', 'rm', '.github/workflows/archive-completed-closure-branches.yml'], check=True)
          subprocess.run(['git', 'add', '-A'], check=True)
      - name: Qualify candidate source without weakening native gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-repository-unicode.mjs --write
          npm ci
          npm ls --all >/dev/null
          node --test scripts/tests/validation-receipt-contract.test.mjs
          npm run validate:ci
          git diff --check
      - name: Commit only qualified non-workflow changes
        shell: python
        run: |
          import json, os, pathlib, shutil, subprocess, tempfile
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          allowed = {
              'README.md', 'reports/UNICODE_INTEGRITY_REPORT.json',
              'scripts/generate-validation-receipt.mjs', 'scripts/validation-receipt-contract.mjs',
              'scripts/tests/validation-receipt-contract.test.mjs', 'scripts/validate-repository-docs.mjs',
              'scripts/prepare-ci-manifest.mjs', 'src/lib/__tests__/skillInteroperabilityV19.test.ts',
          }
          workflows = {
              '.github/workflows/ci.yml', '.github/workflows/v19-skill-contract.yml',
              '.github/workflows/native-full-qualification.yml', '.github/workflows/exact-tree-export.yml',
              '.github/workflows/archive-completed-closure-branches.yml',
          }
          git('add', '-A')
          changed = set(git('diff', 'HEAD', '--name-only').splitlines())
          if changed - allowed - workflows:
              raise SystemExit('unexpected candidate changes: ' + str(changed - allowed - workflows))
          candidate_tree = git('write-tree')
          source_paths = sorted(changed & allowed)
          if git('ls-remote', '--heads', 'origin', 'refs/heads/main').split()[0] != os.environ['GITHUB_SHA']:
              raise SystemExit('main moved; refusing to publish candidate')
          with tempfile.TemporaryDirectory() as directory:
              saved = pathlib.Path(directory)
              for relative in source_paths:
                  source = pathlib.Path(relative)
                  if source.exists():
                      target = saved / relative
                      target.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copy2(source, target)
              git('reset', '--hard', 'HEAD')
              for relative in source_paths:
                  target = pathlib.Path(relative)
                  if (saved / relative).exists():
                      target.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copy2(saved / relative, target)
                  else:
                      target.unlink(missing_ok=True)
          git('config', 'user.name', 'github-actions[bot]')
          git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
          git('add', '-A', '--', *source_paths)
          git('commit', '-m', 'fix(receipt): enforce exact identity and strict evidence predicates')
          git('push', 'origin', 'HEAD:main')
          print(json.dumps({'status': 'CANDIDATE_QUALIFIED', 'expected_final_tree': candidate_tree,
              'source_commit': git('rev-parse', 'HEAD'), 'source_paths': source_paths,
              'pending': 'Apply the already-tested permanent workflow diff and remove temporary transport.'}, indent=2))
