name: Source Snapshot Export

on:
  push:
    branches: [main]
    paths:
      - .github/source-export-trigger.txt
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: source-snapshot-export
  cancel-in-progress: false

jobs:
  export:
    name: Export exact main source snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out exact main commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build source archive
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=dist \
            --exclude=coverage \
            --exclude=artifacts \
            --exclude=reports/source-export.json \
            -czf resindb-source.tgz .
          sha256sum resindb-source.tgz > resindb-source.tgz.sha256

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: resindb-source-${{ github.sha }}
          path: |
            resindb-source.tgz
            resindb-source.tgz.sha256
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Publish artifact locator
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: resindb-source-${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_id=""
          for attempt in $(seq 1 20); do
            artifact_id="$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
              | jq -r --arg name "${ARTIFACT_NAME}" '.artifacts[] | select(.name == $name) | .id' \
              | head -n 1)"
            if [ -n "${artifact_id}" ] && [ "${artifact_id}" != "null" ]; then
              break
            fi
            sleep 3
          done
          if [ -z "${artifact_id}" ] || [ "${artifact_id}" = "null" ]; then
            echo "Unable to resolve uploaded artifact id" >&2
            exit 1
          fi

          mkdir -p reports
          cat > reports/source-export.json <<JSON
          {
            "schemaVersion": 1,
            "repository": "${GITHUB_REPOSITORY}",
            "sourceCommit": "${GITHUB_SHA}",
            "workflowRunId": ${GITHUB_RUN_ID},
            "artifactId": ${artifact_id},
            "artifactName": "${ARTIFACT_NAME}",
            "generatedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/source-export.json
          git commit -m "chore: publish source snapshot locator [skip ci]"
          git push origin HEAD:main
