name: UI UX Pro Max visual final proof 2026-07-27

on:
  push:
    branches: [main]
    paths:
      - .github/uiux-visual-final-proof-20260727.trigger

permissions:
  contents: write
  actions: read

concurrency:
  group: resindb-uiux-visual-final-proof-20260727
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run final visual and application proof
        id: validation
        continue-on-error: true
        shell: bash
        run: bash scripts/uiux-visual-final-proof.sh
      - name: Upload raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resindb-uiux-visual-final-proof-${{ github.sha }}
          path: |
            /tmp/resindb-uiux-visual-final-proof/
            coverage/
            artifacts/
          if-no-files-found: warn
          retention-days: 30
      - name: Publish verified tree or exact failure evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          result="$(cat /tmp/resindb-uiux-visual-final-proof/result.txt 2>/dev/null || echo failure)"
          rm -rf node_modules dist coverage artifacts
          git config user.name "ResinDB UIUX Verification Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          if [ "$result" = "success" ]; then
            git commit -m "docs: verify UI UX Pro Max README visual system"
          else
            git commit -m "docs: publish exact UI UX Pro Max visual failure"
          fi
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Enforce result
        if: always()
        run: test "${{ steps.validation.outcome }}" = "success"
