name: UI UX Pro Max visual final proof 2026-07-27

on:
  push:
    branches: [main]
    paths:
      - .github/uiux-visual-final-proof-20260727.trigger

permissions:
  contents: write
  actions: read

concurrency:
  group: resindb-uiux-visual-final-proof-20260727
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refine layouts and run complete validation
        id: validation
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          out=/tmp/resindb-uiux-visual-final-proof
          logs="$out/logs"
          rm -rf "$out"
          mkdir -p "$logs"
          overall=0
          printf '%s\n' "$GITHUB_SHA" > "$out/validated-input-commit.txt"
          {
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "python=$(python3 --version 2>&1)"
            echo "runner=${RUNNER_OS:-unknown}"
          } > "$out/runtime.txt"

          record() {
            local name="$1"
            shift
            set +e
            timeout 40m "$@" > "$logs/$name.txt" 2>&1
            local code=$?
            set -e
            printf '%s\n' "$code" > "$out/$name.status"
            cat "$logs/$name.txt"
            if [ "$code" -ne 0 ]; then overall=1; fi
          }

          python3 - <<'PY'
          from pathlib import Path
          import re

          generator = Path('scripts/generate-readme-visuals.py')
          text = generator.read_text(encoding='utf-8')
          flow = '''def render_flow(visual: Visual) -> str:
              body = header(visual)
              count = len(visual.items)
              gap = 22
              width = (1072 - gap * (count - 1)) / count
              y = 204
              for index, item in enumerate(visual.items):
                  x = 64 + index * (width + gap)
                  accent = ACCENTS[index % len(ACCENTS)]
                  body += (
                      f'<g filter="url(#shadow-sm)">'
                      f'<rect x="{x}" y="{y}" width="{width}" height="204" rx="18" fill="{TOKENS["surface"]}" stroke="{TOKENS["border_soft"]}"/>'
                      f'<rect x="{x}" y="{y}" width="{width}" height="5" rx="2.5" fill="{accent}"/>'
                      f'</g>'
                      + icon_badge(x + width / 2 - 24, y + 26, item.icon, accent, 48)
                      + text(x + width - 24, y + 31, f"{index + 1:02d}", 11, TOKENS["muted"], 700, "middle", MONO)
                      + text(x + width / 2, y + 105, item.title, 14, TOKENS["ink"], 720, "middle")
                  )
                  subtitle_parts = item.subtitle.split(" • ")
                  if len(subtitle_parts) > 1:
                      body += text(x + width / 2, y + 132, subtitle_parts[0], 11, TOKENS["muted"], 500, "middle")
                      body += text(x + width / 2, y + 151, " • ".join(subtitle_parts[1:]), 11, TOKENS["muted"], 500, "middle")
                  else:
                      body += text(x + width / 2, y + 139, item.subtitle, 11, TOKENS["muted"], 500, "middle")
                  body += f'<circle cx="{x + width / 2}" cy="{y + 178}" r="4" fill="{accent}"/>'
                  if index < count - 1:
                      body += line(x + width + 4, y + 102, x + width + gap - 5, y + 102,
                                   TOKENS["primary"], 2, False, "arrow")
              body += (
                  f'<rect x="64" y="442" width="1072" height="92" rx="18" fill="{TOKENS["surface_alt"]}" stroke="{TOKENS["border_soft"]}"/>'
                  + text(88, 473, "DESIGN INTENT", 11, TOKENS["primary"], 750, family=MONO, letter_spacing=1.0)
                  + text(88, 503, visual.description, 14, TOKENS["body"], 500)
              )
              return body + footer(visual)
          '''
          flow = '\n'.join(line[10:] if line.startswith('          ') else line for line in flow.splitlines()) + '\n\n'
          text, count = re.subn(r'def render_flow\(visual: Visual\) -> str:\n.*?\n\ndef render_grid', flow + 'def render_grid', text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('render_flow replacement failed')
          text = text.replace(
              '''        if width > 400:\n            body += text(x + 26, y + height - 27, visual.description, 12, TOKENS["muted"], 500)\n''',
              '',
              1,
          )
          generator.write_text(text, encoding='utf-8')

          validator = Path('scripts/validate-repository-docs.py')
          vtext = validator.read_text(encoding='utf-8')
          anchor = '    "docs/MIGRATION_v3.1.0.md",\n'
          entries = (
              '    ".github/uiux-visual-final-proof-20260727.trigger",\n'
              '    ".github/workflows/uiux-visual-final-proof-20260727.yml",\n'
          )
          if '".github/uiux-visual-final-proof-20260727.trigger"' not in vtext:
              if anchor not in vtext:
                  raise SystemExit('validator forbidden-path anchor missing')
              vtext = vtext.replace(anchor, entries + anchor, 1)
          validator.write_text(vtext, encoding='utf-8')
          PY

          rm -f .github/workflows/uiux-visual-final-proof-20260727.yml
          rm -f .github/uiux-visual-final-proof-20260727.trigger

          record visuals-generate python3 scripts/generate-readme-visuals.py
          record visuals-check python3 scripts/generate-readme-visuals.py --check
          record npm-ci npm ci
          if [ "$(cat "$out/npm-ci.status")" = "0" ]; then
            record validate-source npm run validate:source
            record lint npm run lint
            record typecheck npm run typecheck
            record test npm run test
            record test-unit npm run test:unit
            record test-science npm run test:science
            record test-coverage npm run test:coverage
            record build npm run build
            record smoke npm run smoke
            record test-ui npm run test:ui
            record audit-all npm run audit:all
            record audit-prod npm run audit:prod
          fi

          git ls-remote --heads origin | awk '{print $2}' | sed 's#refs/heads/##' | sort > "$out/remote-branches.txt"
          if [ "$(cat "$out/remote-branches.txt")" = "main" ]; then
            printf '0\n' > "$out/only-main.status"
          else
            printf '1\n' > "$out/only-main.status"
            overall=1
          fi
          set +e
          git diff --check > "$logs/git-diff-check.txt" 2>&1
          diff_code=$?
          set -e
          printf '%s\n' "$diff_code" > "$out/git-diff-check.status"
          if [ "$diff_code" -ne 0 ]; then overall=1; fi

          python3 - <<'PY'
          from __future__ import annotations
          import datetime as dt
          import json
          import re
          import subprocess
          from pathlib import Path

          root = Path('/tmp/resindb-uiux-visual-final-proof')
          logs = root / 'logs'
          summary_path = Path('reports/final-visual-upgrade-20260726/summary.json')
          alias_path = Path('reports/ci-validation-latest.json')
          report_path = Path('reports/final-visual-upgrade-20260726/REPORT.md')

          statuses = {p.stem: int(p.read_text().strip()) for p in sorted(root.glob('*.status'))}
          runtime = dict(line.split('=', 1) for line in (root / 'runtime.txt').read_text().splitlines() if '=' in line)
          branches = (root / 'remote-branches.txt').read_text().splitlines()
          commit = (root / 'validated-input-commit.txt').read_text().strip()
          coverage_text = (logs / 'test-coverage.txt').read_text(errors='replace') if (logs / 'test-coverage.txt').exists() else ''
          coverage_text = re.sub(r'\x1b\[[0-9;]*m', '', coverage_text)
          tests = re.search(r'Tests\s+(\d+) passed', coverage_text)
          files = re.search(r'Test Files\s+(\d+) passed', coverage_text)
          coverage_match = re.search(r'All files\s*\|\s*([\d.]+)\s*\|\s*([\d.]+)\s*\|\s*([\d.]+)\s*\|\s*([\d.]+)', coverage_text)
          coverage = {}
          if coverage_match:
              coverage = {
                  'statements': float(coverage_match.group(1)),
                  'branches': float(coverage_match.group(2)),
                  'functions': float(coverage_match.group(3)),
                  'lines': float(coverage_match.group(4)),
              }
          visuals = sorted(p.name for p in Path('docs/assets').glob('resindb-*.svg'))
          result = 'success' if statuses and all(code == 0 for code in statuses.values()) else 'failure'
          completed = dt.datetime.now(dt.timezone.utc).isoformat()
          candidate_tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          proof = {
              'result': result,
              'validatedInputCommit': commit,
              'candidateTreeSha': candidate_tree,
              'completedAt': completed,
              'runtime': runtime,
              'remoteBranches': branches,
              'statuses': statuses,
              'scope': 'UI UX Pro Max README visual system plus source, application, scientific, browser and dependency validation',
              'rawEvidenceArtifact': f'resindb-uiux-visual-final-proof-{commit}',
          }
          try:
              summary = json.loads(summary_path.read_text(encoding='utf-8'))
          except Exception:
              summary = {'schemaVersion': 1, 'repository': 'SUNHAOJUN22/ResinDB-Pro-by-SunHJ', 'version': '3.0.0'}
          summary.update({
              'result': result,
              'validatedInputCommit': commit,
              'candidateTreeSha': candidate_tree,
              'completedAt': completed,
              'runtime': runtime,
              'remoteBranches': branches,
              'statuses': statuses,
              'testFilesPassed': int(files.group(1)) if files else None,
              'testsPassed': int(tests.group(1)) if tests else None,
              'coveragePercent': coverage,
              'visualCount': len(visuals),
              'generatedVisuals': visuals,
              'visualDesignSystem': 'resindb-uiux-pro-max-v1',
              'visualDesignMethod': ['Swiss Modernism 2.0', 'Bento Grid', 'Accessible & Ethical', 'Dimensional Layering'],
              'visualDesignSources': [
                  'nextlevelbuilder/ui-ux-pro-max-skill',
                  'bbylw/ui-ux-pro-max-skill-cn',
              ],
              'rawEvidenceArtifact': proof['rawEvidenceArtifact'],
              'currentTreeVerification': proof,
          })
          payload = json.dumps(summary, ensure_ascii=False, indent=2) + '\n'
          summary_path.write_text(payload, encoding='utf-8')
          alias_path.write_text(payload, encoding='utf-8')

          lines = [
              '# ResinDB Pro UI/UX Pro Max visual validation report', '',
              f'- Result: **{result.upper()}**',
              f'- Validated input commit: `{commit}`',
              f'- Candidate tree: `{candidate_tree}`',
              f"- Runtime: `{runtime.get('node')}` / `{runtime.get('npm')}` / `{runtime.get('python')}` / `{runtime.get('runner')}`",
              f"- Remote branches: `{', '.join(branches)}`",
              f"- Tests: **{summary.get('testsPassed')}** across **{summary.get('testFilesPassed')}** files",
              f'- Deterministic visuals: **{len(visuals)}**',
              '- Visual design system: `resindb-uiux-pro-max-v1`', '',
              '## Design direction', '',
              '- Swiss Modernism 2.0',
              '- Bento Grid',
              '- Accessible & Ethical',
              '- Dimensional Layering',
              '- Dashboard density 8/10 and motion 2/10', '',
              '## Gate status', '', '| Gate | Exit code |', '|---|---:|',
          ]
          lines.extend(f'| `{name}` | `{code}` |' for name, code in sorted(statuses.items()))
          if coverage:
              lines.extend(['', '## Coverage', '', '| Metric | Percent |', '|---|---:|'])
              lines.extend([
                  f"| Statements | {coverage['statements']:.2f}% |",
                  f"| Branches | {coverage['branches']:.2f}% |",
                  f"| Functions | {coverage['functions']:.2f}% |",
                  f"| Lines | {coverage['lines']:.2f}% |",
              ])
          lines.extend(['', '## Visual inventory', ''])
          lines.extend(f'- `{name}`' for name in visuals)
          report_path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

          record validate-docs npm run validate:docs

          python3 - <<'PY'
          import datetime as dt
          import json
          from pathlib import Path

          root = Path('/tmp/resindb-uiux-visual-final-proof')
          summary_path = Path('reports/final-visual-upgrade-20260726/summary.json')
          alias_path = Path('reports/ci-validation-latest.json')
          report_path = Path('reports/final-visual-upgrade-20260726/REPORT.md')
          summary = json.loads(summary_path.read_text(encoding='utf-8'))
          statuses = {p.stem: int(p.read_text().strip()) for p in sorted(root.glob('*.status'))}
          result = 'success' if statuses and all(code == 0 for code in statuses.values()) else 'failure'
          completed = dt.datetime.now(dt.timezone.utc).isoformat()
          summary['result'] = result
          summary['completedAt'] = completed
          summary['statuses'] = statuses
          summary['currentTreeVerification']['result'] = result
          summary['currentTreeVerification']['completedAt'] = completed
          summary['currentTreeVerification']['statuses'] = statuses
          payload = json.dumps(summary, ensure_ascii=False, indent=2) + '\n'
          summary_path.write_text(payload, encoding='utf-8')
          alias_path.write_text(payload, encoding='utf-8')
          text = report_path.read_text(encoding='utf-8')
          text = text.replace('- Result: **SUCCESS**', f'- Result: **{result.upper()}**', 1)
          if '| `validate-docs` |' not in text:
              insert = f"| `validate-docs` | `{statuses.get('validate-docs', 99)}` |\n"
              marker = '## Coverage'
              if marker in text:
                  text = text.replace('\n## Coverage', '\n' + insert + '\n## Coverage', 1)
              else:
                  text += '\n' + insert
          report_path.write_text(text, encoding='utf-8')
          (root / 'result.txt').write_text(result + '\n')
          PY

          test "$(cat "$out/result.txt")" = success

      - name: Upload raw validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resindb-uiux-visual-final-proof-${{ github.sha }}
          path: |
            /tmp/resindb-uiux-visual-final-proof/
            coverage/
            artifacts/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish verified visual tree
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          result="$(cat /tmp/resindb-uiux-visual-final-proof/result.txt 2>/dev/null || echo failure)"
          rm -rf node_modules dist coverage artifacts
          git config user.name "ResinDB UIUX Verification Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          if [ "$result" = "success" ]; then
            git commit -m "docs: verify UI UX Pro Max README visual system"
          else
            git commit -m "docs: publish UI UX Pro Max visual validation failure"
          fi
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Enforce result
        if: always()
        run: test "${{ steps.validation.outcome }}" = "success"
