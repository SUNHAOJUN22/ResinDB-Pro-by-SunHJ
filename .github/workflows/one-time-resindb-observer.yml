name: One-time ResinDB bilingual visual observer

on:
  issue_comment:
    types: [created]

permissions:
  actions: read
  issues: write
  contents: read

jobs:
  observe:
    if: >-
      github.event.issue.number == 35 &&
      github.event.comment.body == '/observe-resindb-bilingual-visuals'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Report latest finalizer run and jobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          runs=$(curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?event=issue_comment&per_page=100")
          run=$(jq -c '[.workflow_runs[] | select(.name == "One-time ResinDB bilingual visual controller") | select(.display_title == "/finalize-resindb-bilingual-visuals")] | sort_by(.created_at) | last // {}' <<<"$runs")
          run_id=$(jq -r '.id // "none"' <<<"$run")
          status=$(jq -r '.status // "missing"' <<<"$run")
          conclusion=$(jq -r '.conclusion // "none"' <<<"$run")
          head_sha=$(jq -r '.head_sha // "none"' <<<"$run")
          jobs=''
          if [ "$run_id" != none ]; then
            jobs_json=$(curl -fsSL \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100")
            jobs=$(jq -r '[.jobs[] | "- job `\(.name)`: `\(.status)` / `\(.conclusion // "none")` (id `\(.id)`)" ] | join("\n")' <<<"$jobs_json")
          fi
          body=$(cat <<EOF
          RESINDB_BILINGUAL_VISUAL_OBSERVER
          run_id: ${run_id}
          status: ${status}
          conclusion: ${conclusion}
          head_sha: ${head_sha}
          ${jobs}
          EOF
          )
          jq -n --arg body "$body" '{body:$body}' > /tmp/comment.json
          curl -fsSL -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/35/comments" \
            -d @/tmp/comment.json
