name: One-time merged branch cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-merged-branch-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Delete merged branch and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          branch='agent/material-statistics-polymer-physics-20260805'
          git check-ref-format --branch "$branch" >/dev/null
          if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null 2>&1; then
            git push origin --delete "$branch"
          fi
          git rm .github/workflows/one-time-merged-branch-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove merged branch cleanup controller'
          git push origin HEAD:main
