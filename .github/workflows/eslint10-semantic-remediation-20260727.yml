name: ESLint 10 semantic remediation 2026-07-27

on:
  push:
    branches: [main]
    paths:
      - .github/eslint10-semantic-remediation-20260727.trigger

permissions:
  contents: write

concurrency:
  group: resindb-eslint10-semantic-remediation-20260727
  cancel-in-progress: true

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply patch and run core gates
        id: validation
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports/performance-audit-20260727
          {
            echo "validated_commit=$GITHUB_SHA"
            npm ci
            python3 scripts/fix-eslint10-findings.py
            npm run lint
            npm run typecheck
            npm run test
            npm run build
          } 2>&1 | tee reports/performance-audit-20260727/eslint10-remediation.txt
      - name: Publish candidate and self-clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/eslint10-semantic-remediation-20260727.yml
          rm -f .github/eslint10-semantic-remediation-20260727.trigger
          rm -f scripts/fix-eslint10-findings.py
          rm -f reports/performance-audit-20260727/gate-diagnostic.txt
          git config user.name "ResinDB Remediation Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          if [ "${{ steps.validation.outcome }}" = "success" ]; then
            git commit -m "fix: satisfy ESLint 10 and accelerate property lookup"
          else
            git commit -m "fix: publish ESLint 10 remediation failure evidence"
          fi
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Enforce result
        if: always()
        run: test "${{ steps.validation.outcome }}" = "success"
