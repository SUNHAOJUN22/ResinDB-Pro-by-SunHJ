name: ESLint 10 semantic remediation 2026-07-27

on:
  push:
    branches: [main]
    paths:
      - .github/eslint10-semantic-remediation-20260727.trigger

permissions:
  contents: write

concurrency:
  group: resindb-eslint10-semantic-remediation-20260727
  cancel-in-progress: true

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch and validate
        id: validation
        continue-on-error: true
        shell: bash
        run: |
          set +e
          out=/tmp/resindb-eslint10-remediation
          rm -rf "$out"
          mkdir -p "$out"
          run_gate() {
            name="$1"; shift
            "$@" > "$out/$name.txt" 2>&1
            code=$?
            printf '%s\n' "$code" > "$out/$name.exit"
            cat "$out/$name.txt"
            return "$code"
          }
          overall=0
          run_gate npm-ci npm ci || overall=1
          run_gate patch python3 scripts/fix-eslint10-findings.py || overall=1
          if [ "$overall" -eq 0 ]; then
            run_gate lint npm run lint || overall=1
            run_gate typecheck npm run typecheck || overall=1
            run_gate test npm run test || overall=1
            run_gate build npm run build || overall=1
          fi
          mkdir -p reports/performance-audit-20260727
          {
            echo "validated_commit=$GITHUB_SHA"
            for status in "$out"/*.exit; do
              [ -e "$status" ] || continue
              echo "$(basename "$status" .exit)_exit=$(cat "$status")"
            done
            echo
            for log in "$out"/*.txt; do
              [ -e "$log" ] || continue
              echo "--- $(basename "$log" .txt) ---"
              cat "$log"
              echo
            done
          } > reports/performance-audit-20260727/eslint10-remediation.txt
          exit "$overall"
      - name: Publish candidate and self-clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/eslint10-semantic-remediation-20260727.yml
          rm -f .github/eslint10-semantic-remediation-20260727.trigger
          rm -f scripts/fix-eslint10-findings.py
          rm -f reports/performance-audit-20260727/gate-diagnostic.txt
          git config user.name "ResinDB Remediation Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          if [ "${{ steps.validation.outcome }}" = "success" ]; then
            git commit -m "fix: satisfy ESLint 10 and accelerate property lookup"
          else
            git commit -m "fix: publish ESLint 10 remediation failure evidence"
          fi
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Enforce result
        if: always()
        run: test "${{ steps.validation.outcome }}" = "success"
