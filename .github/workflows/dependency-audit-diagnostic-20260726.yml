name: Full dependency audit diagnostic 2026-07-26

on:
  push:
    branches: [main]
    paths:
      - .github/dependency-audit-diagnostic-20260726.trigger

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Capture complete npm audit graph
        shell: bash
        run: |
          set +e
          npm ci > /tmp/npm-ci.log 2>&1
          install=$?
          npm audit --json > /tmp/npm-audit.json 2>/tmp/npm-audit.stderr
          audit=$?
          npm audit --omit=dev --json > /tmp/npm-audit-prod.json 2>/tmp/npm-audit-prod.stderr
          audit_prod=$?
          set -e
          {
            echo "validated_commit=$GITHUB_SHA"
            echo "npm_ci=$install"
            echo "npm_audit=$audit"
            echo "npm_audit_prod=$audit_prod"
            echo
            echo "## npm ci"
            cat /tmp/npm-ci.log
            echo
            echo "## full npm audit JSON"
            cat /tmp/npm-audit.json
            echo
            echo "## full audit stderr"
            cat /tmp/npm-audit.stderr
            echo
            echo "## production npm audit JSON"
            cat /tmp/npm-audit-prod.json
            echo
            echo "## production audit stderr"
            cat /tmp/npm-audit-prod.stderr
          } > reports/dependency-audit-diagnostic-20260726.txt
      - name: Publish audit diagnostic and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/dependency-audit-diagnostic-20260726.yml
          rm -f .github/dependency-audit-diagnostic-20260726.trigger
          git config user.name "ResinDB Dependency Diagnostic Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "ci: publish full dependency audit diagnostic"
          git pull --rebase origin main
          git push origin HEAD:main
