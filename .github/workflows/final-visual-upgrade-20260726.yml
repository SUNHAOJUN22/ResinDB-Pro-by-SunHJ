name: Final visual and validation upgrade 2026-07-26

on:
  push:
    branches: [main]
    paths:
      - .github/final-visual-upgrade-20260726.trigger

permissions:
  contents: write
  actions: read

concurrency:
  group: resindb-final-visual-upgrade-20260726
  cancel-in-progress: false

jobs:
  finalize:
    name: Generate fourteen visuals and validate final main tree
    runs-on: ubuntu-latest
    timeout-minutes: 65

    steps:
      - name: Check out exact main commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Generate and validate candidate tree
        id: validation
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          out=/tmp/resindb-final-visual-upgrade-20260726
          logs="$out/logs"
          report=reports/final-visual-upgrade-20260726
          rm -rf "$out" "$report"
          mkdir -p "$logs" "$report"
          overall=0

          record() {
            local name="$1"
            shift
            echo "==> $name"
            set +e
            timeout 30m "$@" > "$logs/$name.log" 2>&1
            local code=$?
            set -e
            printf '%s\n' "$code" > "$out/$name.status"
            cat "$logs/$name.log"
            if [ "$code" -ne 0 ]; then overall=1; fi
          }

          printf '%s\n' "$GITHUB_SHA" > "$out/validated-input-commit.txt"
          {
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "python=$(python3 --version 2>&1)"
            echo "runner=${RUNNER_OS:-unknown}"
          } > "$out/runtime.txt"

          record visuals-generate python3 scripts/generate-readme-visuals.py

          install_code=1
          for attempt in 1 2 3; do
            set +e
            timeout 15m npm ci > "$logs/npm-ci.log" 2>&1
            install_code=$?
            set -e
            if [ "$install_code" -eq 0 ]; then break; fi
            tail -n 160 "$logs/npm-ci.log"
            sleep $((attempt * 10))
          done
          printf '%s\n' "$install_code" > "$out/npm-ci.status"
          cat "$logs/npm-ci.log"
          if [ "$install_code" -ne 0 ]; then
            overall=1
          else
            record validate-docs npm run validate:docs
            record lint npm run lint
            record typecheck npm run typecheck
            record test npm run test
            record test-unit npm run test:unit
            record test-science npm run test:science
            record test-coverage npm run test:coverage
            record build npm run build
            record smoke npm run smoke
            record test-ui npm run test:ui
            record audit-prod npm run audit:prod
          fi

          git ls-remote --heads origin | awk '{print $2}' | sed 's#refs/heads/##' | sort > "$out/remote-branches.txt"
          if [ "$(cat "$out/remote-branches.txt")" = "main" ]; then
            printf '0\n' > "$out/only-main.status"
          else
            printf '1\n' > "$out/only-main.status"
            overall=1
          fi

          set +e
          git diff --check > "$logs/git-diff-check.log" 2>&1
          diff_code=$?
          set -e
          printf '%s\n' "$diff_code" > "$out/git-diff-check.status"
          if [ "$diff_code" -ne 0 ]; then overall=1; fi

          set +e
          git grep -nE 'TODO|FIXME|HACK|@ts-ignore|@ts-nocheck|eslint-disable' -- src tests scripts > "$out/static-risk-scan.txt" 2>/dev/null
          risk_code=$?
          set -e
          if [ "$risk_code" -eq 0 ]; then
            printf '1\n' > "$out/static-risk.status"
            overall=1
          elif [ "$risk_code" -eq 1 ]; then
            printf '0\n' > "$out/static-risk.status"
          else
            printf '%s\n' "$risk_code" > "$out/static-risk.status"
            overall=1
          fi

          result=success
          if [ "$overall" -ne 0 ]; then result=failure; fi
          printf '%s\n' "$result" > "$out/result.txt"

          python3 - <<'PY'
          from __future__ import annotations
          import datetime as dt
          import json
          import re
          from pathlib import Path

          root = Path('/tmp/resindb-final-visual-upgrade-20260726')
          logs = root / 'logs'
          report = Path('reports/final-visual-upgrade-20260726')
          statuses = {p.stem: int(p.read_text().strip()) for p in sorted(root.glob('*.status'))}
          runtime = dict(line.split('=', 1) for line in (root / 'runtime.txt').read_text().splitlines() if '=' in line)
          clean = re.sub(r'\x1b\[[0-9;]*m', '', (logs / 'test-coverage.log').read_text(errors='replace') if (logs / 'test-coverage.log').exists() else '')
          tests_match = re.search(r'Tests\s+(\d+) passed', clean)
          files_match = re.search(r'Test Files\s+(\d+) passed', clean)
          coverage_match = re.search(r'All files\s*\|\s*([\d.]+)\s*\|\s*([\d.]+)\s*\|\s*([\d.]+)\s*\|\s*([\d.]+)', clean)
          coverage = {}
          if coverage_match:
              coverage = {
                  'statements': float(coverage_match.group(1)),
                  'branches': float(coverage_match.group(2)),
                  'functions': float(coverage_match.group(3)),
                  'lines': float(coverage_match.group(4)),
              }
          visuals = sorted(p.name for p in Path('docs/assets').glob('resindb-*.svg'))
          summary = {
              'schemaVersion': 1,
              'result': (root / 'result.txt').read_text().strip(),
              'repository': 'SUNHAOJUN22/ResinDB-Pro-by-SunHJ',
              'version': '3.0.0',
              'validatedInputCommit': (root / 'validated-input-commit.txt').read_text().strip(),
              'completedAt': dt.datetime.now(dt.timezone.utc).isoformat(),
              'runtime': runtime,
              'remoteBranches': (root / 'remote-branches.txt').read_text().splitlines(),
              'statuses': statuses,
              'testFilesPassed': int(files_match.group(1)) if files_match else None,
              'testsPassed': int(tests_match.group(1)) if tests_match else None,
              'coveragePercent': coverage,
              'visualCount': len(visuals),
              'generatedVisuals': visuals,
              'rawEvidenceArtifact': f'resindb-final-visual-upgrade-{(root / "validated-input-commit.txt").read_text().strip()}',
          }
          report.joinpath('summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2) + '\n')
          Path('reports/ci-validation-latest.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2) + '\n')
          lines = [
              '# ResinDB Pro final visual and validation report', '',
              f"- Result: **{summary['result'].upper()}**",
              f"- Validated input commit: `{summary['validatedInputCommit']}`",
              f"- Runtime: `{runtime.get('node')}` / `{runtime.get('npm')}` / `{runtime.get('python')}` / `{runtime.get('runner')}`",
              f"- Remote branches: `{', '.join(summary['remoteBranches'])}`",
              f"- Test files passed: **{summary['testFilesPassed']}**",
              f"- Tests passed: **{summary['testsPassed']}**",
              f"- Deterministic README visuals: **{summary['visualCount']}**", '',
              '## Gate status', '', '| Gate | Exit code |', '|---|---:|',
          ]
          lines += [f'| `{name}` | `{code}` |' for name, code in statuses.items()]
          if coverage:
              lines += ['', '## Coverage', '', '| Metric | Percent |', '|---|---:|',
                        f"| Statements | {coverage['statements']:.2f}% |",
                        f"| Branches | {coverage['branches']:.2f}% |",
                        f"| Functions | {coverage['functions']:.2f}% |",
                        f"| Lines | {coverage['lines']:.2f}% |"]
          lines += ['', '## Generated visual inventory', ''] + [f'- `{name}`' for name in visuals]
          if summary['result'] != 'success':
              lines += ['', '## Failure excerpts']
              for name, code in statuses.items():
                  if code == 0:
                      continue
                  log = logs / f'{name}.log'
                  if not log.exists():
                      continue
                  excerpt = log.read_text(errors='replace').splitlines()
                  lines += ['', f'### {name}', '', '```text', *excerpt[-160:], '```']
          report.joinpath('REPORT.md').write_text('\n'.join(lines) + '\n')
          PY

          cp "$out/static-risk-scan.txt" "$report/static-risk-scan.txt"
          if [ "$overall" -ne 0 ]; then exit 1; fi

      - name: Upload raw validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resindb-final-visual-upgrade-${{ github.sha }}
          path: |
            /tmp/resindb-final-visual-upgrade-20260726/
            reports/final-visual-upgrade-20260726/
            coverage/
            artifacts/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish generated visuals and durable evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          result="$(cat /tmp/resindb-final-visual-upgrade-20260726/result.txt)"
          rm -rf node_modules dist coverage artifacts
          rm -f .github/final-visual-upgrade-20260726.trigger
          if [ "$result" = "success" ]; then
            rm -f .github/workflows/final-visual-upgrade-20260726.yml
          fi
          git config user.name "ResinDB Final Validation Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          if [ "$result" = "success" ]; then
            git commit -m "final: validate code and publish fourteen README visuals"
          else
            git commit -m "ci: publish final visual upgrade failure evidence"
          fi
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Enforce validation result
        if: always()
        shell: bash
        run: test "${{ steps.validation.outcome }}" = "success"
