name: One-time ResinDB security lock publisher

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  actions: read
  contents: write
  issues: write

concurrency:
  group: resindb-security-lock-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.head_branch == 'agent/final-acceptance-resindb-20260808' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Download and verify audited security lock artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/security-lock
          artifacts=$(curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100")
          artifact_id=$(jq -r '[.artifacts[] | select(.name | startswith("resindb-security-lock-"))] | last | .id // empty' <<<"$artifacts")
          test -n "$artifact_id"
          curl -fsSL -L \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            -o /tmp/security-lock.zip
          unzip -q /tmp/security-lock.zip -d /tmp/security-lock
          node <<'NODE'
          const lock = require('/tmp/security-lock/package-lock.json');
          if (lock.packages?.['node_modules/dompurify']?.version !== '3.4.13') {
            throw new Error('audited lock does not contain dompurify 3.4.13');
          }
          if (lock.packages?.['node_modules/nanoid']?.version !== '3.3.17') {
            throw new Error('audited lock does not contain nanoid 3.3.17');
          }
          for (const name of ['npm-audit-prod.json', 'npm-audit-all.json']) {
            const audit = require(`/tmp/security-lock/artifacts/security-lock/${name}`);
            if (audit.metadata?.vulnerabilities?.total !== 0) {
              throw new Error(`${name} is not a zero-vulnerability audit`);
            }
          }
          NODE

      - name: Check out exact acceptance branch with write access
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/final-acceptance-resindb-20260808
          fetch-depth: 0
          persist-credentials: true

      - name: Restore permanent CI and install audited lock
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/ci.yml
          cp /tmp/security-lock/package-lock.json package-lock.json
          rm -f .github/security-lock-republish.trigger
          node <<'NODE'
          const fs = require('node:fs');
          const workflowPath = '.github/workflows/ci.yml';
          let workflow = fs.readFileSync(workflowPath, 'utf8');
          const start = workflow.indexOf('  security-lock:\n');
          const end = workflow.indexOf('  validate:\n');
          if (start >= 0) {
            if (end <= start) throw new Error('unable to isolate temporary security-lock job');
            workflow = workflow.slice(0, start) + workflow.slice(end);
          }
          fs.writeFileSync(workflowPath, workflow, 'utf8');
          NODE

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Execute exact lock and full acceptance qualification
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high
          npm run validate:ci
          git diff --exit-code -- package-lock.json package.json

      - name: Publish audited clean branch tree
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json .github/workflows/ci.yml
          git add -u .github/security-lock-republish.trigger
          git diff --cached --check
          git commit -m 'security: publish audited patched dependency lock'
          git push origin HEAD:agent/final-acceptance-resindb-20260808
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Remove all one-time controllers from main
        env:
          SOURCE_SHA: ${{ steps.publish.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git switch --force-create main origin/main
          git rm -f --ignore-unmatch \
            .github/workflows/one-time-resindb-security-lock-publisher.yml \
            .github/workflows/one-time-resindb-security-lock-finalizer.yml \
            .github/workflows/one-time-resindb-security-observer.yml \
            .github/workflows/one-time-pass10-observer.yml \
            .github/workflows/one-time-resindb-observer.yml \
            .github/workflows/one-time-resindb-workflow-run-observer.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'chore: remove one-time ResinDB acceptance controllers'
            git push origin HEAD:main
          fi
          body="RESINDB_SECURITY_LOCK_PUBLISHED: PASS — exact source ${SOURCE_SHA}; audited package lock contains dompurify 3.4.13 and nanoid 3.3.17; production/full audits, validate:ci and Chromium suite passed."
          jq -n --arg body "$body" '{body:$body}' > /tmp/comment.json
          curl -fsSL -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/35/comments" \
            -d @/tmp/comment.json
