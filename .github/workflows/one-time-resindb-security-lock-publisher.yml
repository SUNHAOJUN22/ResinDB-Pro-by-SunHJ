name: One-time ResinDB acceptance finalizer

on:
  issue_comment:
    types: [created]
  push:
    branches: [main]
    paths:
      - .github/resindb-final-acceptance.trigger

permissions:
  actions: read
  contents: write
  issues: write

concurrency:
  group: resindb-final-acceptance-publisher
  cancel-in-progress: true

jobs:
  publish:
    if: >-
      github.event_name == 'push' ||
      (github.event.issue.number == 35 && github.event.comment.body == '/finalize-resindb-acceptance')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Download and verify audited security lock artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: '31237613373'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/security-lock
          artifacts=$(curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100")
          artifact_id=$(jq -r '[.artifacts[] | select(.name | startswith("resindb-security-lock-"))] | last | .id // empty' <<<"$artifacts")
          test -n "$artifact_id"
          curl -fsSL -L \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            -o /tmp/security-lock.zip
          unzip -q /tmp/security-lock.zip -d /tmp/security-lock
          node <<'NODE'
          const lock = require('/tmp/security-lock/package-lock.json');
          if (lock.packages?.['node_modules/dompurify']?.version !== '3.4.13') {
            throw new Error('audited lock does not contain dompurify 3.4.13');
          }
          if (lock.packages?.['node_modules/nanoid']?.version !== '3.3.17') {
            throw new Error('audited lock does not contain nanoid 3.3.17');
          }
          for (const name of ['npm-audit-prod.json', 'npm-audit-all.json']) {
            const audit = require(`/tmp/security-lock/artifacts/security-lock/${name}`);
            if (audit.metadata?.vulnerabilities?.total !== 0) {
              throw new Error(`${name} is not a zero-vulnerability audit`);
            }
          }
          NODE

      - name: Check out exact acceptance branch with write access
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/final-acceptance-resindb-20260808
          fetch-depth: 0
          persist-credentials: true

      - name: Restore permanent CI, audited lock and documentation contract
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/ci.yml
          cp /tmp/security-lock/package-lock.json package-lock.json
          cp package-lock.json /tmp/audited-package-lock.json
          rm -f .github/security-lock-republish.trigger
          rm -f .github/workflows/one-time-direct-security-lock.yml
          node <<'NODE'
          const fs = require('node:fs');

          const workflowPath = '.github/workflows/ci.yml';
          let workflow = fs.readFileSync(workflowPath, 'utf8');
          const start = workflow.indexOf('  security-lock:\n');
          const end = workflow.indexOf('  validate:\n');
          if (start >= 0) {
            if (end <= start) throw new Error('unable to isolate temporary security-lock job');
            workflow = workflow.slice(0, start) + workflow.slice(end);
          }
          if (!workflow.includes('Install CJK fonts for deterministic visual evidence')) {
            const setupAnchor = `      - name: Set up Node.js
        uses: actions/setup-node@v4
`;
            if (!workflow.includes(setupAnchor)) throw new Error('permanent CI Node setup anchor missing');
            const fontStep = `      - name: Install CJK fonts for deterministic visual evidence
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          fc-match 'Noto Sans CJK SC'
          fc-list :lang=zh | grep -q .

`;
            workflow = workflow.replace(setupAnchor, fontStep + setupAnchor);
          }
          fs.writeFileSync(workflowPath, workflow, 'utf8');

          const readmePath = 'README.md';
          let readme = fs.readFileSync(readmePath, 'utf8');
          if (!readme.includes('Linux CJK font and screenshot acceptance')) {
            readme += `

## Linux 中文字体与截图验收 / Linux CJK font and screenshot acceptance

中文界面与科研图表只有在实际字体和真实绘制同时成立时才允许进入 README。永久 CI 安装并验证 Noto CJK，Chromium 随后检查字体可用性、ECharts \`finished\` 生命周期、非零数据点、Canvas 尺寸与非空彩色像素；仅存在 \`canvas\` 或 SVG 图标不再视为图表通过。

*Chinese UI and scientific figures are accepted only when a real CJK font and a completed non-blank plot are both observable. Permanent CI installs and verifies Noto CJK, then requires Chromium font evidence, the ECharts \`finished\` lifecycle, non-zero data points, a sized Canvas, and non-background chromatic pixels.*

Minimal Ubuntu/Debian runtime prerequisite:

\`\`\`bash
sudo apt-get update
sudo apt-get install -y --no-install-recommends fonts-noto-cjk
fc-cache -f
\`\`\`

Windows uses the governed fallback chain headed by Microsoft YaHei; Linux uses Noto Sans CJK SC/Noto Sans SC. README screenshots are regenerated from the same production build after these checks.
`;
          }
          fs.writeFileSync(readmePath, readme, 'utf8');
          NODE

      - name: Install CJK fonts for deterministic visual evidence
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          fc-match 'Noto Sans CJK SC'
          fc-list :lang=zh | grep -q .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Execute audited lock and complete acceptance qualification
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          cmp package-lock.json /tmp/audited-package-lock.json
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high
          npm run validate:ci
          cmp package-lock.json /tmp/audited-package-lock.json
          git diff --exit-code -- package.json

      - name: Publish runtime-proven README screenshots
        shell: bash
        run: |
          set -euo pipefail
          declare -A images=(
            [ui-dashboard-zh-light.png]=ui-dashboard-zh-light.png
            [ui-dashboard-en-dark.png]=ui-dashboard-en-dark.png
            [ui-product-detail.png]=ui-product-detail.png
            [ui-scientific-analytics.png]=ui-scientific-analytics.png
            [ui-phase2l-rheology-proxy.png]=ui-phase2l-rheology-proxy.png
            [ui-phase2l-dependency-heatmap.png]=ui-phase2l-dependency-heatmap.png
            [ui-kmeans-profile-audit.png]=ui-kmeans-profile-audit.png
            [ui-kmeans-device-calibration.png]=ui-kmeans-device-calibration.png
          )
          for target in "${!images[@]}"; do
            source="artifacts/${images[$target]}"
            test -s "$source"
            cp "$source" "docs/images/$target"
          done
          node <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('artifacts/ui-smoke-manifest.json', 'utf8'));
          if (manifest.schemaVersion !== 2 || !manifest.cjkFont?.available) {
            throw new Error(`CJK runtime evidence is incomplete: ${JSON.stringify(manifest.cjkFont)}`);
          }
          if (!manifest.scientificCanvas?.ready || manifest.scientificCanvas.points <= 0) {
            throw new Error(`scientific Canvas evidence is incomplete: ${JSON.stringify(manifest.scientificCanvas)}`);
          }
          fs.writeFileSync(
            'docs/README_RUNTIME_VISUAL_EVIDENCE.json',
            `${JSON.stringify({
              schemaVersion: 'resindb-readme-runtime-visual-evidence-1.0.0',
              cjkFont: manifest.cjkFont,
              scientificCanvas: manifest.scientificCanvas,
              screenshots: manifest.screenshots,
              generatedAt: manifest.generatedAt,
            }, null, 2)}\n`,
            'utf8',
          );
          NODE
          npm run validate:docs
          npm run validate:i18n-visuals

      - name: Publish audited clean branch tree
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: finalize readable bilingual scientific visual delivery'
          git push origin HEAD:agent/final-acceptance-resindb-20260808
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Remove all one-time controllers from main and post result
        if: always()
        env:
          SOURCE_SHA: ${{ steps.publish.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          body="RESINDB_FINALIZER: ${JOB_STATUS}"
          if [ "$JOB_STATUS" = success ]; then
            body="RESINDB_FINALIZER: PASS — exact source ${SOURCE_SHA}; dompurify 3.4.13 and nanoid 3.3.17; zero production/full audit findings; readable CJK font evidence; completed non-blank scientific Canvas; complete validate:ci passed; README screenshots regenerated from the production build."
          fi
          jq -n --arg body "$body" '{body:$body}' > /tmp/comment.json
          curl -fsSL -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/35/comments" \
            -d @/tmp/comment.json
          if [ "$JOB_STATUS" != success ]; then
            exit 0
          fi
          git fetch origin main
          git switch --force-create main origin/main
          git rm -f --ignore-unmatch \
            .github/resindb-final-acceptance.trigger \
            .github/workflows/one-time-resindb-security-lock-publisher.yml \
            .github/workflows/one-time-resindb-security-lock-finalizer.yml \
            .github/workflows/one-time-resindb-security-observer.yml \
            .github/workflows/one-time-pass10-observer.yml \
            .github/workflows/one-time-resindb-observer.yml \
            .github/workflows/one-time-resindb-workflow-run-observer.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'chore: remove one-time ResinDB acceptance controllers'
            git push origin HEAD:main
          fi
