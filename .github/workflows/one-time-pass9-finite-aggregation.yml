name: One-time Pass 9 finite aggregation delivery

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-pass9-finite-aggregation.yml
  issue_comment:
    types: [created]

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event_name == 'push' ||
      (github.event.issue.number == 34 &&
       github.event.comment.body == '/apply-pass9-finite-aggregation-383d4584')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Verify baseline, transport and reviewed tree
        shell: bash
        run: |
          set -euo pipefail
          expected_payload='383d4584f76911fda5ed866c0b906d5a2fd07458c88917b63a6e434b3256dc03'

          verify_blob() {
            local path="$1"
            local expected="$2"
            local actual
            actual=$(git hash-object "$path")
            test "$actual" = "$expected" || {
              echo "Baseline changed for ${path}: expected ${expected}, got ${actual}" >&2
              exit 1
            }
          }

          verify_blob README.md 3fa4e7df8f8c31d9b41d74b53c0d6297614c7812
          verify_blob scripts/validate-source-hygiene.mjs 34d25659a46f7c4dd8cf7f1d7c8c40f4adfdadc5
          verify_blob tests/unit/toolchainPortability.test.ts 9a593efc88e0c2738e3780513b06e22d5e5c9229
          verify_blob src/services/mathUtils.ts 86999426491d5debd6b32fa93bef70a051a8e4fb
          verify_blob src/components/views/ComparisonView.tsx 1429fdd6e6c6d2e95dcd9bee849001b41320f6bf
          verify_blob src/components/views/PivotView.tsx ceb0e6313bcd7454c4ed78882d0576336348a112
          verify_blob src/components/charts/ArrheniusChart.tsx 7a65a1805a297a24c22878158f1895b4e5145be5
          verify_blob src/components/charts/WeibullChart.tsx 3d2d4bb8b855f38f2757213ea205685f39e94941
          verify_blob src/workers/kineticsWorker.ts 1d4722acf417fa6f6bf5d4a54cc780f87b043709
          verify_blob src/workers/pronyWorker.ts b13ee92122f5618018516629a9dee10d6c0b742c
          verify_blob src/lib/materialScience.ts 1617f5ca13e8543e648562013408013af163d64c
          test ! -e src/lib/numericAggregation.ts
          test ! -e tests/unit/numericAggregation.test.ts
          test ! -e docs/CODE_MATH_PERFORMANCE_AUDIT_2026-08-07_PASS9_FINITE_AGGREGATION.md

          mapfile -t chunks < <(find .github/pass9-delivery -maxdepth 1 -name 'chunk-*.txt' -print | sort)
          test "${#chunks[@]}" -eq 6
          cat "${chunks[@]}" > /tmp/pass9.tar.gz.b64
          base64 --decode /tmp/pass9.tar.gz.b64 > /tmp/pass9.tar.gz
          echo "${expected_payload}  /tmp/pass9.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/pass9.tar.gz -C .

          node scripts/validate-source-hygiene.mjs
          node scripts/validate-repository-docs.mjs
          node scripts/validate-compute-surface.mjs
          node scripts/validate-data.mjs

          node --experimental-strip-types --input-type=module <<'NODE'
          import { summarizeFinite } from './src/lib/numericAggregation.ts'
          const cancellation = summarizeFinite([1e16, 1, -1e16])
          if (!cancellation || cancellation.sum !== 1) throw new Error('Compensated sum contract failed')
          function* millionValues() {
            for (let i = 0; i < 1_000_000; i += 1) yield i - 500_000
          }
          const summary = summarizeFinite(millionValues())
          if (!summary || summary.count !== 1_000_000 || summary.min !== -500_000 || summary.max !== 499_999) {
            throw new Error('Million-value finite aggregation contract failed')
          }
          console.log(JSON.stringify({ cancellation, million: summary }))
          NODE

          if grep -R -n -E 'Math\.(min|max)\([[:space:]]*\.\.\.' src; then
            echo 'Variadic array extrema remain in production source' >&2
            exit 1
          fi

      - name: Commit production code and remove controller residue
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/pass9-delivery
          git rm .github/workflows/one-time-pass9-finite-aggregation.yml
          git add README.md docs scripts src tests
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: harden finite aggregation across production paths'
          git push origin HEAD:main
