name: Prune merged remediation branch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prune-merged-remediation
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Delete merged remediation branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          endpoint="https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/remediation/nanoid-3.3.18"
          status="$(curl --silent --show-error --location \
            --output /tmp/delete-ref-response.json \
            --write-out '%{http_code}' \
            --request DELETE \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${endpoint}")"
          case "${status}" in
            204|404|422) ;;
            *)
              cat /tmp/delete-ref-response.json
              exit 1
              ;;
          esac
          mapfile -t heads < <(git ls-remote --heads "https://github.com/${GITHUB_REPOSITORY}.git")
          printf '%s\n' "${heads[@]}"
          test "${#heads[@]}" -eq 1
          [[ "${heads[0]}" == *$'refs/heads/main' ]]
