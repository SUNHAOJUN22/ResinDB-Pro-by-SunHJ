name: One-time performance branch cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

concurrency:
  group: one-time-performance-branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: contains(github.event.head_commit.message, 'one-time performance branch cleanup')
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Delete the merged performance branch and verify single-main state
        shell: bash
        run: |
          set -euo pipefail
          branch='perf/prony-buffer-reuse-20260802'
          if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null 2>&1; then
            git push origin --delete "$branch"
          fi
          git ls-remote --heads origin | tee /tmp/resindb-branch-proof.txt
          test "$(wc -l < /tmp/resindb-branch-proof.txt | tr -d ' ')" -eq 1
          test "$(grep -c 'refs/heads/main$' /tmp/resindb-branch-proof.txt || true)" -eq 1

      - name: Remove this one-time workflow from main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-time-performance-branch-cleanup.yml
          git commit -m 'chore: remove one-time performance cleanup workflow'
          git push origin HEAD:main

      - name: Dispatch final exact-tree CI on cleaned main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches" \
            -f ref=main
