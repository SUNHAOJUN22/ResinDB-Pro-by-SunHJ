name: Diagnose ResinDB final transport blobs

on:
  push:
    branches: [main]
    paths:
      - .github/diagnose-final-blobs.trigger

permissions:
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Compute normalized blob digests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          post_status() {
            local context="$1" description="$2"
            curl -fsSL -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -d "$(jq -nc --arg state success --arg context "$context" --arg description "${description:0:130}" --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{state:$state,context:$context,description:$description,target_url:$target_url}')" >/dev/null
          }
          blob_shas=(
            b3dc76b379a28802555310817d3e598f9cbdbf6b
            a201ac8cd6c8905b6520a47514e4cfc66fec9a24
            331610fc44dfc5e8af4d06e99d55dd205ed206ad
            882e6acd1cacdd84b424637b29ccbd05481adaa9
            6d52c2996f9d8cf849a5c74fdfd2853883e6f23a
            202a388ebeb829a70ab065bc476216c0ce8c287d
            9015cb5fc405f7cce44ac324b2405afdd6dc9b84
            55d5770c343a540976ef1b2686793a479083da73
            38f029849f05dde5b7af827ff24baa551a745878
            6f8b0c5c4509b640173b2f0be00a211e2f8f0222
            810a0ed408a0ab3972c84899cd8d4ced700283c3
            a37e3963af31a7d74576943e383909229b153869
            b561b956fa5d7e72e3d073106c3f4af848bd1502
            f334ad66b29321ba95f1f7362a9873222a671501
            7252d8c9e4e3b444c6e3daedbe8d1132adb1c2e2
            9a84e49fcf701ed06e6d82a5c74f72acb3b151cf
            dfa57ae7ba893d8bc986a7c4cbacb6cb0413fa34
          )
          : > /tmp/combined
          for index in "${!blob_shas[@]}"; do
            response="/tmp/blob-${index}.json"
            raw="/tmp/raw-${index}"
            normalized="/tmp/norm-${index}"
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${blob_shas[$index]}" \
              -o "$response"
            jq -r '.content' "$response" | tr -d '\n' | base64 -d > "$raw"
            tr -d '\r\n' < "$raw" > "$normalized"
            hash="$(sha256sum "$normalized" | awk '{print $1}')"
            bytes="$(stat -c%s "$normalized")"
            cat "$normalized" >> /tmp/combined
            post_status "resindb/d$(printf '%02d' "$index")-${hash:0:12}" "${blob_shas[$index]} bytes=${bytes}"
          done
          combined="$(sha256sum /tmp/combined | awk '{print $1}')"
          post_status "resindb/combined-${combined:0:12}" "Combined normalized transport digest"
