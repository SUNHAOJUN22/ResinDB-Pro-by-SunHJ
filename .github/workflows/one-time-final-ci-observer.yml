name: One-time final CI observer

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-final-ci-observer.yml

permissions:
  actions: read
  issues: write
  contents: write

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Read completed clean-main CI and publish receipt pointer
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 339f2ac83c8623098e8366a7a780b279bbc1bb76
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&event=push&per_page=20"
          run=''
          for attempt in $(seq 1 60); do
            response=$(curl -fsSL \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$api")
            run=$(jq -c '[.workflow_runs[] | select(.name == "CI")] | sort_by(.created_at) | last // empty' <<<"$response")
            if [ -n "$run" ] && [ "$(jq -r '.status' <<<"$run")" = completed ]; then
              break
            fi
            sleep 10
          done
          test -n "$run"
          test "$(jq -r '.status' <<<"$run")" = completed
          run_id=$(jq -r '.id' <<<"$run")
          conclusion=$(jq -r '.conclusion' <<<"$run")
          run_url=$(jq -r '.html_url' <<<"$run")
          body=$(jq -nc \
            --arg marker '<!-- resindb-final-main-ci -->' \
            --arg sha "$TARGET_SHA" \
            --arg run_id "$run_id" \
            --arg conclusion "$conclusion" \
            --arg run_url "$run_url" \
            '{body:($marker + "\nFinal clean-main CI observation\n\n- SHA: `" + $sha + "`\n- Run: `" + $run_id + "`\n- Conclusion: `" + $conclusion + "`\n- URL: " + $run_url)}')
          curl -fsSL -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/34/comments" \
            -d "$body" >/dev/null
          test "$conclusion" = success
      - name: Remove observer from main
        if: always()
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Commit observer removal
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-time-final-ci-observer.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove final CI observer'
          git push origin HEAD:main
