name: One-time final CI observer

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-final-ci-observer.yml

permissions:
  actions: read
  contents: write

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve clean-main CI result
        id: result
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 339f2ac83c8623098e8366a7a780b279bbc1bb76
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&event=push&per_page=20")
          run=$(jq -c '[.workflow_runs[] | select(.name == "CI")] | sort_by(.created_at) | last // {}' <<<"$response")
          run_id=$(jq -r '.id // "none"' <<<"$run")
          status=$(jq -r '.status // "missing"' <<<"$run")
          conclusion=$(jq -r '.conclusion // "none"' <<<"$run")
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          echo "conclusion=${conclusion}" >> "$GITHUB_OUTPUT"
          test "$run_id" != none
          test "$status" = completed
      - name: Check out current main
        if: always()
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Remove observer and record result
        if: always()
        env:
          RUN_ID: ${{ steps.result.outputs.run_id }}
          STATUS: ${{ steps.result.outputs.status }}
          CONCLUSION: ${{ steps.result.outputs.conclusion }}
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-time-final-ci-observer.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore: remove final CI observer [run=${RUN_ID:-none} status=${STATUS:-unknown} conclusion=${CONCLUSION:-unknown}]"
          git push origin HEAD:main
