name: Remove accidental ERROR branch

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  remove-and-self-clean:
    if: github.event.issue.title == 'REMOVE_ERROR_DO_NOT_USE_20260724'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Delete accidental branch and verify
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete ERROR-DO-NOT-USE
          ! git ls-remote --heads origin refs/heads/ERROR-DO-NOT-USE | grep -q .
      - name: Remove this workflow from main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ResinDB Cleanup Bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin main
          git switch --force-create cleanup-main origin/main
          git rm .github/workflows/remove-error-branch.yml
          git commit -m 'chore: remove accidental branch cleanup workflow'
          git push origin HEAD:main
