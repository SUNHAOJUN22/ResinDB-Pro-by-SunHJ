name: One-shot governed AI egress convergence v3

on:
  push:
    branches:
      - remediation/nanoid-3.3.18
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resindb-ai-egress-convergence-v3
  cancel-in-progress: false

jobs:
  apply-test-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CI: "true"
    steps:
      - name: Check out exact Draft PR branch
        uses: actions/checkout@v4
        with:
          ref: remediation/nanoid-3.3.18
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Apply reviewed patch or verify it is already present
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          chunks=(.github/remediation/resindb-ai-egress.patch.b64.*)
          test "${#chunks[@]}" -gt 0
          cat "${chunks[@]}" | tr -d '\r\n' > /tmp/resindb-ai-egress.patch.gz.b64
          base64 --decode /tmp/resindb-ai-egress.patch.gz.b64 | gzip --decompress > /tmp/resindb-ai-egress.patch
          test -s /tmp/resindb-ai-egress.patch
          if git apply --check /tmp/resindb-ai-egress.patch; then
            git apply /tmp/resindb-ai-egress.patch
          elif git apply --reverse --check /tmp/resindb-ai-egress.patch; then
            echo 'patch already applied'
          else
            exit 1
          fi
          rm -rf .github/remediation
          rm -f \
            .github/workflows/remediation-apply-ai-egress.yml \
            .github/workflows/remediation-apply-ai-egress-v2.yml \
            .github/workflows/remediation-apply-ai-egress-v3.yml

      - name: Install exact dependencies
        run: npm ci

      - name: Execute source qualification
        shell: bash
        run: |
          set -euo pipefail
          has_script() {
            node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts['$1'] ? 0 : 1)"
          }
          for script in lint typecheck test build; do
            if has_script "$script"; then
              npm run "$script"
            fi
          done
          if test -f scripts/check-ai-egress-governance.mjs; then
            node scripts/check-ai-egress-governance.mjs
          fi
          git diff --check

      - name: Verify minimum fail-closed contract
        shell: bash
        run: |
          set -euo pipefail
          rg -n --fixed-strings '/api/ai/proxy' src tests scripts
          rg -n '65536|64 \* 1024|MAX_.*EGRESS' src tests scripts
          rg -n 'randomUUID|UUIDv4|uuidv4' src tests scripts
          rg -n 'expiresAt|expires_at|authorization.*expir' src tests scripts

      - name: Commit source for native exact-head qualification
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ai): enforce same-origin governed egress"
          git push origin HEAD:remediation/nanoid-3.3.18
