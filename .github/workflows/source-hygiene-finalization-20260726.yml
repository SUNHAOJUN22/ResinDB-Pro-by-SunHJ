name: Final source hygiene verification 2026-07-26

on:
  push:
    branches: [main]
    paths:
      - .github/source-hygiene-finalization-20260726.trigger

permissions:
  contents: write
  actions: read

concurrency:
  group: resindb-final-source-hygiene-20260726
  cancel-in-progress: false

jobs:
  verify:
    name: Verify final main tree and publish durable evidence
    runs-on: ubuntu-latest
    timeout-minutes: 65

    steps:
      - name: Check out exact main commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Run final validation
        id: validation
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          out=/tmp/resindb-final-source-verification-20260726
          logs="$out/logs"
          rm -rf "$out"
          mkdir -p "$logs"
          overall=0

          # The permanent hygiene validator must inspect the final tree, not this one-time gate.
          rm -f .github/workflows/source-hygiene-finalization-20260726.yml
          rm -f .github/source-hygiene-finalization-20260726.trigger

          record() {
            local name="$1"
            shift
            echo "==> $name"
            set +e
            timeout 35m "$@" > "$logs/$name.log" 2>&1
            local code=$?
            set -e
            printf '%s\n' "$code" > "$out/$name.status"
            cat "$logs/$name.log"
            if [ "$code" -ne 0 ]; then overall=1; fi
          }

          printf '%s\n' "$GITHUB_SHA" > "$out/validated-input-commit.txt"
          {
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "python=$(python3 --version 2>&1)"
            echo "runner=${RUNNER_OS:-unknown}"
          } > "$out/runtime.txt"

          install_code=1
          for attempt in 1 2 3; do
            set +e
            timeout 15m npm ci > "$logs/npm-ci.log" 2>&1
            install_code=$?
            set -e
            if [ "$install_code" -eq 0 ]; then break; fi
            tail -n 160 "$logs/npm-ci.log"
            sleep $((attempt * 10))
          done
          printf '%s\n' "$install_code" > "$out/npm-ci.status"
          cat "$logs/npm-ci.log"
          if [ "$install_code" -ne 0 ]; then
            overall=1
          else
            record validate-source npm run validate:source
            record lint npm run lint
            record typecheck npm run typecheck
            record test npm run test
            record test-unit npm run test:unit
            record test-science npm run test:science
            record test-coverage npm run test:coverage
            record build npm run build
            record smoke npm run smoke
            record test-ui npm run test:ui
            record audit-prod npm run audit:prod
            record visuals-check npm run visuals:check
          fi

          git ls-remote --heads origin | awk '{print $2}' | sed 's#refs/heads/##' | sort > "$out/remote-branches.txt"
          if [ "$(cat "$out/remote-branches.txt")" = "main" ]; then
            printf '0\n' > "$out/only-main.status"
          else
            printf '1\n' > "$out/only-main.status"
            overall=1
          fi

          set +e
          git diff --check > "$logs/git-diff-check.log" 2>&1
          diff_code=$?
          set -e
          printf '%s\n' "$diff_code" > "$out/git-diff-check.status"
          if [ "$diff_code" -ne 0 ]; then overall=1; fi

          result=success
          if [ "$overall" -ne 0 ]; then result=failure; fi
          printf '%s\n' "$result" > "$out/result.txt"

          python3 - <<'PY'
          from __future__ import annotations
          import datetime as dt
          import json
          from pathlib import Path

          root = Path('/tmp/resindb-final-source-verification-20260726')
          fixed = Path('reports/final-visual-upgrade-20260726/summary.json')
          alias = Path('reports/ci-validation-latest.json')
          report = Path('reports/final-visual-upgrade-20260726/REPORT.md')
          summary = json.loads(fixed.read_text(encoding='utf-8'))
          statuses = {p.stem: int(p.read_text().strip()) for p in sorted(root.glob('*.status'))}
          runtime = dict(
              line.split('=', 1)
              for line in (root / 'runtime.txt').read_text().splitlines()
              if '=' in line
          )
          proof = {
              'result': (root / 'result.txt').read_text().strip(),
              'validatedInputCommit': (root / 'validated-input-commit.txt').read_text().strip(),
              'completedAt': dt.datetime.now(dt.timezone.utc).isoformat(),
              'runtime': runtime,
              'remoteBranches': (root / 'remote-branches.txt').read_text().splitlines(),
              'statuses': statuses,
              'scope': 'production-source hygiene plus complete application, scientific, browser and dependency validation',
              'rawEvidenceArtifact': f"resindb-final-source-verification-{(root / 'validated-input-commit.txt').read_text().strip()}",
          }
          summary['currentTreeVerification'] = proof
          payload = json.dumps(summary, ensure_ascii=False, indent=2) + '\n'
          fixed.write_text(payload, encoding='utf-8')
          alias.write_text(payload, encoding='utf-8')

          text = report.read_text(encoding='utf-8')
          marker = '\n## Current evidence-aligned tree verification\n'
          if marker in text:
              text = text.split(marker, 1)[0].rstrip() + '\n'
          text += marker + '\n'
          text += f"- Result: **{proof['result'].upper()}**\n"
          text += f"- Validated input commit: `{proof['validatedInputCommit']}`\n"
          text += f"- Scope: {proof['scope']}\n"
          text += f"- Runtime: `{runtime.get('node')}` / `{runtime.get('npm')}` / `{runtime.get('python')}` / `{runtime.get('runner')}`\n"
          text += f"- Remote branches: `{', '.join(proof['remoteBranches'])}`\n\n"
          text += '| Gate | Exit code |\n|---|---:|\n'
          for name, code in statuses.items():
              text += f'| `{name}` | `{code}` |\n'
          report.write_text(text, encoding='utf-8')
          PY

          record validate-docs npm run validate:docs

          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/resindb-final-source-verification-20260726')
          fixed = Path('reports/final-visual-upgrade-20260726/summary.json')
          alias = Path('reports/ci-validation-latest.json')
          report = Path('reports/final-visual-upgrade-20260726/REPORT.md')
          summary = json.loads(fixed.read_text(encoding='utf-8'))
          proof = summary['currentTreeVerification']
          proof['statuses'] = {p.stem: int(p.read_text().strip()) for p in sorted(root.glob('*.status'))}
          proof['result'] = 'success' if all(code == 0 for code in proof['statuses'].values()) else 'failure'
          payload = json.dumps(summary, ensure_ascii=False, indent=2) + '\n'
          fixed.write_text(payload, encoding='utf-8')
          alias.write_text(payload, encoding='utf-8')

          text = report.read_text(encoding='utf-8')
          marker = '\n## Current evidence-aligned tree verification\n'
          text = text.split(marker, 1)[0].rstrip() + marker + '\n'
          text += f"- Result: **{proof['result'].upper()}**\n"
          text += f"- Validated input commit: `{proof['validatedInputCommit']}`\n"
          text += f"- Scope: {proof['scope']}\n"
          text += f"- Runtime: `{proof['runtime'].get('node')}` / `{proof['runtime'].get('npm')}` / `{proof['runtime'].get('python')}` / `{proof['runtime'].get('runner')}`\n"
          text += f"- Remote branches: `{', '.join(proof['remoteBranches'])}`\n\n"
          text += '| Gate | Exit code |\n|---|---:|\n'
          for name, code in proof['statuses'].items():
              text += f'| `{name}` | `{code}` |\n'
          report.write_text(text, encoding='utf-8')
          Path('/tmp/resindb-final-source-verification-20260726/result.txt').write_text(proof['result'] + '\n')
          PY

          if [ "$(cat "$out/result.txt")" != "success" ]; then exit 1; fi

      - name: Upload raw validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resindb-final-source-verification-${{ github.sha }}
          path: |
            /tmp/resindb-final-source-verification-20260726/
            coverage/
            artifacts/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish final verified tree
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          result="$(cat /tmp/resindb-final-source-verification-20260726/result.txt)"
          rm -rf node_modules dist coverage artifacts
          git config user.name "ResinDB Final Verification Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          if [ "$result" = "success" ]; then
            git commit -m "final: verify source hygiene and complete main tree"
          else
            git commit -m "ci: publish final source verification failure evidence"
          fi
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Enforce result
        if: always()
        shell: bash
        run: test "${{ steps.validation.outcome }}" = "success"
