name: One-time ResinDB bilingual visual controller

on:
  issue_comment:
    types: [created]

permissions:
  actions: read
  issues: write
  contents: write

concurrency:
  group: resindb-bilingual-visual-controller
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.event.issue.number == 35 &&
      github.event.comment.body == '/finalize-resindb-bilingual-visuals'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out acceptance branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/final-acceptance-resindb-20260808
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Materialize permanent README, documentation and CI contracts
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f .github/workflows/finalize-resindb-acceptance-once.yml
          rm -f .github/workflows/finalize-bilingual-visuals-once.yml
          node <<'NODE'
          const fs = require('node:fs');

          let readme = fs.readFileSync('README.md', 'utf8');
          const anchor = '### 2.4 真实界面证据 / Real UI evidence';
          const section = `### 2.4 双语科学图表完整性 / Bilingual scientific visual integrity

语言、字体、数值与绘图生命周期属于同一个显示合同。中文和英文模式使用受控 locale alias，界面文本执行 Unicode NFC 归一化；替换字符、常见 mojibake 和不可见控制字符不得进入交付结果。\`ScientificEChart\` 对零尺寸容器、字体加载、\`ResizeObserver\` 缺失和动态主题/语言切换提供显式恢复路径。

*Language, typography, numerics, and the chart lifecycle form one display contract. Governed locale aliases, Unicode normalization, CJK-safe font fallbacks, resilient resize behavior, and exact-tree evidence prevent broken glyphs or invisible mathematical figures from becoming silent failures.*

![Bilingual scientific visual integrity](docs/images/ai-i18n-scientific-visual-integrity.svg)

验收命令 / Acceptance command:

\`\`\`bash
npm run validate:i18n-visuals
\`\`\`

该门禁检查翻译键一致性、关键中英文语义、UTF-8、乱码特征、README 图链接、SVG 的 \`viewBox\`、\`title\`、\`desc\`、CJK 字体回退和主动脚本禁用。

`;
          if (!readme.includes('ai-i18n-scientific-visual-integrity.svg')) {
            if (!readme.includes(anchor)) throw new Error('README visual anchor missing');
            readme = readme.replace(anchor, `${section}### 2.5 真实界面证据 / Real UI evidence`);
          }
          fs.writeFileSync('README.md', readme, 'utf8');

          let docs = fs.readFileSync('scripts/validate-repository-docs.mjs', 'utf8');
          if (!docs.includes("'ai-i18n-scientific-visual-integrity.svg'")) {
            const visualAnchor = "  'ai-delivery-validation.svg',\n].sort();";
            if (!docs.includes(visualAnchor)) throw new Error('visual inventory anchor missing');
            docs = docs.replace(
              visualAnchor,
              "  'ai-delivery-validation.svg',\n  'ai-i18n-scientific-visual-integrity.svg',\n].sort();",
            );
          }
          if (!docs.includes("'validate:i18n-visuals':")) {
            const commandAnchor = "  'validate:docs': 'node scripts/validate-repository-docs.mjs',";
            if (!docs.includes(commandAnchor)) throw new Error('documentation command anchor missing');
            docs = docs.replace(
              commandAnchor,
              `${commandAnchor}\n  'validate:i18n-visuals': 'node scripts/validate-i18n-visuals.mjs',`,
            );
          }
          fs.writeFileSync('scripts/validate-repository-docs.mjs', docs, 'utf8');

          const workflowPath = '.github/workflows/ci.yml';
          let workflow = fs.readFileSync(workflowPath, 'utf8');
          if (!workflow.includes('Bilingual text and visual integrity')) {
            const stepAnchor = '      - name: Documentation and deterministic scientific visuals\n        run: npm run validate:docs\n';
            if (!workflow.includes(stepAnchor)) throw new Error('CI documentation step anchor missing');
            workflow = workflow.replace(
              stepAnchor,
              `${stepAnchor}      - name: Bilingual text and visual integrity\n        run: npm run validate:i18n-visuals\n`,
            );
          }
          if (!workflow.includes("            'i18n-visuals',")) {
            const gateAnchor = "            'docs',\n            'source-hygiene',";
            if (!workflow.includes(gateAnchor)) throw new Error('CI gate-list anchor missing');
            workflow = workflow.replace(
              gateAnchor,
              "            'docs',\n            'i18n-visuals',\n            'source-hygiene',",
            );
          }
          fs.writeFileSync(workflowPath, workflow, 'utf8');
          NODE
      - name: Install exact dependencies and run focused qualification
        run: |
          npm ci
          npm run validate:docs
          npm run validate:i18n-visuals
          npm run validate:scientific-ui
          npm run lint
          npm run typecheck
          npm run test:unit
      - name: Publish exact clean acceptance tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: finalize Unicode-safe bilingual scientific visuals'
          git push origin HEAD:agent/final-acceptance-resindb-20260808
      - name: Remove trusted controller from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git switch --force-create main origin/main
          git rm .github/workflows/one-time-pass10-observer.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove one-time ResinDB controller'
          git push origin HEAD:main
      - name: Post result to pull request
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          conclusion='completed; inspect the controller job for exact gate status'
          body="RESINDB_BILINGUAL_VISUAL_FINALIZER: ${conclusion}"
          jq -n --arg body "$body" '{body:$body}' > /tmp/comment.json
          curl -fsSL -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/35/comments" \
            -d @/tmp/comment.json
