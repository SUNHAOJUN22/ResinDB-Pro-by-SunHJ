name: Native full qualification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: native-full-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Locked full repository-native gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm ls --all >/dev/null
      - name: Execute authoritative repository gate
        shell: bash
        run: |
          set -euo pipefail
          npm run validate:ci
      - name: Prove generated-source fixed point
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git status --porcelain=v1 | test ! -s /dev/stdin

  publish-exact-status:
    name: Publish exact-SHA result
    runs-on: ubuntu-latest
    if: always()
    needs: [qualify]
    steps:
      - name: Publish terminal native status
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFY_RESULT: ${{ needs.qualify.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$QUALIFY_RESULT" == "success" ]]; then
            state=success
            description='Locked repository-native qualification passed'
          else
            state=failure
            description="Repository-native qualification ended: $QUALIFY_RESULT"
          fi
          payload=$(python - "$state" "$description" <<'PY'
          import json, sys
          print(json.dumps({
              "state": sys.argv[1],
              "context": "native/full-ci",
              "description": sys.argv[2][:140],
              "target_url": f"{__import__('os').environ['GITHUB_SERVER_URL']}/{__import__('os').environ['GITHUB_REPOSITORY']}/actions/runs/{__import__('os').environ['GITHUB_RUN_ID']}",
          }))
          PY
          )
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload"
          [[ "$state" == "success" ]]
