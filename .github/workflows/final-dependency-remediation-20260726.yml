name: Final dependency remediation 2026-07-26

on:
  push:
    branches: [main]
    paths:
      - .github/final-dependency-remediation-20260726.trigger

permissions:
  contents: write
  actions: read

concurrency:
  group: resindb-final-dependency-remediation-20260726
  cancel-in-progress: false

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Remediate lockfile and validate final tree
        id: validation
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          out=/tmp/resindb-final-dependency-remediation-20260726
          logs="$out/logs"
          report=reports/final-dependency-remediation-20260726
          rm -rf "$out" "$report"
          mkdir -p "$logs" "$report"
          overall=0

          record() {
            local name="$1"
            shift
            set +e
            timeout 40m "$@" > "$logs/$name.log" 2>&1
            local code=$?
            set -e
            printf '%s\n' "$code" > "$out/$name.status"
            cat "$logs/$name.log"
            if [ "$code" -ne 0 ]; then overall=1; fi
          }

          cat > /tmp/patch-repository.py <<'PY'
          from __future__ import annotations
          from pathlib import Path

          root = Path('.')

          readme_path = root / 'README.md'
          readme = readme_path.read_text(encoding='utf-8')
          readme = readme.replace('生产依赖审计组成的质量门', '完整依赖审计组成的质量门')
          readme = readme.replace('\nnpm run audit:prod\n', '\nnpm run audit:all\n')
          source_note = ('`validate:source` 只扫描 `src/` 下的生产 TypeScript/JavaScript，拒绝 TypeScript/ESLint 抑制、'
                         '任意代码执行、危险 HTML 注入和未完成标记。用于证明公式引擎拒绝恶意表达式的负向安全样本'
                         '保留在 `tests/`，不会再被错误当成生产风险。')
          audit_note = ('\n\n`audit:all` 审计生产依赖与开发工具链的 high/critical 漏洞；`audit:prod` 可单独核验生产依赖。'
                        '本次已通过非强制 lockfile 修复关闭 `brace-expansion` 开发依赖链漏洞，不改变应用依赖声明。')
          if audit_note.strip() not in readme:
              if source_note not in readme:
                  raise SystemExit('README source-hygiene paragraph anchor is missing')
              readme = readme.replace(source_note, source_note + audit_note, 1)
          readme_path.write_text(readme, encoding='utf-8')

          validation_path = root / 'docs' / 'VALIDATION.md'
          validation = validation_path.read_text(encoding='utf-8')
          validation = validation.replace(
              'production build, HTTP smoke, Chromium UI smoke and dependency audit.',
              'production build, HTTP smoke, Chromium UI smoke and full production/development dependency audit.',
          )
          validation = validation.replace(
              '13. `npm run audit:prod` finds no high-severity production dependency vulnerability.',
              '13. `npm run audit:all` finds no high- or critical-severity vulnerability across production and development dependencies; `npm run audit:prod` separately confirms the production subset.',
          )
          validation = validation.replace(
              'Chromium UI smoke and the production dependency audit as separate attributable stages.',
              'Chromium UI smoke and the full dependency audit as separate attributable stages.',
          )
          validation = validation.replace(
              'Dependency installation and production audit include bounded retries for transient registry failures;',
              'Dependency installation and full dependency audit include bounded retries for transient registry failures;',
          )
          if '## Dependency audit contract' not in validation:
              anchor = '## Current verified baseline\n'
              section = '''## Dependency audit contract

`npm run audit:all` is the release gate and covers production plus development dependencies at `high` severity or above. `npm run audit:prod` remains available as an explicit production-only subset check. Lockfile remediation must not silently alter `package.json`; any required direct-dependency upgrade must be reviewed as a separate source change.

'''
              if anchor not in validation:
                  raise SystemExit('Validation baseline anchor is missing')
              validation = validation.replace(anchor, section + anchor, 1)
          validation_path.write_text(validation, encoding='utf-8')

          generator_path = root / 'scripts' / 'generate-readme-visuals.py'
          generator = generator_path.read_text(encoding='utf-8')
          generator = generator.replace('("Security", "production dependency audit")', '("Security", "all dependencies • high gate")')
          generator = generator.replace(
              'runtime smoke and dependency audit.',
              'runtime smoke and full dependency audit.',
          )
          generator_path.write_text(generator, encoding='utf-8')

          validator_path = root / 'scripts' / 'validate-repository-docs.py'
          validator = validator_path.read_text(encoding='utf-8')
          forbidden_anchor = '    "docs/MIGRATION_v3.1.0.md",\n'
          forbidden_entries = (
              '    ".github/final-dependency-remediation-20260726.trigger",\n'
              '    ".github/workflows/final-dependency-remediation-20260726.yml",\n'
              '    ".github/dependency-audit-diagnostic-20260726.trigger",\n'
              '    ".github/workflows/dependency-audit-diagnostic-20260726.yml",\n'
              '    "reports/dependency-audit-diagnostic-20260726.json",\n'
              '    "reports/dependency-audit-diagnostic-20260726.md",\n'
          )
          if '"reports/dependency-audit-diagnostic-20260726.json"' not in validator:
              if forbidden_anchor not in validator:
                  raise SystemExit('Validator forbidden-path anchor is missing')
              validator = validator.replace(forbidden_anchor, forbidden_entries + forbidden_anchor, 1)
          scripts_anchor = '        "validate:source": "python3 scripts/validate-source-hygiene.py",\n'
          scripts_insert = (
              scripts_anchor
              + '        "audit:all": "npm audit --audit-level=high",\n'
              + '        "audit:prod": "npm audit --omit=dev --audit-level=high",\n'
          )
          if '"audit:all": "npm audit --audit-level=high"' not in validator:
              if scripts_anchor not in validator:
                  raise SystemExit('Validator required-scripts anchor is missing')
              validator = validator.replace(scripts_anchor, scripts_insert, 1)
          validate_anchor = '    if "npm run validate:source" not in validate_script:\n        fail("package.json validate must include npm run validate:source")\n'
          validate_insert = (
              validate_anchor
              + '    if "npm run audit:all" not in scripts.get("validate:ci", ""):\n'
              + '        fail("package.json validate:ci must include npm run audit:all")\n'
          )
          if 'package.json validate:ci must include npm run audit:all' not in validator:
              if validate_anchor not in validator:
                  raise SystemExit('Validator validate-chain anchor is missing')
              validator = validator.replace(validate_anchor, validate_insert, 1)
          ci_anchor = '    if "npm run validate:source" not in ci:\n        fail("permanent CI must execute npm run validate:source")\n'
          ci_insert = (
              ci_anchor
              + '    if "npm run audit:all" not in ci:\n'
              + '        fail("permanent CI must execute npm run audit:all")\n'
              + '    if "contents: write" in ci or "EMBEDDED DEPENDENCY REMEDIATION" in ci:\n'
              + '        fail("permanent CI must remain read-only and non-self-modifying")\n'
          )
          if 'permanent CI must execute npm run audit:all' not in validator:
              if ci_anchor not in validator:
                  raise SystemExit('Validator CI anchor is missing')
              validator = validator.replace(ci_anchor, ci_insert, 1)
          validator_path.write_text(validator, encoding='utf-8')
          PY

          record patch-repository python3 /tmp/patch-repository.py

          if [ "$(cat "$out/patch-repository.status")" = "0" ]; then
            cp package.json /tmp/package-before.json
            if [ -f reports/dependency-audit-diagnostic-20260726.json ]; then
              cp reports/dependency-audit-diagnostic-20260726.json /tmp/dependency-audit-before.json
            fi
            record lockfile-remediation bash -c 'npm audit fix --package-lock-only --ignore-scripts && cmp -s package.json /tmp/package-before.json'
          fi

          rm -f .github/workflows/final-dependency-remediation-20260726.yml
          rm -f .github/final-dependency-remediation-20260726.trigger
          rm -f .github/workflows/dependency-audit-diagnostic-20260726.yml
          rm -f .github/dependency-audit-diagnostic-20260726.trigger
          rm -f reports/dependency-audit-diagnostic-20260726.json
          rm -f reports/dependency-audit-diagnostic-20260726.md

          record visuals-generate npm run visuals:generate

          if [ -f "$out/lockfile-remediation.status" ] && [ "$(cat "$out/lockfile-remediation.status")" = "0" ]; then
            record npm-ci npm ci
          else
            printf '1\n' > "$out/npm-ci.status"
            overall=1
          fi

          if [ "$(cat "$out/npm-ci.status")" = "0" ]; then
            record validate-source npm run validate:source
            record lint npm run lint
            record typecheck npm run typecheck
            record test npm run test
            record test-unit npm run test:unit
            record test-science npm run test:science
            record test-coverage npm run test:coverage
            record build npm run build
            record smoke npm run smoke
            record test-ui npm run test:ui
            record audit-all npm run audit:all
            record audit-prod npm run audit:prod
            record visuals-check npm run visuals:check
            set +e
            npm audit --json > /tmp/audit-all-after.json 2>/dev/null
            npm audit --omit=dev --json > /tmp/audit-prod-after.json 2>/dev/null
            set -e
          fi

          git ls-remote --heads origin | awk '{print $2}' | sed 's#refs/heads/##' | sort > "$out/remote-branches.txt"
          if [ "$(cat "$out/remote-branches.txt")" = "main" ]; then
            printf '0\n' > "$out/only-main.status"
          else
            printf '1\n' > "$out/only-main.status"
            overall=1
          fi

          set +e
          git diff --check > "$logs/git-diff-check.log" 2>&1
          diff_code=$?
          set -e
          printf '%s\n' "$diff_code" > "$out/git-diff-check.status"
          if [ "$diff_code" -ne 0 ]; then overall=1; fi

          printf '%s\n' "$GITHUB_SHA" > "$out/validated-input-commit.txt"
          {
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "python=$(python3 --version 2>&1)"
            echo "runner=${RUNNER_OS:-unknown}"
          } > "$out/runtime.txt"

          result=success
          if [ "$overall" -ne 0 ]; then result=failure; fi
          printf '%s\n' "$result" > "$out/result.txt"

          cat > /tmp/write-evidence.py <<'PY'
          from __future__ import annotations
          import datetime as dt
          import json
          import re
          from pathlib import Path

          root = Path('/tmp/resindb-final-dependency-remediation-20260726')
          logs = root / 'logs'
          report_dir = Path('reports/final-dependency-remediation-20260726')
          report_dir.mkdir(parents=True, exist_ok=True)

          def load_json(path: Path) -> dict:
              if not path.exists():
                  return {}
              text = path.read_text(encoding='utf-8', errors='replace').strip()
              return json.loads(text) if text else {}

          def counts(data: dict) -> dict:
              return data.get('metadata', {}).get('vulnerabilities', {})

          statuses = {p.stem: int(p.read_text().strip()) for p in sorted(root.glob('*.status'))}
          runtime = dict(line.split('=', 1) for line in (root / 'runtime.txt').read_text().splitlines() if '=' in line)
          coverage_log = logs / 'test-coverage.log'
          clean = re.sub(r'\x1b\[[0-9;]*m', '', coverage_log.read_text(errors='replace') if coverage_log.exists() else '')
          tests_match = re.search(r'Tests\s+(\d+) passed', clean)
          files_match = re.search(r'Test Files\s+(\d+) passed', clean)
          coverage_match = re.search(r'All files\s*\|\s*([\d.]+)\s*\|\s*([\d.]+)\s*\|\s*([\d.]+)\s*\|\s*([\d.]+)', clean)
          coverage = {}
          if coverage_match:
              coverage = {
                  'statements': float(coverage_match.group(1)),
                  'branches': float(coverage_match.group(2)),
                  'functions': float(coverage_match.group(3)),
                  'lines': float(coverage_match.group(4)),
              }
          visuals = sorted(p.name for p in Path('docs/assets').glob('resindb-*.svg'))
          before = load_json(Path('/tmp/dependency-audit-before.json'))
          after_all = load_json(Path('/tmp/audit-all-after.json'))
          after_prod = load_json(Path('/tmp/audit-prod-after.json'))
          result = 'success' if all(code == 0 for code in statuses.values()) else 'failure'
          validated_commit = (root / 'validated-input-commit.txt').read_text().strip()
          proof = {
              'result': result,
              'validatedInputCommit': validated_commit,
              'completedAt': dt.datetime.now(dt.timezone.utc).isoformat(),
              'runtime': runtime,
              'remoteBranches': (root / 'remote-branches.txt').read_text().splitlines(),
              'statuses': statuses,
              'scope': 'lockfile-only dependency remediation plus documentation, source, application, scientific, browser, visual and full dependency validation',
              'rawEvidenceArtifact': f'resindb-final-dependency-remediation-{validated_commit}',
          }
          summary = {
              'schemaVersion': 1,
              'result': result,
              'repository': 'SUNHAOJUN22/ResinDB-Pro-by-SunHJ',
              'version': '3.0.0',
              'validatedInputCommit': validated_commit,
              'completedAt': proof['completedAt'],
              'runtime': runtime,
              'remoteBranches': proof['remoteBranches'],
              'statuses': statuses,
              'testFilesPassed': int(files_match.group(1)) if files_match else None,
              'testsPassed': int(tests_match.group(1)) if tests_match else None,
              'coveragePercent': coverage,
              'visualCount': len(visuals),
              'generatedVisuals': visuals,
              'dependencyRemediation': {
                  'command': 'npm audit fix --package-lock-only --ignore-scripts',
                  'packageJsonUnchanged': statuses.get('lockfile-remediation') == 0,
                  'beforeAll': before.get('allDependencies', {}).get('metadata', {}).get('vulnerabilities', {}),
                  'beforeProduction': before.get('productionDependencies', {}).get('metadata', {}).get('vulnerabilities', {}),
                  'afterAll': counts(after_all),
                  'afterProduction': counts(after_prod),
                  'resolvedPackage': 'brace-expansion',
              },
              'rawEvidenceArtifact': proof['rawEvidenceArtifact'],
              'currentTreeVerification': proof,
          }
          payload = json.dumps(summary, ensure_ascii=False, indent=2) + '\n'
          Path('reports/final-visual-upgrade-20260726/summary.json').write_text(payload, encoding='utf-8')
          Path('reports/ci-validation-latest.json').write_text(payload, encoding='utf-8')
          report_dir.joinpath('summary.json').write_text(payload, encoding='utf-8')

          lines = [
              '# ResinDB Pro final dependency remediation report', '',
              f"- Result: **{result.upper()}**",
              f"- Validated input commit: `{validated_commit}`",
              f"- Runtime: `{runtime.get('node')}` / `{runtime.get('npm')}` / `{runtime.get('python')}` / `{runtime.get('runner')}`",
              f"- Remote branches: `{', '.join(proof['remoteBranches'])}`",
              f"- Test files passed: **{summary['testFilesPassed']}**",
              f"- Tests passed: **{summary['testsPassed']}**",
              f"- Deterministic README visuals: **{summary['visualCount']}**", '',
              '## Dependency remediation', '',
              '- Vulnerable package: `brace-expansion` in the development toolchain.',
              '- Remediation: `npm audit fix --package-lock-only --ignore-scripts`.',
              f"- `package.json` unchanged: **{summary['dependencyRemediation']['packageJsonUnchanged']}**",
              f"- Before, all dependencies: `{json.dumps(summary['dependencyRemediation']['beforeAll'], sort_keys=True)}`",
              f"- Before, production dependencies: `{json.dumps(summary['dependencyRemediation']['beforeProduction'], sort_keys=True)}`",
              f"- After, all dependencies: `{json.dumps(summary['dependencyRemediation']['afterAll'], sort_keys=True)}`",
              f"- After, production dependencies: `{json.dumps(summary['dependencyRemediation']['afterProduction'], sort_keys=True)}`", '',
              '## Gate status', '', '| Gate | Exit code |', '|---|---:|',
          ]
          lines.extend(f'| `{name}` | `{code}` |' for name, code in statuses.items())
          if coverage:
              lines.extend([
                  '', '## Coverage', '', '| Metric | Percent |', '|---|---:|',
                  f"| Statements | {coverage['statements']:.2f}% |",
                  f"| Branches | {coverage['branches']:.2f}% |",
                  f"| Functions | {coverage['functions']:.2f}% |",
                  f"| Lines | {coverage['lines']:.2f}% |",
              ])
          lines.extend(['', '## Generated visual inventory', ''])
          lines.extend(f'- `{name}`' for name in visuals)
          report_text = '\n'.join(lines) + '\n'
          report_dir.joinpath('REPORT.md').write_text(report_text, encoding='utf-8')
          Path('reports/final-visual-upgrade-20260726/REPORT.md').write_text(report_text, encoding='utf-8')
          PY

          python3 /tmp/write-evidence.py
          record validate-docs npm run validate:docs
          python3 /tmp/write-evidence.py
          final_result="$(python3 -c 'import json; print(json.load(open("reports/ci-validation-latest.json"))["result"])')"
          printf '%s\n' "$final_result" > "$out/result.txt"
          if [ "$final_result" != "success" ]; then exit 1; fi

      - name: Upload raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resindb-final-dependency-remediation-${{ github.sha }}
          path: |
            /tmp/resindb-final-dependency-remediation-20260726/
            reports/final-dependency-remediation-20260726/
            coverage/
            artifacts/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish remediated final tree
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          result="$(cat /tmp/resindb-final-dependency-remediation-20260726/result.txt 2>/dev/null || echo failure)"
          rm -rf node_modules dist coverage artifacts
          git config user.name "ResinDB Dependency Remediation Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          if [ "$result" = "success" ]; then
            git commit -m "final: remediate full dependency audit and verify main"
          else
            git commit -m "ci: publish dependency remediation failure evidence"
          fi
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Enforce result
        if: always()
        run: test "${{ steps.validation.outcome }}" = "success"
