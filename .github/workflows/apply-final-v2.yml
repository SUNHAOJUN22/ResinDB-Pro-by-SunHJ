name: Apply ResinDB Pro 3.2.0 final candidate v2

on:
  push:
    branches: [main]
    paths:
      - .github/apply-final-v2.trigger

permissions:
  contents: write
  statuses: write

concurrency:
  group: resindb-final-v2
  cancel-in-progress: false

jobs:
  validate-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore and verify signed candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TEXT_SHA256: 25fb284c8915ab4a61ce58a765290ffb9ea61336f8728a002c8b5d89f39e3e39
          GZIP_SHA256: a50a4208cf4be9f5c06c4dadaeba7f2b2e43f57416fb1a53290f11f0dad4e8be
          PATCH_SHA256: 2a33dc4222249f6c7f19ef9571945e7ac18d6f2e2ea0e88489efb088bc4fd694
        run: |
          set -euo pipefail

          post_status() {
            local state="$1" context="$2" description="$3"
            curl -fsSL -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -d "$(jq -nc --arg state "$state" --arg context "$context" --arg description "${description:0:130}" --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{state:$state,context:$context,description:$description,target_url:$target_url}')" >/dev/null
          }

          post_status pending resindb/final-v2 "Signed candidate restoration is running"

          blob_shas=(
            b3dc76b379a28802555310817d3e598f9cbdbf6b
            a201ac8cd6c8905b6520a47514e4cfc66fec9a24
            331610fc44dfc5e8af4d06e99d55dd205ed206ad
            882e6acd1cacdd84b424637b29ccbd05481adaa9
            6d52c2996f9d8cf849a5c74fdfd2853883e6f23a
            202a388ebeb829a70ab065bc476216c0ce8c287d
            9015cb5fc405f7cce44ac324b2405afdd6dc9b84
            55d5770c343a540976ef1b2686793a479083da73
            38f029849f05dde5b7af827ff24baa551a745878
            6f8b0c5c4509b640173b2f0be00a211e2f8f0222
            810a0ed408a0ab3972c84899cd8d4ced700283c3
            a37e3963af31a7d74576943e383909229b153869
            b561b956fa5d7e72e3d073106c3f4af848bd1502
            f334ad66b29321ba95f1f7362a9873222a671501
            7252d8c9e4e3b444c6e3daedbe8d1132adb1c2e2
            9a84e49fcf701ed06e6d82a5c74f72acb3b151cf
            dfa57ae7ba893d8bc986a7c4cbacb6cb0413fa34
          )
          chunk_hashes=(
            524d9b94f74a74d97951091708eb70f8780b68ce30e8fffc6facb06dd392f117
            f0616e150068eb6ea0f2b5397b0421a0cdb0d735009d00b3c1030fe57691281f
            292c7dac0b772fbf8becebf28592cd27591ae09873a7e01af91ab08e4c877b08
            998116a2ad5e8094f1a4864e582774f786756f5d465111672ebed63ffc427e93
            ba3989162c7388183c844cb31dc52c356e523fc4301056d9df74155f8455523a
            783ae978d157e639a3f9e178fd3839202025570cf8773970661203d201098be7
            401beb2dcc565a49c1424e475640200cd5811f1353b63b9c86225d7d691e25b3
            913583d32d4cd64e3132ed116e32cf073fd0af4809ae84ac189b7830b27cf363
            767a809cf1d0d5a386db0964a9f57f253d2165d51c8cb5cdc9ad64a223ba665a
            300b3e513ec8a1f63984c258fc994774415304657d82b4b11f896a3d589101de
            570cb9926f19a4e416c29fc5ba1c4d829217041486e490e3fe7f13bc05722775
            c7ed88c0cab810cd803110d6b62571df58a0114e569b758e6222b2112f4c9216
            6034586882db5f6ee3986cabac8bb5a60b3568e7957c3924e48cd93bc4c359eb
            eda1d4881d00c13011f6b1477432cd2f45f316a37e39f7b82ca22335474b7c6d
            8d460f0c6f34eaf442c90e1a8f998cda474ed2b6c7391f7fef9ceec7eaed3af2
            953856f3d6b0dbb2d87afb79abd97ee5eda38bbcc60a3f0d2816350f527b530e
            886529979947658498e10eddb0e29be57621c7bfd5548183b83039901e333d70
          )

          : > /tmp/resindb-final.patch.gz.b64
          for index in "${!blob_shas[@]}"; do
            raw="/tmp/resindb-chunk-$(printf '%02d' "$index").raw"
            normalized="/tmp/resindb-chunk-$(printf '%02d' "$index")"
            response="/tmp/resindb-blob-$(printf '%02d' "$index").json"

            if ! curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${blob_shas[$index]}" \
              -o "$response"; then
              post_status failure "resindb/chunk-$(printf '%02d' "$index")" "Git blob is missing: ${blob_shas[$index]}"
              exit 1
            fi

            jq -r '.content' "$response" | tr -d '\n' | base64 -d > "$raw"
            tr -d '\r\n' < "$raw" > "$normalized"
            actual="$(sha256sum "$normalized" | awk '{print $1}')"
            if [ "$actual" != "${chunk_hashes[$index]}" ]; then
              post_status failure "resindb/chunk-$(printf '%02d' "$index")" "Digest mismatch: ${actual}"
              exit 1
            fi
            cat "$normalized" >> /tmp/resindb-final.patch.gz.b64
            post_status success "resindb/chunk-$(printf '%02d' "$index")" "Chunk verified"
          done

          actual_text="$(sha256sum /tmp/resindb-final.patch.gz.b64 | awk '{print $1}')"
          test "$actual_text" = "$TEXT_SHA256" || { post_status failure resindb/transport-text "Text digest mismatch: ${actual_text}"; exit 1; }

          base64 -d /tmp/resindb-final.patch.gz.b64 > /tmp/resindb-final.patch.gz
          actual_gzip="$(sha256sum /tmp/resindb-final.patch.gz | awk '{print $1}')"
          test "$actual_gzip" = "$GZIP_SHA256" || { post_status failure resindb/transport-gzip "Gzip digest mismatch: ${actual_gzip}"; exit 1; }
          gzip -t /tmp/resindb-final.patch.gz

          gzip -dc /tmp/resindb-final.patch.gz > /tmp/resindb-final.patch
          actual_patch="$(sha256sum /tmp/resindb-final.patch | awk '{print $1}')"
          test "$actual_patch" = "$PATCH_SHA256" || { post_status failure resindb/transport-patch "Patch digest mismatch: ${actual_patch}"; exit 1; }

          git apply --check --binary /tmp/resindb-final.patch
          git apply --binary /tmp/resindb-final.patch
          post_status success resindb/transport "All transport and git apply checks passed"

      - name: Remove temporary transport and diagnostic files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf reports/_final_source_export
          rm -rf .github/.resindb-v310-patch .github/.resindb-main-update .github/.resindb-v310
          rm -f .github/apply-final-v2.trigger .github/workflows/apply-final-v2.yml
          rm -f .github/apply-final-small.trigger .github/workflows/apply-final-small.yml
          rm -f .github/apply-final-optimization.trigger .github/workflows/apply-final-optimization.yml
          rm -f .github/final-source-export.trigger .github/workflows/final-source-export.yml
          rm -f .github/remediate-lockfile-20260726.trigger .github/workflows/remediate-lockfile-20260726.yml
          rm -f .github/source-export-trigger.txt .github/dependency-export-trigger.txt
          rm -f .github/apply-resindb-main-update.trigger .github/apply-resindb-main-update-retry.trigger
          rm -f .github/workflows/source-export.yml .github/workflows/source-snapshot-export.yml
          rm -f .github/workflows/dependency-snapshot-export.yml
          rm -f .github/workflows/apply-resindb-main-update.yml .github/workflows/apply-resindb-main-update-retry.yml
          rm -f reports/patch-diagnostic.json reports/source-export*.json reports/dependency-export*.json
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm ci > /tmp/npm-ci.log 2>&1; then
              cat /tmp/npm-ci.log
              exit 0
            fi
            tail -n 200 /tmp/npm-ci.log
            [ "$attempt" -eq 3 ] && exit 1
            sleep $((attempt * 15))
          done

      - name: Run complete candidate validation
        run: npm run validate:ci

      - name: Generate and render final reports
        run: |
          npm run report:validation
          npm run report:pdf
          pdf="artifacts/ResinDB-Pro-3.2.0-Final-Validation-Report.pdf"
          test -s "$pdf"
          pdfinfo "$pdf"
          pdftoppm -png -f 1 -singlefile -r 120 "$pdf" artifacts/pdf-render-page-1
          test "$(stat -c%s artifacts/pdf-render-page-1.png)" -gt 10000

      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: resindb-pro-3.2.0-final-evidence-${{ github.run_id }}
          path: |
            artifacts/
            reports/
          if-no-files-found: error
          retention-days: 30

      - name: Commit validated candidate directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ResinDB Finalization Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "feat: finalize ResinDB Pro 3.2.0 scientific data platform"
          git push origin HEAD:main

      - name: Publish final status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state=failure
          description="Candidate transport or validation failed"
          if [ "${{ job.status }}" = "success" ]; then
            state=success
            description="Candidate validated and committed directly to main"
          fi
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$(jq -nc --arg state "$state" --arg context resindb/final-v2 --arg description "$description" --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{state:$state,context:$context,description:$description,target_url:$target_url}')" >/dev/null
