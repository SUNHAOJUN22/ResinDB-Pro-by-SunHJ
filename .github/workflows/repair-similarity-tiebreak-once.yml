name: One-time similarity Top-K determinism repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-similarity-tiebreak-once.yml

permissions:
  contents: write

concurrency:
  group: one-time-similarity-tiebreak-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor == 'SUNHAOJUN22'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact staging commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 3
      - name: Verify immutable repair base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^^)" = "51dfb8f98fb5944121c9ab58a6a31441e88d51fd"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git diff --name-only HEAD^^..HEAD | LC_ALL=C sort)" = ".github/workflows/repair-similarity-tiebreak-once.yml"
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Apply canonical endpoint and tie-break repair
        shell: python
        run: |
          from pathlib import Path

          worker_path = Path("src/workers/similarityWorker.ts")
          source = worker_path.read_text(encoding="utf-8")
          old_version = "zscore-cosine-overlap-canonical-f64-4.0.0"
          new_version = "zscore-cosine-overlap-canonical-f64-4.1.0"
          if source.count(old_version) != 1:
              raise SystemExit(f"unexpected worker model-version count: {source.count(old_version)}")
          source = source.replace(old_version, new_version)

          helper_start = source.index("function retainStrongest(")
          helper_end = source.index("\n\nfunction emptyResponse(", helper_start)
          helpers = '''function compareText(left: string, right: string): number {
            if (left < right) return -1;
            if (left > right) return 1;
            return 0;
          }

          function compareEdgeKey(
            leftValue: number,
            leftSource: string,
            leftTarget: string,
            rightValue: number,
            rightSource: string,
            rightTarget: string,
          ): number {
            if (leftValue < rightValue) return -1;
            if (leftValue > rightValue) return 1;
            const sourceOrder = compareText(rightSource, leftSource);
            if (sourceOrder !== 0) return sourceOrder;
            return compareText(rightTarget, leftTarget);
          }

          function compareIndexedEdges(left: IndexedEdge, right: IndexedEdge): number {
            return compareEdgeKey(
              left.value,
              left.source,
              left.target,
              right.value,
              right.source,
              right.target,
            );
          }

          function siftWeakestDown(heap: IndexedEdge[], start = 0): void {
            let index = start;
            while (true) {
              const left = index * 2 + 1;
              const right = left + 1;
              let weakest = index;
              if (left < heap.length && compareIndexedEdges(heap[left], heap[weakest]) < 0) weakest = left;
              if (right < heap.length && compareIndexedEdges(heap[right], heap[weakest]) < 0) weakest = right;
              if (weakest === index) break;
              swap(heap, index, weakest);
              index = weakest;
            }
          }

          function insertRetainedEdge(heap: IndexedEdge[], edge: IndexedEdge): void {
            heap.push(edge);
            let index = heap.length - 1;
            while (index > 0) {
              const parent = Math.floor((index - 1) / 2);
              if (compareIndexedEdges(heap[parent], heap[index]) <= 0) break;
              swap(heap, parent, index);
              index = parent;
            }
          }'''
          source = source[:helper_start] + helpers + source[helper_end:]

          edge_start = source.index("        edgesAboveThreshold += 1;", source.index("for (let left = 0;"))
          edge_end = source.index("      }\n      const completed = left + 1;", edge_start)
          edge_block = '''        edgesAboveThreshold += 1;
                const leftId = products[left].id;
                const rightId = products[right].id;
                const sourceId = compareText(leftId, rightId) <= 0 ? leftId : rightId;
                const targetId = sourceId === leftId ? rightId : leftId;
                if (maxEdges === undefined) {
                  retainedEdges.push({
                    source: sourceId,
                    target: targetId,
                    value: similarity,
                    rawCosine,
                    featureCoverage,
                    sharedFeatures,
                    leftIndex: left,
                    rightIndex: right,
                  });
                  edgeObjectsAllocated += 1;
                } else if (retainedEdges.length < maxEdges) {
                  insertRetainedEdge(retainedEdges, {
                    source: sourceId,
                    target: targetId,
                    value: similarity,
                    rawCosine,
                    featureCoverage,
                    sharedFeatures,
                    leftIndex: left,
                    rightIndex: right,
                  });
                  edgeObjectsAllocated += 1;
                } else {
                  const weakest = retainedEdges[0];
                  if (compareEdgeKey(
                    similarity,
                    sourceId,
                    targetId,
                    weakest.value,
                    weakest.source,
                    weakest.target,
                  ) <= 0) {
                    continue;
                  }
                  weakest.source = sourceId;
                  weakest.target = targetId;
                  weakest.value = similarity;
                  weakest.rawCosine = rawCosine;
                  weakest.featureCoverage = featureCoverage;
                  weakest.sharedFeatures = sharedFeatures;
                  weakest.leftIndex = left;
                  weakest.rightIndex = right;
                  siftWeakestDown(retainedEdges);
                }
          '''
          source = source[:edge_start] + edge_block + source[edge_end:]

          sort_start = source.index("    retainedEdges.sort((left, right) => (")
          sort_end = source.index("\n    for (const edge of retainedEdges)", sort_start)
          source = (
              source[:sort_start]
              + "    retainedEdges.sort((left, right) => -compareIndexedEdges(left, right));"
              + source[sort_end:]
          )
          worker_path.write_text(source, encoding="utf-8", newline="\n")

          for path_text in ("docs/DATA_ARCHITECTURE.md", "tests/science/numericalPerformance.test.ts"):
              path = Path(path_text)
              text = path.read_text(encoding="utf-8")
              if text.count(old_version) != 1:
                  raise SystemExit(f"unexpected version count in {path}: {text.count(old_version)}")
              path.write_text(text.replace(old_version, new_version), encoding="utf-8", newline="\n")

          Path("tests/science/similarityDeterminism.test.ts").write_text('''import { describe, expect, it, vi } from 'vitest';
          import type { Product } from '@/types/index';

          interface WorkerScope {
            onmessage?: (event: MessageEvent) => void;
            postMessage(value: unknown): void;
          }

          function product(id: string, value: number): Product {
            return {
              id,
              gradeName: id.toUpperCase(),
              manufacturerId: 'm',
              manufacturer: 'Determinism fixture',
              categoryIds: ['cat_pp'],
              createdAt: '2026-01-01',
              updatedAt: '2026-01-01',
              properties: { F1: { value }, F2: { value } },
            };
          }

          async function calculate(products: Product[]): Promise<Record<string, unknown>> {
            vi.resetModules();
            const replies: unknown[] = [];
            const scope: WorkerScope = { postMessage: (value) => replies.push(value) };
            vi.stubGlobal('self', scope);
            try {
              await import('@/workers/similarityWorker');
              expect(scope.onmessage).toBeTypeOf('function');
              scope.onmessage!({
                data: {
                  type: 'CALCULATE_SIMILARITY',
                  payload: {
                    products,
                    features: ['F1', 'F2'],
                    threshold: 0.99,
                    maxEdges: 1,
                  },
                },
              } as MessageEvent);
            } finally {
              vi.unstubAllGlobals();
            }
            const response = [...replies].reverse().find((value) => (
              value !== null
              && typeof value === 'object'
              && (value as { type?: unknown }).type === 'SIMILARITY_CALCULATED'
            )) as { payload?: Record<string, unknown> } | undefined;
            expect(response?.payload).toBeDefined();
            return response!.payload!;
          }

          describe('similarity Top-K determinism', () => {
            it('selects the same canonical edge under permutations and equal scores', async () => {
              const a = product('a', 1);
              const b = product('b', 1);
              const c = product('c', 2);
              const d = product('d', 2);
              const first = await calculate([c, d, a, b]);
              const second = await calculate([a, b, c, d]);
              const firstEdges = first.edges as Array<Record<string, unknown>>;
              const secondEdges = second.edges as Array<Record<string, unknown>>;
              expect(firstEdges).toEqual(secondEdges);
              expect(firstEdges).toHaveLength(1);
              expect(firstEdges[0]).toMatchObject({ source: 'a', target: 'b', value: 1 });
              expect(first.modelVersion).toBe('zscore-cosine-overlap-canonical-f64-4.1.0');
              expect(first.diagnostics).toMatchObject({
                edgesAboveThreshold: 2,
                edgesReturned: 1,
                edgeObjectsAllocated: 1,
                truncated: true,
              });
            });
          });
          ''', encoding="utf-8", newline="\n")
      - name: Remove staging workflow and commit candidate
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/repair-similarity-tiebreak-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/workers/similarityWorker.ts tests/science/similarityDeterminism.test.ts tests/science/numericalPerformance.test.ts docs/DATA_ARCHITECTURE.md
          git commit -m "fix(similarity): make bounded Top-K tie-breaking deterministic"
      - name: Validate focused repair
        shell: bash
        run: |
          set -euo pipefail
          npm run lint
          npm run typecheck
          npx vitest run tests/science/similarityDeterminism.test.ts tests/science/similarityMissingness.test.ts tests/science/numericalPerformance.test.ts --pool=forks --maxWorkers=1
          npm run test:science
          npm run build
          git diff --exit-code
      - name: Publish one atomic repair commit
        shell: bash
        run: git push origin HEAD:main
