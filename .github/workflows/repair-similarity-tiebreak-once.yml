name: One-time similarity Top-K determinism repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-similarity-tiebreak-once.yml

permissions:
  contents: write

concurrency:
  group: one-time-similarity-tiebreak-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor == 'SUNHAOJUN22'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact staging commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - name: Verify immutable repair base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "51dfb8f98fb5944121c9ab58a6a31441e88d51fd"
          test "$GITHUB_REF" = "refs/heads/main"
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Apply canonical endpoint and tie-break repair
        shell: python
        run: |
          from pathlib import Path

          worker_path = Path("src/workers/similarityWorker.ts")
          source = worker_path.read_text(encoding="utf-8")
          if source.count("zscore-cosine-overlap-canonical-f64-4.0.0") != 1:
              raise SystemExit("unexpected similarity model version count")
          source = source.replace(
              "zscore-cosine-overlap-canonical-f64-4.0.0",
              "zscore-cosine-overlap-canonical-f64-4.1.0",
          )

          heap_anchor = '''function swap(heap: IndexedEdge[], left: number, right: number): void {
            const temporary = heap[left];
            heap[left] = heap[right];
            heap[right] = temporary;
          }

          function retainStrongest(heap: IndexedEdge[], edge: IndexedEdge, limit: number): void {
            if (heap.length < limit) {
              heap.push(edge);
              let index = heap.length - 1;
              while (index > 0) {
                const parent = Math.floor((index - 1) / 2);
                if (heap[parent].value <= heap[index].value) break;
                swap(heap, parent, index);
                index = parent;
              }
              return;
            }
            heap[0] = edge;
            let index = 0;
            while (true) {
              const left = index * 2 + 1;
              const right = left + 1;
              let smallest = index;
              if (left < heap.length && heap[left].value < heap[smallest].value) smallest = left;
              if (right < heap.length && heap[right].value < heap[smallest].value) smallest = right;
              if (smallest === index) break;
              swap(heap, index, smallest);
              index = smallest;
            }
          }
          '''
          heap_replacement = '''function swap(heap: IndexedEdge[], left: number, right: number): void {
            const temporary = heap[left];
            heap[left] = heap[right];
            heap[right] = temporary;
          }

          function compareText(left: string, right: string): number {
            if (left < right) return -1;
            if (left > right) return 1;
            return 0;
          }

          function compareEdgeKey(
            leftValue: number,
            leftSource: string,
            leftTarget: string,
            rightValue: number,
            rightSource: string,
            rightTarget: string,
          ): number {
            if (leftValue < rightValue) return -1;
            if (leftValue > rightValue) return 1;
            const sourceOrder = compareText(rightSource, leftSource);
            if (sourceOrder !== 0) return sourceOrder;
            return compareText(rightTarget, leftTarget);
          }

          function compareIndexedEdges(left: IndexedEdge, right: IndexedEdge): number {
            return compareEdgeKey(
              left.value,
              left.source,
              left.target,
              right.value,
              right.source,
              right.target,
            );
          }

          function siftWeakestDown(heap: IndexedEdge[], start = 0): void {
            let index = start;
            while (true) {
              const left = index * 2 + 1;
              const right = left + 1;
              let weakest = index;
              if (left < heap.length && compareIndexedEdges(heap[left], heap[weakest]) < 0) weakest = left;
              if (right < heap.length && compareIndexedEdges(heap[right], heap[weakest]) < 0) weakest = right;
              if (weakest === index) break;
              swap(heap, index, weakest);
              index = weakest;
            }
          }

          function insertRetainedEdge(heap: IndexedEdge[], edge: IndexedEdge): void {
            heap.push(edge);
            let index = heap.length - 1;
            while (index > 0) {
              const parent = Math.floor((index - 1) / 2);
              if (compareIndexedEdges(heap[parent], heap[index]) <= 0) break;
              swap(heap, parent, index);
              index = parent;
            }
          }
          '''
          if source.count(heap_anchor) != 1:
              raise SystemExit(f"unexpected heap anchor count: {source.count(heap_anchor)}")
          source = source.replace(heap_anchor, heap_replacement)

          edge_anchor = '''        edgesAboveThreshold += 1;
                if (
                  maxEdges !== undefined
                  && retainedEdges.length >= maxEdges
                  && similarity <= retainedEdges[0].value
                ) {
                  continue;
                }
                const edge: IndexedEdge = {
                  source: products[left].id,
                  target: products[right].id,
                  value: similarity,
                  rawCosine,
                  featureCoverage,
                  sharedFeatures,
                  leftIndex: left,
                  rightIndex: right,
                };
                edgeObjectsAllocated += 1;
                if (maxEdges === undefined) retainedEdges.push(edge);
                else retainStrongest(retainedEdges, edge, maxEdges);
          '''
          edge_replacement = '''        edgesAboveThreshold += 1;
                const leftId = products[left].id;
                const rightId = products[right].id;
                const sourceId = compareText(leftId, rightId) <= 0 ? leftId : rightId;
                const targetId = sourceId === leftId ? rightId : leftId;
                if (maxEdges === undefined) {
                  retainedEdges.push({
                    source: sourceId,
                    target: targetId,
                    value: similarity,
                    rawCosine,
                    featureCoverage,
                    sharedFeatures,
                    leftIndex: left,
                    rightIndex: right,
                  });
                  edgeObjectsAllocated += 1;
                } else if (retainedEdges.length < maxEdges) {
                  insertRetainedEdge(retainedEdges, {
                    source: sourceId,
                    target: targetId,
                    value: similarity,
                    rawCosine,
                    featureCoverage,
                    sharedFeatures,
                    leftIndex: left,
                    rightIndex: right,
                  });
                  edgeObjectsAllocated += 1;
                } else {
                  const weakest = retainedEdges[0];
                  if (compareEdgeKey(
                    similarity,
                    sourceId,
                    targetId,
                    weakest.value,
                    weakest.source,
                    weakest.target,
                  ) <= 0) {
                    continue;
                  }
                  weakest.source = sourceId;
                  weakest.target = targetId;
                  weakest.value = similarity;
                  weakest.rawCosine = rawCosine;
                  weakest.featureCoverage = featureCoverage;
                  weakest.sharedFeatures = sharedFeatures;
                  weakest.leftIndex = left;
                  weakest.rightIndex = right;
                  siftWeakestDown(retainedEdges);
                }
          '''
          if source.count(edge_anchor) != 1:
              raise SystemExit(f"unexpected edge anchor count: {source.count(edge_anchor)}")
          source = source.replace(edge_anchor, edge_replacement)

          sort_anchor = '''    retainedEdges.sort((left, right) => (
              right.value - left.value
              || left.source.localeCompare(right.source)
              || left.target.localeCompare(right.target)
            ));
          '''
          sort_replacement = '''    retainedEdges.sort((left, right) => -compareIndexedEdges(left, right));
          '''
          if source.count(sort_anchor) != 1:
              raise SystemExit(f"unexpected sort anchor count: {source.count(sort_anchor)}")
          worker_path.write_text(source.replace(sort_anchor, sort_replacement), encoding="utf-8", newline="\n")

          for path_text in ("docs/DATA_ARCHITECTURE.md", "tests/science/numericalPerformance.test.ts"):
              path = Path(path_text)
              text = path.read_text(encoding="utf-8")
              if text.count("zscore-cosine-overlap-canonical-f64-4.0.0") != 1:
                  raise SystemExit(f"unexpected version count in {path}: {text.count('zscore-cosine-overlap-canonical-f64-4.0.0')}")
              path.write_text(
                  text.replace(
                      "zscore-cosine-overlap-canonical-f64-4.0.0",
                      "zscore-cosine-overlap-canonical-f64-4.1.0",
                  ),
                  encoding="utf-8",
                  newline="\n",
              )

          test_path = Path("tests/science/similarityDeterminism.test.ts")
          test_path.write_text('''import { describe, expect, it, vi } from 'vitest';
          import type { Product } from '@/types/index';

          interface WorkerScope {
            onmessage?: (event: MessageEvent) => void;
            postMessage(value: unknown): void;
          }

          function product(id: string, value: number): Product {
            return {
              id,
              gradeName: id.toUpperCase(),
              manufacturerId: 'm',
              manufacturer: 'Determinism fixture',
              categoryIds: ['cat_pp'],
              createdAt: '2026-01-01',
              updatedAt: '2026-01-01',
              properties: {
                F1: { value },
                F2: { value },
              },
            };
          }

          async function calculate(products: Product[]): Promise<Record<string, unknown>> {
            vi.resetModules();
            const replies: unknown[] = [];
            const scope: WorkerScope = { postMessage: (value) => replies.push(value) };
            vi.stubGlobal('self', scope);
            try {
              await import('@/workers/similarityWorker');
              expect(scope.onmessage).toBeTypeOf('function');
              scope.onmessage!({
                data: {
                  type: 'CALCULATE_SIMILARITY',
                  payload: {
                    products,
                    features: ['F1', 'F2'],
                    threshold: 0.99,
                    maxEdges: 1,
                  },
                },
              } as MessageEvent);
            } finally {
              vi.unstubAllGlobals();
            }
            const response = [...replies].reverse().find((value) => (
              value !== null
              && typeof value === 'object'
              && (value as { type?: unknown }).type === 'SIMILARITY_CALCULATED'
            )) as { payload?: Record<string, unknown> } | undefined;
            expect(response?.payload).toBeDefined();
            return response!.payload!;
          }

          describe('similarity Top-K determinism', () => {
            it('selects the same canonical edge under product-order permutations and equal scores', async () => {
              const a = product('a', 1);
              const b = product('b', 1);
              const c = product('c', 2);
              const d = product('d', 2);

              const lateLexicographicWinner = await calculate([c, d, a, b]);
              const earlyLexicographicWinner = await calculate([a, b, c, d]);
              const firstEdges = lateLexicographicWinner.edges as Array<Record<string, unknown>>;
              const secondEdges = earlyLexicographicWinner.edges as Array<Record<string, unknown>>;

              expect(firstEdges).toEqual(secondEdges);
              expect(firstEdges).toHaveLength(1);
              expect(firstEdges[0]).toMatchObject({ source: 'a', target: 'b', value: 1 });
              expect(lateLexicographicWinner.modelVersion)
                .toBe('zscore-cosine-overlap-canonical-f64-4.1.0');
              expect(lateLexicographicWinner.diagnostics).toMatchObject({
                edgesAboveThreshold: 2,
                edgesReturned: 1,
                edgeObjectsAllocated: 1,
                truncated: true,
              });
            });
          });
          ''', encoding="utf-8", newline="\n")
      - name: Remove staging workflow and commit candidate
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/repair-similarity-tiebreak-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/workers/similarityWorker.ts tests/science/similarityDeterminism.test.ts tests/science/numericalPerformance.test.ts docs/DATA_ARCHITECTURE.md
          git commit -m "fix(similarity): make bounded Top-K tie-breaking deterministic"
      - name: Validate focused repair
        shell: bash
        run: |
          set -euo pipefail
          npm run lint
          npm run typecheck
          npx vitest run tests/science/similarityDeterminism.test.ts tests/science/similarityMissingness.test.ts tests/science/numericalPerformance.test.ts --pool=forks --maxWorkers=1
          npm run test:science
          npm run build
          git diff --exit-code
      - name: Publish one atomic repair commit
        shell: bash
        run: git push origin HEAD:main
