name: Apply Phase 2K scientific UI overhaul

on:
  push:
    branches: [main]
    paths:
      - '.phase2k/ready.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase2k-exact-patch-apply
  cancel-in-progress: false

jobs:
  apply:
    name: Verify and apply exact Phase 2K patch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact staging tree
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Reconstruct, verify and apply patch
        shell: bash
        run: |
          set -euo pipefail
          stage=initial
          record_failure() {
            code=$?
            trap - EXIT
            if [ "$code" -ne 0 ]; then
              {
                echo "stage=$stage"
                echo "exit_code=$code"
                for part in .phase2k/final-*.b64; do
                  [ -f "$part" ] || continue
                  printf '%s bytes=' "$part"
                  wc -c < "$part" | tr -d ' '
                  sha256sum "$part"
                done
                if [ -f /tmp/phase2k.patch.xz ]; then sha256sum /tmp/phase2k.patch.xz; fi
                if [ -f /tmp/phase2k.patch ]; then sha256sum /tmp/phase2k.patch; fi
              } > .phase2k/diagnostic.txt
              git config user.name "ResinDB Phase 2K Diagnostics"
              git config user.email "phase2k@users.noreply.github.com"
              git add .phase2k/diagnostic.txt
              if ! git diff --cached --quiet; then
                git commit -m "chore: record phase 2k final patch diagnostics"
                git push origin HEAD:main
              fi
            fi
            exit "$code"
          }
          trap record_failure EXIT

          stage=parts-present
          for index in 00 01 02 03 04 05 06 07 08 09 10 11; do
            test -f ".phase2k/final-${index}.b64"
          done

          stage=part-hashes
          echo "052090d81e221376613edc13a66824a3b24855abb53a0178418abb3cfe262f2e  .phase2k/final-00.b64" | sha256sum -c -
          echo "f39d42c9d5a95451764cf4d76cd3702c2191ecee6276a97edd57b67153611bcd  .phase2k/final-01.b64" | sha256sum -c -
          echo "c0dd6350f0cc4e50f22d45b9a666f092585a8aa409afc5943613110ae936ceaa  .phase2k/final-02.b64" | sha256sum -c -
          echo "4521db9d122b23b74a3e136adb71158016b3a67ccd0d3c414f19c5d9398bc7f4  .phase2k/final-03.b64" | sha256sum -c -
          echo "067c7ff32ba9a76c39c65eb703756590f8888324af6b55c72eb9709b3874c904  .phase2k/final-04.b64" | sha256sum -c -
          echo "e1ec58aab99f9545b5612c1ce4182f2542656215733d7dd43921670db85c6f14  .phase2k/final-05.b64" | sha256sum -c -
          echo "93c714e062668ac44f6266fd97c3f10393d876b3f6b7bc33646351e2e88e7043  .phase2k/final-06.b64" | sha256sum -c -
          echo "3db2cc333adb2b8bce358f7d56f9ba71cb326827dcbe899cc92da870aec9c664  .phase2k/final-07.b64" | sha256sum -c -
          echo "bab65058f8f9abcba0e32f63d003f90575c5bca86ee71877e7565a3f7ba5d2f2  .phase2k/final-08.b64" | sha256sum -c -
          echo "bc870b23edac3cacccdad60a920c12b44254724a59c517edb3225b242052b3b8  .phase2k/final-09.b64" | sha256sum -c -
          echo "ed9d685538538fc2039e53837cecf4d6799d6e43cbe1ef56a3989af656683960  .phase2k/final-10.b64" | sha256sum -c -
          echo "a2e6e659c6cb17fe59c0af97432fb63e08bc8441c4787bc8947e2ffa2c741125  .phase2k/final-11.b64" | sha256sum -c -

          stage=compressed-reconstruction
          cat \
            .phase2k/final-00.b64 \
            .phase2k/final-01.b64 \
            .phase2k/final-02.b64 \
            .phase2k/final-03.b64 \
            .phase2k/final-04.b64 \
            .phase2k/final-05.b64 \
            .phase2k/final-06.b64 \
            .phase2k/final-07.b64 \
            .phase2k/final-08.b64 \
            .phase2k/final-09.b64 \
            .phase2k/final-10.b64 \
            .phase2k/final-11.b64 \
            | base64 -d > /tmp/phase2k.patch.xz
          echo "f23ae7dc6e5ac689a9ee9d7718439ddc4f1eb907a5d16bdbf7ed117464d04426  /tmp/phase2k.patch.xz" | sha256sum -c -

          stage=patch-decompression
          xz -dc /tmp/phase2k.patch.xz > /tmp/phase2k.patch
          echo "9cdbccdc453cd9376d12328a0670fcdefe0cc54b914bf3698748042d529c1a7b  /tmp/phase2k.patch" | sha256sum -c -

          stage=patch-applicability
          git apply --check /tmp/phase2k.patch
          stage=patch-application
          git apply /tmp/phase2k.patch
          rm -rf .phase2k .github/workflows/apply-phase2k.yml
          git diff --check
          git status --short
          trap - EXIT

      - name: Commit and push exact source update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ResinDB Phase 2K Automation"
          git config user.email "phase2k@users.noreply.github.com"
          git add -A
          git commit -m "feat: overhaul scientific UI and figure semantics"
          git push origin HEAD:main
