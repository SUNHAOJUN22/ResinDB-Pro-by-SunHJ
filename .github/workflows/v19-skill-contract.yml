name: V19 Skill contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: v19-skill-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Run V19 static routing and interoperability checks
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const base = '.agents/skills/resindb-science-screening-audit/evals';
          const load = (path) => JSON.parse(readFileSync(path, 'utf8'));
          const status = load(`${base}/MODEL_EVAL_STATUS.json`);
          const capture = load(`${base}/MODEL_CAPTURE_TEMPLATE.json`);
          const document = load(`${base}/evals.json`);
          const contract = load('.agents/skills/resindb-science-screening-audit/references/interoperability-v1.json');
          const cases = document.cases;
          const unique = new Set(cases.map((item) => item.id));
          const languages = new Set(cases.map((item) => item.language));
          const splits = new Set(cases.map((item) => item.split));
          const categories = new Set(cases.map((item) => item.category));
          if (status.status !== 'NOT_RUN' || capture.status !== 'NOT_RUN') throw new Error('model status is not truthful');
          if (unique.size !== cases.length || cases.length < 6) throw new Error('invalid routing case identity');
          if (![...['en','zh']].every((value) => languages.has(value))) throw new Error('language coverage missing');
          if (![...['train','validation']].every((value) => splits.has(value))) throw new Error('split coverage missing');
          if (![...['workflow','boundary','negative']].every((value) => categories.has(value))) throw new Error('category coverage missing');
          if (contract.scientific_quantity.boolean_is_numeric !== false || contract.scientific_quantity.unknown_is_zero !== false) throw new Error('quantity truth boundary drift');
          if (contract.status_lattice.software_pass_implies_external_acceptance !== false) throw new Error('acceptance boundary drift');
          const source = readFileSync('src/lib/skillInteroperabilityV19.ts', 'utf8');
          for (const symbol of ['isFiniteScientificNumber','aggregateStatus','mayClaimExternalAcceptance']) {
            if (!source.includes(symbol)) throw new Error(`missing implementation symbol: ${symbol}`);
          }
          console.log(JSON.stringify({status:'PASS', cases:cases.length}));
          JS
      - name: Publish exact-SHA status
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const state = process.env.JOB_STATUS === 'success' ? 'success' : 'failure';
          const response = await fetch(`https://api.github.com/repos/${process.env.REPOSITORY}/statuses/${process.env.TARGET_SHA}`, {
            method: 'POST',
            headers: {
              Authorization: `Bearer ${process.env.GH_TOKEN}`,
              Accept: 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({state, context: 'v19/skill-contract', description: `V19 Skill and interoperability contract ${state}`, target_url: process.env.RUN_URL}),
          });
          if (!response.ok) throw new Error(`status API failed: ${response.status}`);
          JS
