name: V19 Skill contract

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: resindb-ai-egress-finalize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  finalize-ai-egress:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.ref == 'remediation/nanoid-3.3.18'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact Draft branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: remediation/nanoid-3.3.18
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Materialize governed source and remove transport
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/remediation/resindb-ai-source.tar.gz.b64 > /tmp/resindb-ai-source.tar.gz
          printf '%s  %s\n' \
            'bc819f30d61f97d6f56d076d7e2d33f4aea12a10f455a9ea6fc3e8d1ef0373e8' \
            /tmp/resindb-ai-source.tar.gz | sha256sum --check
          tar -xzf /tmp/resindb-ai-source.tar.gz
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';

          const packagePath = 'package.json';
          const document = JSON.parse(readFileSync(packagePath, 'utf8'));
          document.scripts['validate:source'] = 'node scripts/validate-source-hygiene.mjs';
          document.scripts['validate:ai-egress'] = 'node scripts/validate-ai-egress-governance.mjs';
          writeFileSync(packagePath, `${JSON.stringify(document, null, 2)}\n`);

          const servicePath = 'src/services/aiService.ts';
          let service = readFileSync(servicePath, 'utf8');
          const dynamicControlPattern = "new RegExp(`[${String.fromCharCode(0)}-${String.fromCharCode(31)}${String.fromCharCode(127)}]`, 'g')";
          let controlPatternReplaced = false;
          for (const literal of [
            String.raw`/[\x00-\x1F\x7F]/g`,
            String.raw`/[\x00-\x1f\x7f]/g`,
            String.raw`/[\u0000-\u001F\u007F]/g`,
            String.raw`/[\u0000-\u001f\u007f]/g`,
          ]) {
            if (service.includes(literal)) {
              service = service.replaceAll(literal, dynamicControlPattern);
              controlPatternReplaced = true;
            }
          }
          if (!controlPatternReplaced) {
            throw new Error('expected control-character sanitizer was not found');
          }
          if (!service.includes('normalizeGeneratedProperties')) {
            throw new Error('expected generated-property normalizer was not found');
          }
          service = service.replaceAll('normalizeGeneratedProperties', '_normalizeGeneratedProperties');
          writeFileSync(servicePath, service);
          JS
          rm -rf .github/remediation
          find .github/workflows -maxdepth 1 -type f -name 'remediation-*.yml' -delete
          git show origin/main:.github/workflows/v19-skill-contract.yml > .github/workflows/v19-skill-contract.yml

      - name: Commit clean governed source tree
        shell: bash
        run: |
          set -euo pipefail
          test -f src/services/aiGovernance.ts
          test -f tests/unit/aiEgressGovernance.test.ts
          test -z "$(find .github/workflows -maxdepth 1 -type f -name 'remediation-*.yml' -print -quit)"
          test ! -d .github/remediation
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ai): materialize same-origin governed egress'
          git push origin HEAD:remediation/nanoid-3.3.18

      - name: Run focused and production qualification
        shell: bash
        run: |
          set -euo pipefail
          npm run test -- --run \
            tests/unit/aiGovernance.test.ts \
            tests/unit/aiEgressGovernance.test.ts \
            tests/unit/aiService.test.ts \
            tests/unit/toolchainPortability.test.ts
          npm run validate:ai-egress
          npm run lint
          npm run typecheck
          npm run build
          git restore --worktree dist/assets 2>/dev/null || true
          git diff --check
