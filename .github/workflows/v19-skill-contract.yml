name: V19 Skill contract

# Temporary exact-branch finalizer. The clean commit restores the permanent workflow from main.
on:
  push:
    branches:
      - remediation/nanoid-3.3.18

permissions:
  contents: write

concurrency:
  group: resindb-ai-types-finalize
  cancel-in-progress: false

jobs:
  finalize-ai-types:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact Draft branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: remediation/nanoid-3.3.18
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Repair governed AI call and quantity contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          for relative in (
              'src/components/modals/AddProductModal.tsx',
              'src/components/modals/EditProductModal.tsx',
          ):
              path = Path(relative)
              text = path.read_text(encoding='utf-8')
              pattern = re.compile(
                  r'const generated = await aiService\.generateProductProperties\(\s*'
                  r'formData\.gradeName,\s*formData\.manufacturer \|\| ""\s*\);'
              )
              text, count = pattern.subn(
                  'const generated = await aiService.generateProductProperties();',
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f'expected one identity-bearing AI call in {relative}, found {count}')
              path.write_text(text, encoding='utf-8')

          service_path = Path('src/services/aiService.ts')
          service = service_path.read_text(encoding='utf-8')
          old = "...(property?.temperature ? { condition: property.temperature.slice(0, 80) } : {}),"
          new = "...(property?.temperature !== undefined ? { condition: String(property.temperature).slice(0, 80) } : {}),"
          if service.count(old) != 1:
              raise SystemExit('expected exactly one unsafe temperature slice')
          service_path.write_text(service.replace(old, new), encoding='utf-8')

          workflow = Path('.github/workflows/v19-skill-contract.yml')
          workflow.write_text(
              __import__('subprocess').check_output(
                  ['git', 'show', 'origin/main:.github/workflows/v19-skill-contract.yml'],
                  text=True,
              ),
              encoding='utf-8',
          )
          PY

      - name: Run governed AI and production qualification
        shell: bash
        run: |
          set -euo pipefail
          npm run test -- --run \
            tests/unit/aiGovernance.test.ts \
            tests/unit/aiEgressGovernance.test.ts \
            tests/unit/aiService.test.ts \
            tests/unit/toolchainPortability.test.ts
          npm run validate:ai-egress
          npm run lint
          npm run typecheck
          npm run build
          git restore --worktree dist/assets 2>/dev/null || true
          test ! -d .github/remediation
          test -z "$(find .github/workflows -maxdepth 1 -type f -name 'remediation-*.yml' -print -quit)"
          git diff --check

      - name: Commit clean source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ai): align browser calls with governed proxy contract'
          git push origin HEAD:remediation/nanoid-3.3.18
