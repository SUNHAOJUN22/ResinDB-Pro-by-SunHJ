name: Provider-neutral AI migration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Remove provider-specific integration and legacy CLI material
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          for path in Path('src').rglob('*'):
              if path.suffix not in {'.ts', '.tsx'}:
                  continue
              text = path.read_text(encoding='utf-8')
              updated = text.replace('@/services/geminiService', '@/services/aiService')
              updated = updated.replace('Generated by Gemini 3.0', 'User-configured AI API')
              updated = updated.replace('Gemini', 'AI')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
          PY

          rm -f src/services/geminiService.ts
          rm -f 'src/workers/ResinDB_Pro_技术实现_参数配置与部署说明报告.md'
          rm -f .agents/skills/firebase_basics/references/setup/gemini_cli.md
          rm -f .agents/skills/firebase_basics/references/refresh/gemini-cli.md

      - name: Synchronize dependency lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Install exact dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Production HTTP smoke test
        run: npm run smoke

      - name: Verify active project is provider-neutral
        shell: bash
        run: |
          if grep -RInE '(@google/genai|VITE_GEMINI|geminiService|Gemini CLI|gemini-3)' README.md SECURITY.md metadata.json package.json package-lock.json .env.example src .agents/skills/firebase_basics; then
            echo 'Provider-specific references remain in active project files.'
            exit 1
          fi

      - name: Package validated migration payload
        shell: bash
        run: |
          mkdir -p /tmp/provider-neutral-payload
          git diff --name-only --diff-filter=ACMRT > /tmp/provider-neutral-payload/changed-files.txt
          git diff --name-only --diff-filter=D > /tmp/provider-neutral-payload/deleted-files.txt
          tar -czf /tmp/provider-neutral-payload/changed-files.tar.gz -T /tmp/provider-neutral-payload/changed-files.txt
          printf '%s\n' '.github/workflows/provider-neutral-migration.yml' >> /tmp/provider-neutral-payload/deleted-files.txt

      - name: Upload validated migration payload
        uses: actions/upload-artifact@v4
        with:
          name: provider-neutral-migration-payload
          path: /tmp/provider-neutral-payload
          retention-days: 3

      - name: Delete obsolete temporary branches
        shell: bash
        run: |
          git push origin --delete agent/stabilize-security-readme-ci || true
          git push origin --delete migration-trigger || true
