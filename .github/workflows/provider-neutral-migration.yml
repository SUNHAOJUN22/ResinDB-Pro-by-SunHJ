name: Provider-neutral AI migration

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Remove provider-specific integration and legacy CLI material
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          for path in Path('src').rglob('*'):
              if path.suffix not in {'.ts', '.tsx'}:
                  continue
              text = path.read_text(encoding='utf-8')
              updated = text.replace('@/services/geminiService', '@/services/aiService')
              updated = updated.replace('Generated by Gemini 3.0', 'User-configured AI API')
              updated = updated.replace('Gemini', 'AI provider')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
          PY

          rm -f src/services/geminiService.ts
          rm -f .agents/skills/firebase_basics/references/setup/gemini_cli.md
          rm -f .agents/skills/firebase_basics/references/refresh/gemini-cli.md

      - name: Synchronize dependency lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Install and validate
        run: |
          npm ci
          npm run validate

      - name: Verify active project is provider-neutral
        shell: bash
        run: |
          if grep -RInE '(@google/genai|VITE_GEMINI|geminiService|Gemini CLI|gemini-3)' README.md SECURITY.md metadata.json package.json package-lock.json .env.example src .agents/skills/firebase_basics; then
            echo 'Provider-specific references remain in active project files.'
            exit 1
          fi

      - name: Commit migration directly to main
        shell: bash
        run: |
          rm -f .github/workflows/provider-neutral-migration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: remove Gemini integration and use configurable AI API'
          git push origin HEAD:main

      - name: Delete obsolete temporary branch
        shell: bash
        run: git push origin --delete agent/stabilize-security-readme-ci || true
