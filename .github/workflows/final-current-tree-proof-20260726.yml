name: Final current-tree proof 2026-07-26

on:
  push:
    branches: [main]
    paths:
      - .github/final-current-tree-proof-20260726.trigger

permissions:
  contents: write
  actions: read

concurrency:
  group: resindb-final-current-tree-proof-20260726
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Run complete current-tree proof
        id: validation
        continue-on-error: true
        run: bash scripts/final-current-tree-proof.sh

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resindb-final-current-tree-proof-${{ github.sha }}
          path: |
            /tmp/resindb-final-current-tree-proof-20260726/
            reports/final-dependency-remediation-20260726/
            coverage/
            artifacts/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish final tree
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          result="$(cat /tmp/resindb-final-current-tree-proof-20260726/result.txt 2>/dev/null || echo failure)"
          rm -rf node_modules dist coverage artifacts
          rm -f .github/workflows/final-current-tree-proof-20260726.yml
          rm -f .github/final-current-tree-proof-20260726.trigger
          rm -f scripts/final-current-tree-proof.sh
          rm -f reports/lockfile-rebuild-diagnostic-20260726.txt
          rm -f reports/fresh-lockfile-rebuild-failure-20260726.md
          git config user.name "ResinDB Final Current Tree Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          if [ "$result" = "success" ]; then
            git commit -m "final: prove complete remediated main tree"
          else
            git commit -m "ci: publish final current-tree proof failure"
          fi
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Enforce result
        if: always()
        run: test "${{ steps.validation.outcome }}" = "success"
