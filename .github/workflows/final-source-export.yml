name: Final source export

on:
  push:
    branches: [main]
    paths:
      - .github/final-source-export.trigger

permissions:
  contents: write

concurrency:
  group: final-source-export-main
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Build repository snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf reports/_final_source_export
          mkdir -p reports/_final_source_export
          tar \
            --exclude=.git \
            --exclude=reports/_final_source_export \
            --exclude=node_modules \
            --exclude=dist \
            --exclude=coverage \
            --exclude=artifacts \
            -czf /tmp/resindb-final-source.tgz .
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          archive = Path('/tmp/resindb-final-source.tgz')
          payload = {
              'schemaVersion': 3,
              'sourceCommit': os.environ['GITHUB_SHA'],
              'runId': int(os.environ['GITHUB_RUN_ID']),
              'runAttempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'artifactName': f"final-source-snapshot-{os.environ['GITHUB_SHA']}",
              'archiveBytes': archive.stat().st_size,
              'archiveSha256': hashlib.sha256(archive.read_bytes()).hexdigest(),
          }
          Path('reports/_final_source_export/run.json').write_text(
              json.dumps(payload, indent=2) + '\n', encoding='utf-8'
          )
          PY
      - name: Upload source snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: final-source-snapshot-${{ github.sha }}
          path: /tmp/resindb-final-source.tgz
          retention-days: 3
          if-no-files-found: error
      - name: Publish export receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ResinDB Source Export Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A reports/_final_source_export
          git commit -m "chore: publish final source export receipt [skip ci]"
          git push origin HEAD:main
