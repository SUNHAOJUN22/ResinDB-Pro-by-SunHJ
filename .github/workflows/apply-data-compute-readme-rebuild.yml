name: Apply data compute README rebuild

on:
  push:
    branches: [agent/data-compute-readme-rebuild-20260802]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  actions: read

concurrency:
  group: apply-data-compute-readme-rebuild
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'ci: run verified data compute README rebuild'))
      || (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/data-compute-readme-rebuild-20260802')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out rebuild branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/data-compute-readme-rebuild-20260802
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Decode and verify rebuild payload
        shell: bash
        run: |
          set -euo pipefail
          cat .github/.resindb-rebuild-payload.part* > /tmp/resindb-rebuild-payload.b64
          echo '903b0ebae42d388ebb432ae820cd4e2508cad729856eda744f693192631b6652  /tmp/resindb-rebuild-payload.b64' | sha256sum -c -
          base64 -d /tmp/resindb-rebuild-payload.b64 > /tmp/resindb-rebuild-payload.tar.gz
          echo '197ed80b5e7da26421092488b470a96b1b353ec7da9970c44da39e413b01ea09  /tmp/resindb-rebuild-payload.tar.gz' | sha256sum -c -
          tar -xzf /tmp/resindb-rebuild-payload.tar.gz

      - name: Replace synthetic visual inventory with real UI evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f docs/images/resindb-*.svg docs/images/ui-*.png
          rm -f scripts/readme-visuals.bundle.json
          rm -f scripts/generate-readme-visuals.mjs
          rm -f scripts/bundle-readme-visuals.mjs
          rm -f docs/README_VISUAL_DESIGN_SYSTEM.md
          mkdir -p /tmp/resindb-evidence docs/images
          curl -fsSL -L \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/8829515833/zip" \
            -o /tmp/resindb-evidence.zip
          unzip -q /tmp/resindb-evidence.zip -d /tmp/resindb-evidence
          cp /tmp/resindb-evidence/artifacts/ui-dashboard-zh-light.png docs/images/ui-dashboard-zh-light.png
          cp /tmp/resindb-evidence/artifacts/ui-dashboard-en-dark.png docs/images/ui-dashboard-en-dark.png
          cp /tmp/resindb-evidence/artifacts/ui-product-detail.png docs/images/ui-product-detail.png
          cp /tmp/resindb-evidence/artifacts/ui-scientific-analytics.png docs/images/ui-scientific-analytics.png
          cp /tmp/resindb-evidence/artifacts/ui-phase2l-rheology-proxy.png docs/images/ui-phase2l-rheology-proxy.png
          cp /tmp/resindb-evidence/artifacts/ui-phase2l-dependency-heatmap.png docs/images/ui-phase2l-dependency-heatmap.png
          cp /tmp/resindb-evidence/artifacts/ui-kmeans-profile-audit.png docs/images/ui-kmeans-profile-audit.png
          cp /tmp/resindb-evidence/artifacts/ui-kmeans-device-calibration.png docs/images/ui-kmeans-device-calibration.png
          mapfile -t screenshots < <(find docs/images -maxdepth 1 -type f -name 'ui-*.png' -printf '%f\n' | sort)
          test "${#screenshots[@]}" -eq 8
          test "$(find docs/images -maxdepth 1 -type f -name 'resindb-*.svg' | wc -l | tr -d ' ')" -eq 0
          for screenshot in "${screenshots[@]}"; do
            test "$(stat -c%s "docs/images/${screenshot}")" -gt 20000
          done

      - name: Regenerate governed manifests and run pre-commit gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/generate-data-manifest.mjs
          node --check scripts/validate-data.mjs
          node --check scripts/validate-compute-surface.mjs
          node --check scripts/validate-repository-docs.mjs
          node --check scripts/validate-source-hygiene.mjs
          node --check scripts/generate-validation-receipt.mjs
          node scripts/validate-compute-surface.mjs
          node scripts/validate-source-hygiene.mjs
          node scripts/validate-data.mjs
          node scripts/validate-repository-docs.mjs

      - name: Commit rebuilt source candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/.resindb-rebuild-payload.part*
          rm -f .github/data-compute-readme-rebuild.trigger
          rm -f .github/data-compute-readme-rebuild.pr-ready
          git rm -f .github/workflows/apply-data-compute-readme-rebuild.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: govern data and rebuild scientific README'
          git push origin HEAD:agent/data-compute-readme-rebuild-20260802
