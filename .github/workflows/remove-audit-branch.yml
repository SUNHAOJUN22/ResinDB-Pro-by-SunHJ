name: Remove temporary cleanup branches

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  remove-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete temporary branches
        shell: bash
        run: |
          remote="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          for branch in audit-trigger branch-cleanup-trigger "${{ github.event.pull_request.head.ref }}"; do
            if [ "$branch" != "main" ] && git ls-remote --exit-code --heads "$remote" "$branch" >/dev/null 2>&1; then
              git push "$remote" --delete "$branch"
            fi
          done
