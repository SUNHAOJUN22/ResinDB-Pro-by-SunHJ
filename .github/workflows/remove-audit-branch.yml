name: Remove temporary cleanup branches

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  remove-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Delete temporary branches
        shell: bash
        run: |
          remote="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push "$remote" --delete audit-trigger || true
          if [ "${{ github.event.pull_request.head.ref }}" != "main" ]; then
            git push "$remote" --delete "${{ github.event.pull_request.head.ref }}" || true
          fi
