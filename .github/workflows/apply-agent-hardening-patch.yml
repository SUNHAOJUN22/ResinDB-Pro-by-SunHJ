name: Apply agent hardening patch

on:
  push:
    branches:
      - agent/resindb-pro-full-hardening
    paths:
      - .github/agent-hardening-patch/part-15

permissions:
  contents: write

concurrency:
  group: apply-agent-hardening-patch
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out hardening branch
        uses: actions/checkout@v4
        with:
          ref: agent/resindb-pro-full-hardening
          fetch-depth: 0

      - name: Reassemble and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/agent-hardening-patch/part-* \
            | base64 --decode \
            | xz --decompress \
            > /tmp/resindb-hardening.patch
          git apply --check /tmp/resindb-hardening.patch

      - name: Apply patch and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "resindb-hardening-bot"
          git config user.email "actions@users.noreply.github.com"
          git apply --index --whitespace=nowarn /tmp/resindb-hardening.patch
          git rm -r \
            .github/agent-hardening-patch \
            .github/workflows/apply-agent-hardening-patch.yml
          git commit -m "harden correctness, workers, storage, and validation"
          git push origin HEAD:agent/resindb-pro-full-hardening
