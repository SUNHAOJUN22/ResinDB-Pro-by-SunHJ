name: One-time Pass 9 final CI observer

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-pass9-ci-observer.yml

permissions:
  actions: read
  statuses: write
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for clean observer deletion commit and report its CI
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          final_sha=none
          for attempt in $(seq 1 120); do
            ref=$(curl -fsSL \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/main")
            candidate=$(jq -r '.object.sha' <<<"$ref")
            if [ "$candidate" != "$TRIGGER_SHA" ]; then
              code=$(curl -sS -o /dev/null -w '%{http_code}' \
                -H 'Accept: application/vnd.github+json' \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/.github/workflows/one-time-pass9-ci-observer.yml?ref=${candidate}")
              if [ "$code" = 404 ]; then
                final_sha="$candidate"
                break
              fi
            fi
            sleep 5
          done
          test "$final_sha" != none

          run_id=none
          status=missing
          conclusion=none
          for attempt in $(seq 1 180); do
            response=$(curl -fsSL \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${final_sha}&event=push&per_page=20")
            run=$(jq -c '[.workflow_runs[] | select(.name == "CI")] | sort_by(.created_at) | last // {}' <<<"$response")
            run_id=$(jq -r '.id // "none"' <<<"$run")
            status=$(jq -r '.status // "missing"' <<<"$run")
            conclusion=$(jq -r '.conclusion // "none"' <<<"$run")
            if [ "$run_id" != none ] && [ "$status" = completed ]; then
              break
            fi
            sleep 10
          done

          state=pending
          if [ "$status" = completed ] && [ "$conclusion" = success ]; then state=success; fi
          if [ "$status" = completed ] && [ "$conclusion" != success ]; then state=failure; fi
          description="run=${run_id} status=${status} conclusion=${conclusion}"
          target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${final_sha}" \
            -f state="$state" \
            -f context='pass9-final-ci' \
            -f description="$description" \
            -f target_url="$target_url"
          test "$run_id" != none
          test "$status" = completed
