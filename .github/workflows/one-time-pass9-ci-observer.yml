name: One-time Pass 9 CI observer

on:
  issue_comment:
    types: [created]

permissions:
  actions: read
  issues: write
  contents: read

jobs:
  observe:
    if: >-
      github.event.issue.number == 34 &&
      github.event.comment.body == '/observe-pass9-ci-44b38289'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query target permanent CI and report
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 44b38289c8035881b0411992249403e1b417abc2
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&event=push&per_page=20")
          run=$(jq -c '[.workflow_runs[] | select(.name == "CI")] | sort_by(.created_at) | last // {}' <<<"$response")
          run_id=$(jq -r '.id // "none"' <<<"$run")
          status=$(jq -r '.status // "missing"' <<<"$run")
          conclusion=$(jq -r '.conclusion // "none"' <<<"$run")
          printf 'PASS9_CI_RESULT target=%s run=%s status=%s conclusion=%s\n' "$TARGET_SHA" "$run_id" "$status" "$conclusion" > /tmp/result.txt
          gh api "repos/${GITHUB_REPOSITORY}/issues/34/comments" -f body="$(cat /tmp/result.txt)"
          test "$run_id" != none
          test "$status" = completed
