name: One-time Pass 9 CI observer

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-pass9-ci-observer.yml

permissions:
  actions: read
  statuses: write
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query target permanent CI and set commit status
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 44b38289c8035881b0411992249403e1b417abc2
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&event=push&per_page=20")
          run=$(jq -c '[.workflow_runs[] | select(.name == "CI")] | sort_by(.created_at) | last // {}' <<<"$response")
          run_id=$(jq -r '.id // "none"' <<<"$run")
          status=$(jq -r '.status // "missing"' <<<"$run")
          conclusion=$(jq -r '.conclusion // "none"' <<<"$run")
          state=pending
          if [ "$status" = completed ] && [ "$conclusion" = success ]; then state=success; fi
          if [ "$status" = completed ] && [ "$conclusion" != success ]; then state=failure; fi
          description="run=${run_id} status=${status} conclusion=${conclusion}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state="$state" \
            -f context='pass9-ci-observer' \
            -f description="$description"
          test "$run_id" != none
          test "$status" = completed
