name: Current audit diagnostic 2026-07-26

on:
  push:
    branches: [main]
    paths:
      - .github/current-audit-diagnostic-20260726.trigger

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Capture current exact audit graph
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          set +e
          npm audit --json > /tmp/audit.json 2>/tmp/audit.stderr
          code=$?
          set -e
          printf '%s\n' "$code" > /tmp/audit-code
          printf '%s\n' "$GITHUB_SHA" > /tmp/commit
          python3 - <<'PY'
          from __future__ import annotations
          import json
          from pathlib import Path

          raw = json.loads(Path('/tmp/audit.json').read_text(encoding='utf-8'))
          rows = []
          for name, item in sorted(raw.get('vulnerabilities', {}).items()):
              advisories = []
              dependencies = []
              for via in item.get('via', []):
                  if isinstance(via, str):
                      dependencies.append(via)
                  else:
                      advisories.append({
                          'source': via.get('source'),
                          'name': via.get('name'),
                          'dependency': via.get('dependency'),
                          'title': via.get('title'),
                          'url': via.get('url'),
                          'severity': via.get('severity'),
                          'range': via.get('range'),
                          'cvss': via.get('cvss'),
                      })
              rows.append({
                  'name': name,
                  'severity': item.get('severity'),
                  'isDirect': item.get('isDirect'),
                  'range': item.get('range'),
                  'nodes': item.get('nodes', []),
                  'effects': item.get('effects', []),
                  'viaDependencies': dependencies,
                  'advisories': advisories,
                  'fixAvailable': item.get('fixAvailable'),
              })
          payload = {
              'schemaVersion': 1,
              'validatedCommit': Path('/tmp/commit').read_text().strip(),
              'exitCode': int(Path('/tmp/audit-code').read_text()),
              'metadata': raw.get('metadata', {}),
              'vulnerabilities': rows,
          }
          out = Path('reports/current-audit-diagnostic-20260726.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Publish diagnostic and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/current-audit-diagnostic-20260726.yml
          rm -f .github/current-audit-diagnostic-20260726.trigger
          git config user.name "ResinDB Audit Diagnostic Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "ci: publish current exact audit diagnostic"
          git pull --rebase origin main
          git push origin HEAD:main
