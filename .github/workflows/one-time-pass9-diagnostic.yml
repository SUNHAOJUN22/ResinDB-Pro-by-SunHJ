name: One-time Pass 9 delivery diagnostic

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-pass9-diagnostic.yml

permissions:
  actions: read
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query latest Pass 9 controller run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          runs=$(curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=50")
          run=$(jq -c '[.workflow_runs[] | select(.name == "One-time Pass 9 finite aggregation delivery")] | sort_by(.created_at) | last // {}' <<<"$runs")
          run_id=$(jq -r '.id // "none"' <<<"$run")
          status=$(jq -r '.status // "missing"' <<<"$run")
          conclusion=$(jq -r '.conclusion // "none"' <<<"$run")
          head_sha=$(jq -r '.head_sha // "none"' <<<"$run")
          event=$(jq -r '.event // "none"' <<<"$run")
          {
            echo "run_id=${run_id}"
            echo "status=${status}"
            echo "conclusion=${conclusion}"
            echo "head_sha=${head_sha}"
            echo "event=${event}"
          } > /tmp/diagnostic.txt
          if [ "$run_id" != none ]; then
            jobs=$(curl -fsSL \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100")
            echo '--- jobs ---' >> /tmp/diagnostic.txt
            jq -r '.jobs[] | "job_id=\(.id) name=\(.name) status=\(.status) conclusion=\(.conclusion)"' <<<"$jobs" >> /tmp/diagnostic.txt
            echo '--- steps ---' >> /tmp/diagnostic.txt
            jq -r '.jobs[] | .steps[]? | "\(.number)\t\(.name)\t\(.status)\t\(.conclusion)"' <<<"$jobs" >> /tmp/diagnostic.txt
          fi

      - name: Record diagnostic and remove observer
        shell: bash
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout main
          cp /tmp/diagnostic.txt .github/pass9-delivery/diagnostic.txt
          git rm .github/workflows/one-time-pass9-diagnostic.yml
          git add .github/pass9-delivery/diagnostic.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: record Pass 9 delivery diagnostic'
          git push origin HEAD:main
