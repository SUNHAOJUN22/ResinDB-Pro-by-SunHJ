name: One-time Pass 9 result reader

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-pass9-result-reader.yml

permissions:
  actions: read
  statuses: write
  contents: read

jobs:
  read-result:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read validated clean-tree CI result
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 5bad3eabe95007614b406dc4d96beedaedb79583
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&event=push&per_page=20")
          run=$(jq -c '[.workflow_runs[] | select(.name == "CI")] | sort_by(.created_at) | last // {}' <<<"$response")
          run_id=$(jq -r '.id // "none"' <<<"$run")
          status=$(jq -r '.status // "missing"' <<<"$run")
          conclusion=$(jq -r '.conclusion // "none"' <<<"$run")
          state=pending
          if [ "$status" = completed ] && [ "$conclusion" = success ]; then state=success; fi
          if [ "$status" = completed ] && [ "$conclusion" != success ]; then state=failure; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state="$state" \
            -f context='pass9-final-ci' \
            -f description="run=${run_id} status=${status} conclusion=${conclusion}" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
          test "$run_id" != none
          test "$status" = completed
