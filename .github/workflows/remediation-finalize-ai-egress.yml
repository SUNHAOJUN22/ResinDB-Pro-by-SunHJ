name: Finalize governed AI egress source

on:
  push:
    branches:
      - remediation/nanoid-3.3.18

permissions:
  contents: write

concurrency:
  group: resindb-ai-egress-finalize
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact Draft branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: remediation/nanoid-3.3.18
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Materialize source and remove transport
        shell: bash
        run: |
          set -euo pipefail
          cat .github/remediation/resindb-ai-egress.patch.b64.* \
            | base64 --decode \
            | gzip --decompress > /tmp/resindb-ai-egress.patch
          printf '%s  %s\n' \
            '7927c6cfdd4e79ac52d5566c618600dc7fbd2f2af7dc8add0b7f48b8a50fbfde' \
            /tmp/resindb-ai-egress.patch | sha256sum --check
          git apply --index /tmp/resindb-ai-egress.patch
          rm -rf .github/remediation
          find .github/workflows -maxdepth 1 -type f -name 'remediation-*.yml' -delete

      - name: Run focused and production qualification
        shell: bash
        run: |
          set -euo pipefail
          npm run test -- --run \
            tests/unit/aiGovernance.test.ts \
            tests/unit/aiEgressGovernance.test.ts \
            tests/unit/aiService.test.ts \
            tests/unit/toolchainPortability.test.ts
          node scripts/validate-ai-egress-governance.mjs
          npm run lint
          npm run typecheck
          npm run build
          git restore --worktree dist/assets 2>/dev/null || true
          git diff --check

      - name: Commit clean source tree
        shell: bash
        run: |
          set -euo pipefail
          test -f src/services/aiGovernance.ts
          test -f tests/unit/aiEgressGovernance.test.ts
          test -z "$(find .github/workflows -maxdepth 1 -type f -name 'remediation-*.yml' -print -quit)"
          test ! -d .github/remediation
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ai): enforce same-origin governed egress'
          git push origin HEAD:remediation/nanoid-3.3.18
