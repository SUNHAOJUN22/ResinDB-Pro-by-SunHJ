name: Full-sequence UI diagnostic 2026-07-26

on:
  push:
    branches: [main]
    paths:
      - .github/ui-sequence-diagnostic-20260726.trigger

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reproduce the full pre-UI sequence
        shell: bash
        run: |
          set +e
          npm ci > /tmp/npm-ci.log 2>&1; npm_ci=$?
          npm run test > /tmp/test.log 2>&1; test_code=$?
          npm run test:coverage > /tmp/coverage.log 2>&1; coverage_code=$?
          npm run build > /tmp/build.log 2>&1; build_code=$?
          npm run smoke > /tmp/smoke.log 2>&1; smoke_code=$?
          npm run test:ui > /tmp/ui.log 2>&1; ui_code=$?
          set -e
          {
            echo "validated_commit=$GITHUB_SHA"
            echo "npm_ci=$npm_ci"
            echo "test=$test_code"
            echo "coverage=$coverage_code"
            echo "build=$build_code"
            echo "smoke=$smoke_code"
            echo "test_ui=$ui_code"
            echo
            echo "## smoke output"
            cat /tmp/smoke.log
            echo
            echo "## UI output"
            cat /tmp/ui.log
          } > reports/ui-sequence-diagnostic-20260726.txt
      - name: Publish diagnostic and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/ui-sequence-diagnostic-20260726.yml
          rm -f .github/ui-sequence-diagnostic-20260726.trigger
          git config user.name "ResinDB Sequence Diagnostic Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "ci: publish full-sequence UI diagnostic"
          git pull --rebase origin main
          git push origin HEAD:main
