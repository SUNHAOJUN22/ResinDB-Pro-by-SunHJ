name: Diagnose ResinDB v3.1.0 patch

on:
  push:
    branches: [main]
    paths:
      - .github/apply-v310-patch.trigger

permissions:
  contents: write
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Record staged patch hashes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD_SHA256: ec61784122da0d984532c3b71e7d57a67d167cc17a8e4d70860797af4d771cd6
        run: |
          set -euo pipefail
          mkdir -p reports
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          expected = "ec61784122da0d984532c3b71e7d57a67d167cc17a8e4d70860797af4d771cd6"
          parts = sorted(Path('.github/.resindb-v310-patch').glob('part*'))
          encoded = b''.join(path.read_bytes() for path in parts)
          import base64
          decoded = base64.b64decode(encoded)
          result = {
              "schemaVersion": 1,
              "expectedPayloadSha256": expected,
              "actualPayloadSha256": hashlib.sha256(decoded).hexdigest(),
              "parts": {
                  path.name: {
                      "bytes": path.stat().st_size,
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  }
                  for path in parts
              },
          }
          Path('reports/patch-diagnostic.json').write_text(
              json.dumps(result, indent=2) + '\n', encoding='utf-8'
          )
          PY
          git config user.name "ResinDB Diagnostic Bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/patch-diagnostic.json
          git commit -m "chore: record v3.1.0 patch diagnostics [skip ci]" || true
          git push origin HEAD:main
