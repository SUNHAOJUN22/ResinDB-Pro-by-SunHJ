name: One-time final single-main cleanup

on:
  push:
    branches:
      - automation/main-revalidation-snapshot
    paths:
      - .github/workflows/one-time-export-main-source.yml

permissions:
  contents: write

jobs:
  archive-delete-verify-self-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out cleanup branch with full history
        uses: actions/checkout@v4
        with:
          ref: automation/main-revalidation-snapshot
          fetch-depth: 0

      - name: Archive and delete every non-main branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ResinDB Single Main Bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch --force --prune origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'

          mkdir -p /tmp/resindb-final-single-main
          git ls-remote --heads origin | sort -k2 > /tmp/resindb-final-single-main/before.txt
          : > /tmp/resindb-final-single-main/tags.txt
          : > /tmp/resindb-final-single-main/deleted.txt

          create_tag() {
            local tag_name="$1"
            local target_sha="$2"
            local message="$3"
            if git ls-remote --exit-code --tags origin "refs/tags/${tag_name}" >/dev/null 2>&1; then
              echo "exists ${tag_name}" >> /tmp/resindb-final-single-main/tags.txt
            else
              git tag -a "${tag_name}" "${target_sha}" -m "${message}"
              git push origin "refs/tags/${tag_name}"
              echo "created ${tag_name} -> ${target_sha}" >> /tmp/resindb-final-single-main/tags.txt
            fi
          }

          mapfile -t branches < <(git ls-remote --heads origin | awk '{sub("refs/heads/", "", $2); print $1 " " $2}' | sort -k2)
          for entry in "${branches[@]}"; do
            sha="${entry%% *}"
            branch="${entry#* }"
            if [[ "$branch" == 'main' ]]; then
              continue
            fi
            safe_name="${branch//\//-}"
            create_tag "archive/${safe_name}-20260723" "$sha" "Archived before final single-main cleanup of ${branch}"
            git push origin --delete "$branch"
            echo "deleted ${branch} (${sha})" >> /tmp/resindb-final-single-main/deleted.txt
          done

          git ls-remote --heads origin | sort -k2 > /tmp/resindb-final-single-main/after.txt
          test "$(wc -l < /tmp/resindb-final-single-main/after.txt | tr -d ' ')" = '1'
          grep -Eq "[[:space:]]refs/heads/main$" /tmp/resindb-final-single-main/after.txt

      - name: Remove temporary cleanup gate from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin main
          git switch --force-create cleanup-main origin/main
          git rm .github/workflows/one-time-final-single-main-cleanup.yml
          git commit -m 'chore: remove completed final single-main cleanup'
          git push origin HEAD:main
          echo "final_main=$(git rev-parse HEAD)" > /tmp/resindb-final-single-main/final-main.txt

      - name: Upload final cleanup record
        uses: actions/upload-artifact@v4
        with:
          name: resindb-final-single-main-record
          path: /tmp/resindb-final-single-main
          if-no-files-found: error
          retention-days: 14
