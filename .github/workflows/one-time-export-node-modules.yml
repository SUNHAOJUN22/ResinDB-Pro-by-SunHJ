name: One-time export validated node modules

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: automation/main-revalidation-snapshot
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install exact lockfile
        run: npm ci
      - name: Record environment and package tree
        run: |
          node --version > dependency-environment.txt
          npm --version >> dependency-environment.txt
          sha256sum package-lock.json >> dependency-environment.txt
          npm ls --all --json > npm-tree.json || true
      - name: Archive installed tree
        run: tar -czf node-modules-linux-x64-node22.tar.gz node_modules dependency-environment.txt npm-tree.json
      - name: Upload validated dependency tree
        uses: actions/upload-artifact@v4
        with:
          name: resindb-node-modules-linux-x64-node22-${{ github.sha }}
          path: node-modules-linux-x64-node22.tar.gz
          compression-level: 0
          retention-days: 1
