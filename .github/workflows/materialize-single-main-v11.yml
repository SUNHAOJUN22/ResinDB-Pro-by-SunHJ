name: Materialize and validate single-main candidate v11

on:
  push:
    branches:
      - agent/single-main-consolidation-v11
    paths:
      - .github/single-main-v11/candidate.patch.xz.b64

permissions:
  contents: write

concurrency:
  group: single-main-v11-materialization
  cancel-in-progress: false

jobs:
  materialize-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=3072

    steps:
      - name: Check out candidate transport branch
        uses: actions/checkout@v4
        with:
          ref: agent/single-main-consolidation-v11
          fetch-depth: 0

      - name: Verify and decode candidate patch
        shell: bash
        run: |
          set -euo pipefail
          cp .github/single-main-v11/candidate.patch.xz.b64 /tmp/candidate.patch.xz.b64
          printf '%s  %s\n' 'f597871ae789a73d20045a4d532b52e87aa316a8e735741161f5c2088d5e4f71' /tmp/candidate.patch.xz.b64 | sha256sum --check -
          base64 --decode /tmp/candidate.patch.xz.b64 > /tmp/candidate.patch.xz
          printf '%s  %s\n' '8648a711f112ec78a0b42e4b5afa18f50d11ffd3ae59ac839a717e42db63bffd' /tmp/candidate.patch.xz | sha256sum --check -
          xz --decompress --stdout /tmp/candidate.patch.xz > /tmp/candidate.patch
          printf '%s  %s\n' '58e9d6bee02a052a60b3a07182c81578a9bbac5999dfd1a45f85ff779e5a922a' /tmp/candidate.patch | sha256sum --check -
          git apply --check --whitespace=nowarn /tmp/candidate.patch

      - name: Materialize ordinary source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'resindb-single-main-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm -r --ignore-unmatch \
            .dependency-hardening-trigger \
            .github/agent-hardening-patch \
            .github/hardening-patch \
            .github/single-main-v11 \
            .github/second-pass-pr.trigger \
            .github/second-pass-snapshot.trigger \
            .github/second-pass.patch.b64.00 \
            .github/second-pass.patch.b64.01 \
            .github/second-pass.patch.part.00 \
            .github/second-pass.patch.part.01 \
            .github/second-pass.patch.part.02a \
            .github/second-pass.patch.part.02b \
            .github/workflows/apply-agent-hardening-patch.yml \
            .github/workflows/export-source.yml \
            .github/workflows/materialize-single-main-v11.yml \
            .github/workflows/second-pass-snapshot.yml || true
          git apply --index --whitespace=nowarn /tmp/candidate.patch
          git add -A
          git diff --cached --check
          git commit -m 'materialize comprehensive single-main candidate v3.1.1'
          git push origin HEAD:agent/single-main-consolidation-v11

      - name: Install exact dependencies
        id: npm-ci
        shell: bash
        run: |
          set -euo pipefail
          npm ci > /tmp/npm-ci.log 2>&1 || {
            tail -n 160 /tmp/npm-ci.log
            exit 1
          }

      - name: Static and functional validation
        shell: bash
        run: |
          set -euo pipefail
          npm run lint
          npm run typecheck
          npm run test
          npm run test:coverage

      - name: Production and performance validation
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          npm run bundle:check
          npm run smoke
          npm run test:performance
          npm audit --audit-level=high
          git diff --check

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: single-main-v11-validation
          path: |
            /tmp/npm-ci.log
            coverage/
            artifacts/
            dist/index.html
          if-no-files-found: ignore
          retention-days: 7
