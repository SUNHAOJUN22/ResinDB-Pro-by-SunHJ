name: Pinned optimization toolchain

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/optimization-toolchain.yml]

permissions:
  contents: read

concurrency:
  group: optimization-toolchain-${{ github.ref }}
  cancel-in-progress: false

jobs:
  node-toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c706b98c69bdaef567bbf5ee52d972c3a67728a4
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Preserve the lock-bound development installation
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm ls --all
          destination="$RUNNER_TEMP/optimization-node-toolchain"
          mkdir -p "$destination"
          tar -czf "$destination/node_modules.tar.gz" node_modules
          cp package-lock.json "$destination/package-lock.json"
          node --version > "$destination/node-version.txt"
          npm --version > "$destination/npm-version.txt"
          git rev-parse HEAD > "$destination/source-commit.txt"
          (cd "$destination" && sha256sum node_modules.tar.gz package-lock.json > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: optimization-node-toolchain-${{ github.run_id }}
          path: ${{ runner.temp }}/optimization-node-toolchain
          retention-days: 7
          if-no-files-found: error
  python-toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: SUNHAOJUN22/TsaoDFT_skill
          ref: 65318eb434c12ac07a878b588e54d593bca373e2
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
      - name: Download the constrained Python development wheels
        shell: bash
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/optimization-python-toolchain"
          mkdir -p "$destination"
          python -m pip download --only-binary=:all: --dest "$destination" \
            -c constraints/py313.txt -r requirements-dev.txt
          cp constraints/py313.txt "$destination/constraints.txt"
          cp requirements-dev.txt "$destination/requirements-dev.txt"
          cp requirements.txt "$destination/requirements.txt"
          git rev-parse HEAD > "$destination/source-commit.txt"
          (cd "$destination" && sha256sum *.whl > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: optimization-python-toolchain-${{ github.run_id }}
          path: ${{ runner.temp }}/optimization-python-toolchain
          retention-days: 7
          if-no-files-found: error

  source-snapshots:
    name: Exact pinned sources and failed-browser evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Archive pinned source bytes without executing repository code
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          import concurrent.futures
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import tempfile

          pins = {
              "AspenOps-Agent": "5590f1552e3e7ef3e7e46c0e16e6275ebf88f078",
              "TsaoSciComputation": "830f7b3acab452e985f3961d00334fc47aeb4e13",
              "TSAO-PROCESSING-SKILL": "5c87aeee54c6c54a0016746e429dd9fa6bc8a5e7",
              "ResinDB-Pro-by-SunHJ": "c706b98c69bdaef567bbf5ee52d972c3a67728a4",
              "TsaoDFT_skill": "65318eb434c12ac07a878b588e54d593bca373e2",
              "TsaoSciResearcher": "01c82e5e95378f17b0c8c86296f9fbb7c1f4e9f2",
              "OpenDeepMind_skill": "d9fe3c83cd59321ac5e5ac86e08e279d451fd197",
          }
          output = Path(os.environ["RUNNER_TEMP"]) / "optimization-source-snapshots"
          output.mkdir(exist_ok=True)

          def capture(item):
              name, sha = item
              with tempfile.TemporaryDirectory(prefix="source-", dir=os.environ["RUNNER_TEMP"]) as directory:
                  def git(*args):
                      return subprocess.run(["git", "-C", directory, *args], check=True,
                                            stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=300).stdout
                  git("init", "--quiet")
                  git("-c", "protocol.file.allow=never", "fetch", "--quiet", "--depth=1",
                      "https://github.com/SUNHAOJUN22/" + name + ".git", sha)
                  resolved = git("rev-parse", "FETCH_HEAD").decode().strip()
                  if resolved != sha:
                      raise RuntimeError("Resolved source does not match pin: " + name)
                  archive = output / (name + "-" + sha + ".tar.gz")
                  git("archive", "--format=tar.gz", "--output=" + str(archive), sha)
                  inventory = output / (name + ".git-tree.z")
                  inventory.write_bytes(git("ls-tree", "-rz", sha))
                  return {"repository": "SUNHAOJUN22/" + name, "commit": sha,
                          "tree": git("rev-parse", sha + "^{tree}").decode().strip(),
                          "archive": archive.name,
                          "archive_sha256": hashlib.sha256(archive.read_bytes()).hexdigest(),
                          "inventory": inventory.name,
                          "inventory_sha256": hashlib.sha256(inventory.read_bytes()).hexdigest()}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              records = sorted(pool.map(capture, pins.items()), key=lambda row: row["repository"])
          (output / "sources.json").write_text(json.dumps({
              "schema": "optimization-source-snapshots/v1", "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"], "sources": records,
              "qualification": "SOURCE_BYTES_ONLY_NOT_TEST_ACCEPTANCE",
          }, indent=2) + "\n", encoding="utf-8")
          print("Captured", len(records), "exact source trees; no repository code executed.")
          PYCODE
      - name: Preserve the already-failed browser job log
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --allow-escape-sequences repos/SUNHAOJUN22/ResinDB-Pro-by-SunHJ/actions/jobs/122710130054/logs \
            > "$RUNNER_TEMP/optimization-source-snapshots/resin-failed-job-122710130054.log"
          sha256sum "$RUNNER_TEMP/optimization-source-snapshots/resin-failed-job-122710130054.log" \
            > "$RUNNER_TEMP/optimization-source-snapshots/failed-log.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: optimization-source-snapshots-${{ github.run_id }}
          path: ${{ runner.temp }}/optimization-source-snapshots
          retention-days: 7
          if-no-files-found: error
