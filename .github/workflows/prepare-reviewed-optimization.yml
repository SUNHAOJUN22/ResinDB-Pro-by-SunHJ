name: Prepare reviewed optimization objects
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prepare-reviewed-optimization.yml
      - .github/optimization-transfer/**
permissions:
  contents: read
jobs:
  prepare-objects:
    if: github.repository == 'SUNHAOJUN22/ResinDB-Pro-by-SunHJ' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Upload exact reviewed immutable Git objects, never update a ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYCODE'
          import base64, concurrent.futures, hashlib, json, os, pathlib, subprocess, tempfile, urllib.request, zlib
          base = '97d08b9c758829ec3c5434c3e95a9df6706022a3'
          target = '9c49029ef78d69242ad03d9e3749cfd63b56a6bd'
          patch_digest = '1cd7e86f130cb6a1de7677afb3b31e82f29a7377d9a0a8a74b31888657146fde'
          assert os.environ['GITHUB_REPOSITORY'] == 'SUNHAOJUN22/ResinDB-Pro-by-SunHJ'
          assert os.environ['GITHUB_REF'] == 'refs/heads/main'
          manifest = json.loads(pathlib.Path('.github/optimization-transfer/manifest.json').read_text())
          assert manifest['schema'] == 1 and manifest['base_commit'] == base and manifest['candidate_tree'] == target
          parts = []
          for item in manifest['parts']:
              assert item['path'].startswith('.github/optimization-transfer/patch-') and '..' not in item['path']
              data = pathlib.Path(item['path']).read_bytes()
              assert len(data) <= 8001 and hashlib.sha256(data).hexdigest() == item['sha256']
              parts.append(data.strip())
          compressed = base64.b64decode(b''.join(parts), validate=True)
          assert len(compressed) < 100000
          decoder = zlib.decompressobj()
          patch = decoder.decompress(compressed, 2000000)
          assert decoder.eof and not decoder.unconsumed_tail and not decoder.unused_data
          assert hashlib.sha256(patch).hexdigest() == patch_digest == manifest['patch_sha256']
          subprocess.run(['git', 'merge-base', '--is-ancestor', base, os.environ['GITHUB_SHA']], check=True)
          work = pathlib.Path(tempfile.mkdtemp(prefix='reviewed-source-', dir=os.environ['RUNNER_TEMP']))
          subprocess.run(['git', 'worktree', 'add', '--detach', str(work), base], check=True)
          def git(*args):
              return subprocess.check_output(['git', '-C', str(work), *args])
          subprocess.run(['git', '-C', str(work), 'apply', '--index', '--binary', '-'], input=patch, check=True)
          assert git('write-tree').decode().strip() == target
          changed = git('diff', '--cached', '--name-only', '-z').decode().strip('\0').split('\0')
          assert changed == manifest['paths'] and 1 <= len(changed) <= 50
          assert not any(p.startswith('.github/') or '..' in p.split('/') for p in changed)
          entries = []
          for record in git('ls-files', '--stage', '-z').decode().strip('\0').split('\0'):
              metadata, path = record.split('\t', 1)
              if path not in changed:
                  continue
              mode, sha, stage = metadata.split()
              assert stage == '0' and mode in ('100644', '100755')
              entries.append({'path': path, 'mode': mode, 'type': 'blob', 'sha': sha})
          assert len(entries) == len(changed)
          api = 'https://api.github.com/repos/SUNHAOJUN22/ResinDB-Pro-by-SunHJ/'
          def post(endpoint, value):
              assert endpoint in ('git/blobs', 'git/trees')
              request = urllib.request.Request(api + endpoint, json.dumps(value).encode(), method='POST', headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          def upload(entry):
              data = git('cat-file', 'blob', entry['sha'])
              assert len(data) <= 1000000
              result = post('git/blobs', {'content': base64.b64encode(data).decode(), 'encoding': 'base64'})
              assert result['sha'] == entry['sha']
              return entry
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              uploaded = list(pool.map(upload, entries))
          tree = post('git/trees', {'base_tree': manifest['base_tree'], 'tree': uploaded})
          assert tree['sha'] == target
          receipt = {'schema': 1, 'base_commit': base, 'candidate_tree': target,
                     'preparation_commit': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'],
                     'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'entries': uploaded,
                     'refs_changed': False, 'scientific_acceptance': 'NOT_EVALUATED'}
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'reviewed-objects.json'
          output.write_text(json.dumps(receipt, indent=2) + '\n')
          print('Prepared exact candidate tree:', target, '; no branch or ref was changed.')
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reviewed-optimization-objects-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/reviewed-objects.json
          if-no-files-found: error
          retention-days: 7
