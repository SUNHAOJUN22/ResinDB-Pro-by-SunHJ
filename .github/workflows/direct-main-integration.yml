name: Direct main integration

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  integrate-validate-publish:
    if: github.event.issue.title == 'RUN_DIRECT_MAIN_INTEGRATION_20260723'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify and apply audited integration patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p integration-evidence
          base64 --decode .github/direct-main-integration.patch.xz.b64 > /tmp/integration.patch.xz
          echo '6b04c8c3582f1b7a8b89b7099cfa8bf37df3cce4c0943be08239ea82b36b935c  /tmp/integration.patch.xz' | sha256sum -c -
          xz --decompress --stdout /tmp/integration.patch.xz > /tmp/integration.patch
          git apply --check /tmp/integration.patch
          git apply /tmp/integration.patch
          git diff --check
          cp /tmp/integration.patch integration-evidence/applied.patch

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee integration-evidence/npm-ci.log

      - name: Lint
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee integration-evidence/lint.log

      - name: Typecheck
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee integration-evidence/typecheck.log

      - name: Run full tests
        shell: bash
        run: |
          set -o pipefail
          npm run test 2>&1 | tee integration-evidence/test.log

      - name: Run unit and science suites
        shell: bash
        run: |
          set -o pipefail
          npm run test:unit 2>&1 | tee integration-evidence/test-unit.log
          npm run test:science 2>&1 | tee integration-evidence/test-science.log

      - name: Generate coverage
        shell: bash
        run: |
          set -o pipefail
          npm run test:coverage 2>&1 | tee integration-evidence/coverage.log

      - name: Build production application
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee integration-evidence/build.log

      - name: Run HTTP and browser UI smoke tests
        shell: bash
        run: |
          set -o pipefail
          npm run smoke 2>&1 | tee integration-evidence/smoke.log
          npm run test:ui 2>&1 | tee integration-evidence/ui-smoke.log

      - name: Audit production dependencies
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if npm run audit:prod 2>&1 | tee integration-evidence/audit-production.log; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 10)); fi
          done
          exit 1

      - name: Repository hygiene and secret guards
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .dependency-hardening-trigger
          test ! -e npm-audit.json
          test ! -e dependency-audit.json
          ! find . -path './node_modules' -prune -o -path './dist' -prune -o -path './coverage' -prune -o -path './artifacts' -prune -o \( -name '*.patch' -o -name '*.trigger' \) -print | grep -q .
          ! grep -RInE --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=coverage --exclude-dir=artifacts --exclude='.env.example' -- '(-----BEGIN (RSA|EC|OPENSSH|DSA|PGP) PRIVATE KEY-----|sk-[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{25,})' .
          ! grep -RIn --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=coverage --exclude-dir=artifacts 'transparenttextures\|dicebear' src index.html
          ! grep -RIn 'CNPC Research Lab' src

      - name: Commit validated integration directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ResinDB Main Integration Bot'
          git config user.email 'actions@users.noreply.github.com'
          rm -f .github/direct-main-integration.patch.xz.b64
          rm -f .github/workflows/direct-main-integration.yml
          git add -A
          git diff --cached --check
          git commit -m 'feat: integrate validated platform capabilities and test evidence'
          git push origin HEAD:main
          git rev-parse HEAD | tee integration-evidence/final-main-sha.txt

      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resindb-direct-main-integration-evidence
          path: |
            integration-evidence
            coverage
            artifacts
          if-no-files-found: warn
          retention-days: 14
