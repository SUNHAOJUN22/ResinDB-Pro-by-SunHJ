name: Report temporary repository paths

on:
  push:
    branches: [main]
    paths:
      - .github/report-temp-paths.trigger

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Commit temporary path inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          git ls-files \
            | grep -E '(^|/)([^/]*(trigger|diagnos|apply-final|source-export|dependency-export|remediate|report-tree|report-temp)[^/]*|_final_source_export)(/|$)|^reports/(patch-diagnostic|source-export|dependency-export)' \
            | sort -u > reports/temp-path-inventory.txt || true
          git config user.name "ResinDB Inventory Bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/temp-path-inventory.txt
          git commit -m "chore: publish temporary path inventory [skip ci]"
          git push origin HEAD:main
