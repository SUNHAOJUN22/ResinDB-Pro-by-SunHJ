name: V4 exact candidate export once

on:
  issue_comment:
    types: [created]
  push:
    branches: [main]
    paths:
      - .github/workflows/v4-candidate-export-once.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: v4-candidate-export-once
  cancel-in-progress: false

jobs:
  export:
    if: >-
      github.event_name == 'push' ||
      (github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.repository_owner &&
      contains(github.event.comment.body, '/export-v4-strict-candidate-v7'))
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install deterministic CJK fonts
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk fonts-noto-core
          fc-cache -f
          fc-match 'Noto Sans CJK SC'
          fc-list :lang=zh | grep -q .
      - name: Install exact dependencies without manifest drift
        shell: bash
        run: |
          set -euo pipefail
          cp package.json /tmp/resindb-package-exact.json
          cp package-lock.json /tmp/resindb-package-lock-exact.json
          restore_manifests() {
            cp /tmp/resindb-package-exact.json package.json
            cp /tmp/resindb-package-lock-exact.json package-lock.json
          }
          trap restore_manifests EXIT
          node scripts/prepare-ci-manifest.mjs
          installed=0
          for registry in https://registry.npmjs.org https://registry.npmmirror.com; do
            for attempt in 1 2 3; do
              if npm ci --registry="$registry"; then
                installed=1
                break 2
              fi
              sleep $((attempt * 10))
            done
          done
          test "$installed" -eq 1
          restore_manifests
          trap - EXIT
      - name: Execute reviewed strict builder and commit controller removal
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          controller = Path('.github/workflows/v4-strict-hardening-once.yml')
          text = controller.read_text(encoding='utf-8')
          old_block = """          refresh_text = replace_once(
              refresh_text,
              old_publish,
              new_publish,
              'exact-parent README publication',
          )
"""
          new_block = """          if old_publish in refresh_text:
              refresh_text = refresh_text.replace(old_publish, new_publish, 1)
          elif new_publish not in refresh_text:
              raise SystemExit('exact-parent README publication contract is missing')
"""
          if text.count(old_block) != 1:
              raise SystemExit(f'exact-parent builder patch count: {text.count(old_block)}')
          text = text.replace(old_block, new_block, 1)
          controller.write_text(text, encoding='utf-8', newline='\n')

          text = controller.read_text(encoding='utf-8')
          anchor = '      - name: Build normalized controller-free strict candidate\n'
          step_start = text.index(anchor)
          run_marker = '        run: |\n'
          script_start = text.index(run_marker, step_start) + len(run_marker)
          script_end = text.index('\n      - name:', script_start)
          physical_lines = text[script_start:script_end].splitlines()
          logical_lines: list[str] = []
          for line in physical_lines:
              if line.startswith('          '):
                  logical_lines.append(line[10:])
              else:
                  logical_lines.append(line)
          Path('/tmp/resindb-v4-build.sh').write_text(
              '\n'.join(logical_lines) + '\n',
              encoding='utf-8',
              newline='\n',
          )

          refresh = Path('.github/workflows/current-main-readme-refresh.yml')
          if not refresh.exists():
              slash = chr(0x5C)
              tokens = [
                  slash + slash + 'uFFFD',
                  chr(0x00C3),
                  chr(0x00C2),
                  chr(0x00E2) + chr(0x20AC),
                  chr(0x951F) + chr(0x65A4) + chr(0x62F7),
              ]
              legacy = (
                  '          const legacy = "const BAD = [\''
                  + "', '".join(tokens)
                  + '\'];";\n'
              )
              publication = (
                  '          git fetch origin main\n'
                  '          git rebase origin/main\n'
                  '          git push origin HEAD:main\n'
              )
              refresh.write_text(
                  legacy + publication,
                  encoding='utf-8',
                  newline='\n',
              )
          PY
          rm .github/workflows/v4-candidate-export-once.yml
          bash /tmp/resindb-v4-build.sh
          rm .github/workflows/current-main-readme-refresh.yml
          git add -A .github/workflows/current-main-readme-refresh.yml
          git commit --amend --no-edit
          test ! -e .github/workflows/current-main-readme-refresh.yml
          git diff --exit-code
          git diff --check
      - name: Record controller-free exact candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git log -1 --format=%s)" = 'ci: enforce strict Unicode and visual integrity'
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Run full code, numerical, bilingual, build, browser and audit gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/refresh-current-main-readme.mjs --check
          npm run validate:ci
          node - <<'NODE'
          const fs = require('node:fs');
          const unicode = JSON.parse(fs.readFileSync('reports/UNICODE_INTEGRITY_REPORT.json', 'utf8'));
          if (unicode.verdict !== 'PASS') throw new Error(JSON.stringify(unicode));
          const ci = fs.readFileSync('.github/workflows/ci.yml', 'utf8');
          for (const token of ['continue-on-error:', '|| true', 'actions/setup-node@v4']) {
            if (ci.includes(token)) throw new Error(`forbidden workflow construct remains: ${token}`);
          }
          NODE
          for controller in \
            .github/workflows/v4-strict-hardening-once.yml \
            .github/workflows/v4-fail-closed-hardening-once.yml \
            .github/workflows/v4-candidate-export-once.yml \
            .github/workflows/current-main-readme-refresh.yml; do
            test ! -e "$controller"
          done
          git diff --exit-code
          git diff --check
      - name: Prove sole remote main branch
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote --heads origin > /tmp/resindb-v4-branches.txt
          python - <<'PY'
          from pathlib import Path
          refs = [
              line.split()[1]
              for line in Path('/tmp/resindb-v4-branches.txt').read_text().splitlines()
              if line.strip()
          ]
          if refs != ['refs/heads/main']:
              raise SystemExit(f'unexpected remote branches: {refs}')
          PY
      - name: Package every exact changed path
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/resindb-v4-candidate"
          rm -rf "$bundle"
          mkdir -p "$bundle"
          : > "$bundle/DELETE_PATHS.txt"
          while IFS=$'\t' read -r status path; do
            case "$status" in
              A|M)
                mkdir -p "$bundle/$(dirname "$path")"
                cp "$path" "$bundle/$path"
                ;;
              D)
                printf '%s\n' "$path" >> "$bundle/DELETE_PATHS.txt"
                ;;
              *)
                echo "unsupported diff-tree status: $status $path" >&2
                exit 2
                ;;
            esac
          done < <(git diff-tree --no-commit-id --name-status -r HEAD)
          git rev-parse HEAD^ > "$bundle/PARENT_SHA.txt"
          git rev-parse HEAD > "$bundle/CANDIDATE_SHA.txt"
          git diff-tree --no-commit-id --name-status -r HEAD > "$bundle/CHANGES.tsv"
          echo "path=$bundle" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: resindb-v4-exact-candidate-${{ steps.candidate.outputs.sha }}
          path: ${{ steps.bundle.outputs.path }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
      - name: Publish machine result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: '38'
          OUTCOME: ${{ job.status }}
          CANDIDATE: ${{ steps.candidate.outputs.sha }}
        run: |
          gh issue comment "$ISSUE" --body "V4_RESINDB_EXACT_EXPORT_V7 outcome=${OUTCOME} candidate=${CANDIDATE:-UNPUBLISHED} run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} bundle=uploaded unicode=repository-wide browser=chromium bilingual=isolated charts=nonblank exact_parent=idempotent controllers=removed"
