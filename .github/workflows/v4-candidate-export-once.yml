name: V4 exact candidate export once

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: v4-candidate-export-once
  cancel-in-progress: false

jobs:
  export:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.repository_owner &&
      contains(github.event.comment.body, '/export-v4-strict-candidate')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install deterministic CJK fonts
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk fonts-noto-core
          fc-cache -f
          fc-match 'Noto Sans CJK SC'
          fc-list :lang=zh | grep -q .
      - name: Install exact dependencies without manifest drift
        shell: bash
        run: |
          set -euo pipefail
          cp package.json /tmp/resindb-package-exact.json
          cp package-lock.json /tmp/resindb-package-lock-exact.json
          restore_manifests() {
            cp /tmp/resindb-package-exact.json package.json
            cp /tmp/resindb-package-lock-exact.json package-lock.json
          }
          trap restore_manifests EXIT
          node scripts/prepare-ci-manifest.mjs
          installed=0
          for registry in https://registry.npmjs.org https://registry.npmmirror.com; do
            for attempt in 1 2 3; do
              if npm ci --registry="$registry"; then
                installed=1
                break 2
              fi
              sleep $((attempt * 10))
            done
          done
          test "$installed" -eq 1
          restore_manifests
          trap - EXIT
      - name: Extract and execute the reviewed strict transformation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          controller = Path('.github/workflows/v4-strict-hardening-once.yml')
          text = controller.read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = text.index(marker) + len(marker)
          end = text.index("\n          PY\n", start)
          script = textwrap.dedent(text[start:end]) + "\n"
          Path('/tmp/resindb-v4-transform.py').write_text(
              script,
              encoding='utf-8',
              newline='\n',
          )
          PY
          rm .github/workflows/v4-candidate-export-once.yml
          python /tmp/resindb-v4-transform.py
          git diff --check
      - name: Commit controller-free exact candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci: enforce strict Unicode and visual integrity'
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Run full code, numerical, bilingual, build, browser and audit gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/refresh-current-main-readme.mjs --check
          npm run validate:ci
          node - <<'NODE'
          const fs = require('node:fs');
          const unicode = JSON.parse(fs.readFileSync('reports/UNICODE_INTEGRITY_REPORT.json', 'utf8'));
          if (unicode.verdict !== 'PASS') throw new Error(JSON.stringify(unicode));
          const ci = fs.readFileSync('.github/workflows/ci.yml', 'utf8');
          for (const token of ['continue-on-error:', '|| true', 'actions/setup-node@v4']) {
            if (ci.includes(token)) throw new Error(`forbidden workflow construct remains: ${token}`);
          }
          NODE
          for controller in \
            .github/workflows/v4-strict-hardening-once.yml \
            .github/workflows/v4-fail-closed-hardening-once.yml \
            .github/workflows/v4-candidate-export-once.yml; do
            test ! -e "$controller"
          done
          git diff --exit-code
          git diff --check
      - name: Prove sole remote main branch
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote --heads origin > /tmp/resindb-v4-branches.txt
          python - <<'PY'
          from pathlib import Path
          refs = [
              line.split()[1]
              for line in Path('/tmp/resindb-v4-branches.txt').read_text().splitlines()
              if line.strip()
          ]
          if refs != ['refs/heads/main']:
              raise SystemExit(f'unexpected remote branches: {refs}')
          PY
      - name: Package every exact changed path
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/resindb-v4-candidate"
          rm -rf "$bundle"
          mkdir -p "$bundle"
          : > "$bundle/DELETE_PATHS.txt"
          while IFS=$'\t' read -r status path; do
            case "$status" in
              A|M)
                mkdir -p "$bundle/$(dirname "$path")"
                cp "$path" "$bundle/$path"
                ;;
              D)
                printf '%s\n' "$path" >> "$bundle/DELETE_PATHS.txt"
                ;;
              *)
                echo "unsupported diff-tree status: $status $path" >&2
                exit 2
                ;;
            esac
          done < <(git diff-tree --no-commit-id --name-status -r HEAD)
          git rev-parse HEAD^ > "$bundle/PARENT_SHA.txt"
          git rev-parse HEAD > "$bundle/CANDIDATE_SHA.txt"
          git diff-tree --no-commit-id --name-status -r HEAD > "$bundle/CHANGES.tsv"
          echo "path=$bundle" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: resindb-v4-exact-candidate-${{ steps.candidate.outputs.sha }}
          path: ${{ steps.bundle.outputs.path }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
      - name: Publish machine result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          OUTCOME: ${{ job.status }}
          CANDIDATE: ${{ steps.candidate.outputs.sha }}
        run: |
          gh issue comment "$ISSUE" --body "V4_RESINDB_EXACT_EXPORT outcome=${OUTCOME} candidate=${CANDIDATE:-UNPUBLISHED} run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} bundle=uploaded unicode=repository-wide browser=chromium bilingual=isolated charts=nonblank controllers=removed"
