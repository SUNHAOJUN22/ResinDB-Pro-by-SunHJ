name: Performance source optimization v3 2026-07-27

on:
  push:
    branches: [main]
    paths:
      - .github/performance-source-v3-20260727.trigger

permissions:
  contents: write
  actions: read

concurrency:
  group: resindb-performance-source-v3-20260727
  cancel-in-progress: true

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reconstruct corrected source patch
        shell: bash
        run: |
          set -euo pipefail
          git show 4cc44cbae0621580d3f2193c836a4e734fdc2599:scripts/apply-performance-source-v2.py > scripts/apply-performance-source-v3.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-performance-source-v3.py')
          text = path.read_text(encoding='utf-8')
          old = 'private registerMutationBatchCreate'
          if text.count(old) != 2:
              raise SystemExit(f'expected two batch boundary markers, found {text.count(old)}')
          path.write_text(text.replace(old, 'private async getDB'), encoding='utf-8')
          PY
          python3 -m py_compile scripts/apply-performance-source-v3.py
          git show 9247d91793273b96989453bfd653d36d3f6deaca:scripts/run-performance-source-v2.sh > scripts/run-performance-source-v3.sh
          sed -i 's/apply-performance-source-v2.py/apply-performance-source-v3.py/g' scripts/run-performance-source-v3.sh
          bash -n scripts/run-performance-source-v3.sh
      - name: Measure, patch and validate source
        id: source
        continue-on-error: true
        run: bash scripts/run-performance-source-v3.sh
      - name: Upload raw source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resindb-performance-source-v3-${{ github.sha }}
          path: reports/performance-audit-20260727/
          if-no-files-found: warn
          retention-days: 30
      - name: Publish verified source or rollback
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          result="$(cat reports/performance-audit-20260727/source-result.txt 2>/dev/null || echo failure)"
          if [ "$result" != success ]; then
            rm -rf /tmp/source-v3-failure
            mkdir -p /tmp/source-v3-failure
            cp reports/performance-audit-20260727/SOURCE_PHASE.* /tmp/source-v3-failure/ 2>/dev/null || true
            cp reports/performance-audit-20260727/source-logs/apply.txt /tmp/source-v3-failure/apply.txt 2>/dev/null || true
            git reset --hard HEAD
            rm -rf reports/performance-audit-20260727
            mkdir -p reports/performance-audit-20260727
            cp -R /tmp/source-v3-failure/. reports/performance-audit-20260727/ 2>/dev/null || true
          else
            rm -rf reports/performance-audit-20260727/source-logs
            rm -f reports/performance-audit-20260727/source-*.status
            rm -f reports/performance-audit-20260727/source-input-commit.txt
            rm -f reports/performance-audit-20260727/source-result.txt
            rm -f reports/performance-audit-20260727/FAILURE.md
            rm -f reports/performance-audit-20260727/source-v2-apply-diagnostic.txt
          fi
          rm -f .github/workflows/performance-source-v3-20260727.yml
          rm -f .github/performance-source-v3-20260727.trigger
          rm -f scripts/apply-performance-source-v3.py scripts/run-performance-source-v3.sh
          rm -rf node_modules dist coverage artifacts scripts/__pycache__
          git config user.name "ResinDB Performance Source Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          if [ "$result" = success ]; then
            git commit -m "perf: cache formulas and index repeated lookups"
          else
            git commit -m "perf: publish corrected source optimization failure"
          fi
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Enforce result
        if: always()
        run: test "${{ steps.source.outcome }}" = success
